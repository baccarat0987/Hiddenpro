<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Engine PRO | TERMINAL</title>
    
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = new Date().getTime();
            if (!userDoc.exists() || (userDoc.data().expiry !== 'LIFETIME' && userDoc.data().expiry < now)) {
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Segoe UI', sans-serif;
            height:100vh;
            display:none; 
            justify-content:center;
            align-items:center;
            background:radial-gradient(circle at center,#050b14,#00101f);
            color:#d6e6ff;
            overflow:hidden;
        }

        .exit-nav { position: fixed; top: 15px; right: 15px; z-index: 1000; }
        .exit-btn { 
            background: rgba(0, 200, 255, 0.1); color: #00e5ff; padding: 8px 15px; 
            border-radius: 4px; text-decoration: none; font-weight: bold; 
            border: 1px solid rgba(0, 200, 255, 0.4); font-size: 11px; transition: 0.3s; 
            text-transform: uppercase; letter-spacing: 1px;
        }
        .exit-btn:hover { background: #00e5ff; color: #000; }

        .container{
            display:flex;
            flex-direction:column;
            align-items:center;
            width:420px;
            max-width:95%;
            backdrop-filter:blur(12px);
            background:rgba(0,20,35,0.7);
            border:2px solid rgba(0,200,255,0.4);
            border-radius:20px;
            padding:25px;
            z-index:1;
            position: relative;
        }

        .header{
            font-size:22px;
            font-weight:700;
            letter-spacing:3px;
            color:#00e5ff;
            text-shadow:0 0 10px #00e5ff;
            margin-bottom:20px;
            text-align:center;
            text-transform: uppercase;
        }

        .totals{
            display:flex;
            justify-content:space-between;
            width:100%;
            margin-bottom:20px;
            padding:12px;
            background:rgba(0,0,0,0.4);
            border:1px solid rgba(0,200,255,0.2);
            border-radius:10px;
        }
        .totals div{ font-size:11px; font-weight:bold; color: #66b2ff; }

        .prediction{ font-size:52px; font-weight:900; text-align:center; margin-bottom:15px; min-height: 70px; }
        .player{color:#4fc3ff; text-shadow:0 0 25px #1e90ff;}
        .banker{color:#ff5252; text-shadow:0 0 25px #ff3b3b;}

        .confidence-container{ width:100%; margin-bottom:25px; height:8px; background:rgba(255,255,255,0.05); border-radius:10px; overflow:hidden;}
        .confidence-bar{ width:0%; height:100%; background:#00e5ff; box-shadow:0 0 15px #00e5ff; transition:width 0.8s ease; }

        .history-panel{
            width:100%;
            background:rgba(0,0,0,0.3);
            border:1px solid rgba(0,200,255,0.2);
            border-radius:10px;
            padding:12px;
            margin-bottom:15px;
        }
        .sequence-row{ display:flex; gap:6px; justify-content: center; min-height: 30px; }
        .sequence-row span{ width:28px; height:28px; display:flex; justify-content:center; align-items:center; border-radius:5px; font-weight:900; font-size:12px; }
        .P{background:#1e90ff; color:#fff;}
        .B{background:#ff3b3b; color:#fff;}

        .live-feed{
            width:100%;
            height:100px;
            overflow-y:auto;
            font-family:'Courier New', monospace;
            font-size:10px;
            color:#00ffea;
            background:rgba(0,0,0,0.5);
            border-radius:8px;
            padding:10px;
            margin-bottom:20px;
            border: 1px solid rgba(0,200,255,0.1);
        }

        .controls{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; width: 100%; }
        .controls button{
            padding:18px;
            font-weight:900;
            font-size:14px;
            color:#fff;
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(0,200,255,0.3);
            border-radius:12px;
            cursor:pointer;
            transition:0.2s;
            text-transform: uppercase;
        }
        .controls button:active { transform: scale(0.95); }
        .btn-p:hover { background: #1e90ff; border-color: #1e90ff; }
        .btn-b:hover { background: #ff3b3b; border-color: #ff3b3b; }
        
        .util-btns { grid-column: span 2; display: flex; gap: 10px; margin-top: 5px; }
        .util-btns button { flex: 1; padding: 10px; font-size: 11px; background: transparent; color: #444; border-color: #222; }

        .scan-line{
            position:absolute;
            top:0; left:0; width:100%; height:2px;
            background:linear-gradient(90deg,transparent,#00e5ff,transparent);
            animation:scan 3s linear infinite;
            pointer-events: none;
        }
        @keyframes scan{ 0%{top:0%;} 100%{top:100%;} }
    </style>
</head>
<body>

<div class="exit-nav">
    <a href="index.html" class="exit-btn">EXIT TERMINAL</a>
</div>

<div class="container">
    <div class="scan-line"></div>
    <div class="header">Neural Engine PRO</div>

    <div class="totals">
        <div>P: <span id="playerTotal">0</span></div>
        <div>B: <span id="bankerTotal">0</span></div>
        <div>ROUNDS: <span id="totalRounds">0</span></div>
    </div>

    <div class="prediction" id="predictionBox">STANDBY</div>
    <div class="confidence-container">
        <div class="confidence-bar" id="confidenceBar"></div>
    </div>

    <div class="history-panel">
        <div class="sequence-row" id="historySequence"></div>
    </div>

    <div class="live-feed" id="liveFeed"></div>

    <div class="controls">
        <button class="btn-p" onclick="recordResult('P')">Player</button>
        <button class="btn-b" onclick="recordResult('B')">Banker</button>
        <div class="util-btns">
            <button onclick="undo()">UNDO</button>
            <button onclick="resetAll()">RESET</button>
        </div>
    </div>
</div>

<script>
/* 100% ORIGINAL LOGIC INTEGRATION */
const MIN_HANDS = 10;
let sequence = JSON.parse(localStorage.getItem('baccarat_sequence')) || [];
let results = JSON.parse(localStorage.getItem('baccarat_results')) || [];
let lastPrediction = null;

const oldPatterns=[{seq:'PBPBP',pred:'P'},{seq:'BPBPB',pred:'B'},{seq:'PBPPB',pred:'P'},{seq:'BPPBP',pred:'P'},{seq:'PBBPB',pred:'P'},{seq:'BPBPP',pred:'P'},{seq:'BPBBP',pred:'P'},{seq:'PBPBB',pred:'P'},{seq:'PPBPP',pred:'B'},{seq:'BBPPP',pred:'B'},{seq:'PPBPB',pred:'P'},{seq:'PPPBP',pred:'B'},{seq:'PBBPP',pred:'B'},{seq:'BBPBB',pred:'P'},{seq:'BBBPB',pred:'P'},{seq:'BPPBB',pred:'P'},{seq:'PBPBB',pred:'B'},{seq:'BPBBP',pred:'B'},{seq:'PPBBB',pred:'P'},{seq:'BBPBP',pred:'B'},{seq:'PBBPB',pred:'B'}];

let patternMemory = JSON.parse(localStorage.getItem('patternMemory'))||{};
let shadowPatterns = JSON.parse(localStorage.getItem('shadowPatterns'))||{};

function applyPatternMemory(pred,seq){if(seq.length<5)return pred;const key=seq.slice(-5).join('');if(patternMemory[key]==="R") return pred==='P'?'B':'P';return pred;}
function storePatternMemory(seq,pred,actual){if(seq.length<5)return;const key=seq.slice(-5).join('');if(pred!==actual) patternMemory[key]="R";localStorage.setItem("patternMemory",JSON.stringify(patternMemory));}
function shadowCheck(seq,pred){if(seq.length<6)return pred;const key=seq.slice(-6).join('');if(shadowPatterns[key]>=2) return pred==='P'?'B':'P';return pred;}
function shadowStore(seq,pred,actual){if(seq.length<6)return;const key=seq.slice(-6).join('');if(pred!==actual){shadowPatterns[key]=(shadowPatterns[key]||0)+1;}else{shadowPatterns[key]=0;}localStorage.setItem("shadowPatterns",JSON.stringify(shadowPatterns));}
function quantumDrift(seq,pred){if(seq.length<6)return pred;const s=seq.slice(-6);const mirror=s[0]!==s[1]&&s[1]!==s[2]&&s[2]!==s[3];const streak=s.every(v=>v===s[0]);if(mirror||streak) return pred==='P'?'B':'P';return pred;}
function neuralShoe(seq,pred){if(seq.length<12)return pred;const s=seq.slice(-12);const p=s.filter(x=>x==='P').length;const b=s.filter(x=>x==='B').length;if(Math.abs(p-b)>=4) return p>b?'P':'B';return pred;}
function chaosDetector(seq,pred){if(seq.length<10)return pred;const s=seq.slice(-10);let alt=true;for(let i=1;i<s.length;i++) if(s[i]===s[i-1]) alt=false;const p=s.filter(x=>x==='P').length;const b=s.filter(x=>x==='B').length;if(alt||Math.abs(p-b)<=1) return "WAIT";return pred;}

function oldPatternPrediction(seq){if(seq.length<5)return null;const last5=seq.slice(-5).join('');const match=oldPatterns.find(p=>p.seq===last5);return match?match.pred:null;}
function buildPatterns(seq,length=5){const table={};for(let i=0;i<=seq.length-length;i++){const sub=seq.slice(i,i+length).join('');const next=seq[i+length];if(!next)continue;if(!table[sub])table[sub]={P:0,B:0};table[sub][next]++;}return table;}
function adaptivePrediction(seq){if(seq.length<5)return null;const table=buildPatterns(seq,5);const last5=seq.slice(-5).join('');if(table[last5]) return table[last5].P>=table[last5].B?'P':'B';return null;}
function trendPrediction(seq){const last6=seq.slice(-6);if(last6.length===0)return null;const p=last6.filter(x=>'P'===x).length;const b=last6.filter(x=>'B'===x).length;if(p>b)return'P';if(b>p)return'B';return seq[seq.length-1];}

function finalPrediction(seq){
    const oldPred=oldPatternPrediction(seq);
    if(oldPred) return{pred:oldPred,confidence:90};
    const adaptivePred=adaptivePrediction(seq);
    const trendPred=trendPrediction(seq);
    const pred=adaptivePred||trendPred;
    return pred?{pred,confidence:85}:null;
}

function recordResult(r){
    if(lastPrediction){
        storePatternMemory(sequence, lastPrediction, r);
        shadowStore(sequence, lastPrediction, r);
        results.push(lastPrediction === r ? 'W' : 'L');
    } else {
        results.push('');
    }
    sequence.push(r);
    saveData();
    updateUI();
    triggerLiveFeed();
}

function undo(){
    sequence.pop(); results.pop();
    saveData(); updateUI();
}

function resetAll(){
    if(confirm("Factory Reset Neural Engine?")){
        localStorage.clear(); sequence=[]; results=[];
        document.getElementById("liveFeed").innerHTML = "";
        updateUI();
    }
}

function saveData(){
    localStorage.setItem('baccarat_sequence', JSON.stringify(sequence));
    localStorage.setItem('baccarat_results', JSON.stringify(results));
}

function triggerLiveFeed(){
    if(sequence.length < MIN_HANDS) return;
    const feed = document.getElementById('liveFeed');
    const msgs=["SCANNING TABLE...","AI PATTERN ANALYSIS RUNNING...","NEURAL NETWORK ADJUSTMENT...","TACTICAL ENGINE UPDATED..."];
    msgs.forEach((m,i)=>{
        setTimeout(()=>{
            const div = document.createElement("div");
            div.textContent = "> " + m;
            feed.appendChild(div);
            feed.scrollTop = feed.scrollHeight;
        }, i*400);
    });
}

function updateUI(){
    document.getElementById('playerTotal').textContent = sequence.filter(x=>'P'===x).length;
    document.getElementById('bankerTotal').textContent = sequence.filter(x=>'B'===x).length;
    document.getElementById('totalRounds').textContent = sequence.length;

    const seqRow = document.getElementById('historySequence');
    seqRow.innerHTML = '';
    sequence.slice(-10).forEach(val => {
        const s = document.createElement('span');
        s.className = val; s.textContent = val;
        seqRow.appendChild(s);
    });

    const box = document.getElementById("predictionBox");
    const bar = document.getElementById("confidenceBar");

    if(sequence.length < MIN_HANDS){
        box.innerHTML = `<span style="font-size:14px; color:#444">NEED ${MIN_HANDS-sequence.length} MORE</span>`;
        bar.style.width = "0%";
        lastPrediction = null;
        return;
    }

    const result = finalPrediction(sequence);
    if(!result){
        box.innerHTML = "NO OUTPUT";
        bar.style.width = "0%";
        return;
    }

    let pred = result.pred;
    pred = applyPatternMemory(pred, sequence);
    pred = shadowCheck(sequence, pred);
    pred = quantumDrift(sequence, pred);
    pred = neuralShoe(sequence, pred);
    pred = chaosDetector(sequence, pred);

    if(pred === "WAIT"){
        box.innerHTML = "WAIT";
        bar.style.width = "0%";
        lastPrediction = null;
    } else {
        lastPrediction = pred;
        box.innerHTML = `<span class="${pred==='P'?'player':'banker'}">${pred==='P'?'PLAYER':'BANKER'}</span>`;
        bar.style.width = result.confidence + "%";
    }
}

updateUI();
</script>
</body>
</html>
