<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIDDEN PRO | COMMAND CENTER</title>
    <style>
        :root { --neon:#00ffff; --panel-bg: rgba(6,11,25,0.9); --danger: #ff4444; --success: #00ff88; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family:'Segoe UI',sans-serif; background:#000; color:#fff; padding:20px; min-height:100vh; }
        body::before { content:""; position:fixed; inset:0; background: radial-gradient(circle at 50% 50%, #001f3f 0%, #000 100%); z-index:-1; }
        .container { max-width: 1200px; margin: 0 auto; }

        /* Notifications */
        #successToast {
            position: fixed; top: 20px; right: 20px; background: var(--neon); color: #000;
            padding: 15px 30px; border-radius: 8px; font-weight: 900; letter-spacing: 2px;
            box-shadow: 0 0 20px var(--neon); z-index: 1000; display: none;
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }

        /* UI Elements */
        .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .price-card { background: var(--panel-bg); border: 1px solid #333; padding: 20px; border-radius: 12px; }
        label { display: block; font-size: 10px; color: var(--neon); margin-bottom: 8px; letter-spacing: 2px; font-weight: bold; }
        input, select { background: #0a0a0a; border: 1px solid #333; color: #fff; padding: 12px; width: 100%; border-radius: 6px; margin-bottom: 10px; }
        
        .save-btn { background: var(--neon); color: #000; border: none; padding: 15px; width: 100%; font-weight: 900; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
        .user-card { background: var(--panel-bg); border: 1px solid #222; border-radius: 15px; padding: 25px; margin-top: 40px; }
        .add-user-bar { display: flex; gap: 15px; margin-bottom: 30px; align-items: flex-end; background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #555; font-size: 11px; padding: 15px; border-bottom: 1px solid #222; }
        td { padding: 18px 15px; border-bottom: 1px solid #111; font-size: 14px; }
        .timer-text { font-family: monospace; color: var(--neon); font-weight: bold; }
    </style>
</head>
<body>

<div id="successToast">SUCCESS: ACTION COMPLETED</div>

<div class="container">
    <header style="margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h1 style="letter-spacing:10px; margin:0;">ADMIN TERMINAL</h1>
            <p id="adminStatus" style="color:var(--danger); font-size:11px; margin-top:5px; font-weight:bold;">RECOGNIZING ADMIN...</p>
        </div>
        <button onclick="adminLogin()" style="background:#fff; color:#000; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">FORCE LOGIN</button>
    </header>

    <div class="pricing-grid">
        <div class="price-card"><label>1 MONTH</label><input type="number" id="p1"></div>
        <div class="price-card"><label>3 MONTHS</label><input type="number" id="p3_new"></div>
        <div class="price-card"><label>1 YEAR</label><input type="number" id="p12_new"></div>
        <div class="price-card"><label>LIFETIME</label><input type="number" id="p_life"></div>
    </div>
    <button class="save-btn" onclick="updatePricing()">Update Prices</button>

    <div class="user-card">
        <h2 style="margin-bottom:20px; font-size:18px;">GRANT ACCESS TO ANY EMAIL</h2>
        <div class="add-user-bar">
            <div style="flex:2"><label>TARGET GMAIL</label><input type="text" id="addEmail" placeholder="customer@gmail.com" style="margin:0;"></div>
            <div style="flex:1">
                <label>DURATION</label>
                <select id="addDuration" style="margin:0;">
                    <option value="30">30 Days</option>
                    <option value="90">90 Days</option>
                    <option value="365">365 Days</option>
                    <option value="99999">LIFETIME</option>
                </select>
            </div>
            <button id="grantBtn" onclick="grantAccess()" style="padding:12px 25px; background:var(--neon); border:none; font-weight:900; height:45px; border-radius:6px; cursor:pointer;">ACTIVATE EMAIL</button>
        </div>

        <table>
            <thead>
                <tr><th>USER EMAIL</th><th>TIME REMAINING</th><th>EXPIRY</th><th style="text-align:right;">ACTION</th></tr>
            </thead>
            <tbody id="userList"></tbody>
        </table>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
    authDomain: "my-software-portal.firebaseapp.com",
    projectId: "my-software-portal",
    appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// ADMIN AUTH CHECK
window.adminLogin = () => signInWithPopup(auth, provider);

onAuthStateChanged(auth, (user) => {
    const status = document.getElementById('adminStatus');
    if (user && user.email === 'edzelkeith0@gmail.com') {
        status.innerHTML = "ADMIN VERIFIED: " + user.email;
        status.style.color = "#00ff88";
    } else {
        status.innerHTML = "UNAUTHORIZED: PLEASE LOGIN AS ADMIN";
        status.style.color = "#ff4444";
        adminLogin();
    }
});

function showSuccess(msg) {
    const toast = document.getElementById('successToast');
    toast.textContent = "SUCCESS: " + msg;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

// PRICING LOGIC
(async () => {
    const pDoc = await getDoc(doc(db, "settings", "pricing"));
    if(pDoc.exists()){
        const d = pDoc.data();
        document.getElementById('p1').value = d.p1;
        document.getElementById('p3_new').value = d.p3_new;
        document.getElementById('p12_new').value = d.p12_new;
        document.getElementById('p_life').value = d.p_life;
    }
})();

window.updatePricing = async () => {
    await setDoc(doc(db, "settings", "pricing"), {
        p1: document.getElementById('p1').value,
        p3_new: document.getElementById('p3_new').value,
        p12_new: document.getElementById('p12_new').value,
        p_life: document.getElementById('p_life').value
    });
    showSuccess("PRICING UPDATED");
};

// USER ACCESS LOGIC
window.grantAccess = async () => {
    const email = document.getElementById('addEmail').value.toLowerCase().trim();
    const days = parseInt(document.getElementById('addDuration').value);
    if(!email) return;

    try {
        const now = new Date().getTime();
        const expiryTime = days > 30000 ? 'LIFETIME' : now + (days * 24 * 60 * 60 * 1000);

        await setDoc(doc(db, "users", email), {
            email: email,
            expiry: expiryTime,
            isPaid: true
        });
        document.getElementById('addEmail').value = "";
        showSuccess("ACCESS GRANTED TO " + email);
    } catch (e) {
        alert("ACCESS DENIED: You must login as edzelkeith0@gmail.com");
    }
};

onSnapshot(collection(db, "users"), (snapshot) => {
    const list = document.getElementById('userList');
    list.innerHTML = "";
    snapshot.forEach(docSnap => {
        const u = docSnap.data();
        const isLife = u.expiry === 'LIFETIME';
        list.innerHTML += `
            <tr>
                <td><strong>${u.email}</strong></td>
                <td><span class="timer-text" data-expiry="${u.expiry}" data-email="${u.email}">${isLife ? '∞ LIFETIME' : '...'}</span></td>
                <td>${isLife ? 'PERMANENT' : new Date(u.expiry).toLocaleDateString()}</td>
                <td style="text-align:right"><button onclick="removeUser('${u.email}')" style="color:red; background:none; border:none; cursor:pointer;">REMOVE</button></td>
            </tr>`;
    });
});

window.removeUser = async (email) => {
    if(confirm("Remove " + email + "?")) {
        await deleteDoc(doc(db, "users", email));
        showSuccess("USER DELETED");
    }
};

// TIMER LOOP
setInterval(() => {
    const now = new Date().getTime();
    document.querySelectorAll('.timer-text').forEach(async el => {
        const exp = el.dataset.expiry;
        if(exp === 'LIFETIME') return;
        const dist = parseInt(exp) - now;
        if (dist < -5000) { await deleteDoc(doc(db, "users", el.dataset.email)); return; }
        if (dist < 0) { el.innerHTML = "EXPIRED"; return; }
        const d = Math.floor(dist / (1000 * 60 * 60 * 24));
        const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((dist % (1000 * 60)) / 1000);
        el.innerHTML = `${d}d ${h}h ${m}m ${s}s`;
    });
}, 1000);
</script>
</body>
</html>
