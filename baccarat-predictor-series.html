<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baccarat Pro Series | PREMIUM</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    if (window.location.pathname.endsWith('.html')) {
      const cleanUrl = window.location.pathname.replace('.html', '');
      window.history.replaceState(null, '', cleanUrl);
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
      authDomain: "my-software-portal.firebaseapp.com",
      projectId: "my-software-portal",
      appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "index.html"; return; }
      const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
      const now = new Date().getTime();
      if (!userDoc.exists() || (userDoc.data().expiry !== 'LIFETIME' && userDoc.data().expiry < now)) {
        window.location.href = "index.html";
        return;
      }
      document.body.style.display = "block";
    });
  </script>

  <style>
    :root {
      --purple-glow: #bb86fc;
      --player-blue: #2196f3;
      --banker-red: #f44336;
    }

    body {
      margin:0; padding:0;
      font-family:'Roboto',sans-serif;
      color:#eee; font-size:17px;
      display: none; /* Security hidden */
      background: linear-gradient(-45deg, #1a0026, #2e004f, #4b0082, #310652);
      background-size: 400% 400%;
      animation: galaxy 15s ease infinite;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* ensure body becomes flex when shown */
    body[style*="display: block"] {
      display: flex !important;
    }

    @keyframes galaxy {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    /* EXIT BUTTON */
    .exit-nav {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1000;
    }
    .exit-btn {
      background: rgba(255,255,255,0.1);
      color: white;
      padding: 8px 15px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 12px;
      font-family: 'Orbitron';
      transition: 0.3s;
    }
    .exit-btn:hover {
      background: #8a2be2;
      border-color: #fff;
      box-shadow: 0 0 10px #8a2be2;
    }

    /* header compact */
    .header {
      text-align:center;
      padding: 20px 0 15px;
      background:rgba(0,0,0,0.6);
      border-bottom:1px solid rgba(255,255,255,0.1);
      border-radius: 15px 15px 0 0;
    }
    .header h1 {
      font-family:'Orbitron',sans-serif;
      font-size:28px;
      color:#ffffff;
      margin:0;
      font-weight:bold;
      letter-spacing:2px;
      text-shadow:0 0 15px var(--purple-glow);
    }

    /* container: small, centered, card-like */
    .container {
      max-width: 620px;
      width: 95%;
      margin: 20px auto;
      padding: 20px 20px 25px;
      background: rgba(15, 15, 25, 0.92);
      border:1px solid #444;
      border-radius: 20px;
      text-align:center;
      box-shadow:0 15px 45px rgba(0,0,0,0.9);
      backdrop-filter: blur(12px);
    }

    .sequence {
      margin:12px 0;
      min-height: 36px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .sequence span {
      display:inline-block;
      width:28px;
      height:28px;
      line-height:28px;
      text-align:center;
      border-radius:50%;
      font-weight:bold;
      font-size: 13px;
    }
    .p { background: var(--player-blue); color:#fff; box-shadow: 0 0 10px var(--player-blue); } 
    .b { background: var(--banker-red); color:#fff; box-shadow: 0 0 10px var(--banker-red); }
    .t { background:#ffc107; color:#000; }

    .prediction {
      margin:16px 0;
      font-size:28px;
      font-weight:900;
      font-family: 'Orbitron';
      height: 44px;
    }
    .prediction .pred-p { color: var(--player-blue); text-shadow: 0 0 15px var(--player-blue); }
    .prediction .pred-b { color: var(--banker-red); text-shadow: 0 0 15px var(--banker-red); }

    .buttons {
      margin:14px 0 10px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .buttons button {
      background:#111;
      color:#fff;
      border:1px solid #555;
      border-radius:8px;
      padding:10px 16px;
      font-size:13px;
      font-family:'Orbitron';
      cursor:pointer;
      transition: 0.2s;
    }
    .buttons button:hover:enabled {
      background:#333;
      border-color: var(--purple-glow);
      transform: scale(1.04);
    }
    .btn-reset {
      border-color: #ffc107 !important;
      color: #ffc107 !important;
    }

    .capital-table table {
      width:100%;
      border-collapse:collapse;
      margin-top: 14px;
      background:#111;
      border:1px solid #333;
      font-size: 13px;
    }
    .capital-table th, .capital-table td {
      padding:8px 4px;
      font-size:13px;
      border:1px solid #333;
      text-align:center;
    }
    .capital-table th {
      background:#222;
      font-family: 'Orbitron';
      font-size: 11px;
      color: var(--purple-glow);
    }

    .highlight {
      background:#ffc107 !important;
      color:#000 !important;
      font-weight:bold;
      animation: pulse 1s infinite;
    }
    .highlight-win {
      color:#00f693 !important;
      font-weight:bold;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .message-box {
      margin-top:16px;
      font-size:20px;
      font-weight:bold;
      font-family: 'Orbitron';
    }
    .success { color:#00f693; }
    .fail { color:#f44336; }

    /* small adjustment for spacing */
    .container > *:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="exit-nav">
    <a href="index.html" class="exit-btn">EXIT TERMINAL</a>
  </div>

  <div class="container">
    <div class="header"><h1>Baccarat Pro Series</h1></div>

    <div class="sequence" id="historyBox"></div>
    <div id="predictionBox" class="prediction"></div>

    <div class="buttons">
      <button onclick="recordResult('P')">PLAYER</button>
      <button onclick="recordResult('B')">BANKER</button>
      <button onclick="recordResult('T')">TIE</button>
      <button onclick="undo()">UNDO</button>
      <button onclick="resetAll()" class="btn-reset">RESET</button>
    </div>

    <div class="capital-table" id="betTableBox">
      <table id="betTable">
        <thead>
          <tr>
            <th>Bet 1</th><th>Bet 2</th><th>Bet 3</th><th>Bet 4</th><th>Bet 5</th><th>Bet 6</th><th>Bet 7</th><th>WIN</th>
          </tr>
        </thead>
        <tbody id="betBody"></tbody>
      </table>
    </div>
    <div id="finalMessage" class="message-box"></div>
  </div>

<script>
    let sequence = [];
    let currentPrediction = null;
    let currentRow = 0;
    let currentCol = 0;
    const maxCols = 8;
    const maxRows = 10;
    const betValues = ["1", "2", "4", "8", "16", "32", "64", "ALL IN"];

    function initBetTable() {
        const tbody = document.getElementById('betBody');
        tbody.innerHTML = '';
        for (let r=0; r<maxRows; r++) {
            const tr = document.createElement('tr');
            for (let c=0; c<maxCols; c++) {
                const td = document.createElement('td');
                td.textContent = betValues[c];
                tr.appendChild(td);
            }
            const winTd = document.createElement('td');
            winTd.textContent = '';
            tr.appendChild(winTd);
            tbody.appendChild(tr);
        }
    }

    function updateHistory() {
        const box = document.getElementById('historyBox');
        box.innerHTML = '';
        sequence.forEach(r => {
            const span = document.createElement('span');
            span.className = r.toLowerCase();
            span.textContent = r;
            box.appendChild(span);
        });
    }

    function updatePrediction() {
        const box = document.getElementById('predictionBox');
        if (sequence.length < 7) {
            currentPrediction = null;
            box.innerHTML = "<span style='font-size:14px; color:#888;'>WAITING FOR DATA (NEED 7)</span>";
            updateBetTable();
            return;
        }
        
        const windowSizes = [5,4,3];
        let found = false;
        let nextChoices = [];
        for (let w of windowSizes) {
            if (sequence.length >= w) {
                const lastForm = sequence.slice(-w).join("-");
                for (let i=0; i <= sequence.length - w - 1; i++) {
                    if (sequence.slice(i, i+w).join("-") === lastForm) {
                        const nextVal = sequence[i+w];
                        if (nextVal && nextVal !== 'T') nextChoices.push(nextVal);
                    }
                }
                if (nextChoices.length > 0) { found = true; break; }
            }
        }
        
        currentPrediction = found ? (nextChoices.filter(x=>x==='P').length >= nextChoices.filter(x=>x==='B').length ? 'P' : 'B') : 'B';
        
        if (currentPrediction === 'P') {
            box.innerHTML = "<span class='pred-p'>PLAYER</span>";
        } else {
            box.innerHTML = "<span class='pred-b'>BANKER</span>";
        }
        updateBetTable();
    }

    function updateBetTable() {
        const rows = document.getElementById('betBody').rows;
        for (let r=0; r<maxRows; r++) {
            for (let c=0; c<maxCols; c++) rows[r].cells[c].classList.remove('highlight');
        }
        if (currentPrediction && sequence.length >= 7 && rows[currentRow]) {
            rows[currentRow].cells[currentCol].classList.add('highlight');
        }
    }

    function markWin(rowIndex) {
        const rows = document.getElementById('betBody').rows;
        if (rows[rowIndex]) {
            rows[rowIndex].cells[maxCols].innerHTML = "✔";
            rows[rowIndex].cells[maxCols].classList.add('highlight-win');
        }
    }

    function recordResult(res) {
        const prevPrediction = currentPrediction;
        if (prevPrediction && (res==='P'||res==='B')) {
            if (res === prevPrediction) {
                markWin(currentRow);
                currentRow++; currentCol=0;
                if (currentRow >= maxRows) {
                    document.getElementById('betTableBox').style.display="none";
                    document.getElementById('finalMessage').innerHTML = "🎉 TARGET REACHED!";
                    document.getElementById('finalMessage').className = "message-box success";
                    return;
                }
            } else {
                currentCol++;
                if (currentCol >= maxCols) {
                    document.getElementById('betTableBox').style.display="none";
                    document.getElementById('finalMessage').innerHTML = "❌ LIMIT REACHED";
                    document.getElementById('finalMessage').className = "message-box fail";
                    return;
                }
            }
        }
        sequence.push(res);
        updateHistory();
        updatePrediction();
    }

    function undo() {
        if (sequence.length === 0) return;
        sequence.pop();
        const tempSeq = [...sequence];
        resetAll();
        tempSeq.forEach(r => recordResult(r));
    }

    function resetAll() {
        sequence=[]; currentPrediction=null; currentRow=0; currentCol=0;
        initBetTable();
        document.getElementById('betTableBox').style.display="block";
        document.getElementById('finalMessage').textContent="";
        document.getElementById('finalMessage').className = "message-box";
        updateHistory(); updatePrediction();
    }

    // SECURITY PROTOCOLS (unchanged)
    (function() {
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };
        setInterval(function() {
            (function() { return false; }['constructor']('debugger')['call']());
        }, 50);
        if (typeof console !== "undefined") {
            Object.keys(console).forEach(m => console[m] = function() {});
        }
    })();

    initBetTable(); updateHistory(); updatePrediction();
</script>
</body>
</html>
