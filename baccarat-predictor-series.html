<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baccarat Pro Series</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    if (window.location.pathname.endsWith('.html')) {
      const cleanUrl = window.location.pathname.replace('.html', '');
      window.history.replaceState(null, '', cleanUrl);
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
      authDomain: "my-software-portal.firebaseapp.com",
      projectId: "my-software-portal",
      appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "index.html"; return; }
      const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
      const now = new Date().getTime();
      if (!userDoc.exists() || (userDoc.data().expiry !== 'LIFETIME' && userDoc.data().expiry < now)) {
        window.location.href = "index.html";
        return;
      }
      document.body.style.display = "block";
    });
  </script>

  <style>
    :root {
      /* Player Colors - Navy/Blue/Sky Blue */
      --player-dark: #1A3A6A;
      --player-mid: #2A5A9A;
      --player-light: #5B8CC4;
      --player-sky: #87CEEB;
      --player-glow: rgba(42, 90, 154, 0.4);

      /* Banker Colors - Red/Dark Red/Red-Pink */
      --banker-dark: #6B1A1A;
      --banker-mid: #A52A2A;
      --banker-light: #CC4444;
      --banker-pink: #E88080;
      --banker-glow: rgba(165, 42, 42, 0.4);

      /* Tie Colors - Green/Dark Green/Light Green */
      --tie-dark: #1A4A2A;
      --tie-mid: #2A7A3A;
      --tie-light: #4AAA5A;
      --tie-glow: rgba(42, 122, 58, 0.4);

      /* Gray for Undo & Reset */
      --gray-dark: #4A4A4A;
      --gray-mid: #7A7A7A;
      --gray-light: #AAAAAA;
      --gray-glow: rgba(122, 122, 122, 0.3);

      /* Bet Highlight - Light Yellow */
      --highlight-yellow: #FFF8B0;
      --highlight-glow: rgba(255, 248, 176, 0.6);

      /* Theme Background - Soft/Light */
      --bg-dark: #1A2A3A;
      --bg-mid: #2A3A5A;
      --bg-light: #3A5A7A;
      --bg-soft: #4A6A8A;
      --bg-container: rgba(26, 42, 58, 0.92);
      --text-light: #F0F4F8;
      --text-mid: #C8D8E8;
      --border-light: rgba(74, 106, 138, 0.25);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      color: var(--text-light);
      font-size: 17px;
      display: none;
      background: linear-gradient(-45deg, #1A2A3A, #2A3A5A, #3A5A7A, #2A3A5A);
      background-size: 400% 400%;
      animation: galaxy 20s ease infinite;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    body[style*="display: block"] {
      display: flex !important;
    }

    @keyframes galaxy {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* WELCOME OVERLAY */
    #welcomeOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    #welcomeOverlay.hidden {
      display: none;
    }
    .welcome-box {
      background: rgba(26, 42, 58, 0.98);
      border: 2px solid var(--border-light);
      border-radius: 25px;
      padding: 50px 45px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 80px rgba(42, 58, 90, 0.3);
    }
    .welcome-box h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 38px;
      color: var(--text-light);
      margin: 0 0 10px 0;
      text-shadow: 0 0 40px var(--player-glow);
      letter-spacing: 4px;
    }
    .welcome-box .subtitle {
      font-size: 14px;
      color: var(--text-mid);
      margin-bottom: 30px;
      font-family: 'Roboto', sans-serif;
      letter-spacing: 2px;
    }
    .welcome-box label {
      display: block;
      font-size: 14px;
      color: var(--text-light);
      text-align: left;
      margin-bottom: 8px;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .welcome-box input {
      width: 100%;
      padding: 14px 18px;
      font-size: 20px;
      font-family: 'Orbitron', sans-serif;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--border-light);
      border-radius: 12px;
      color: var(--text-light);
      outline: none;
      transition: 0.3s;
      box-sizing: border-box;
      text-align: center;
    }
    .welcome-box input:focus {
      border-color: var(--player-mid);
      box-shadow: 0 0 30px var(--player-glow);
    }
    .welcome-box input::placeholder {
      color: var(--gray-light);
      font-size: 16px;
    }
    .welcome-box .confirm-btn {
      margin-top: 25px;
      width: 100%;
      padding: 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(135deg, var(--player-dark), var(--player-mid));
      border: 2px solid var(--border-light);
      border-radius: 12px;
      color: var(--text-light);
      cursor: pointer;
      transition: 0.3s;
      letter-spacing: 2px;
      text-shadow: none;
    }
    .welcome-box .confirm-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 40px var(--player-glow);
      border-color: var(--player-light);
    }
    .welcome-box .confirm-btn:active {
      transform: scale(0.97);
    }

    .exit-nav {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1000;
    }
    .exit-btn {
      background: rgba(26, 42, 58, 0.9);
      color: var(--text-light);
      padding: 8px 15px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      border: 1px solid var(--border-light);
      font-size: 12px;
      font-family: 'Orbitron';
      transition: 0.3s;
    }
    .exit-btn:hover {
      background: var(--player-mid);
      border-color: var(--text-light);
      color: var(--text-light);
      box-shadow: 0 0 30px var(--player-glow);
    }

    .header {
      text-align: center;
      padding: 20px 0 15px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 2px solid var(--border-light);
      border-radius: 15px 15px 0 0;
    }
    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      color: var(--text-light);
      margin: 0;
      font-weight: bold;
      letter-spacing: 4px;
      text-shadow: 0 0 30px var(--player-glow);
    }

    .container {
      max-width: 620px;
      width: 95%;
      margin: 20px auto;
      padding: 20px 20px 25px;
      background: var(--bg-container);
      border: 2px solid var(--border-light);
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(15px);
      display: none;
    }
    .container.active {
      display: block;
    }

    .sequence {
      margin: 12px 0;
      min-height: 36px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .sequence span {
      display: inline-block;
      width: 28px;
      height: 28px;
      line-height: 28px;
      text-align: center;
      border-radius: 50%;
      font-weight: bold;
      font-size: 13px;
    }
    /* PLAYER - Navy/Blue/Sky Blue */
    .p {
      background: var(--player-mid);
      color: var(--text-light);
      box-shadow: 0 0 20px var(--player-glow);
    }
    /* BANKER - Red/Dark Red/Red-Pink */
    .b {
      background: var(--banker-mid);
      color: var(--text-light);
      box-shadow: 0 0 20px var(--banker-glow);
    }
    /* TIE - Green/Dark Green/Light Green */
    .t {
      background: var(--tie-mid);
      color: var(--text-light);
      box-shadow: 0 0 20px var(--tie-glow);
    }

    .prediction {
      margin: 16px 0;
      font-size: 28px;
      font-weight: 900;
      font-family: 'Orbitron';
      height: 44px;
    }
    .prediction .pred-p {
      color: var(--player-sky);
      text-shadow: 0 0 30px var(--player-glow);
    }
    .prediction .pred-b {
      color: var(--banker-light);
      text-shadow: 0 0 30px var(--banker-glow);
    }

    .buttons {
      margin: 14px 0 10px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    /* PLAYER BUTTON */
    .buttons button#btnPlayer {
      background: var(--player-dark);
      color: var(--text-light);
      border: 2px solid var(--player-mid);
    }
    .buttons button#btnPlayer:hover:enabled {
      background: var(--player-light);
      border-color: var(--player-sky);
      box-shadow: 0 0 30px var(--player-glow);
      transform: scale(1.05);
    }
    /* BANKER BUTTON */
    .buttons button#btnBanker {
      background: var(--banker-dark);
      color: var(--text-light);
      border: 2px solid var(--banker-mid);
    }
    .buttons button#btnBanker:hover:enabled {
      background: var(--banker-light);
      border-color: var(--banker-pink);
      box-shadow: 0 0 30px var(--banker-glow);
      transform: scale(1.05);
    }
    /* TIE BUTTON */
    .buttons button#btnTie {
      background: var(--tie-dark);
      color: var(--text-light);
      border: 2px solid var(--tie-mid);
    }
    .buttons button#btnTie:hover:enabled {
      background: var(--tie-light);
      border-color: var(--tie-light);
      box-shadow: 0 0 30px var(--tie-glow);
      transform: scale(1.05);
    }
    /* UNDO & RESET - GRAY */
    .buttons button#btnUndo {
      background: var(--gray-dark);
      color: var(--text-light);
      border: 2px solid var(--gray-mid);
    }
    .buttons button#btnUndo:hover:enabled {
      background: var(--gray-mid);
      border-color: var(--gray-light);
      box-shadow: 0 0 30px var(--gray-glow);
      transform: scale(1.05);
    }
    .buttons button#btnReset {
      background: var(--gray-dark);
      color: var(--text-light);
      border: 2px solid var(--gray-mid);
    }
    .buttons button#btnReset:hover:enabled {
      background: var(--gray-mid);
      border-color: var(--gray-light);
      box-shadow: 0 0 30px var(--gray-glow);
      transform: scale(1.05);
    }
    .buttons button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }
    .btn-reset.blink-reset {
      animation: blinkGray 0.8s ease-in-out infinite;
      border-color: var(--gray-light) !important;
      box-shadow: 0 0 30px var(--gray-glow);
    }
    @keyframes blinkGray {
      0% { background: var(--gray-dark); color: var(--text-light); }
      50% { background: var(--gray-mid); color: var(--text-light); box-shadow: 0 0 40px var(--gray-glow); }
      100% { background: var(--gray-dark); color: var(--text-light); }
    }

    .capital-table table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      background: rgba(26, 42, 58, 0.9);
      border: 2px solid var(--border-light);
      table-layout: auto;
    }
    .capital-table th,
    .capital-table td {
      padding: 6px 2px;
      font-size: 13px;
      border: 1px solid var(--border-light);
      text-align: center;
      white-space: nowrap;
      width: auto;
      color: var(--text-mid);
    }
    .capital-table th {
      background: rgba(26, 42, 58, 0.95);
      font-family: 'Orbitron';
      font-size: 10px;
      color: var(--text-light);
      padding: 6px 1px;
      letter-spacing: 0.3px;
    }
    .capital-table td:last-child {
      min-width: 30px;
    }

    /* BET HIGHLIGHT - LIGHT YELLOW */
    .highlight {
      background: var(--highlight-yellow) !important;
      color: var(--player-dark) !important;
      font-weight: bold;
      animation: pulseYellow 1s infinite;
    }
    .highlight-win {
      color: var(--highlight-yellow) !important;
      font-weight: bold;
      text-shadow: 0 0 20px var(--highlight-glow);
    }
    @keyframes pulseYellow {
      0% { opacity: 0.8; }
      50% { opacity: 1; background: #FFE87A !important; }
      100% { opacity: 0.8; }
    }

    .message-box {
      margin-top: 16px;
      font-size: 20px;
      font-weight: bold;
      font-family: 'Orbitron';
    }
    .success {
      color: var(--tie-light);
    }
    .fail {
      color: var(--banker-light);
    }

    ::placeholder {
      color: var(--gray-light) !important;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- WELCOME OVERLAY -->
  <div id="welcomeOverlay">
    <div class="welcome-box">
      <h1>WELCOME</h1>
      <div class="subtitle">✦ BACCARAT PRO SERIES ✦</div>
      <label for="baseBetInput">ENTER BASE BET</label>
      <input type="text" id="baseBetInput" placeholder="e.g. 10, 25.50, 100" value="10">
      <button class="confirm-btn" id="confirmBtn">▶ CONFIRM</button>
    </div>
  </div>

  <div class="exit-nav">
    <a href="index.html" class="exit-btn">EXIT TERMINAL</a>
  </div>

  <div class="container" id="mainApp">
    <div class="header"><h1>Baccarat Pro Series</h1></div>

    <div class="sequence" id="historyBox"></div>
    <div id="predictionBox" class="prediction"></div>

    <div class="buttons">
      <button id="btnPlayer" onclick="recordResult('P')">PLAYER</button>
      <button id="btnBanker" onclick="recordResult('B')">BANKER</button>
      <button id="btnTie" onclick="recordResult('T')">TIE</button>
      <button id="btnUndo" onclick="undo()">UNDO</button>
      <button id="btnReset" onclick="resetAll()" class="btn-reset">RESET</button>
    </div>

    <div class="capital-table" id="betTableBox">
      <table id="betTable">
        <thead>
          <tr>
            <th>Bet 1</th><th>Bet 2</th><th>Bet 3</th><th>Bet 4</th><th>Bet 5</th><th>Bet 6</th><th>Bet 7</th><th>Bet 8</th><th>WIN</th>
          </tr>
        </thead>
        <tbody id="betBody"></tbody>
      </table>
    </div>
    <div id="finalMessage" class="message-box"></div>
  </div>

  <script>
    let sequence = [];
    let currentPrediction = null;
    let currentRow = 0;
    let currentCol = 0;
    let isGameOver = false;
    let baseBet = 10;
    let baseBetString = "10";
    const maxCols = 8;
    const maxRows = 10;

    function initBetTable() {
      const tbody = document.getElementById('betBody');
      tbody.innerHTML = '';
      const betValues = getBetValues();
      for (let r = 0; r < maxRows; r++) {
        const tr = document.createElement('tr');
        for (let c = 0; c < maxCols; c++) {
          const td = document.createElement('td');
          td.textContent = betValues[c];
          tr.appendChild(td);
        }
        const winTd = document.createElement('td');
        winTd.textContent = '';
        tr.appendChild(winTd);
        tbody.appendChild(tr);
      }
    }

    function getBetValues() {
      const b = parseFloat(baseBet);
      if (isNaN(b) || b <= 0) return ["1", "2", "4", "8", "16", "32", "64", "ALL IN"];
      
      const hasDecimal = baseBetString.includes('.');
      
      if (hasDecimal) {
        return [
          b.toFixed(2),
          (b * 2).toFixed(2),
          (b * 4).toFixed(2),
          (b * 8).toFixed(2),
          (b * 16).toFixed(2),
          (b * 32).toFixed(2),
          (b * 64).toFixed(2),
          "ALL IN"
        ];
      } else {
        return [
          Math.round(b).toString(),
          Math.round(b * 2).toString(),
          Math.round(b * 4).toString(),
          Math.round(b * 8).toString(),
          Math.round(b * 16).toString(),
          Math.round(b * 32).toString(),
          Math.round(b * 64).toString(),
          "ALL IN"
        ];
      }
    }

    function setButtonsEnabled(enabled) {
      document.getElementById('btnPlayer').disabled = !enabled;
      document.getElementById('btnBanker').disabled = !enabled;
      document.getElementById('btnTie').disabled = !enabled;
      document.getElementById('btnUndo').disabled = !enabled;
      document.getElementById('btnReset').disabled = false;
    }

    function updateHistory() {
      const box = document.getElementById('historyBox');
      box.innerHTML = '';
      const displaySeq = sequence.slice(-10);
      displaySeq.forEach(r => {
        const span = document.createElement('span');
        span.className = r.toLowerCase();
        span.textContent = r;
        box.appendChild(span);
      });
    }

    function updatePrediction() {
      const box = document.getElementById('predictionBox');
      if (isGameOver) return;
      if (sequence.length < 7) {
        currentPrediction = null;
        box.innerHTML = "<span style='font-size:14px; color:var(--gray-light);'>WAITING FOR DATA (NEED 7)</span>";
        updateBetTable();
        return;
      }

      const windowSizes = [5, 4, 3];
      let found = false;
      let nextChoices = [];
      for (let w of windowSizes) {
        if (sequence.length >= w) {
          const lastForm = sequence.slice(-w).join("-");
          for (let i = 0; i <= sequence.length - w - 1; i++) {
            if (sequence.slice(i, i + w).join("-") === lastForm) {
              const nextVal = sequence[i + w];
              if (nextVal && nextVal !== 'T') nextChoices.push(nextVal);
            }
          }
          if (nextChoices.length > 0) { found = true; break; }
        }
      }

      currentPrediction = found ? (nextChoices.filter(x => x === 'P').length >= nextChoices.filter(x => x === 'B').length ? 'P' : 'B') : 'B';

      if (currentPrediction === 'P') {
        box.innerHTML = "<span class='pred-p'>PLAYER</span>";
      } else {
        box.innerHTML = "<span class='pred-b'>BANKER</span>";
      }
      updateBetTable();
    }

    function updateBetTable() {
      const rows = document.getElementById('betBody').rows;
      for (let r = 0; r < maxRows; r++) {
        for (let c = 0; c < maxCols; c++) rows[r].cells[c].classList.remove('highlight');
      }
      if (currentPrediction && sequence.length >= 7 && rows[currentRow] && !isGameOver) {
        rows[currentRow].cells[currentCol].classList.add('highlight');
      }
    }

    function markWin(rowIndex) {
      const rows = document.getElementById('betBody').rows;
      if (rows[rowIndex]) {
        rows[rowIndex].cells[maxCols].innerHTML = "✔";
        rows[rowIndex].cells[maxCols].classList.add('highlight-win');
      }
    }

    function recordResult(res) {
      if (isGameOver) return;

      const prevPrediction = currentPrediction;
      if (prevPrediction && (res === 'P' || res === 'B')) {
        if (res === prevPrediction) {
          markWin(currentRow);
          currentRow++;
          currentCol = 0;
          if (currentRow >= maxRows) {
            isGameOver = true;
            document.getElementById('betTableBox').style.display = "none";
            document.getElementById('finalMessage').innerHTML = "🎉 TARGET REACHED!";
            document.getElementById('finalMessage').className = "message-box success";
            setButtonsEnabled(false);
            document.getElementById('btnReset').classList.add('blink-reset');
            return;
          }
        } else {
          currentCol++;
          if (currentCol >= maxCols) {
            isGameOver = true;
            document.getElementById('betTableBox').style.display = "none";
            document.getElementById('finalMessage').innerHTML = "❌ LIMIT REACHED";
            document.getElementById('finalMessage').className = "message-box fail";
            setButtonsEnabled(false);
            return;
          }
        }
      }
      sequence.push(res);
      updateHistory();
      updatePrediction();
    }

    function undo() {
      if (isGameOver) return;
      if (sequence.length === 0) return;
      sequence.pop();
      const tempSeq = [...sequence];
      resetAll();
      tempSeq.forEach(r => recordResult(r));
    }

    function resetAll() {
      isGameOver = false;
      sequence = [];
      currentPrediction = null;
      currentRow = 0;
      currentCol = 0;
      initBetTable();
      document.getElementById('betTableBox').style.display = "block";
      document.getElementById('finalMessage').textContent = "";
      document.getElementById('finalMessage').className = "message-box";
      setButtonsEnabled(true);
      document.getElementById('btnReset').classList.remove('blink-reset');
      updateHistory();
      updatePrediction();
    }

    // WELCOME LOGIC
    document.getElementById('confirmBtn').addEventListener('click', function() {
      const input = document.getElementById('baseBetInput');
      const rawValue = input.value.trim();
      if (rawValue === '') {
        alert('Please enter a base bet amount.');
        return;
      }
      const num = parseFloat(rawValue);
      if (isNaN(num) || num <= 0) {
        alert('Please enter a valid positive number.');
        return;
      }
      baseBet = num;
      baseBetString = rawValue;
      
      document.getElementById('welcomeOverlay').classList.add('hidden');
      document.getElementById('mainApp').classList.add('active');
      initBetTable();
      updateHistory();
      updatePrediction();
      setButtonsEnabled(true);
    });

    document.getElementById('baseBetInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('confirmBtn').click();
      }
    });

    // SECURITY PROTOCOLS
    (function() {
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.onkeydown = function(e) {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) {
          return false;
        }
      };
