<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baccarat Pro Series</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    if (window.location.pathname.endsWith('.html')) {
      const cleanUrl = window.location.pathname.replace('.html', '');
      window.history.replaceState(null, '', cleanUrl);
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
      authDomain: "my-software-portal.firebaseapp.com",
      projectId: "my-software-portal",
      appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "index.html"; return; }
      const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
      const now = new Date().getTime();
      if (!userDoc.exists() || (userDoc.data().expiry !== 'LIFETIME' && userDoc.data().expiry < now)) {
        window.location.href = "index.html";
        return;
      }
      document.body.style.display = "block";
    });
  </script>

  <style>
    :root {
      --purple-glow: #bb86fc;
      --player-blue: #2196f3;
      --banker-red: #f44336;
      /* premium navy base */
      --navy-deep: #0a192f;
      --navy-mid: #112240;
      --navy-light: #233554;
      --navy-card: #0d1b2a;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      color: #eee;
      font-size: 17px;
      display: none;
      /* premium navy gradient */
      background: linear-gradient(145deg, #0a192f 0%, #0d1b2a 40%, #112240 80%, #1a2a4a 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    body[style*="display: block"] {
      display: flex !important;
    }

    /* subtle animated shimmer over navy */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(30, 60, 120, 0.15) 0%, transparent 60%),
                  radial-gradient(circle at 80% 70%, rgba(20, 50, 110, 0.12) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* WELCOME OVERLAY */
    #welcomeOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 25, 47, 0.92);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    #welcomeOverlay.hidden {
      display: none;
    }
    .welcome-box {
      background: rgba(17, 34, 64, 0.95);
      border: 1px solid rgba(187, 134, 252, 0.25);
      border-radius: 25px;
      padding: 50px 45px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(20, 60, 140, 0.3);
      backdrop-filter: blur(4px);
    }
    .welcome-box h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 38px;
      color: #fff;
      margin: 0 0 10px 0;
      text-shadow: 0 0 30px rgba(187, 134, 252, 0.3);
      letter-spacing: 4px;
    }
    .welcome-box .subtitle {
      font-size: 14px;
      color: #8899bb;
      margin-bottom: 30px;
      font-family: 'Roboto', sans-serif;
      letter-spacing: 2px;
    }
    .welcome-box label {
      display: block;
      font-size: 14px;
      color: #b0c4de;
      text-align: left;
      margin-bottom: 8px;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .welcome-box input {
      width: 100%;
      padding: 14px 18px;
      font-size: 20px;
      font-family: 'Orbitron', sans-serif;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #2a3f5e;
      border-radius: 12px;
      color: #e0e8f0;
      outline: none;
      transition: 0.3s;
      box-sizing: border-box;
      text-align: center;
    }
    .welcome-box input:focus {
      border-color: var(--purple-glow);
      box-shadow: 0 0 20px rgba(187, 134, 252, 0.15);
      background: rgba(255, 255, 255, 0.06);
    }
    .welcome-box input::placeholder {
      color: #4a6080;
      font-size: 16px;
    }
    .welcome-box .confirm-btn {
      margin-top: 25px;
      width: 100%;
      padding: 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(135deg, #1a3a6a, #2a5a8a);
      border: 1px solid #3a7aaa;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }
    .welcome-box .confirm-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(30, 80, 180, 0.4);
      background: linear-gradient(135deg, #1e4a7a, #2e6a9a);
      border-color: #5a8aba;
    }
    .welcome-box .confirm-btn:active {
      transform: scale(0.97);
    }

    .exit-nav {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1000;
    }
    .exit-btn {
      background: rgba(255, 255, 255, 0.05);
      color: #b0c4de;
      padding: 8px 15px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      font-family: 'Orbitron';
      transition: 0.3s;
      backdrop-filter: blur(4px);
    }
    .exit-btn:hover {
      background: #1a3a6a;
      border-color: #4a7aaa;
      color: #fff;
      box-shadow: 0 0 15px rgba(30, 80, 180, 0.3);
    }

    .header {
      text-align: center;
      padding: 20px 0 15px;
      background: rgba(10, 25, 47, 0.7);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 15px 15px 0 0;
      backdrop-filter: blur(4px);
    }
    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      color: #ffffff;
      margin: 0;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(187, 134, 252, 0.2);
    }

    .container {
      max-width: 620px;
      width: 95%;
      margin: 20px auto;
      padding: 20px 20px 25px;
      background: rgba(13, 27, 42, 0.92);
      border: 1px solid rgba(60, 100, 160, 0.2);
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.8), 0 0 60px rgba(20, 60, 140, 0.1);
      backdrop-filter: blur(10px);
      display: none;
      position: relative;
      z-index: 2;
    }
    .container.active {
      display: block;
    }

    .sequence {
      margin: 12px 0;
      min-height: 36px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .sequence span {
      display: inline-block;
      width: 28px;
      height: 28px;
      line-height: 28px;
      text-align: center;
      border-radius: 50%;
      font-weight: bold;
      font-size: 13px;
    }
    .p {
      background: var(--player-blue);
      color: #fff;
      box-shadow: 0 0 10px var(--player-blue);
    }
    .b {
      background: var(--banker-red);
      color: #fff;
      box-shadow: 0 0 10px var(--banker-red);
    }
    .t {
      background: #ffc107;
      color: #000;
    }

    .prediction {
      margin: 16px 0;
      font-size: 28px;
      font-weight: 900;
      font-family: 'Orbitron';
      height: 44px;
    }
    .prediction .pred-p {
      color: var(--player-blue);
      text-shadow: 0 0 15px var(--player-blue);
    }
    .prediction .pred-b {
      color: var(--banker-red);
      text-shadow: 0 0 15px var(--banker-red);
    }

    .buttons {
      margin: 14px 0 10px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .buttons button {
      background: rgba(20, 40, 70, 0.7);
      color: #c0d0e0;
      border: 1px solid #2a4a6a;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      font-family: 'Orbitron';
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(2px);
    }
    .buttons button:hover:enabled {
      background: #1a3a5a;
      border-color: #5a8aba;
      transform: scale(1.04);
      box-shadow: 0 0 20px rgba(30, 80, 180, 0.15);
    }
    .buttons button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
    }
    .btn-reset {
      border-color: #ffc107 !important;
      color: #ffc107 !important;
    }
    .btn-reset.blink-reset {
      animation: blinkGold 0.8s ease-in-out infinite;
      border-color: #ffd700 !important;
      box-shadow: 0 0 20px #ffd700;
    }
    @keyframes blinkGold {
      0% { background: rgba(20, 40, 70, 0.7); color: #ffc107; border-color: #ffc107; }
      50% { background: #ffc107; color: #0a192f; border-color: #ffd700; box-shadow: 0 0 30px #ffd700; }
      100% { background: rgba(20, 40, 70, 0.7); color: #ffc107; border-color: #ffc107; }
    }

    .capital-table table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      background: rgba(10, 25, 47, 0.6);
      border: 1px solid #1a3050;
      table-layout: auto;
      backdrop-filter: blur(2px);
    }
    .capital-table th,
    .capital-table td {
      padding: 6px 2px;
      font-size: 13px;
      border: 1px solid #1a3050;
      text-align: center;
      white-space: nowrap;
      width: auto;
    }
    .capital-table th {
      background: rgba(20, 45, 80, 0.6);
      font-family: 'Orbitron';
      font-size: 10px;
      color: #8aacd0;
      padding: 6px 1px;
      letter-spacing: 0.3px;
    }
    .capital-table td {
      color: #c0d4e8;
    }
    .capital-table td:last-child {
      min-width: 30px;
    }

    .highlight {
      background: #2a5a8a !important;
      color: #fff !important;
      font-weight: bold;
      animation: pulse 1s infinite;
      box-shadow: inset 0 0 20px rgba(60, 140, 255, 0.2);
    }
    .highlight-win {
      color: #4af0a0 !important;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(74, 240, 160, 0.3);
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .message-box {
      margin-top: 16px;
      font-size: 20px;
      font-weight: bold;
      font-family: 'Orbitron';
    }
    .success {
      color: #4af0a0;
      text-shadow: 0 0 30px rgba(74, 240, 160, 0.2);
    }
    .fail {
      color: #f44336;
      text-shadow: 0 0 30px rgba(244, 67, 54, 0.2);
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- WELCOME OVERLAY -->
  <div id="welcomeOverlay">
    <div class="welcome-box">
      <h1>WELCOME</h1>
      <div class="subtitle">✦ BACCARAT PRO SERIES ✦</div>
      <label for="baseBetInput">ENTER BASE BET</label>
      <input type="text" id="baseBetInput" placeholder="e.g. 10, 25.50, 100" value="10">
      <button class="confirm-btn" id="confirmBtn">▶ CONFIRM</button>
    </div>
  </div>

  <div class="exit-nav">
    <a href="index.html" class="exit-btn">EXIT TERMINAL</a>
  </div>

  <div class="container" id="mainApp">
    <div class="header"><h1>Baccarat Pro Series</h1></div>

    <div class="sequence" id="historyBox"></div>
    <div id="predictionBox" class="prediction"></div>

    <div class="buttons">
      <button id="btnPlayer" onclick="recordResult('P')">PLAYER</button>
      <button id="btnBanker" onclick="recordResult('B')">BANKER</button>
      <button id="btnTie" onclick="recordResult('T')">TIE</button>
      <button id="btnUndo" onclick="undo()">UNDO</button>
      <button id="btnReset" onclick="resetAll()" class="btn-reset">RESET</button>
    </div>

    <div class="capital-table" id="betTableBox">
      <table id="betTable">
        <thead>
          <tr>
            <th>Bet 1</th><th>Bet 2</th><th>Bet 3</th><th>Bet 4</th><th>Bet 5</th><th>Bet 6</th><th>Bet 7</th><th>Bet 8</th><th>WIN</th>
          </tr>
        </thead>
        <tbody id="betBody"></tbody>
      </table>
    </div>
    <div id="finalMessage" class="message-box"></div>
  </div>

  <script>
    let sequence = [];
    let currentPrediction = null;
    let currentRow = 0;
    let currentCol = 0;
    let isGameOver = false;
    let baseBet = 10;
    let baseBetString = "10";
    const maxCols = 8;
    const maxRows = 10;

    function initBetTable() {
      const tbody = document.getElementById('betBody');
      tbody.innerHTML = '';
      const betValues = getBetValues();
      for (let r = 0; r < maxRows; r++) {
        const tr = document.createElement('tr');
        for (let c = 0; c < maxCols; c++) {
          const td = document.createElement('td');
          td.textContent = betValues[c];
          tr.appendChild(td);
        }
        const winTd = document.createElement('td');
        winTd.textContent = '';
        tr.appendChild(winTd);
        tbody.appendChild(tr);
      }
    }

    function getBetValues() {
      const b = parseFloat(baseBet);
      if (isNaN(b) || b <= 0) return ["1", "2", "4", "8", "16", "32", "64", "ALL IN"];
      const hasDecimal = baseBetString.includes('.');
      if (hasDecimal) {
        return [
          b.toFixed(2),
          (b * 2).toFixed(2),
          (b * 4).toFixed(2),
          (b * 8).toFixed(2),
          (b * 16).toFixed(2),
          (b * 32).toFixed(2),
          (b * 64).toFixed(2),
          "ALL IN"
        ];
      } else {
        return [
          Math.round(b).toString(),
          Math.round(b * 2).toString(),
          Math.round(b * 4).toString(),
          Math.round(b * 8).toString(),
          Math.round(b * 16).toString(),
          Math.round(b * 32).toString(),
          Math.round(b * 64).toString(),
          "ALL IN"
        ];
      }
    }

    function setButtonsEnabled(enabled) {
      document.getElementById('btnPlayer').disabled = !enabled;
      document.getElementById('btnBanker').disabled = !enabled;
      document.getElementById('btnTie').disabled = !enabled;
      document.getElementById('btnUndo').disabled = !enabled;
      document.getElementById('btnReset').disabled = false;
    }

    function updateHistory() {
      const box = document.getElementById('historyBox');
      box.innerHTML = '';
      const displaySeq = sequence.slice(-10);
      displaySeq.forEach(r => {
        const span = document.createElement('span');
        span.className = r.toLowerCase();
        span.textContent = r;
        box.appendChild(span);
      });
    }

    function updatePrediction() {
      const box = document.getElementById('predictionBox');
      if (isGameOver) return;
      if (sequence.length < 7) {
        currentPrediction = null;
        box.innerHTML = "<span style='font-size:14px; color:#6a8aaa;'>WAITING FOR DATA (NEED 7)</span>";
        updateBetTable();
        return;
      }

      const windowSizes = [5, 4, 3];
      let found = false;
      let nextChoices = [];
      for (let w of windowSizes) {
        if (sequence.length >= w) {
          const lastForm = sequence.slice(-w).join("-");
          for (let i = 0; i <= sequence.length - w - 1; i++) {
            if (sequence.slice(i, i + w).join("-") === lastForm) {
              const nextVal = sequence[i + w];
              if (nextVal && nextVal !== 'T') nextChoices.push(nextVal);
            }
          }
          if (nextChoices.length > 0) { found = true; break; }
        }
      }

      currentPrediction = found ? (nextChoices.filter(x => x === 'P').length >= nextChoices.filter(x => x === 'B').length ? 'P' : 'B') : 'B';

      if (currentPrediction === 'P') {
        box.innerHTML = "<span class='pred-p'>PLAYER</span>";
      } else {
        box.innerHTML = "<span class='pred-b'>BANKER</span>";
      }
      updateBetTable();
    }

    function updateBetTable() {
      const rows = document.getElementById('betBody').rows;
      for (let r = 0; r < maxRows; r++) {
        for (let c = 0; c < maxCols; c++) rows[r].cells[c].classList.remove('highlight');
      }
      if (currentPrediction && sequence.length >= 7 && rows[currentRow] && !isGameOver) {
        rows[currentRow].cells[currentCol].classList.add('highlight');
      }
    }

    function markWin(rowIndex) {
      const rows = document.getElementById('betBody').rows;
      if (rows[rowIndex]) {
        rows[rowIndex].cells[maxCols].innerHTML = "✔";
        rows[rowIndex].cells[maxCols].classList.add('highlight-win');
      }
    }

    function recordResult(res) {
      if (isGameOver) return;

      const prevPrediction = currentPrediction;
      if (prevPrediction && (res === 'P' || res === 'B')) {
        if (res === prevPrediction) {
          markWin(currentRow);
          currentRow++;
          currentCol = 0;
          if (currentRow >= maxRows) {
            isGameOver = true;
            document.getElementById('betTableBox').style.display = "none";
            document.getElementById('finalMessage').innerHTML = "🎉 TARGET REACHED!";
            document.getElementById('finalMessage').className = "message-box success";
            setButtonsEnabled(false);
            document.getElementById('btnReset').classList.add('blink-reset');
            return;
          }
        } else {
          currentCol++;
          if (currentCol >= maxCols) {
            isGameOver = true;
            document.getElementById('betTableBox').style.display = "none";
            document.getElementById('finalMessage').innerHTML = "❌ LIMIT REACHED";
            document.getElementById('finalMessage').className = "message-box fail";
            setButtonsEnabled(false);
            return;
          }
        }
      }
      sequence.push(res);
      updateHistory();
      updatePrediction();
    }

    function undo() {
      if (isGameOver) return;
      if (sequence.length === 0) return;
      sequence.pop();
      const tempSeq = [...sequence];
      resetAll();
      tempSeq.forEach(r => recordResult(r));
    }

    function resetAll() {
      isGameOver = false;
      sequence = [];
      currentPrediction = null;
      currentRow = 0;
      currentCol = 0;
      initBetTable();
      document.getElementById('betTableBox').style.display = "block";
      document.getElementById('finalMessage').textContent = "";
      document.getElementById('finalMessage').className = "message-box";
      setButtonsEnabled(true);
      document.getElementById('btnReset').classList.remove('blink-reset');
      updateHistory();
      updatePrediction();
    }

    document.getElementById('confirmBtn').addEventListener('click', function() {
      const input = document.getElementById('baseBetInput');
      const rawValue = input.value.trim();
      if (rawValue === '') {
        alert('Please enter a base bet amount.');
        return;
      }
      const num = parseFloat(rawValue);
      if (isNaN(num) || num <= 0) {
        alert('Please enter a valid positive number.');
        return;
      }
      baseBet = num;
      baseBetString = rawValue;

      document.getElementById('welcomeOverlay').classList.add('hidden');
      document.getElementById('mainApp').classList.add('active');
      initBetTable();
      updateHistory();
      updatePrediction();
      setButtonsEnabled(true);
    });

    document.getElementById('baseBetInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('confirmBtn').click();
      }
    });

    (function() {
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.onkeydown = function(e) {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) {
          return false;
        }
      };
      setInterval(function() {
        (function() { return false; }['constructor']('debugger')['call']());
      }, 50);
      if (typeof console !== "undefined") {
        Object.keys(console).forEach(m => console[m] = function() {});
      }
    })();

    initBetTable();
    updateHistory();
    updatePrediction();
    setButtonsEnabled(true);
  </script>
</body>
</html>
