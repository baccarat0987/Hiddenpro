<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Baccarat PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>

    <!-- Firebase Auth + Per‑User Permission Guard (engine_6) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ✅ Baccarat PRO engine ID
        const REQUIRED_ENGINE_ID = "engine_6";

        // Global sign‑out function (used by the exit button)
        window.signOutUser = function() {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch(() => {
                window.location.href = "index.html";
            });
        };

        onAuthStateChanged(auth, async (user) => {
            // 1. Not logged in → redirect
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            try {
                const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
                const now = Date.now();
                const userData = userDoc.data();

                // 2. Check expiry + per‑user software permission
                const isValid =
                    userDoc.exists() &&
                    (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                    userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);

                if (!isValid) {
                    // 3. Alert on access denial
                    alert("Access denied: you don't have permission for Baccarat PRO.");
                    window.location.href = "index.html";
                    return;
                }

                // 4. All good – show the app
                document.body.style.display = "flex";
            } catch (err) {
                // If Firestore read fails, treat as denial
                alert("Access denied: unable to verify permissions.");
                window.location.href = "index.html";
            }
        });
    </script>

    <style>
        :root{  --player:#4169E1;  --banker:#800080;  --tie:#2ecc71;  --sub:#FFFFFF;  --glass:rgba(20,20,20,0.9);  --ink:#FFFFFF;}

        /* User‑select disabled (global) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body{  
            background:radial-gradient(circle at 50% 50%,#111111 0%,#000000 100%);  
            font-family:'Inter', sans-serif;  
            color:var(--ink);  
            display: none; /* hidden until auth passes */
            min-height: 100vh;
            padding: 20px 12px;
            justify-content: center;
            align-items: center;
        }

        /* EXIT BUTTON — calls signOutUser() */
        .exit-nav { position: fixed; top: 20px; right: 20px; z-index: 2000; }
        .exit-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid #444;
            font-size: 12px;
            transition: 0.3s;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .exit-btn:hover { background: var(--player); border-color: #fff; }

        .card{  
            max-width:500px;  
            width: 100%;
            margin:0 auto;  
            background: var(--glass);  
            border:1px solid rgba(255,255,255,0.1);  border-radius:24px;  
            padding:40px; backdrop-filter:blur(15px);  
            box-shadow:0 25px 50px rgba(0,0,0,0.5);
        }
        h1{  text-align:center;  font-size:1.8rem;  font-weight:600;  margin-bottom:20px;  letter-spacing:1px;  background:linear-gradient(90deg,var(--player),var(--banker),var(--tie),var(--sub));  -webkit-background-clip:text;  color:transparent;}
        
        .stats{  display:flex;  justify-content:space-between;  font-size:1rem;  margin-bottom:15px; border-bottom: 1px solid #333; padding-bottom: 15px;}
        .label { color: #888; margin-right: 5px; }

        .predict{text-align:center;margin-bottom:24px;}
        .pred-label{  font-size:2.2rem;  font-weight:700;  padding:10px 30px;  border-radius:14px;  display: inline-block; transition: 0.5s;}
        .pred-label.player{color:var(--player); text-shadow: 0 0 15px var(--player);}
        .pred-label.banker{color:var(--banker); text-shadow: 0 0 15px var(--banker);}
        
        .conf-wrap{margin-top:20px; width:100%; max-width:280px; margin-inline:auto;}
        .conf-bar{height:6px; border-radius:10px; background:rgba(255,255,255,0.05); overflow:hidden;}
        .conf-fill{height:100%; width:0; background:linear-gradient(90deg,var(--player),var(--banker)); transition: width 0.5s;}
        .conf-val{text-align:center; font-size:.85rem; margin-top:8px; color:#aaa; font-weight: 600;}

        .btn-row{display:flex; gap:12px; margin-bottom:30px; flex-wrap:wrap;}
        button{  flex:1; min-width:100px; padding:15px 0;  border-radius:12px; border:1px solid rgba(255,255,255,0.1);  font-weight:700; font-size:.9rem;  background:rgba(255,255,255,0.05); color:#fff; cursor:pointer; transition:0.2s;}
        button:hover:enabled{background:rgba(255,255,255,0.15); transform: translateY(-2px);}
        button:disabled{opacity:0.2; cursor:not-allowed;}
        
        .btn-player{ border-color: var(--player) !important; }
        .btn-banker{ border-color: var(--banker) !important; }
        .btn-tie{ border-color: var(--tie) !important; color: var(--tie); }
        .btn-reset{ border-color: #ff4b4b !important; color: #ff4b4b; }

        .first-six{ font-size:1.4rem; text-align:center; margin-top:15px; letter-spacing:.5rem; background: #000; padding: 10px; border-radius: 10px; min-height: 50px;}
        .msg{text-align:center; margin-bottom:15px; font-weight: 600;}
        #bankroll-msg { color: var(--tie); font-size: 1.1rem; }
        .w{color:var(--player);} .l{color:var(--banker);} .t{color:var(--tie);} .dash{color:#444;}
        .hidden{display:none;}

        #setup-overlay{  position:fixed; inset:0;  background:rgba(0,0,0,0.9);  display:flex; justify-content:center; align-items:center;  z-index:3000;}
        #setup-overlay div{  background:#1a1a1a; padding:40px; border-radius:20px; border: 1px solid #333; text-align:center; width: 350px;}
        #setup-overlay h2 { margin-bottom: 20px; font-size: 1.2rem; color: var(--player); }
        #setup-overlay input{ width:100%; padding:12px; border-radius:8px; border:1px solid #444; background: #000; color: #fff; font-size:1.1rem; text-align:center; margin-bottom: 15px;}
        #setup-overlay button{ width: 100%; background: var(--player); color: #fff; border: none; padding: 15px; font-size: 1rem; }

        /* Tie history — plain green letter, no background container */
        .tie-history {
            color: var(--tie) !important;
            font-weight: 700;
            background: transparent !important;
            padding: 0 !important;
            border-radius: 0 !important;
            display: inline !important;
        }
    </style>
</head>
<body>

    <div class="exit-nav">
        <button onclick="window.signOutUser()" class="exit-btn">✕ EXIT</button>
    </div>

    <div id="setup-overlay">
        <div>
            <h2>SETUP SESSION</h2>
            <p style="color:#666; font-size: 0.8rem; margin-bottom: 10px;">BANKROLL</p>
            <input type="number" id="input-bankroll" value="1000" step="any">
            <p style="color:#666; font-size: 0.8rem; margin-bottom: 10px;">BASE BET</p>
            <input type="number" id="input-bet" value="100" step="any" min="0.01">
            <button id="start-btn">CONFIRM</button>
        </div>
    </div>

    <div class="card">
        <h1>Baccarat PRO</h1>

        <div class="stats">
            <span id="bankroll"><span class="label">Bank:</span> $1000</span>
            <span id="next-bet"><span class="label">Bet:</span> $100</span>
        </div>

        <div class="predict hidden" id="prediction-box">
            <span id="prediction" class="pred-label player">Player</span>
            <div class="conf-wrap">
                <div class="conf-bar"><div id="bar" class="conf-fill"></div></div>
                <div id="val" class="conf-val">0%</div>
            </div>
        </div>

        <div id="waitmsg" class="msg" style="color: #aaa;">Waiting for result... (0/6)</div>
        <div id="bankroll-msg" class="msg"></div>

        <div class="btn-row">
            <button type="button" class="btn-player">P</button>
            <button type="button" class="btn-tie">T</button>
            <button type="button" class="btn-banker">B</button>
            <button type="button" class="btn-reset">RESET</button>
        </div>

        <div id="history" class="first-six"></div>
    </div>

<script>
    let bankroll=1000, baseBet=100, currentBet=100;
    let cumulativeLoss=0, winCount=0, lossStreak=0;
    let maxLoss=6, targetProfitMultiplier=1.8;
    let targetProfit=0, history=[], aiPrediction=null;

    const bankrollEl=document.getElementById("bankroll");
    const nextBetEl=document.getElementById("next-bet");
    const historyEl=document.getElementById("history");
    const predictionBox=document.getElementById("prediction-box");
    const predictionLabel=document.getElementById("prediction");
    const bar=document.getElementById("bar");
    const val=document.getElementById("val");
    const waitmsg=document.getElementById("waitmsg");
    const bankrollMsg=document.getElementById("bankroll-msg");

    const btnPlayer=document.querySelector(".btn-player");
    const btnBanker=document.querySelector(".btn-banker");
    const btnTie=document.querySelector(".btn-tie");
    const betButtons=[btnPlayer,btnBanker,btnTie];

    const overlay=document.getElementById("setup-overlay");
    const inputBankroll=document.getElementById("input-bankroll");
    const inputBet=document.getElementById("input-bet");
    const startBtn=document.getElementById("start-btn");

    // ✅ Format money — integers as-is, decimals always 2 places
    function fmtMoney(n) {
        const num = Math.round(n * 100) / 100;
        if (Number.isInteger(num)) return num.toString();
        return num.toFixed(2);
    }

    function updateWaitMessage() {
        if (history.length < 6) {
            waitmsg.textContent = `Waiting for result... (${history.length}/6)`;
        }
    }

    // ✅ FIXED: startBtn handler — sets currentBet = baseBet BEFORE updating UI
    startBtn.onclick = () => {
        const parsedBankroll = parseFloat(inputBankroll.value);
        const parsedBet = parseFloat(inputBet.value);

        bankroll = (!isNaN(parsedBankroll) && parsedBankroll > 0) ? parsedBankroll : 1000;
        baseBet = (!isNaN(parsedBet) && parsedBet > 0) ? parsedBet : 100;

        targetProfit = bankroll * targetProfitMultiplier;

        resetState();
        overlay.style.display = "none";

        // Double‑safety: force display update after overlay hidden
        updateBankroll();
        updateNextBet();
    };

    // ✅ FIXED: resetState — sets currentBet = baseBet FIRST, then updates UI (no duplicates)
    function resetState() {
        cumulativeLoss = 0;
        winCount = 0;
        lossStreak = 0;
        history = [];
        aiPrediction = null;
        historyEl.innerHTML = "";
        predictionBox.classList.add("hidden");
        waitmsg.classList.remove("hidden");
        bankrollMsg.textContent = "";
        betButtons.forEach(b => b.disabled = false);

        // ⬇️ IMPORTANT: assign BEFORE rendering
        currentBet = baseBet;

        updateBankroll();
        updateNextBet();
        updateWaitMessage();
    }

    function updateBankroll(){
        bankrollEl.innerHTML=`<span class="label">Bank:</span> $${fmtMoney(bankroll)}`;
    }
    function updateNextBet(){
        nextBetEl.innerHTML=`<span class="label">Bet:</span> $${fmtMoney(currentBet)}`;
    }

    function addHistory(result,outcome="neutral"){
        history.push({result,outcome});
        if(history.length>10) history.shift();
        historyEl.innerHTML=history.map(h=>{
            if(h.result==="Tie") {
                return `<span class="tie-history">T</span>`;
            }
            if(h.outcome==="win") return `<span class="w">${h.result[0]}</span>`;
            if(h.outcome==="loss") return `<span class="l">${h.result[0]}</span>`;
            return `<span class="dash">${h.result[0]}</span>`;
        }).join("");
    }

    function animateConfidence(num){
        let c=0,inc=num/20;
        (function run(){
            c+=inc;if(c>num)c=num;
            bar.style.width=c+"%";
            val.textContent=c.toFixed(1)+"%";
            if(c<num)requestAnimationFrame(run);
        })();
    }

    function makePrediction(){
        let p=0,b=0,decay=.95;
        history.forEach((h,i)=>{
            let f=Math.pow(decay,history.length-i-1);
            if(h.result==="Player")p+=f;
            if(h.result==="Banker")b+=f;
        });
        if(!p&&!b)return;
        aiPrediction=Math.random()<p/(p+b)?"Player":"Banker";
        predictionLabel.textContent=aiPrediction.toUpperCase();
        predictionLabel.className="pred-label "+aiPrediction.toLowerCase();
        predictionBox.classList.remove("hidden");
        waitmsg.classList.add("hidden");
        animateConfidence((aiPrediction==="Player"?p:b)/(p+b)*100);
    }

    function calculateNextBet(){
        if(lossStreak>0){
            let aggressive=(cumulativeLoss+baseBet)*1.5;
            aggressive = Math.round(aggressive * 100) / 100;
            return Math.min(aggressive, bankroll);
        }
        return baseBet;
    }

    // ✅ Force full refresh with silent cache-bust + clean URL restore
    function forceFullRefresh() {
        const url = new URL(window.location.href);
        url.searchParams.set('t', Date.now());
        window.location.replace(url.href);
    }

    function resetGame(){
        forceFullRefresh();
    }

    function handleClick(result){
        if(history.length<6){
            addHistory(result);
            updateWaitMessage();
            if(history.length===6)makePrediction();
            return;
        }
        if(result==="Tie"){addHistory(result);return;}

        if(result===aiPrediction){
            bankroll+=currentBet;
            cumulativeLoss=0;lossStreak=0;winCount++;
            addHistory(result,"win");
            if(bankroll>=targetProfit){
                bankrollMsg.textContent="SESSION COMPLETE: PROFIT REACHED";
                betButtons.forEach(b=>b.disabled=true);
                predictionBox.classList.add("hidden");
                waitmsg.classList.add("hidden");
                return;
            }
        }else{
            bankroll-=currentBet;
            cumulativeLoss+=currentBet;lossStreak++;
            addHistory(result,"loss");
            if(lossStreak>=maxLoss||bankroll<=0){
                bankrollMsg.textContent="SESSION FAILED: LIMIT EXCEEDED";
                betButtons.forEach(b=>b.disabled=true);
                currentBet=0;updateNextBet();
                predictionBox.classList.add("hidden");
                waitmsg.classList.add("hidden");
                return;
            }
        }
        currentBet=calculateNextBet();
        updateBankroll();updateNextBet();
        makePrediction();
    }

    btnPlayer.onclick=()=>handleClick("Player");
    btnBanker.onclick=()=>handleClick("Banker");
    btnTie.onclick=()=>handleClick("Tie");
    document.querySelector(".btn-reset").onclick=resetGame;

    // ✅ Ctrl+R and F5 trigger FULL refresh (cache-bust), then URL is cleaned
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (e.key === 'r' || e.key === 'R')) {
            e.preventDefault();
            forceFullRefresh();
            return;
        }
        if (e.key === 'F5') {
            e.preventDefault();
            forceFullRefresh();
            return;
        }
    });

    // Strip ?t= from the address bar right after the page finishes loading
    window.addEventListener('load', () => {
        if (window.location.search.includes('t=')) {
            const cleanPath = window.location.pathname.replace('.html', '');
            const cleanUrl = window.location.origin + cleanPath;
            window.history.replaceState(null, '', cleanUrl);
        }
    });
</script>

<script>
(function() {
    // Prevent Right-Click
    document.addEventListener('contextmenu', e => e.preventDefault());

    // Block Logic Inspection Shortcuts
    document.onkeydown = function(e) {
        if (
            e.keyCode === 123 || 
            (e.ctrlKey && e.keyCode === 85) || 
            (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) ||
            (e.ctrlKey && e.keyCode === 83)
        ) {
            return false;
        }
    };

    // Script Freeze (Interruption)
    setInterval(function() {
        (function() { return false; }['constructor']('debugger')['call']());
    }, 50);

    // ✅ DevTools detection — ONLY triggers on real DevTools, NOT split‑screen
    function detectDevTools() {
        const threshold = 300;
        const widthDiff = window.outerWidth - window.innerWidth;
        const heightDiff = window.outerHeight - window.innerHeight;

        const devToolsOpen =
            (widthDiff > threshold && heightDiff < 100) ||
            (heightDiff > threshold && widthDiff < 100);

        if (devToolsOpen) {
            document.body.innerHTML = "";
            window.location.replace("about:blank");
        }
    }
    setInterval(detectDevTools, 800);

    // Silent Console
    if (typeof console !== "undefined") {
        console.log = console.debug = console.info = console.warn = console.error = function() {};
    }
})();
</script>
</body>
</html>
