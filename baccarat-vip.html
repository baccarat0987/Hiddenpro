    <!-- Clean URL script -->
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>

    <!-- Firebase Authentication & Permission Check -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const REQUIRED_ENGINE_ID = "engine_17";

        window.signOutUser = function() {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                window.location.href = "index.html";
            });
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && 
                           (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                           userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) {
                alert("Access denied: you don't have permission for Baccarat VIP Plus.");
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.onkeydown = function(e) {
            if (
                e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83)) ||
                (e.ctrlKey && e.shiftKey && e.keyCode === 85)
            ) {
                e.preventDefault();
                return false;
            }
        };

        setInterval(function() {
            (function() { return false; }['constructor']('debugger')['call']());

        if (typeof console !== "undefined") {
            console.log = console.debug = console.info = console.warn = console.error = function() {};

                    <button onclick="undo()">UNDO LAST</button>

                </div>

    <script>
        /* =========================================================
           PURE PREDICTION ENGINE - NO PROGRESSION
        ========================================================= */
        let sequence = JSON.parse(localStorage.getItem('bt_sequence')) || [];
        let results = JSON.parse(localStorage.getItem('bt_results')) || [];
        let lastPrediction = null;
        let detailedHistory = JSON.parse(localStorage.getItem('bt_detailed')) || [];
        let wins = 0, losses = 0, skips = 0;
        const MIN_HANDS = 8;

        function clampConfidence(raw) { return Math.min(98, Math.max(35, raw)); }
        function oppositeSide(side) { return side === 'P' ? 'B' : 'P'; }

        // ========== ENHANCED PATTERN DETECTION ==========
        
        function getMarkovPrediction() {
            if (sequence.length < 2) return null;
            
            const transitions = { P: { P: 0, B: 0 }, B: { P: 0, B: 0 } };
            for (let i = 0; i < sequence.length - 1; i++) {
                const current = sequence[i];
                const next = sequence[i + 1];
                transitions[current][next]++;
            }
            
            const last = sequence[sequence.length - 1];
            const total = transitions[last].P + transitions[last].B;
            if (total === 0) return null;
            
            const pProb = transitions[last].P / total;
            const bProb = transitions[last].B / total;
            const prediction = pProb > bProb ? 'P' : 'B';
            const confidence = Math.max(pProb, bProb) * 100;
            
            return { prediction, confidence };
        }

        function getRunLengthPrediction() {
            if (sequence.length < 2) return null;
            
            const last = sequence[sequence.length - 1];
            let runLength = 1;
            for (let i = sequence.length - 2; i >= 0; i--) {
                if (sequence[i] === last) runLength++;
                else break;
            }
            
            if (runLength >= 3) {
                const continuationConfidence = Math.min(85, 55 + (runLength - 2) * 10);
                return { prediction: last, confidence: continuationConfidence };
            }
            
            if (runLength === 1 && sequence.length >= 3) {
                const prev = sequence[sequence.length - 2];
                if (prev !== last) {
                    let isAlternating = true;
                    for (let i = sequence.length - 3; i >= 0; i--) {
                        if (sequence[i] === sequence[i+1]) { isAlternating = false; break; }
                    }
                    if (isAlternating) {
                        return { prediction: oppositeSide(last), confidence: 70 };
                    }
                }
            }
            
            return null;
        }

        function getFrequencyPrediction() {
            if (sequence.length < 10) return null;
            
            const total = sequence.length;
            const pCount = sequence.filter(s => s === 'P').length;
            const bCount = total - pCount;
            
            const pRate = pCount / total;
            const bRate = bCount / total;
            
            if (pRate < 0.42 && bRate > 0.58) {
                const confidence = 50 + (0.58 - bRate) * 200;
                return { prediction: 'P', confidence: Math.min(80, confidence) };
            }
            if (bRate < 0.42 && pRate > 0.58) {
                const confidence = 50 + (0.58 - pRate) * 200;
                return { prediction: 'B', confidence: Math.min(80, confidence) };
            }
            
            return null;
        }

        function getPatternPrediction() {
            if (sequence.length < 5) return null;
            
            const pattern = sequence.slice(-3).join('');
            let matches = [];
            
            for (let i = 0; i <= sequence.length - 4; i++) {
                const currentPattern = sequence.slice(i, i + 3).join('');
                if (currentPattern === pattern && i + 3 < sequence.length - 1) {
                    matches.push(sequence[i + 3]);
                }
            }
            
            if (matches.length >= 2) {
                const pCount = matches.filter(m => m === 'P').length;
                const bCount = matches.length - pCount;
                const prediction = pCount > bCount ? 'P' : 'B';
                const confidence = 50 + (Math.max(pCount, bCount) / matches.length) * 40;
                return { prediction, confidence: Math.min(85, confidence) };
            }
            
            return null;
        }

        function getZigzagPrediction() {
            if (sequence.length < 5) return null;
            
            let zigzagCount = 0;
            let totalCheck = 0;
            const checkLength = Math.min(10, sequence.length - 1);
            
            for (let i = sequence.length - checkLength; i < sequence.length - 1; i++) {
                if (sequence[i] !== sequence[i+1]) zigzagCount++;
                totalCheck++;
            }
            
            const zigzagRate = zigzagCount / totalCheck;
            
            if (zigzagRate > 0.7) {
                const confidence = 55 + zigzagRate * 30;
                return { prediction: oppositeSide(sequence[sequence.length - 1]), confidence: Math.min(85, confidence) };
            }
            
            if (zigzagRate < 0.3) {
                const confidence = 55 + (1 - zigzagRate) * 30;
                return { prediction: sequence[sequence.length - 1], confidence: Math.min(85, confidence) };
            }
            
            return null;
        }

        function getRecentBiasPrediction() {
            if (sequence.length < 5) return null;
            
            const recent = sequence.slice(-5);
            const pCount = recent.filter(s => s === 'P').length;
            const bCount = 5 - pCount;
            
            if (pCount >= 4) {
                return { prediction: 'B', confidence: 55 + (pCount - 3) * 12 };
            }
            if (bCount >= 4) {
                return { prediction: 'P', confidence: 55 + (bCount - 3) * 12 };
            }
            
            return null;
        }

        // ========== WEIGHTED VOTING SYSTEM ==========
        function getEnhancedPredictionAndConfidence() {
            if (sequence.length < MIN_HANDS) return { prediction: null, confidence: 0 };
            
            const algorithms = [
                { name: 'markov', fn: getMarkovPrediction, weight: 2.0 },
                { name: 'runLength', fn: getRunLengthPrediction, weight: 1.5 },
                { name: 'frequency', fn: getFrequencyPrediction, weight: 1.0 },
                { name: 'pattern', fn: getPatternPrediction, weight: 1.8 },
                { name: 'zigzag', fn: getZigzagPrediction, weight: 1.2 },
                { name: 'recentBias', fn: getRecentBiasPrediction, weight: 1.0 }
            ];
            
            let scores = { P: 0, B: 0 };
            let totalWeight = 0;
            let algorithmResults = [];
            
            for (const algo of algorithms) {
                const result = algo.fn();
                if (result) {
                    const weight = algo.weight;
                    const confidenceFactor = result.confidence / 100;
                    scores[result.prediction] += weight * confidenceFactor;
                    totalWeight += weight;
                    algorithmResults.push({ name: algo.name, prediction: result.prediction, confidence: result.confidence });
                }
            }
            
            if (totalWeight === 0) {
                const last = sequence[sequence.length - 1];
                const runLength = getRunLength(sequence);
                if (runLength >= 3) {
                    return { prediction: last, confidence: 55 + runLength * 3 };
                }
                return { prediction: oppositeSide(last), confidence: 52 };
            }
            
            let prediction = scores.P > scores.B ? 'P' : 'B';
            let confidence = (Math.max(scores.P, scores.B) / totalWeight) * 100;
            
            const pPredictions = algorithmResults.filter(r => r.prediction === 'P').length;
            const bPredictions = algorithmResults.filter(r => r.prediction === 'B').length;
            const agreementBonus = Math.abs(pPredictions - bPredictions) / algorithmResults.length * 15;
            confidence = Math.min(96, confidence + agreementBonus);
            
            if (sequence.length > 30) confidence += 5;
            if (sequence.length > 50) confidence += 3;
            
            return { 
                prediction, 
                confidence: clampConfidence(Math.round(confidence * 10) / 10),
                algorithmResults
            };
        }

        function getRunLength(arr) {
            if (arr.length === 0) return 0;
            const last = arr[arr.length - 1];
            let count = 1;
            for (let i = arr.length - 2; i >= 0; i--) {
                if (arr[i] === last) count++;
                else break;
            }
            return count;
        }

        // ========== DYNAMIC SKIP THRESHOLD ==========
        function getDynamicSkipThreshold() {
            let baseThreshold = 55;
            
            const recentResults = detailedHistory.slice(-10).filter(h => !h.wasSkip);
            if (recentResults.length >= 5) {
                const recentWins = recentResults.filter(r => r.type === 'win').length;
                const winRate = recentWins / recentResults.length;
                
                if (winRate < 0.4) baseThreshold = 48;
                else if (winRate < 0.5) baseThreshold = 52;
                else if (winRate > 0.6) baseThreshold = 62;
                else if (winRate > 0.7) baseThreshold = 68;
            }
            
            const total = wins + losses;
            if (total > 20) {
                const overallWinRate = wins / total;
                if (overallWinRate < 0.45) baseThreshold = Math.max(45, baseThreshold - 5);
                else if (overallWinRate > 0.58) baseThreshold = Math.min(72, baseThreshold + 5);
            }
            
            const streak = getRunLength(sequence);
            if (streak >= 4) baseThreshold = Math.max(45, baseThreshold - 8);
            if (streak >= 6) baseThreshold = Math.max(42, baseThreshold - 10);
            
            return Math.min(75, Math.max(42, baseThreshold));
        }

        function shouldSkipPrediction(confidence, algorithmCount) {
            const dyn = getDynamicSkipThreshold();
            let adj = dyn;
            if (algorithmCount >= 3) adj = Math.max(40, dyn - 8);
            return confidence < adj;
        }

        function finalPrediction() {
            if (sequence.length < MIN_HANDS) return null;
            
            const result = getEnhancedPredictionAndConfidence();
            if (!result || !result.prediction) return null;
            
            const skip = shouldSkipPrediction(result.confidence, result.algorithmResults?.length || 0);
            if (skip) return { pred: null, confidence: result.confidence, skip: true };
            
            return { pred: result.prediction, confidence: result.confidence, skip: false };
        }

        // ========== UI FUNCTIONS ==========
        function updateHistory() {
            const box = document.getElementById('historyBox');
            const rBox = document.getElementById('resultsBox');
            if (sequence.length === 0) { box.innerHTML = "READY FOR DATA"; rBox.innerHTML = ""; return; }
            box.innerHTML = '';
            sequence.slice(-10).forEach(r => {
                const span = document.createElement('span');
                span.className = r;
                span.textContent = r;
                box.appendChild(span);
            });

            rBox.innerHTML = '';
            const filteredResults = results.filter(r => r === 'W' || r === 'L');
            const last10 = filteredResults.slice(-10);
            last10.forEach(wl => {
                const span = document.createElement('span');
                span.className = wl;
                span.textContent = wl;
                rBox.appendChild(span);
            });
        }

        function updatePredictionBox() {
            const box = document.getElementById('predictionBox');
            const skipNote = document.getElementById('skipNote');

            if (sequence.length < MIN_HANDS) {
                box.innerHTML = `<span style="font-size:clamp(11px,2.5vw,13px); color:#7a8595; letter-spacing:1px;">LOGGING: ${MIN_HANDS-sequence.length} MORE HANDS NEEDED</span>`;
                lastPrediction = null;
                skipNote.textContent = '';
                return;
            }
            
            const result = finalPrediction();
            if (result && result.pred) {
                const text = result.pred === 'P' ? 'PLAYER' : 'BANKER';
                const cls = result.pred === 'P' ? 'player' : 'banker';
                box.innerHTML = `NEXT: <span class="${cls}">${text}</span> <span class="confidence">${result.confidence}%</span>`;
                lastPrediction = result.pred;
                skipNote.textContent = '';
            } else if (result && result.skip) {
                box.innerHTML = `<span style="font-size:clamp(14px,3vw,16px); color:#db2777;">⏭ SKIP (${result.confidence}%)</span>`;
                lastPrediction = null;
                skipNote.textContent = 'Low confidence — skipping this hand';
            } else {
                box.innerHTML = "<span style='font-size:clamp(14px,3vw,16px); color:#7a8595'>ANALYZING TRENDS...</span>";
                lastPrediction = null;
                skipNote.textContent = '';
            }
            
            updateStatsBar();
        }

        function updateStatsBar() {
            document.getElementById('winCount').textContent = wins;
            document.getElementById('lossCount').textContent = losses;
            const total = wins + losses;
            const winRate = total > 0 ? Math.round((wins / total) * 100) : 0;
            document.getElementById('winRateDisplay').textContent = `WR: ${winRate}%`;
            
            const streak = getRunLength(sequence);
            const last = sequence.length > 0 ? sequence[sequence.length - 1] : null;
            const streakDisplay = document.getElementById('streakDisplay');
            if (last && streak > 0) {
                streakDisplay.textContent = `Streak: ${streak} ${last}`;
                streakDisplay.className = 'streak-indicator ' + (streak >= 3 ? 'win-streak' : '');
            } else {
                streakDisplay.textContent = 'Streak: 0';
                streakDisplay.className = 'streak-indicator';
            }
        }

        // ========== RECORD RESULT, UNDO, RESET ==========
        function recordResult(r) {
            const skipNote = document.getElementById('skipNote');

            if (lastPrediction) {
                const wasWin = (lastPrediction === r);
                results.push(wasWin ? 'W' : 'L');
                if (wasWin) { wins++; detailedHistory.push({ type: 'win', wasSkip: false }); } else { losses++; detailedHistory.push({ type: 'loss', wasSkip: false }); }
                skipNote.textContent = '';
            } else {
                results.push('');
                skips++;
                detailedHistory.push({ type: 'skip', wasSkip: true });
                skipNote.textContent = '⏭ Skipped (no bet placed)';
            }

            sequence.push(r);

            saveAndUpdate();
        }

        function undo() {
            if (sequence.length === 0) return;
            
            const lastResult = sequence.pop();
            const lastResultData = results.pop();
            const lastHistory = detailedHistory.pop();

            if (lastResultData === 'W') wins--;
            else if (lastResultData === 'L') losses--;
            else if (lastResultData === '') skips--;

            saveAndUpdate();
        }

        function resetAll() {
            if (confirm("Reset all data?")) {
                sequence = [];
                results = [];
                lastPrediction = null;
                detailedHistory = [];
                wins = 0; losses = 0; skips = 0;

                saveAndUpdate();
            }
        }

        function saveAndUpdate() {
            localStorage.setItem('bt_sequence', JSON.stringify(sequence));
            localStorage.setItem('bt_results', JSON.stringify(results));
            localStorage.setItem('bt_detailed', JSON.stringify(detailedHistory));
            updateHistory();
            updatePredictionBox();
        }

        // Initial stats if we have data
        if (sequence.length > 0 || results.length > 0) {
            results.forEach(r => { if (r === 'W') wins++; else if (r === 'L') losses++; else if (r === '') skips++; });
        }

        // Initial render
        updateHistory();
        updatePredictionBox();
    </script>
</body>
</html>
