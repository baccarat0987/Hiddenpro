<!DOCTYPE html>
<html lang="en">
<head>

    <title>Baccarat VIP Plus · AI</title>

    <!-- Clean URL script -->
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>

    <!-- Firebase Authentication & Permission Check -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const REQUIRED_ENGINE_ID = "engine_17";

        window.signOutUser = function() {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                window.location.href = "index.html";
            });
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && 
                           (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                           userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) {
                alert("Access denied: you don't have permission for Baccarat VIP Plus.");
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>

    <!-- Security Blockers -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.onkeydown = function(e) {
            if (
                e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83)) ||
                (e.ctrlKey && e.shiftKey && e.keyCode === 85)
            ) {
                e.preventDefault();
                return false;
            }
        };

        setInterval(function() {
            (function() { return false; }['constructor']('debugger')['call']());
        }, 50);

        if (typeof console !== "undefined") {
            console.log = console.debug = console.info = console.warn = console.error = function() {};
        }
    </script>

<body>

    <div class="exit-nav">
        <button onclick="window.signOutUser()" class="exit-btn">✕ EXIT</button>
    </div>

    <div class="wrap">
        <div class="container">
            <div class="header">
                <h1>
                    <span class="title-violet">Baccarat</span>
                    <span class="title-darkblue">VIP</span>
                    <span class="title-redpink">Plus</span>
                </h1>
                <div class="ai-container">
                    <span class="ai-text">AI</span>
                </div>
            </div>
            <div class="tag" style="text-align:center; color:var(--text-muted); font-size:11px; letter-spacing:2px; margin-bottom:18px; opacity:0.7;">Bet AGAINST streaks - Randomness favors reversal</div>

            <div class="sequence" id="historyBox">READY FOR DATA</div>
            <div class="results" id="resultsBox"></div>
            
            <div class="stats-bar" id="statsBar">
                <span>W: <strong id="winCount">0</strong></span>
                <span>L: <strong id="lossCount">0</strong></span>
                <span class="win-rate" id="winRateDisplay">WR: 0%</span>
                <span id="streakDisplay">Streak: 0</span>
            </div>

            <div class="prediction" id="predictionBox">
                <span>WAITING FOR DATA...</span>
            </div>
            <div class="skip-note" id="skipNote"></div>

            <div class="buttons">
                <button onclick="recordResult('P')" id="playerBtn">PLAYER</button>
                <button onclick="recordResult('B')" id="bankerBtn">BANKER</button>
                <div class="util-btns">
                    <button onclick="undo()">UNDO LAST</button>
                    <button onclick="resetAll()">RESET SHOE</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
           SIMPLE BUT EFFECTIVE - BET AGAINST STREAKS
           Based on the Gambler's Fallacy - streaks are rare in random data
        ========================================================= */
        let sequence = JSON.parse(localStorage.getItem('bt_sequence')) || [];
        let results = JSON.parse(localStorage.getItem('bt_results')) || [];
        let lastPrediction = null;
        let detailedHistory = JSON.parse(localStorage.getItem('bt_detailed')) || [];
        let wins = 0, losses = 0, skips = 0;
        const MIN_HANDS = 10;

        function oppositeSide(side) { return side === 'P' ? 'B' : 'P'; }

        function getRunLength(arr) {
            if (arr.length === 0) return 0;
            const last = arr[arr.length - 1];
            let count = 1;
            for (let i = arr.length - 2; i >= 0; i--) {
                if (arr[i] === last) count++;
                else break;
            }
            return count;
        }

        // ========== SIMPLE PREDICTION - BET AGAINST STREAKS ==========
        function getPrediction() {
            if (sequence.length < MIN_HANDS) return null;
            
            const streak = getRunLength(sequence);
            const last = sequence[sequence.length - 1];
            
            // If streak is 3 or more, bet AGAINST it (reversal)
            if (streak >= 3) {
                // Higher streak = higher confidence
                const confidence = Math.min(75, 55 + (streak - 2) * 8);
                return { 
                    prediction: oppositeSide(last), 
                    confidence: confidence,
                    reason: `Streak of ${streak} ${last}s - betting reversal`
                };
            }
            
            // Check if there's a strong recent bias (5 out of last 7)
            if (sequence.length >= 7) {
                const recent = sequence.slice(-7);
                const pCount = recent.filter(s => s === 'P').length;
                const bCount = 7 - pCount;
                
                if (pCount >= 5) {
                    return { 
                        prediction: 'B', 
                        confidence: 60,
                        reason: `Player bias ${pCount}/7 - betting Banker`
                    };
                }
                if (bCount >= 5) {
                    return { 
                        prediction: 'P', 
                        confidence: 60,
                        reason: `Banker bias ${bCount}/7 - betting Player`
                    };
                }
            }
            
            // If no strong pattern, look at last hand - bet the opposite
            // This gives ~50% win rate over time
            if (sequence.length >= 2) {
                const secondLast = sequence[sequence.length - 2];
                if (last !== secondLast) {
                    // Alternating pattern - continue it
                    return { 
                        prediction: oppositeSide(last), 
                        confidence: 52,
                        reason: 'Alternating pattern - continue'
                    };
                } else {
                    // Same pattern - bet reversal
                    return { 
                        prediction: oppositeSide(last), 
                        confidence: 55,
                        reason: 'Same pattern - betting reversal'
                    };
                }
            }
            
            // Default: bet opposite of last
            return { 
                prediction: oppositeSide(last), 
                confidence: 52,
                reason: 'Default - betting opposite'
            };
        }

        function shouldSkip(confidence) {
            // Skip if confidence is too low
            if (confidence < 50) return true;
            
            // Dynamic skip based on recent performance
            const recent = detailedHistory.slice(-5).filter(h => !h.wasSkip);
            if (recent.length >= 3) {
                const recentWins = recent.filter(r => r.type === 'win').length;
                const winRate = recentWins / recent.length;
                // If losing streak, be more aggressive (skip less)
                if (winRate < 0.3) return false;
                // If winning, be more conservative (skip more)
                if (winRate > 0.7 && confidence < 60) return true;
            }
            
            return confidence < 52;
        }

        // ========== UI FUNCTIONS ==========
        function updateHistory() {
            const box = document.getElementById('historyBox');
            const rBox = document.getElementById('resultsBox');
            if (sequence.length === 0) { box.innerHTML = "READY FOR DATA"; rBox.innerHTML = ""; return; }
            box.innerHTML = '';
            sequence.slice(-10).forEach(r => {
                const span = document.createElement('span');
                span.className = r;
                span.textContent = r;
                box.appendChild(span);
            });

            rBox.innerHTML = '';
            const filteredResults = results.filter(r => r === 'W' || r === 'L');
            const last10 = filteredResults.slice(-10);
            last10.forEach(wl => {
                const span = document.createElement('span');
                span.className = wl;
                span.textContent = wl;
                rBox.appendChild(span);
            });
        }

        function updatePredictionBox() {
            const box = document.getElementById('predictionBox');
            const skipNote = document.getElementById('skipNote');

            if (sequence.length < MIN_HANDS) {
                box.innerHTML = `<span style="font-size:clamp(11px,2.5vw,13px); color:#7a8595; letter-spacing:1px;">LOGGING: ${MIN_HANDS-sequence.length} MORE HANDS NEEDED</span>`;
                lastPrediction = null;
                skipNote.textContent = '';
                return;
            }
            
            const result = getPrediction();
            if (result && result.prediction) {
                const skip = shouldSkip(result.confidence);
                
                if (skip) {
                    box.innerHTML = `<span style="font-size:clamp(14px,3vw,16px); color:#db2777;">⏭ SKIP (${result.confidence}%)</span>`;
                    lastPrediction = null;
                    skipNote.textContent = `Low confidence (${result.confidence}%) - skipping`;
                } else {
                    const text = result.prediction === 'P' ? 'PLAYER' : 'BANKER';
                    const cls = result.prediction === 'P' ? 'player' : 'banker';
                    box.innerHTML = `NEXT: <span class="${cls}">${text}</span> <span class="confidence">${result.confidence}%</span>`;
                    lastPrediction = result.prediction;
                    skipNote.textContent = result.reason || '';
                }
            } else {
                box.innerHTML = "<span style='font-size:clamp(14px,3vw,16px); color:#7a8595'>ANALYZING...</span>";
                lastPrediction = null;
                skipNote.textContent = '';
            }
            
            updateStatsBar();
        }

        function updateStatsBar() {
            document.getElementById('winCount').textContent = wins;
            document.getElementById('lossCount').textContent = losses;
            const total = wins + losses;
            const winRate = total > 0 ? Math.round((wins / total) * 100) : 0;
            document.getElementById('winRateDisplay').textContent = `WR: ${winRate}%`;
            
            const streak = getRunLength(sequence);
            const last = sequence.length > 0 ? sequence[sequence.length - 1] : null;
            const streakDisplay = document.getElementById('streakDisplay');
            if (last && streak > 0) {
                streakDisplay.textContent = `Streak: ${streak} ${last}`;
                streakDisplay.className = 'streak-indicator ' + (streak >= 3 ? 'loss-streak' : 'win-streak');
                if (streak >= 4) {
                    streakDisplay.textContent += ' 🔥';
                }
            } else {
                streakDisplay.textContent = 'Streak: 0';
                streakDisplay.className = 'streak-indicator';
            }
        }

        // ========== RECORD RESULT, UNDO, RESET ==========
        function recordResult(r) {
            const skipNote = document.getElementById('skipNote');

            if (lastPrediction) {
                const wasWin = (lastPrediction === r);
                results.push(wasWin ? 'W' : 'L');
                if (wasWin) { wins++; detailedHistory.push({ type: 'win', wasSkip: false }); } else { losses++; detailedHistory.push({ type: 'loss', wasSkip: false }); }
                skipNote.textContent = wasWin ? '✅ WIN!' : '❌ LOSS';
            } else {
                results.push('');
                skips++;
                detailedHistory.push({ type: 'skip', wasSkip: true });
                skipNote.textContent = '⏭ Skipped (no bet placed)';
            }

            sequence.push(r);

            saveAndUpdate();
        }

        function undo() {
            if (sequence.length === 0) return;
            
            const lastResult = sequence.pop();
            const lastResultData = results.pop();
            const lastHistory = detailedHistory.pop();

            if (lastResultData === 'W') wins--;
            else if (lastResultData === 'L') losses--;
            else if (lastResultData === '') skips--;

            saveAndUpdate();
        }

        function resetAll() {
            if (confirm("Reset all data?")) {
                sequence = [];
                results = [];
                lastPrediction = null;
                detailedHistory = [];
                wins = 0; losses = 0; skips = 0;

                saveAndUpdate();
            }
        }

        function saveAndUpdate() {
            localStorage.setItem('bt_sequence', JSON.stringify(sequence));
            localStorage.setItem('bt_results', JSON.stringify(results));
            localStorage.setItem('bt_detailed', JSON.stringify(detailedHistory));
            updateHistory();
            updatePredictionBox();
        }

        // Initial stats if we have data
        if (sequence.length > 0 || results.length > 0) {
            results.forEach(r => { if (r === 'W') wins++; else if (r === 'L') losses++; else if (r === '') skips++; });
        }

        // Initial render
        updateHistory();
        updatePredictionBox();
    </script>
</body>
</html>
