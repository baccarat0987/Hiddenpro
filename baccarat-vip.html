        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);

    <!-- Firebase Authentication & Permission Check -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const REQUIRED_ENGINE_ID = "engine_17";

        window.signOutUser = function() {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                window.location.href = "index.html";
            });
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() &&
                (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) {
                alert("Access denied: you don't have permission for Baccarat VIP Plus.");
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.onkeydown = function(e) {
            if (
                e.keyCode === 123 ||
                (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83)) ||
                (e.ctrlKey && e.shiftKey && e.keyCode === 85)
            ) {
                e.preventDefault();
                return false;
            }
        };

        setInterval(function() {
            (function() { return false; }['constructor']('debugger')['call']());

        if (typeof console !== "undefined") {

    <script>
        /* =========================================================
           PURE PATTERN RECOGNITION & ADAPTIVE LEARNING ENGINE
           - No voting, no conflict resolution
           - Pattern detection from historical sequences
           - Bias detection (streak bias, zigzag bias, frequency bias)
           - Adaptive learning based on recent accuracy
           - ADAPTIVE LOSE: learns from losses to avoid repetition (internal, no UI)
        ========================================================= */
        let sequence = JSON.parse(localStorage.getItem('bt_sequence')) || [];
        let results = JSON.parse(localStorage.getItem('bt_results')) || [];
        let lastPrediction = null;
        let detailedHistory = JSON.parse(localStorage.getItem('bt_detailed')) || [];
        let wins = 0,
            losses = 0,
            skips = 0;
        const MIN_HANDS = 7;

        // Adaptive learning weights
        let patternAccuracy = { P: 0.5, B: 0.5 };
        let recentCorrect = 0;
        let recentTotal = 0;
        const MAX_RECENT = 7;

        // ===== ADAPTIVE LOSE MODULE (internal) =====
        let loseTracker = JSON.parse(localStorage.getItem('bt_lose_tracker')) || {
            recent: [], // last 12 outcomes: { prediction, actual, wasWin, timestamp }
            sideLossStreak: { P: 0, B: 0 }, // consecutive losses per side
            totalLosses: 0,
            correctionActive: false,
            correctionSide: null,
            correctionStrength: 0
        };

        function clampConfidence(raw) { return Math.min(96, Math.max(40, raw)); }

        function oppositeSide(side) { return side === 'P' ? 'B' : 'P'; }

        // ========== 1. PATTERN DETECTION ==========
        function detectPatterns() {
            if (sequence.length < 7) return null;

            const patterns = {};
            const maxLen = Math.min(8, sequence.length - 1);

            for (let len = 2; len <= maxLen; len++) {
                const pattern = sequence.slice(-len).join('');
                let occurrences = [];

                for (let i = 0; i <= sequence.length - len - 1; i++) {
                    const current = sequence.slice(i, i + len).join('');
                    if (current === pattern && i + len < sequence.length) {
                        occurrences.push(sequence[i + len]);
                    }
                }

                if (occurrences.length >= 2) {
                    const pCount = occurrences.filter(o => o === 'P').length;
                    const bCount = occurrences.length - pCount;
                    const confidence = (Math.max(pCount, bCount) / occurrences.length) * 100;
                    const prediction = pCount > bCount ? 'P' : 'B';

                    const weight = len * occurrences.length;
                    if (!patterns[prediction] || patterns[prediction].weight < weight) {
                        patterns[prediction] = { confidence, weight, matches: occurrences.length };
                    }
                }
            }

            if (Object.keys(patterns).length === 0) return null;

            let best = null;
            let bestScore = 0;
            for (const [side, data] of Object.entries(patterns)) {
                const score = data.confidence * (data.weight / 10);
                if (score > bestScore) {
                    bestScore = score;
                    best = { prediction: side, confidence: data.confidence, matches: data.matches };
                }
            }

            return best;
        }

        // ========== 2. STREAK BIAS DETECTION ==========
        function detectStreakBias() {
            if (sequence.length < 7) return null;

            const last = sequence[sequence.length - 1];
            let streakLength = 1;
            for (let i = sequence.length - 2; i >= 0; i--) {
                if (sequence[i] === last) streakLength++;
                else break;
            }

            let streakData = { P: { continue: 0, break: 0 }, B: { continue: 0, break: 0 } };

            for (let i = 1; i < sequence.length; i++) {
                const current = sequence[i];
                const prev = sequence[i - 1];
                if (current === prev) {
                    streakData[prev].continue++;
                } else {
                    streakData[prev].break++;
                }
            }

            const side = last;
            const total = streakData[side].continue + streakData[side].break;

            if (total >= 2) {
                const continueRate = streakData[side].continue / total;

                if (streakLength >= 3 && continueRate > 0.55) {
                    const confidence = Math.min(78, 55 + (continueRate - 0.5) * 100 + streakLength * 2);
                    return { prediction: side, confidence: clampConfidence(confidence), type: 'streak_continue' };
                }

                if (streakLength >= 3 && continueRate < 0.45) {
                    const confidence = Math.min(78, 55 + (0.5 - continueRate) * 100 + streakLength * 2);
                    return { prediction: oppositeSide(side), confidence: clampConfidence(confidence), type: 'streak_break' };
                }
            }

            return null;
        }

        // ========== 3. ZIGZAG BIAS DETECTION ==========
        function detectZigzagBias() {
            if (sequence.length < 7) return null;

            let alternations = 0;
            const checkLen = Math.min(10, sequence.length);
            const start = Math.max(0, sequence.length - checkLen);

            for (let i = start; i < sequence.length - 1; i++) {
                if (sequence[i] !== sequence[i + 1]) alternations++;
            }

            const totalChecks = sequence.length - 1 - start;
            if (totalChecks < 3) return null;

            const zigzagRate = alternations / totalChecks;

            if (zigzagRate > 0.7) {
                const confidence = 55 + (zigzagRate - 0.5) * 80;
                return { prediction: oppositeSide(sequence[sequence.length - 1]), confidence: clampConfidence(confidence),
                    type: 'zigzag' };
            }

            if (zigzagRate < 0.3) {
                const confidence = 55 + (0.5 - zigzagRate) * 80;
                return { prediction: sequence[sequence.length - 1], confidence: clampConfidence(confidence),
                type: 'streak' };
            }

            return null;
        }

        // ========== 4. FREQUENCY BIAS DETECTION ==========
        function detectFrequencyBias() {
            if (sequence.length < 7) return null;

            const total = sequence.length;
            const pCount = sequence.filter(s => s === 'P').length;
            const bCount = total - pCount;

            const pRate = pCount / total;
            const bRate = bCount / total;

            const expectedP = 0.4462;
            const expectedB = 0.4586;

            if (pRate < expectedP - 0.06) {
                const confidence = Math.min(75, 50 + (expectedP - pRate) * 350);
                return { prediction: 'P', confidence: clampConfidence(confidence), type: 'regression' };
            }
            if (bRate < expectedB - 0.06) {
                const confidence = Math.min(75, 50 + (expectedB - bRate) * 350);
                return { prediction: 'B', confidence: clampConfidence(confidence), type: 'regression' };
            }

            if (pRate > 0.55) {
                const confidence = 50 + (pRate - 0.5) * 100;
                return { prediction: 'B', confidence: clampConfidence(confidence), type: 'overbias' };
            }
            if (bRate > 0.55) {
                const confidence = 50 + (bRate - 0.5) * 100;
                return { prediction: 'P', confidence: clampConfidence(confidence), type: 'overbias' };
            }

            return null;
        }

        // ========== 5. RECENT BIAS (Weighted) ==========
        function detectRecentBias() {
            if (sequence.length < 7) return null;

            const weights = [8, 7, 6, 5, 4, 3, 2, 1];
            const recentLen = Math.min(8, sequence.length);
            const recent = sequence.slice(-recentLen);

            let pWeight = 0,
                bWeight = 0;
            for (let i = 0; i < recent.length; i++) {
                const w = weights[i] || 1;
                if (recent[i] === 'P') pWeight += w;
                else bWeight += w;
            }

            const total = pWeight + bWeight;
            if (total === 0) return null;

            const pRate = pWeight / total;
            const bRate = bWeight / total;

            if (pRate > 0.6) {
                const confidence = 50 + (pRate - 0.5) * 130;
                return { prediction: 'B', confidence: clampConfidence(confidence), type: 'recent_bias' };
            }
            if (bRate > 0.6) {
                const confidence = 50 + (bRate - 0.5) * 130;
                return { prediction: 'P', confidence: clampConfidence(confidence), type: 'recent_bias' };
            }

            return null;
        }

        // ========== 6. ADAPTIVE LOSE DETECTION (internal) ==========
        function detectAdaptiveLose() {
            const recent = loseTracker.recent;
            if (recent.length < 7) return null;

            const lookback = Math.min(6, recent.length);
            const recentSlice = recent.slice(-lookback);

            const losses = recentSlice.filter(r => !r.wasWin);
            if (losses.length < 2) return null;

            let pLosses = 0,
                bLosses = 0;
            for (const loss of losses) {
                if (loss.prediction === 'P') pLosses++;
                else if (loss.prediction === 'B') bLosses++;
            }

            const totalLosses = pLosses + bLosses;
            if (totalLosses < 2) return null;

            const threshold = 0.6;
            const pRatio = pLosses / totalLosses;
            const bRatio = bLosses / totalLosses;

            let correctionSide = null;
            let confidence = 0;

            if (pRatio >= threshold) {
                correctionSide = 'B';
                confidence = 50 + (pRatio - 0.5) * 70;
                if (loseTracker.sideLossStreak.P >= 2) {
                    confidence += 8;
                }
            } else if (bRatio >= threshold) {
                correctionSide = 'P';
                confidence = 50 + (bRatio - 0.5) * 70;
                if (loseTracker.sideLossStreak.B >= 2) {
                    confidence += 8;
                }
            }

            if (correctionSide && confidence >= 45) {
                loseTracker.correctionActive = true;
                loseTracker.correctionSide = correctionSide;
                loseTracker.correctionStrength = clampConfidence(confidence);
                localStorage.setItem('bt_lose_tracker', JSON.stringify(loseTracker));
                return {
                    prediction: correctionSide,
                    confidence: clampConfidence(confidence),
                    type: 'adaptive_lose',
                    strength: clampConfidence(confidence)
                };
            }

            loseTracker.correctionActive = false;
            loseTracker.correctionSide = null;
            loseTracker.correctionStrength = 0;
            localStorage.setItem('bt_lose_tracker', JSON.stringify(loseTracker));
            return null;
        }

        // ========== 7. ADAPTIVE LEARNING ==========
        function getAdaptivePrediction() {
            if (sequence.length < 7) return null;

            if (detailedHistory.length >= 7) {
                const recent = detailedHistory.slice(-MAX_RECENT);
                const valid = recent.filter(h => !h.wasSkip);
                if (valid.length >= 3) {
                    const correct = valid.filter(h => h.type === 'win').length;
                    recentCorrect = correct;
                    recentTotal = valid.length;
                    patternAccuracy.P = 0.5;
                    patternAccuracy.B = 0.5;

                    if (recentCorrect / recentTotal > 0.55) {
                        patternAccuracy.P = 0.55;
                        patternAccuracy.B = 0.55;
                    } else if (recentCorrect / recentTotal < 0.45) {
                        patternAccuracy.P = 0.45;
                        patternAccuracy.B = 0.45;
                    }
                }
            }

            const patterns = [
                detectPatterns(),
                detectStreakBias(),
                detectZigzagBias(),
                detectFrequencyBias(),
                detectRecentBias(),
                detectAdaptiveLose()
            ].filter(p => p !== null);

            if (patterns.length === 0) return null;

            let pScore = 0,
                bScore = 0;
            let pWeighted = 0,
                bWeighted = 0;

            for (const p of patterns) {
                const confidenceFactor = p.confidence / 100;
                const adaptiveWeight = patternAccuracy[p.prediction] || 0.5;

                if (p.prediction === 'P') {
                    pScore += confidenceFactor * (1 + adaptiveWeight);
                    pWeighted += (1 + adaptiveWeight);
                } else {
                    bScore += confidenceFactor * (1 + adaptiveWeight);
                    bWeighted += (1 + adaptiveWeight);
                }
            }

            pScore = pWeighted > 0 ? pScore / pWeighted : 0;
            bScore = bWeighted > 0 ? bScore / bWeighted : 0;

            if (pScore === 0 && bScore === 0) return null;

            const prediction = pScore > bScore ? 'P' : 'B';
            const confidence = Math.max(pScore, bScore) * 100;

            const pCount = patterns.filter(p => p.prediction === 'P').length;
            const bCount = patterns.filter(p => p.prediction === 'B').length;
            const agreement = Math.abs(pCount - bCount) / patterns.length;

            let finalConfidence = confidence;
            if (agreement > 0.4) finalConfidence += 10;
            if (agreement > 0.6) finalConfidence += 8;
            if (patterns.length >= 4) finalConfidence += 5;

            const total = wins + losses;
            if (total > 10 && wins / total < 0.4) {
                finalConfidence -= 8;
            }

            if (loseTracker.correctionActive && loseTracker.correctionSide) {
                const losePattern = patterns.find(p => p.type === 'adaptive_lose');
                if (losePattern && losePattern.prediction === prediction) {
                    finalConfidence += 4;
                }
            }

            return {
                prediction,
                confidence: clampConfidence(Math.round(finalConfidence * 10) / 10),
                patternCount: patterns.length,
                agreement: agreement,
                adaptiveLoseActive: loseTracker.correctionActive,
                adaptiveLoseSide: loseTracker.correctionSide
            };
        }

        function getRunLength(arr) {
            if (arr.length === 0) return 0;
            const last = arr[arr.length - 1];
            let count = 1;
            for (let i = arr.length - 2; i >= 0; i--) {
                if (arr[i] === last) count++;
                else break;
            }
            return count;
        }

        // ========== DYNAMIC SKIP THRESHOLD ==========
        function getDynamicSkipThreshold() {
            let baseThreshold = 65;

            const recentResults = detailedHistory.slice(-15).filter(h => !h.wasSkip);
            if (recentResults.length >= 5) {
                const recentWins = recentResults.filter(r => r.type === 'win').length;
                const winRate = recentWins / recentResults.length;

                if (winRate < 0.35) baseThreshold = 48;
                else if (winRate < 0.45) baseThreshold = 52;
                else if (winRate > 0.6) baseThreshold = 62;
                else if (winRate > 0.7) baseThreshold = 68;
            }

            const total = wins + losses;
            if (total > 20) {
                const overallWinRate = wins / total;
                if (overallWinRate < 0.4) baseThreshold = Math.max(42, baseThreshold - 8);
                else if (overallWinRate > 0.6) baseThreshold = Math.min(72, baseThreshold + 8);
            }

            if (loseTracker.correctionActive && loseTracker.correctionStrength > 55) {
                baseThreshold = Math.max(38, baseThreshold - 10);
            }

            return Math.min(72, Math.max(42, baseThreshold));
        }

        function shouldSkip(confidence, patternCount) {
            const threshold = getDynamicSkipThreshold();
            let adjusted = threshold;

            if (patternCount >= 4) adjusted = Math.max(38, threshold - 10);
            else if (patternCount >= 3) adjusted = Math.max(40, threshold - 6);
            else if (patternCount <= 1) adjusted = Math.min(72, threshold + 10);

            if (loseTracker.correctionActive && loseTracker.correctionStrength > 60) {
                adjusted = Math.max(35, adjusted - 8);
            }

            return confidence < adjusted;
        }

        function finalPrediction() {
            if (sequence.length < MIN_HANDS) return null;

            const result = getAdaptivePrediction();
            if (!result) return null;

            const skip = shouldSkip(result.confidence, result.patternCount || 0);

            if (skip) {
                return { pred: null, confidence: result.confidence, skip: true, patterns: result.patternCount };
            }

            return { pred: result.prediction, confidence: result.confidence, skip: false, patterns: result.patternCount };
        }

        // ========== UI FUNCTIONS ==========
        function updateHistory() {
            const box = document.getElementById('historyBox');
            const rBox = document.getElementById('resultsBox');
            if (sequence.length === 0) { box.innerHTML = "READY FOR DATA";
                rBox.innerHTML = ""; return; }
            box.innerHTML = '';
            sequence.slice(-10).forEach(r => {
                const span = document.createElement('span');
                span.className = r;
                span.textContent = r;
                box.appendChild(span);
            });

            rBox.innerHTML = '';
            const filteredResults = results.filter(r => r === 'W' || r === 'L');
            const last10 = filteredResults.slice(-10);
            last10.forEach(wl => {
                const span = document.createElement('span');
                span.className = wl;
                span.textContent = wl;
                rBox.appendChild(span);
            });
        }

        function updatePredictionBox() {
            const box = document.getElementById('predictionBox');

            if (sequence.length < MIN_HANDS) {
                box.innerHTML =
                    `<span style="font-size:clamp(11px,2.5vw,13px); color:#7a8595; letter-spacing:1px;">LOGGING: ${MIN_HANDS-sequence.length} MORE HANDS NEEDED</span>`;
                lastPrediction = null;
                return;
            }

            const result = finalPrediction();

            // No adaptive lose notes appear — clean UI
            if (result && result.pred) {
                const text = result.pred === 'P' ? 'PLAYER' : 'BANKER';
                const cls = result.pred === 'P' ? 'player' : 'banker';
                box.innerHTML =
                    `NEXT: <span class="${cls}">${text}</span> <span class="confidence">${result.confidence}%</span>`;
                lastPrediction = result.pred;
            } else if (result && result.skip) {
                box.innerHTML =
                    `<span style="font-size:clamp(14px,3vw,16px); color:#db2777;">⏭ SKIP (${result.confidence}%)</span>`;
                lastPrediction = null;
            } else {
                box.innerHTML = `<span style='font-size:clamp(14px,3vw,16px); color:#7a8595'>ANALYZING PATTERNS...</span>`;
                lastPrediction = null;
            }

            updateStatsBar();
        }

        function updateStatsBar() {
            document.getElementById('winCount').textContent = wins;
            document.getElementById('lossCount').textContent = losses;
            const total = wins + losses;
            const winRate = total > 0 ? Math.round((wins / total) * 100) : 0;
            document.getElementById('winRateDisplay').textContent = `WR: ${winRate}%`;

            const streak = getRunLength(sequence);
            const last = sequence.length > 0 ? sequence[sequence.length - 1] : null;
            const streakDisplay = document.getElementById('streakDisplay');
            if (last && streak > 0) {
                streakDisplay.textContent = `Streak: ${streak} ${last}`;
                streakDisplay.className = 'streak-indicator ' + (streak >= 3 ? 'win-streak' : '');
            } else {
                streakDisplay.textContent = 'Streak: 0';
                streakDisplay.className = 'streak-indicator';
            }
        }

        // ========== RECORD RESULT, UNDO, RESET ==========
        function recordResult(r) {
            if (lastPrediction) {
                const wasWin = (lastPrediction === r);
                loseTracker.recent.push({
                    prediction: lastPrediction,
                    actual: r,
                    wasWin: wasWin,
                    timestamp: Date.now()
                });
                if (loseTracker.recent.length > 12) loseTracker.recent.shift();

                if (!wasWin) {
                    loseTracker.sideLossStreak[lastPrediction] = (loseTracker.sideLossStreak[lastPrediction] || 0) + 1;
                    loseTracker.sideLossStreak[oppositeSide(lastPrediction)] = 0;
                    loseTracker.totalLosses++;
                } else {
                    loseTracker.sideLossStreak.P = 0;
                    loseTracker.sideLossStreak.B = 0;
                }

                localStorage.setItem('bt_lose_tracker', JSON.stringify(loseTracker));

                results.push(wasWin ? 'W' : 'L');
                if (wasWin) { wins++;
                    detailedHistory.push({ type: 'win', wasSkip: false }); } else { losses++;
                    detailedHistory.push({ type: 'loss', wasSkip: false }); }
            } else {
                results.push('');
                skips++;
                detailedHistory.push({ type: 'skip', wasSkip: true });
            }

            sequence.push(r);
            saveAndUpdate();
        }

        function undo() {
            if (sequence.length === 0) return;

            const lastResultData = results.pop();
            const lastHistory = detailedHistory.pop();

            if (lastResultData === 'W') wins--;
            else if (lastResultData === 'L') losses--;
            else if (lastResultData === '') skips--;

            if (loseTracker.recent.length > 0) {
                loseTracker.recent.pop();
                loseTracker.sideLossStreak.P = 0;
                loseTracker.sideLossStreak.B = 0;
                let streakP = 0,
                    streakB = 0;
                for (let i = loseTracker.recent.length - 1; i >= 0; i--) {
                    const entry = loseTracker.recent[i];
                    if (!entry.wasWin) {
                        if (entry.prediction === 'P') streakP++;
                        else streakB++;
                    } else {
                        break;
                    }
                }
                loseTracker.sideLossStreak.P = streakP;
                loseTracker.sideLossStreak.B = streakB;
                loseTracker.totalLosses = loseTracker.recent.filter(r => !r.wasWin).length;
                loseTracker.correctionActive = false;
                loseTracker.correctionSide = null;
                loseTracker.correctionStrength = 0;
                localStorage.setItem('bt_lose_tracker', JSON.stringify(loseTracker));
            }

            sequence.pop();
            saveAndUpdate();
        }

        function resetAll() {
            if (confirm("Reset all data?")) {
                sequence = [];
                results = [];
                lastPrediction = null;
                detailedHistory = [];
                wins = 0;
                losses = 0;
                skips = 0;
                patternAccuracy = { P: 0.5, B: 0.5 };
                recentCorrect = 0;
                recentTotal = 0;

                loseTracker = {
                    recent: [],
                    sideLossStreak: { P: 0, B: 0 },
                    totalLosses: 0,
                    correctionActive: false,
                    correctionSide: null,
                    correctionStrength: 0
                };
                localStorage.setItem('bt_lose_tracker', JSON.stringify(loseTracker));

                saveAndUpdate();
            }
        }

        function saveAndUpdate() {
            localStorage.setItem('bt_sequence', JSON.stringify(sequence));
            localStorage.setItem('bt_results', JSON.stringify(results));
            localStorage.setItem('bt_detailed', JSON.stringify(detailedHistory));
            updateHistory();
            updatePredictionBox();
        }

        // Initial stats
        if (sequence.length > 0 || results.length > 0) {
            results.forEach(r => { if (r === 'W') wins++;
                else if (r === 'L') losses++;
                else if (r === '') skips++; });
        }

        // Initial render
        updateHistory();
        updatePredictionBox();

        // Periodic refresh to keep adaptive lose internal state fresh
        setInterval(() => {
            if (sequence.length >= MIN_HANDS) {
                updatePredictionBox();
            }
        }, 5000);
    </script>
