<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Baccarat VIP Plus · AI</title>

    <!-- Clean URL script -->
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>

    <!-- Firebase Authentication & Permission Check -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const REQUIRED_ENGINE_ID = "engine_17";

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && 
                           (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                           userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) {
                alert("Access denied: you don't have permission for Baccarat VIP Plus.");
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>

    <!-- Security Blockers: Right-click + All Shortcut Keys -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.onkeydown = function(e) {
            if (
                e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83)) ||
                (e.ctrlKey && e.shiftKey && e.keyCode === 85)
            ) {
                e.preventDefault();
                return false;
            }
        };

        setInterval(function() {
            (function() { return false; }['constructor']('debugger')['call']());
        }, 50);

        if (typeof console !== "undefined") {
            console.log = console.debug = console.info = console.warn = console.error = function() {};
        }
    </script>

<body>

    <div class="exit-nav">
        <a href="index.html" class="exit-btn">← EXIT TERMINAL</a>
    </div>

    <div class="overlay" id="entryOverlay">
        <div class="overlay-card">
            <h2 class="overlay-title">
                <span class="title-violet">Baccarat</span>
                <span class="title-darkblue">VIP</span>

            </h2>
            <div class="overlay-welcome">WELCOME</div>
            <label>Base Unit
                <input type="number" id="overlayBase" value="1" step="0.01" min="0.01">
            </label>
            <label>Progression
                <select id="overlayProgression">
                    <option value="sentinel">Sentinel</option>
                    <option value="martingale">Martingale</option>
                    <option value="fibonacci">Fibonacci</option>
                    <option value="dalambert">D'Alembert</option>
                </select>
            </label>
            <button class="start-btn" id="overlayStartBtn">Confirm</button>
        </div>
    </div>

    <div class="wrap">
        <div class="container">
            <div class="header">
                <h1>
                    <span class="title-violet">Baccarat</span>
                    <span class="title-darkblue">VIP</span>
                    <span class="title-redpink">Plus</span>
                </h1>
                <div class="ai-container">
                    <span class="ai-text">AI</span>
                </div>
            </div>
            <div class="tag" style="text-align:center; color:var(--text-muted); font-size:11px; letter-spacing:2px; margin-bottom:18px; opacity:0.7;">Results are insights, not Guarantees</div>

            <div class="sequence" id="historyBox">READY FOR DATA</div>
            <div class="results" id="resultsBox"></div>

            <div class="prediction" id="predictionBox">
                INITIALIZING...
                <div class="bet-line" id="betLine" style="display:none;"></div>
            </div>
            <div class="skip-note" id="skipNote"></div>

            <div class="buttons">
                <button onclick="recordResult('P')" id="playerBtn">PLAYER</button>
                <button onclick="recordResult('B')" id="bankerBtn">BANKER</button>
                <div class="util-btns">
                    <button onclick="undo()">UNDO LAST</button>
                    <button onclick="resetAll()">RESET SHOE</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
           PART 1 — pattern log / "prediction" display
        ========================================================= */
        let sequence = JSON.parse(localStorage.getItem('bt_sequence')) || [];
        let results = JSON.parse(localStorage.getItem('bt_results')) || [];
        let lastPrediction = null;
        let detailedHistory = JSON.parse(localStorage.getItem('bt_detailed')) || [];
        let wins = 0, losses = 0, skips = 0, playerCount = 0, bankerCount = 0;
        const MIN_HANDS = 10;

        function clampConfidence(raw) { return Math.min(96, Math.max(40, raw)); }
        function oppositeSide(side) { return side === 'P' ? 'B' : 'P'; }

        function getCurrentStreak() {
            if (sequence.length === 0) return { side: null, count: 0 };
            let streak = 1;
            const lastSide = sequence[sequence.length - 1];
            for (let i = sequence.length - 2; i >= 0; i--) { if (sequence[i] === lastSide) streak++; else break; }
            return { side: lastSide, count: streak };
        }

        function analyzeLast3Pattern() {
            if (sequence.length < 3) return null;
            const last3 = sequence.slice(-3);
            let occurrences = 0, playerFollows = 0, bankerFollows = 0;
            for (let i = 0; i <= sequence.length - 4; i++) {
                if (sequence[i] === last3[0] && sequence[i+1] === last3[1] && sequence[i+2] === last3[2]) {
                    occurrences++;
                    if (sequence[i+3] === 'P') playerFollows++; else bankerFollows++;
                }
            }
            if (occurrences === 0 && sequence.length >= 2) {
                const last2 = sequence.slice(-2);
                for (let i = 0; i <= sequence.length - 3; i++) {
                    if (sequence[i] === last2[0] && sequence[i+1] === last2[1]) {
                        occurrences++;
                        if (sequence[i+2] === 'P') playerFollows++; else bankerFollows++;
                    }
                }
            }
            if (occurrences === 0) return null;
            const prediction = playerFollows > bankerFollows ? 'P' : 'B';
            const matches = prediction === 'P' ? playerFollows : bankerFollows;
            return { prediction, confidence: (matches / occurrences) * 100, occurrences, matches };
        }

        function isZigzagPattern() {
            if (sequence.length < 4) return false;
            for (let i = sequence.length - 3; i < sequence.length - 1; i++) {
                if (sequence[i] === sequence[i+1]) return false;
            }
            return true;
        }

        function getEnhancedPredictionAndConfidence() {
            if (sequence.length < 2) return { prediction: null, confidence: 0, occurrences: 0 };
            let scores = { P: 0, B: 0 }, totalWeight = 0;

            const streak = getCurrentStreak();
            if (streak.count >= 3) { scores[streak.side] += Math.min(40, (streak.count - 2) * 15); totalWeight += 30; }
            else if (streak.count === 2) { scores[streak.side] += 10; totalWeight += 20; }

            const patternAnalysis = analyzeLast3Pattern();
            if (patternAnalysis && patternAnalysis.occurrences > 0) {
                const patternWeight = 50;
                scores[patternAnalysis.prediction] += (patternAnalysis.confidence / 100) * patternWeight;
                totalWeight += patternWeight;
            }

            if (isZigzagPattern() && sequence.length >= 4) {
                const zigzagPrediction = oppositeSide(sequence[sequence.length - 1]);
                scores[zigzagPrediction] += 20;
                totalWeight += 20;
            }

            if (totalWeight === 0 && sequence.length >= 2) {
                scores[oppositeSide(sequence[sequence.length - 1])] = 55;
                totalWeight = 100;
            }

            let prediction = scores.P > scores.B ? 'P' : 'B';
            let maxScore = Math.max(scores.P, scores.B);
            let confidence = totalWeight > 0 ? (maxScore / totalWeight) * 100 : 50;

            let bonus = 0;
            if (sequence.length > 50) bonus = 10;
            else if (sequence.length > 30) bonus = 7;
            else if (sequence.length > 20) bonus = 5;
            else if (sequence.length > 10) bonus = 2;

            let rawConfidence = Math.min(96, Math.max(40, confidence + bonus));
            let finalConfidence = clampConfidence(rawConfidence);
            let totalOccurrences = (patternAnalysis ? patternAnalysis.occurrences : 0) + (streak.count >= 3 ? streak.count : 0);

            return { prediction, confidence: Math.round(finalConfidence * 10) / 10, occurrences: totalOccurrences || 1 };
        }

        function getDynamicSkipThreshold() {
            let baseThreshold = 60;
            const recent = detailedHistory.slice(-5).filter(h => !h.wasSkip);
            const recentLosses = recent.filter(r => r.type === 'loss').length;
            const recentWins = recent.filter(r => r.type === 'win').length;
            if (recentLosses >= 3) baseThreshold = 52;
            else if (recentWins >= 3 && recent.length >= 3) baseThreshold = 68;
            else if (recentLosses >= 2) baseThreshold = 56;
            else if (recentWins >= 2) baseThreshold = 64;
            const total = wins + losses;
            if (total > 10) {
                const winRate = wins / total;
                if (winRate < 0.45) baseThreshold = Math.max(50, baseThreshold - 5);
                else if (winRate > 0.55) baseThreshold = Math.min(75, baseThreshold + 5);
            }
            return baseThreshold;
        }

        function shouldSkipPrediction(confidence, occurrences) {
            const dyn = getDynamicSkipThreshold();
            let adj = dyn;
            if (occurrences >= 5) adj = Math.max(50, dyn - 8);
            return confidence < adj || occurrences < 1;
        }

        function finalPrediction() {
            if (sequence.length < MIN_HANDS) return null;
            const result = getEnhancedPredictionAndConfidence();
            if (!result || !result.prediction) return null;
            const skip = shouldSkipPrediction(result.confidence, result.occurrences);
            if (skip) return { pred: null, confidence: result.confidence, skip: true };
            return { pred: result.prediction, confidence: result.confidence, skip: false };
        }

        function updateHistory() {
            const box = document.getElementById('historyBox');
            const rBox = document.getElementById('resultsBox');
            if (sequence.length === 0) { box.innerHTML = "READY FOR DATA"; rBox.innerHTML = ""; return; }
            box.innerHTML = '';
            sequence.slice(-10).forEach(r => {
                const span = document.createElement('span');
                span.className = r;
                span.textContent = r;
                box.appendChild(span);
            });

            rBox.innerHTML = '';
            const filteredResults = results.filter(r => r === 'W' || r === 'L');
            const last10 = filteredResults.slice(-10);
            last10.forEach(wl => {
                const span = document.createElement('span');
                span.className = wl;
                span.textContent = wl;
                rBox.appendChild(span);
            });
        }

        function updatePredictionBox() {
            const box = document.getElementById('predictionBox');
            const betLine = document.getElementById('betLine');

            if (sequence.length < MIN_HANDS) {
                box.innerHTML = `<span style="font-size:clamp(11px,2.5vw,13px); color:#7a8595; letter-spacing:1px;">LOGGING: ${MIN_HANDS-sequence.length} MORE HANDS NEEDED</span>`;
                lastPrediction = null;
                box.appendChild(betLine);
                betLine.style.display = 'none';
                return;
            }
            const result = finalPrediction();
            if (result && result.pred) {
                const text = result.pred === 'P' ? 'PLAYER' : 'BANKER';
                const cls = result.pred === 'P' ? 'player' : 'banker';
                box.innerHTML = `NEXT: <span class="${cls}">${text}</span> <span class="confidence">${result.confidence}%</span>`;
                lastPrediction = result.pred;
                box.appendChild(betLine);
                renderBetLine(true);
            } else if (result && result.skip) {
                box.innerHTML = `<span style="font-size:clamp(14px,3vw,16px); color:#db2777;">SKIP (${result.confidence}%)</span>`;
                lastPrediction = null;
                box.appendChild(betLine);
                betLine.style.display = 'none';
            } else {
                box.innerHTML = "<span style='font-size:clamp(14px,3vw,16px); color:#7a8595'>ANALYZING TRENDS...</span>";
                lastPrediction = null;
                box.appendChild(betLine);
                betLine.style.display = 'none';
            }
        }

        let lastRenderedBet = null;

        function renderBetLine(show) {
            const betLine = document.getElementById('betLine');
            if (!show) { betLine.style.display = 'none'; return; }
            const s = engine.getState();
            const changed = lastRenderedBet !== null && lastRenderedBet !== s.currentBet;
            lastRenderedBet = s.currentBet;
            betLine.innerHTML = `Suggested bet: <span class="amount${changed?' flash':''}">$${s.currentBet.toFixed(2)}</span>`;
            betLine.style.display = 'block';
            if (changed) {
                const amt = betLine.querySelector('.amount');
                setTimeout(() => { if (amt) amt.classList.remove('flash'); }, 500);
            }
        }

        /* =========================================================
           PART 2 — Progression Engine Factory (FIXED SENTINEL)
        ========================================================= */
        class ProgressionEngine {
            constructor(baseUnit, type) {
                this.baseUnit = baseUnit;
                this.type = type;
                this.reset();
            }

            reset() {
                this.streak = 0;
                this.round = 0;
                // Martingale specific
                this.martingaleMultiplier = 1;
                // Fibonacci specific
                this.fibPrev = 0;
                this.fibCurr = 1;
                // D'Alembert specific
                this.dalembertUnits = 1;
                // Sentinel specific
                this.shieldCount = 0;
                this.surgeActive = false;
                this.currentUnits = 1;
                this.MAX_UNITS = 10;
                this.MIN_UNITS = 1;
                this.SURGE_THRESHOLD = 3;
                this.SHIELD_THRESHOLD = -5;
                this.SHIELD_DURATION = 3;
                return this.getState();
            }

            getState() {
                let currentBet = this.baseUnit;
                switch (this.type) {
                    case 'martingale': currentBet = this.baseUnit * this.martingaleMultiplier; break;
                    case 'fibonacci': currentBet = this.baseUnit * (this.fibCurr || 1); break;
                    case 'dalambert': currentBet = this.baseUnit * this.dalembertUnits; break;
                    case 'sentinel':
                    default: currentBet = this.baseUnit * this.currentUnits; break;
                }
                return {
                    currentBet: currentBet,
                    currentUnits: this.type === 'sentinel' ? this.currentUnits : 
                                  (this.type === 'martingale' ? this.martingaleMultiplier :
                                   this.type === 'fibonacci' ? this.fibCurr : this.dalembertUnits),
                    bankroll: 0,
                    streak: this.streak,
                    surgeActive: this.surgeActive || false,
                    shieldActive: (this.shieldCount || 0) > 0,
                    shieldCount: this.shieldCount || 0,
                    round: this.round,
                    baseUnit: this.baseUnit,
                    startingBankroll: 0
                };
            }

            placeBet(result) {
                const isWin = result === 'win';
                switch (this.type) {
                    case 'martingale':
                        if (isWin) { this.martingaleMultiplier = 1; } else { this.martingaleMultiplier *= 2; }
                        break;
                    case 'fibonacci':
                        if (isWin) {
                            // Step back two numbers in the sequence
                            if (this.fibPrev === 0 && this.fibCurr === 1) {
                                this.fibCurr = 1;
                                this.fibPrev = 0;
                            } else {
                                const temp = this.fibPrev;
                                this.fibPrev = this.fibCurr - this.fibPrev;
                                this.fibCurr = temp;
                                if (this.fibCurr < 1) { this.fibCurr = 1; this.fibPrev = 0; }
                            }
                        } else {
                            const next = this.fibPrev + this.fibCurr;
                            this.fibPrev = this.fibCurr;
                            this.fibCurr = next;
                            if (this.fibCurr === 0) this.fibCurr = 1;
                        }
                        break;
                    case 'dalambert':
                        if (isWin) {
                            this.dalembertUnits = Math.max(1, this.dalembertUnits - 1);
                        } else {
                            this.dalembertUnits = this.dalembertUnits + 1;
                        }
                        break;
                    case 'sentinel':
                    default:
                        // === FIXED: Proper streak tracking for Sentinel ===
                        // Track consecutive wins or losses properly
                        if (isWin) {
                            // If streak was negative (losses), reset to 1, otherwise increment
                            this.streak = this.streak > 0 ? this.streak + 1 : 1;
                        } else {
                            // If streak was positive (wins), reset to -1, otherwise decrement
                            this.streak = this.streak < 0 ? this.streak - 1 : -1;
                        }
                        
                        // Shield activates when we hit 5 consecutive losses
                        if (this.streak <= this.SHIELD_THRESHOLD && this.shieldCount === 0) {
                            this.shieldCount = this.SHIELD_DURATION;
                            this.currentUnits = 1;
                        }
                        
                        let surgeBonus = 0;
                        // Surge activates on 3+ consecutive wins
                        if (isWin && this.streak >= this.SURGE_THRESHOLD) { 
                            surgeBonus = 1; 
                            this.surgeActive = true; 
                        } else { 
                            this.surgeActive = false; 
                        }

                        if (this.shieldCount > 0) {
                            this.shieldCount--;
                            this.currentUnits = 1;
                        } else {
                            if (isWin) {
                                this.currentUnits = Math.min(this.currentUnits + 1 + surgeBonus, this.MAX_UNITS);
                            } else {
                                this.currentUnits = Math.max(this.currentUnits - 1, this.MIN_UNITS);
                            }
                        }
                        this.currentUnits = Math.max(this.MIN_UNITS, Math.min(this.currentUnits, this.MAX_UNITS));
                        break;
                }
                // Update streak for display (non-Sentinel)
                if (this.type !== 'sentinel') {
                    this.streak = isWin ? Math.abs(this.streak) + 1 : -(Math.abs(this.streak) + 1);
                }
                this.round++;
                return this.getState();
            }

            resetWith(baseUnit, type) {
                this.baseUnit = baseUnit;
                this.type = type;
                return this.reset();
            }
        }

        /* =========================================================
           PART 3 — Glue: overlay + engine
        ========================================================= */
        const savedConfig = JSON.parse(localStorage.getItem('bt_sentinel_config')) || null;
        const savedProgression = localStorage.getItem('bt_progression_type') || 'sentinel';
        let engine = new ProgressionEngine((savedConfig && savedConfig.base) || 1, savedProgression);

        const savedState = JSON.parse(localStorage.getItem('bt_sentinel_state'));
        if (savedConfig && savedState) {
            engine.streak = savedState.streak || 0;
            engine.round = savedState.round || 0;
            if (engine.type === 'sentinel') {
                engine.currentUnits = savedState.currentUnits || 1;
                engine.shieldCount = savedState.shieldCount || 0;
                engine.surgeActive = savedState.surgeActive || false;
            } else if (engine.type === 'martingale') {
                engine.martingaleMultiplier = savedState.currentUnits || 1;
            } else if (engine.type === 'fibonacci') {
                engine.fibCurr = savedState.currentUnits || 1;
                engine.fibPrev = 0;
            } else if (engine.type === 'dalambert') {
                engine.dalembertUnits = savedState.currentUnits || 1;
            }
        }

        function renderSentinel() {
            const s = engine.getState();
            localStorage.setItem('bt_sentinel_state', JSON.stringify(s));
            if (lastPrediction) renderBetLine(true);
        }

        const overlay = document.getElementById('entryOverlay');
        const overlayBase = document.getElementById('overlayBase');
        const overlayProgression = document.getElementById('overlayProgression');
        const overlayStartBtn = document.getElementById('overlayStartBtn');
        const DEFAULT_BANKROLL = 100;

        function openOverlay(prefill) {
            if (prefill) {
                overlayBase.value = engine.baseUnit;
                overlayProgression.value = engine.type;
            }
            overlay.style.display = 'flex';
        }

        function closeOverlay() { overlay.style.display = 'none'; }

        overlayStartBtn.addEventListener('click', function() {
            const base = parseFloat(overlayBase.value) || 1;
            const prog = overlayProgression.value;
            localStorage.setItem('bt_sentinel_config', JSON.stringify({ base, bankroll: DEFAULT_BANKROLL }));
            localStorage.setItem('bt_progression_type', prog);
            engine = new ProgressionEngine(base, prog);
            renderSentinel();

            sequence = [];
            results = [];
            lastPrediction = null;
            detailedHistory = [];
            wins = 0; losses = 0; skips = 0;
            playerCount = 0; bankerCount = 0;
            saveAndUpdate();

            closeOverlay();
        });
        overlayBase.addEventListener('keydown', e => { if (e.key === 'Enter') overlayStartBtn.click(); });

        openOverlay(!!savedConfig);

        /* =========================================================
           PART 4 — recordResult, undo, reset
        ========================================================= */
        function recordResult(r) {
            const skipNote = document.getElementById('skipNote');

            if (lastPrediction) {
                const wasWin = (lastPrediction === r);
                results.push(wasWin ? 'W' : 'L');
                if (wasWin) { wins++; detailedHistory.push({ type: 'win', wasSkip: false }); } else { losses++; detailedHistory.push({ type: 'loss', wasSkip: false }); }

                engine.placeBet(wasWin ? 'win' : 'loss');
                renderSentinel();
                skipNote.textContent = '';
            } else {
                results.push('');
                skips++;
                detailedHistory.push({ type: 'skip', wasSkip: true });
                skipNote.textContent = '';
            }

            sequence.push(r);
            if (r === 'P') playerCount++; else bankerCount++;

            saveAndUpdate();
        }

        function undo() {
            if (sequence.length === 0) return;
            const lastResult = sequence.pop();
            const lastResultData = results.pop();
            const lastHistory = detailedHistory.pop();

            if (lastResult === 'P') playerCount--; else bankerCount--;
            if (lastResultData === 'W') wins--;
            else if (lastResultData === 'L') losses--;
            else if (lastResultData === '') skips--;

            const base = engine.baseUnit;
            const type = engine.type;
            engine = new ProgressionEngine(base, type);
            const replayResults = results.filter(r => r === 'W' || r === 'L');
            for (let i = 0; i < replayResults.length; i++) {
                engine.placeBet(replayResults[i] === 'W' ? 'win' : 'loss');
            }
            renderSentinel();

            saveAndUpdate();
        }

        function resetAll() {
            if (confirm("Do you want to reset??")) {
                sequence = [];
                results = [];
                lastPrediction = null;
                detailedHistory = [];
                wins = 0; losses = 0; skips = 0;
                playerCount = 0; bankerCount = 0;

                const base = engine.baseUnit;
                const type = engine.type;
                engine = new ProgressionEngine(base, type);
                renderSentinel();

                saveAndUpdate();
            }
        }

        function saveAndUpdate() {
            localStorage.setItem('bt_sequence', JSON.stringify(sequence));
            localStorage.setItem('bt_results', JSON.stringify(results));
            localStorage.setItem('bt_detailed', JSON.stringify(detailedHistory));
            updateHistory();
            updatePredictionBox();
        }

        // initial stats
        results.forEach(r => { if (r === 'W') wins++; else if (r === 'L') losses++; else if (r === '') skips++; });
        sequence.forEach(r => { if (r === 'P') playerCount++; else if (r === 'B') bankerCount++; });

        updateHistory();
        updatePredictionBox();
        renderSentinel();
    </script>
