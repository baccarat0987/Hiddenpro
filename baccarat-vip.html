    <!-- Firebase Authentication & Permission Check -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const REQUIRED_ENGINE_ID = "engine_17";

        window.signOutUser = function() {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                window.location.href = "index.html";
            });
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && 
                           (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                           userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) {
                alert("Access denied: you don't have permission for Baccarat VIP Plus.");
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.onkeydown = function(e) {
            if (
                e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83)) ||
                (e.ctrlKey && e.shiftKey && e.keyCode === 85)
            ) {
                e.preventDefault();
                return false;

        setInterval(function() {

    <script>
        /* =========================================================
           PREDICTION ENGINE - 6 ALGORITHMS
           Pattern Matching: Last 7 outcomes
           Recent Weighted Bias: Last 7 hands
        ========================================================= */
        let sequence = JSON.parse(localStorage.getItem('bt_sequence')) || [];
        let results = JSON.parse(localStorage.getItem('bt_results')) || [];
        let lastPrediction = null;
        let detailedHistory = JSON.parse(localStorage.getItem('bt_detailed')) || [];
        let wins = 0, losses = 0, skips = 0;
        let conflictData = null;
        const MIN_HANDS = 10;

        function clampConfidence(raw) { return Math.min(98, Math.max(35, raw)); }
        function oppositeSide(side) { return side === 'P' ? 'B' : 'P'; }

        // ========== ALGORITHM 1: MARKOV CHAIN (2nd Order) ==========
        function getMarkovPrediction() {
            if (sequence.length < 3) return null;
            
            const last2 = sequence.slice(-2).join('');
            const transitions = {};
            
            for (let i = 0; i < sequence.length - 2; i++) {
                const key = sequence[i] + sequence[i+1];
                const next = sequence[i+2];
                if (!transitions[key]) transitions[key] = { P: 0, B: 0 };
                transitions[key][next]++;
            }
            
            if (transitions[last2]) {
                const total = transitions[last2].P + transitions[last2].B;
                if (total > 0) {
                    const pProb = transitions[last2].P / total;
                    const bProb = transitions[last2].B / total;
                    const prediction = pProb > bProb ? 'P' : 'B';
                    const confidence = Math.max(pProb, bProb) * 100;
                    return { prediction, confidence: clampConfidence(confidence + 5) };
                }
            }
            
            // Fallback to 1st order
            const trans = { P: { P: 0, B: 0 }, B: { P: 0, B: 0 } };
            for (let i = 0; i < sequence.length - 1; i++) {
                const current = sequence[i];
                const next = sequence[i + 1];
                trans[current][next]++;
            }
            
            const last = sequence[sequence.length - 1];
            const total = trans[last].P + trans[last].B;
            if (total === 0) return null;
            
            const pProb = trans[last].P / total;
            const bProb = trans[last].B / total;
            const prediction = pProb > bProb ? 'P' : 'B';
            const confidence = Math.max(pProb, bProb) * 100;
            
            return { prediction, confidence: clampConfidence(confidence) };
        }

        // ========== ALGORITHM 2: FREQUENCY/REGRESSION TO MEAN ==========
        function getFrequencyPrediction() {
            if (sequence.length < 8) return null;
            
            const total = sequence.length;
            const pCount = sequence.filter(s => s === 'P').length;
            const bCount = total - pCount;
            
            const pRate = pCount / total;
            const bRate = bCount / total;
            
            // If one side is significantly underrepresented, bet on it
            if (pRate < 0.43 && bRate > 0.57) {
                const confidence = Math.min(80, 55 + (0.57 - bRate) * 300);
                return { prediction: 'P', confidence: clampConfidence(confidence) };
            }
            if (bRate < 0.43 && pRate > 0.57) {
                const confidence = Math.min(80, 55 + (0.57 - pRate) * 300);
                return { prediction: 'B', confidence: clampConfidence(confidence) };
            }
            
            return null;
        }

        // ========== ALGORITHM 3: PATTERN MATCHING (LAST 7 OUTCOMES) ==========
        function getPatternPrediction() {
            if (sequence.length < 7) return null;
            
            // Use up to 7 outcomes for pattern matching
            const maxPatternLength = Math.min(7, sequence.length);
            let bestPrediction = null;
            let bestConfidence = 0;
            let bestMatches = 0;
            
            // Try pattern lengths from 2 to maxPatternLength
            for (let patternLength = 2; patternLength <= maxPatternLength; patternLength++) {
                const pattern = sequence.slice(-patternLength).join('');
                let matches = [];
                
                // Find all occurrences of this pattern in history
                for (let i = 0; i <= sequence.length - patternLength - 1; i++) {
                    const currentPattern = sequence.slice(i, i + patternLength).join('');
                    if (currentPattern === pattern && i + patternLength < sequence.length) {
                        matches.push(sequence[i + patternLength]);
                    }
                }
                
                // If we have enough matches, calculate prediction
                if (matches.length >= 2) {
                    const pCount = matches.filter(m => m === 'P').length;
                    const bCount = matches.length - pCount;
                    const prediction = pCount > bCount ? 'P' : 'B';
                    const matchRatio = Math.max(pCount, bCount) / matches.length;
                    const confidence = 50 + matchRatio * 40;
                    
                    // Prefer longer patterns with more matches
                    const weight = patternLength * matches.length;
                    const weightedConfidence = confidence * (1 + (patternLength / 20));
                    
                    if (weightedConfidence > bestConfidence) {
                        bestConfidence = weightedConfidence;
                        bestPrediction = prediction;
                        bestMatches = matches.length;
                    }
                }
            }
            
            if (bestPrediction && bestConfidence > 0) {
                return { 
                    prediction: bestPrediction, 
                    confidence: clampConfidence(Math.min(85, bestConfidence)),
                    matches: bestMatches
                };
            }
            
            return null;
        }

        // ========== ALGORITHM 4: ZIGZAG DETECTION ==========
        function getZigzagPrediction() {
            if (sequence.length < 6) return null;
            
            let zigzagCount = 0;
            let totalCheck = 0;
            const checkLength = Math.min(12, sequence.length - 1);
            const startIdx = Math.max(0, sequence.length - checkLength - 1);
            
            for (let i = startIdx; i < sequence.length - 1; i++) {
                if (sequence[i] !== sequence[i+1]) zigzagCount++;
                totalCheck++;
            }
            
            if (totalCheck === 0) return null;
            const zigzagRate = zigzagCount / totalCheck;
            
            // Strong zigzag pattern (alternating)
            if (zigzagRate > 0.7) {
                const confidence = 55 + zigzagRate * 25;
                return { prediction: oppositeSide(sequence[sequence.length - 1]), confidence: clampConfidence(confidence) };
            }
            
            // Strong streak pattern (not alternating)
            if (zigzagRate < 0.35) {
                const confidence = 55 + (1 - zigzagRate) * 25;
                return { prediction: sequence[sequence.length - 1], confidence: clampConfidence(confidence) };
            }
            
            return null;
        }

        // ========== ALGORITHM 5: RECENT WEIGHTED BIAS (LAST 7 HANDS) ==========
        function getRecentBiasPrediction() {
            if (sequence.length < 3) return null;
            
            // Weighted: most recent gets highest weight (7 to 1 for last 7 hands)
            const weights = [7, 6, 5, 4, 3, 2, 1];
            const recentLength = Math.min(7, sequence.length);
            const recent = sequence.slice(-recentLength);
            
            let pWeight = 0, bWeight = 0;
            for (let i = 0; i < recent.length; i++) {
                const weight = weights[i] || 1;
                if (recent[i] === 'P') pWeight += weight;
                else bWeight += weight;
            }
            
            const totalWeight = pWeight + bWeight;
            if (totalWeight === 0) return null;
            
            const pRate = pWeight / totalWeight;
            const bRate = bWeight / totalWeight;
            
            // If one side has significantly higher weighted count
            if (pRate > 0.62) {
                const confidence = 50 + (pRate - 0.5) * 120;
                return { prediction: 'B', confidence: clampConfidence(confidence) };
            }
            if (bRate > 0.62) {
                const confidence = 50 + (bRate - 0.5) * 120;
                return { prediction: 'P', confidence: clampConfidence(confidence) };
            }
            
            return null;
        }

        // ========== ALGORITHM 6: STATISTICAL EDGE ==========
        function getStatisticalEdge() {
            if (sequence.length < 20) return null;
            
            const total = sequence.length;
            const pCount = sequence.filter(s => s === 'P').length;
            const bCount = total - pCount;
            
            // Actual baccarat probabilities
            const expectedP = 0.4462;  // Player wins 44.62%
            const expectedB = 0.4586;  // Banker wins 45.86%
            
            const actualP = pCount / total;
            const actualB = bCount / total;
            
            // If Player is significantly underperforming, bet Player
            if (actualP < expectedP - 0.06) {
                const confidence = Math.min(75, 50 + (expectedP - actualP) * 400);
                return { prediction: 'P', confidence: clampConfidence(confidence) };
            }
            // If Banker is significantly underperforming, bet Banker
            if (actualB < expectedB - 0.06) {
                const confidence = Math.min(75, 50 + (expectedB - actualB) * 400);
                return { prediction: 'B', confidence: clampConfidence(confidence) };
            }
            
            return null;
        }

        // ========== CONFLICT RESOLUTION ENGINE ==========
        function resolveConflicts(algorithmResults) {
            if (!algorithmResults || algorithmResults.length === 0) {
                return { resolution: 'NO_DATA', side: null, confidenceModifier: 0, agreement: 0 };
            }
            
            const pVotes = algorithmResults.filter(a => a.prediction === 'P');
            const bVotes = algorithmResults.filter(a => a.prediction === 'B');
            const total = algorithmResults.length;
            const pCount = pVotes.length;
            const bCount = bVotes.length;
            
            const agreement = Math.abs(pCount - bCount) / total;
            
            if (agreement > 0.4) {
                const side = pCount > bCount ? 'P' : 'B';
                const confidenceBonus = 15;
                return { 
                    resolution: 'STRONG_AGREEMENT', 
                    side, 
                    confidenceModifier: confidenceBonus,
                    agreement: agreement,
                    details: `${Math.max(pCount, bCount)}/${total} algorithms agree`
                };
            }
            
            if (agreement > 0.2) {
                const side = pCount > bCount ? 'P' : 'B';
                const confidenceBonus = 5;
                return { 
                    resolution: 'MODERATE_AGREEMENT', 
                    side, 
                    confidenceModifier: confidenceBonus,
                    agreement: agreement,
                    details: `Split vote, leaning ${side}`
                };
            }
            
            if (pCount > 0 && bCount > 0 && agreement <= 0.2) {
                const avgPConf = pVotes.reduce((sum, a) => sum + a.confidence, 0) / pCount;
                const avgBConf = bVotes.reduce((sum, a) => sum + a.confidence, 0) / bCount;
                
                const side = avgPConf > avgBConf ? 'P' : 'B';
                const confidencePenalty = 10;
                
                return { 
                    resolution: 'CONFLICT_RESOLVED_BY_CONFIDENCE', 
                    side, 
                    confidenceModifier: -confidencePenalty,
                    agreement: agreement,
                    details: `Conflict! Resolved by confidence (P:${Math.round(avgPConf)}% vs B:${Math.round(avgBConf)}%)`
                };
            }
            
            if (pCount === total || bCount === total) {
                const side = pCount > 0 ? 'P' : 'B';
                const confidenceBonus = 20;
                return { 
                    resolution: 'UNANIMOUS', 
                    side, 
                    confidenceModifier: confidenceBonus,
                    agreement: 1.0,
                    details: `All ${total} algorithms agree on ${side}`
                };
            }
            
            return { resolution: 'UNRESOLVED', side: null, confidenceModifier: 0, agreement: 0 };
        }

        // ========== ENSEMBLE VOTING ==========
        function getEnhancedPredictionAndConfidence() {
            if (sequence.length < MIN_HANDS) return { prediction: null, confidence: 0, algorithmResults: [], conflict: null };
            
            const algorithms = [
                { name: 'markov', fn: getMarkovPrediction, baseWeight: 2.0 },
                { name: 'frequency', fn: getFrequencyPrediction, baseWeight: 1.2 },
                { name: 'pattern', fn: getPatternPrediction, baseWeight: 1.8 },
                { name: 'zigzag', fn: getZigzagPrediction, baseWeight: 1.3 },
                { name: 'recentBias', fn: getRecentBiasPrediction, baseWeight: 1.5 },
                { name: 'statEdge', fn: getStatisticalEdge, baseWeight: 1.4 }
            ];
            
            let scores = { P: 0, B: 0 };
            let totalWeight = 0;
            let activeAlgorithms = [];
            
            for (const algo of algorithms) {
                const result = algo.fn();
                if (result) {
                    const effectiveWeight = algo.baseWeight;
                    const confidenceFactor = result.confidence / 100;
                    scores[result.prediction] += effectiveWeight * confidenceFactor;
                    totalWeight += effectiveWeight;
                    activeAlgorithms.push({ 
                        name: algo.name, 
                        prediction: result.prediction, 
                        confidence: result.confidence,
                        weight: effectiveWeight,
                        matches: result.matches || null
                    });
                }
            }
            
            if (totalWeight === 0) {
                return { 
                    prediction: oppositeSide(sequence[sequence.length - 1]), 
                    confidence: 50, 
                    algorithmResults: [],
                    conflict: null 
                };
            }
            
            let prediction = scores.P > scores.B ? 'P' : 'B';
            let confidence = (Math.max(scores.P, scores.B) / totalWeight) * 100;
            
            const conflictResolution = resolveConflicts(activeAlgorithms);
            conflictData = conflictResolution;
            
            if (conflictResolution.resolution !== 'NO_DATA' && conflictResolution.resolution !== 'UNRESOLVED') {
                if (conflictResolution.side && conflictResolution.side !== prediction) {
                    prediction = conflictResolution.side;
                }
                confidence += conflictResolution.confidenceModifier;
            }
            
            if (conflictResolution.agreement > 0.3) {
                const bonus = conflictResolution.agreement * 15;
                confidence += bonus;
            }
            
            if (sequence.length > 30) confidence += 4;
            if (sequence.length > 50) confidence += 3;
            
            return { 
                prediction, 
                confidence: clampConfidence(Math.round(confidence * 10) / 10),
                algorithmResults: activeAlgorithms,
                conflict: conflictResolution
            };
        }

        function getRunLength(arr) {
            if (arr.length === 0) return 0;
            const last = arr[arr.length - 1];
            let count = 1;
            for (let i = arr.length - 2; i >= 0; i--) {
                if (arr[i] === last) count++;
                else break;
            }
            return count;
        }

        // ========== DYNAMIC SKIP THRESHOLD ==========
        function getDynamicSkipThreshold() {
            let baseThreshold = 55;
            
            const recentResults = detailedHistory.slice(-15).filter(h => !h.wasSkip);
            if (recentResults.length >= 5) {
                const recentWins = recentResults.filter(r => r.type === 'win').length;
                const winRate = recentWins / recentResults.length;
                
                if (winRate < 0.35) baseThreshold = 45;
                else if (winRate < 0.45) baseThreshold = 50;
                else if (winRate > 0.6) baseThreshold = 63;
                else if (winRate > 0.7) baseThreshold = 68;
            }
            
            const total = wins + losses;
            if (total > 25) {
                const overallWinRate = wins / total;
                if (overallWinRate < 0.42) baseThreshold = Math.max(44, baseThreshold - 6);
                else if (overallWinRate > 0.58) baseThreshold = Math.min(70, baseThreshold + 6);
            }
            
            return Math.min(72, Math.max(42, baseThreshold));
        }

        function shouldSkipPrediction(confidence, algorithmCount, conflict) {
            const dyn = getDynamicSkipThreshold();
            let adj = dyn;
            if (algorithmCount >= 4) adj = Math.max(40, dyn - 8);
            else if (algorithmCount >= 3) adj = Math.max(42, dyn - 4);
            
            if (conflict && conflict.resolution === 'CONFLICT_RESOLVED_BY_CONFIDENCE') {
                adj += 5;
            }
            
            return confidence < adj;
        }

        function finalPrediction() {
            if (sequence.length < MIN_HANDS) return null;
            
            const result = getEnhancedPredictionAndConfidence();
            if (!result || !result.prediction) return null;
            
            const skip = shouldSkipPrediction(result.confidence, result.algorithmResults?.length || 0, result.conflict);
            if (skip) { 
                return { 
                    pred: null, 
                    confidence: result.confidence, 
                    skip: true, 
                    algoResults: result.algorithmResults,
                    conflict: result.conflict
                }; 
            }
            
            return { 
                pred: result.prediction, 
                confidence: result.confidence, 
                skip: false, 
                algoResults: result.algorithmResults,
                conflict: result.conflict
            };
        }

        // ========== UI FUNCTIONS ==========
        function updateHistory() {
            const box = document.getElementById('historyBox');
            const rBox = document.getElementById('resultsBox');
            if (sequence.length === 0) { box.innerHTML = "READY FOR DATA"; rBox.innerHTML = ""; return; }
            box.innerHTML = '';
            sequence.slice(-10).forEach(r => {
                const span = document.createElement('span');
                span.className = r;
                span.textContent = r;
                box.appendChild(span);
            });

            rBox.innerHTML = '';
            const filteredResults = results.filter(r => r === 'W' || r === 'L');
            const last10 = filteredResults.slice(-10);
            last10.forEach(wl => {
                const span = document.createElement('span');
                span.className = wl;
                span.textContent = wl;
                rBox.appendChild(span);
            });
        }

        function updatePredictionBox() {
            const box = document.getElementById('predictionBox');
            const skipNote = document.getElementById('skipNote');
            const algoDetail = document.getElementById('algoDetail');
            const conflictIndicator = document.getElementById('conflictIndicator');

            if (sequence.length < MIN_HANDS) {
                box.innerHTML = `<span style="font-size:clamp(11px,2.5vw,13px); color:#7a8595; letter-spacing:1px;">LOGGING: ${MIN_HANDS-sequence.length} MORE HANDS NEEDED</span>`;
                lastPrediction = null;
                skipNote.textContent = '';
                algoDetail.textContent = '';
                conflictIndicator.textContent = '';
                return;
            }
            
            const result = finalPrediction();
            
            if (result && result.pred) {
                const text = result.pred === 'P' ? 'PLAYER' : 'BANKER';
                const cls = result.pred === 'P' ? 'player' : 'banker';
                box.innerHTML = `NEXT: <span class="${cls}">${text}</span> <span class="confidence">${result.confidence}%</span>`;
                lastPrediction = result.pred;
                skipNote.textContent = '';
                
                if (result.algoResults && result.algoResults.length > 0) {
                    const summary = result.algoResults.map(a => {
                        let name = a.name;
                        if (a.name === 'pattern' && a.matches) {
                            name = `pattern(${a.matches}matches)`;
                        }
                        if (a.name === 'recentBias') {
                            name = 'recentBias(7h)';
                        }
                        return `${name}:${a.prediction}(${Math.round(a.confidence)}%)`;
                    }).join(' ');
                    algoDetail.textContent = `Algorithms: ${summary}`;
                } else {
                    algoDetail.textContent = '';
                }
                
                if (result.conflict) {
                    const c = result.conflict;
                    if (c.resolution === 'STRONG_AGREEMENT') {
                        conflictIndicator.textContent = `✅ ${c.details} (+${c.confidenceModifier}% confidence)`;
                        conflictIndicator.className = 'agreement-indicator';
                    } else if (c.resolution === 'MODERATE_AGREEMENT') {
                        conflictIndicator.textContent = `📊 ${c.details} (+${c.confidenceModifier}% confidence)`;
                        conflictIndicator.className = 'agreement-indicator';
                    } else if (c.resolution === 'UNANIMOUS') {
                        conflictIndicator.textContent = `🎯 ${c.details} (+${c.confidenceModifier}% confidence)`;
                        conflictIndicator.className = 'agreement-indicator';
                    } else if (c.resolution === 'CONFLICT_RESOLVED_BY_CONFIDENCE') {
                        conflictIndicator.textContent = `⚡ ${c.details} (${c.confidenceModifier}% penalty)`;
                        conflictIndicator.className = 'conflict-indicator';
                    } else {
                        conflictIndicator.textContent = '';
                    }
                } else {
                    conflictIndicator.textContent = '';
                }
            } else if (result && result.skip) {
                box.innerHTML = `<span style="font-size:clamp(14px,3vw,16px); color:#db2777;">⏭ SKIP (${result.confidence}%)</span>`;
                lastPrediction = null;
                skipNote.textContent = 'Low confidence — skipping this hand';
                if (result.algoResults && result.algoResults.length > 0) {
                    const summary = result.algoResults.map(a => `${a.name}:${a.prediction}(${Math.round(a.confidence)}%)`).join(' ');
                    algoDetail.textContent = `Algorithms: ${summary}`;
                } else {
                    algoDetail.textContent = '';
                }
                
                if (result.conflict && result.conflict.resolution === 'CONFLICT_RESOLVED_BY_CONFIDENCE') {
                    conflictIndicator.textContent = `⚡ Conflict detected — skipping due to uncertainty`;
                    conflictIndicator.className = 'conflict-indicator';
                } else {
                    conflictIndicator.textContent = '';
                }
            } else {
                box.innerHTML = "<span style='font-size:clamp(14px,3vw,16px); color:#7a8595'>ANALYZING TRENDS...</span>";
                lastPrediction = null;
                skipNote.textContent = '';
                algoDetail.textContent = '';
                conflictIndicator.textContent = '';
            }
            
            updateStatsBar();
        }

        function updateStatsBar() {
            document.getElementById('winCount').textContent = wins;
            document.getElementById('lossCount').textContent = losses;
            const total = wins + losses;
            const winRate = total > 0 ? Math.round((wins / total) * 100) : 0;
            document.getElementById('winRateDisplay').textContent = `WR: ${winRate}%`;
            
            const streak = getRunLength(sequence);
            const last = sequence.length > 0 ? sequence[sequence.length - 1] : null;
            const streakDisplay = document.getElementById('streakDisplay');
            if (last && streak > 0) {
                streakDisplay.textContent = `Streak: ${streak} ${last}`;
                streakDisplay.className = 'streak-indicator ' + (streak >= 3 ? 'win-streak' : '');
            } else {
                streakDisplay.textContent = 'Streak: 0';
                streakDisplay.className = 'streak-indicator';
            }
        }

        // ========== RECORD RESULT, UNDO, RESET ==========
        function recordResult(r) {
            const skipNote = document.getElementById('skipNote');

            if (lastPrediction) {
                const wasWin = (lastPrediction === r);
                results.push(wasWin ? 'W' : 'L');
                if (wasWin) { wins++; detailedHistory.push({ type: 'win', wasSkip: false }); } else { losses++; detailedHistory.push({ type: 'loss', wasSkip: false }); }
                skipNote.textContent = '';
            } else {
                results.push('');
                skips++;
                detailedHistory.push({ type: 'skip', wasSkip: true });
                skipNote.textContent = '⏭ Skipped (no bet placed)';
            }

            sequence.push(r);
            saveAndUpdate();
        }

        function undo() {
            if (sequence.length === 0) return;
            
            sequence.pop();
            const lastResultData = results.pop();
            const lastHistory = detailedHistory.pop();

            if (lastResultData === 'W') wins--;
            else if (lastResultData === 'L') losses--;
            else if (lastResultData === '') skips--;

            saveAndUpdate();
        }

        function resetAll() {
            if (confirm("Reset all data?")) {
                sequence = [];
                results = [];
                lastPrediction = null;
                detailedHistory = [];
                wins = 0; losses = 0; skips = 0;
                conflictData = null;

                saveAndUpdate();
            }
        }

        function saveAndUpdate() {
            localStorage.setItem('bt_sequence', JSON.stringify(sequence));
            localStorage.setItem('bt_results', JSON.stringify(results));
            localStorage.setItem('bt_detailed', JSON.stringify(detailedHistory));
            updateHistory();
            updatePredictionBox();
        }

        // Initial stats if we have data
        if (sequence.length > 0 || results.length > 0) {
            results.forEach(r => { if (r === 'W') wins++; else if (r === 'L') losses++; else if (r === '') skips++; });
        }

        // Initial render
        updateHistory();
        updatePredictionBox();
    </script>
</body>
