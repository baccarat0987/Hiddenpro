<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Roulette VIP PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    
    <!-- ========== ADDED 1: CLEAN URL SCRIPT ========== -->
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <!-- ========== ADDED 2: FIREBASE AUTHENTICATION MODULE ========== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const REQUIRED_ENGINE_ID = "engine_15";

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && 
                           (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                           userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) {
                alert("Access denied: you don't have permission for Roulette VIP PRO (engine_14).");
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>
    
    <!-- ========== ADDED 3: RIGHT-CLICK & SHORTCUT BLOCKER ========== -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) {
                return false;
            }
        };
    </script>
    
    <!-- ========== ADDED 4: EXIT BUTTON STYLES ========== -->

        /* The stadium wrapper: sized dynamically via JS. The inner is scaled to fit. */
        .stadium-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            overflow: hidden;
        }
        /* Design-space container: fixed 1200x420, scaled via CSS transform */
        .stadium-stage {
            position: relative;
            width: 1200px;
            height: 420px;
            transform-origin: center center;
        }
        /* Felt stadium background */
        .stadium-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1140px;
            height: 360px;
            border-radius: 180px;
            overflow: hidden;
        }
        .stadium-bg.evo {
            background: radial-gradient(ellipse at center, #5E1A1A 0%, #3A0C0C 70%, #1E0505 100%);
            box-shadow:
                inset 0 0 90px rgba(0,0,0,0.85),
                0 0 0 4px #7A5528,
                0 0 0 6px #3A2410,
                0 0 40px rgba(0,0,0,0.7);

    // ==================== ENHANCED PREDICTION LOGIC (v2, original show-behavior) ====================
    function analiz() {
        // ---- 0. HIT/MISS FEEDBACK ----
        if (lastPrediction && lastPredictionGroups.length > 0 && groupHistory.length > 0) {
            const evalWindow = groupHistory.slice(-lastPredictionGroups.length);
            const hit = evalWindow.some(g => g === lastPrediction);
            if (hit) hitCount++;
            else missCount++;
            lastPrediction = null;
            lastPredictionGroups = [];
        }

        // ---- 1. EMPTY GUARD ----
        if (groupHistory.length === 0) {
            mainPredictionSpan.innerText = "———";
            alternativesContainer.innerHTML = `
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
            `;
            return;
        }

        // ---- 2. NORMALIZE GROUP KEYS ----
        const norm = (g) => g.split('-').map(Number).sort((a, b) => a - b).join('-');
        const normalizedHistory = groupHistory.map(norm);

        // ---- 3. WEIGHTED FREQUENCY WITH EXPONENTIAL RECENCY DECAY ----
        const startIdx = Math.max(0, normalizedHistory.length - 20);
        const lastGroups = normalizedHistory.slice(startIdx);
        const DECAY = 0.85;

        const freqMap = new Map();
        lastGroups.forEach((g, idx) => {
            const age = lastGroups.length - 1 - idx;
            const weight = Math.pow(DECAY, age);
            freqMap.set(g, (freqMap.get(g) || 0) + weight);
        });

        // ---- 4. PATTERN MATCH WITH COUNT + RECENCY DECAY ----
        if (normalizedHistory.length >= 4) {
            const lastThree = normalizedHistory.slice(-3).join(',');
            const patternHits = [];

            for (let i = 0; i <= normalizedHistory.length - 4; i++) {
                const pattern = normalizedHistory.slice(i, i + 3).join(',');
                if (pattern === lastThree) {
                    const nextGroup = normalizedHistory[i + 3];
                    const distFromEnd = normalizedHistory.length - (i + 3);
                    patternHits.push({ nextGroup, distFromEnd });
                }
            }

            const totalEval = hitCount + missCount;
            const hitRateScale = totalEval >= 3 ? (0.5 + 0.5 * (hitCount / totalEval)) : 1.0;

            for (const { nextGroup, distFromEnd } of patternHits) {
                const decay = Math.pow(0.9, distFromEnd);
                const boost = 4 * decay * hitRateScale;
                freqMap.set(nextGroup, (freqMap.get(nextGroup) || 0) + boost);
            }
        }

        // ---- 5. SORT BY SCORE (stable tie-break) ----
        const sorted = Array.from(freqMap.entries()).sort((a, b) => {
            if (b[1] !== a[1]) return b[1] - a[1];
            return a[0].localeCompare(b[0]);
        });

        // ---- 6. DEDUPLICATE ALTERNATIVES BY NUMBER OVERLAP ----
        const selected = [];
        const selectedNums = [];
        for (const [grp, score] of sorted) {
            const nums = grp.split('-').map(Number);
            const overlap = nums.filter(n => selectedNums.includes(n)).length;
            if (overlap >= 2) continue;
            selected.push([grp, score]);
            selectedNums.push(...nums);
            if (selected.length === 5) break;
        }

        // ---- 7. MAIN PREDICTION (always show top) ----
        if (selected.length === 0) {
            mainPredictionSpan.innerText = "———";

            mainPredictionSpan.innerText = selected[0][0];
            lastPrediction = selected[0][0];
            lastPredictionGroups = [selected[0][0]];

        // ---- 8. RENDER ALTERNATIVES ----

        for (let i = 0; i < 5; i++) {
            const groupValue = (i < selected.length) ? selected[i][0] : '———';
            const row = document.createElement('div');
            row.className = 'alt-row';
            row.innerText = groupValue;
            alternativesContainer.appendChild(row);
        }
    }

    // ---- Stadium geometry helper ----
    // Given a stadium width W, height H, and N tiles:
    // Returns an array of {x, y, angle} for tile centers along the perimeter,
    // walking clockwise starting from the top-left of the top straight section.
    function computeStadiumPositions(W, H, N) {
        // The tiles sit on a ring centered on the stadium perimeter.
        // Ring is offset outward from the inner oval by a fixed margin.
        const rectW = W - H;      // width of the straight section
        const rectH = 0;          // pure stadium: straight sections are horizontal only
        const radius = H / 2;     // end cap radius

        // Perimeter = 2*straight + pi*H
        const straightLen = rectW;
        const capLen = Math.PI * radius;
        const totalPerim = 2 * straightLen + 2 * capLen;

        const step = totalPerim / N;
        const positions = [];

        // Starting point: top-left corner of the top straight, moving right (clockwise).
        // We'll walk the perimeter and produce {x,y} in local coords (origin top-left).

        // Center line of the ring is at:
        //   top straight: y = radius (outer ring, top edge)
        //   bottom straight: y = H - radius (outer ring, bottom edge)
        // Actually, the ring is on the OUTER edge of the stadium:
        //   top tiles centered on y = radius, offset so their outer edge is at y=0.
        // We'll use center-of-stadium coordinates for smooth math.

        const cx = W / 2;
        const cy = H / 2;
        const rx = W / 2 - radius * 0.15; // slight inward from outer edge
        const ry = H / 2 - radius * 0.15;

        // --- Simpler approach: parametrize by walking segments ---
        // Segment order (clockwise starting at top-left corner of top straight):
        //  1. Top straight: from (x=radius, y=0) to (x=W-radius, y=0)
        //  2. Right cap: arc from angle -90° to +90° (going clockwise visually)
        //  3. Bottom straight: from (x=W-radius, y=H) to (x=radius, y=H)
        //  4. Left cap: arc from angle +90° to +270°

        // We want tiles centered on a ring that sits on the OUTER edge, i.e., 
        // tile center is at radius offset inward from the outer edge.
        // Tile "center ring" radius = radius (end cap) minus half tile diagonal? 
        // For 1:1 look, keep tiles on the outer edge; their centers on the ring.
        const tileCenterOffset = 0; // 0 = exactly on outer edge

        // Coordinates for the center ring:
        //  Top straight: y = tileCenterOffset
        //  Right cap center: (W - radius, radius)
        //  Bottom straight: y = H - tileCenterOffset
        //  Left cap center: (radius, radius)

        // Perimeter walk
        let t = 0;
        for (let i = 0; i < N; i++) {
            const dist = i * step + step / 2; // midpoint of each tile's slot
            let x, y, angle;

            if (dist < straightLen) {
                // Top straight, moving right
                x = radius + dist;
                y = tileCenterOffset;
                angle = 0;
            } else if (dist < straightLen + capLen) {
                // Right cap, sweeping from -90° to +90° (clockwise visual)
                const capT = (dist - straightLen) / capLen;
                const theta = -Math.PI / 2 + capT * Math.PI; // -90° → +90°
                x = (W - radius) + radius * Math.cos(theta);
                y = radius + radius * Math.sin(theta);
                angle = theta + Math.PI / 2; // tile radial
            } else if (dist < 2 * straightLen + capLen) {
                // Bottom straight, moving left
                const s = dist - (straightLen + capLen);
                x = (W - radius) - s;
                y = H - tileCenterOffset;
                angle = 0;
            } else {
                // Left cap, sweeping from +90° to +270°
                const capT = (dist - (2 * straightLen + capLen)) / capLen;
                const theta = Math.PI / 2 + capT * Math.PI;
                x = radius + radius * Math.cos(theta);
                y = radius + radius * Math.sin(theta);
                angle = theta + Math.PI / 2;
            }
            positions.push({ x, y, angle });
        }
        return positions;
    }

    function closePickerAndStart() {
        const picker = document.getElementById('providerPickerOverlay');
        if (picker) picker.remove();
        showWheelOverlay();
    }

    // ==================== WHEEL OVERLAY (STADIUM TRACK) ====================
    function showWheelOverlay() {
        if (!chosenProvider) return;
        if (overlayVisible) return;
        if (spinHistory.length < 5) return;
        const mainPredRaw = mainPredictionSpan.innerText;
        if (!mainPredRaw || mainPredRaw === '———') return;

        const numbersInGroup = mainPredRaw.split('-').map(Number).filter(n => !isNaN(n) && n >= 0 && n <= 36);
        if (numbersInGroup.length === 0) return;

        // Compute highlight indices using PHYSICAL wheel neighbors (not visual positions)
        const centerIndices = [];
        const neighborIndicesSet = new Set();
        numbersInGroup.forEach(num => {
            const idx = wheelNumbers.indexOf(num);
            if (idx !== -1) {
                centerIndices.push(num);
                for (let offset = -2; offset <= 2; offset++) {
                    if (offset === 0) continue;
                    const neighborIdx = (idx + offset + wheelNumbers.length) % wheelNumbers.length;
                    neighborIndicesSet.add(wheelNumbers[neighborIdx]);
                }
            }
        });

        const overlay = document.createElement('div');
        overlay.className = 'wheel-overlay';

        const containerDiv = document.createElement('div');
        containerDiv.className = 'wheel-container';

        const closeBtn = document.createElement('div');
        closeBtn.className = 'close-wheel-btn';
        closeBtn.innerHTML = '✕';
        closeBtn.addEventListener('click', () => {
            overlay.remove();
            overlayVisible = false;
        });

        const title = document.createElement('div');
        title.className = 'wheel-title';
        const providerLabel = chosenProvider === 'evolution' ? 'EVOLUTION' : 'PRAGMATIC';
        title.innerText = `${providerLabel} • PREDICTION: ${mainPredRaw}`;

        // Stadium wrapper (dynamic size based on viewport)
        const wrap = document.createElement('div');
        wrap.className = 'stadium-wrap';

        const stage = document.createElement('div');
        stage.className = 'stadium-stage';

        // Felt background (design space)
        const bg = document.createElement('div');
        bg.className = 'stadium-bg ' + (chosenProvider === 'evolution' ? 'evo' : 'prag');
        stage.appendChild(bg);

        // Inner window
        const inner = document.createElement('div');
        inner.className = 'stadium-inner';
        stage.appendChild(inner);

        // Design space dimensions (match CSS .stadium-stage)
        const DS_W = 1200;
        const DS_H = 420;

        // Stadium geometry inside the design space
        const bgW = 1140;
        const bgH = 360;
        const bgLeft = (DS_W - bgW) / 2;
        const bgTop = (DS_H - bgH) / 2;

        // Tile geometry
        const order = chosenProvider === 'evolution' ? trackOrderEvolution : trackOrderPragmatic;
        const N = order.length;

        // Compute positions along the stadium perimeter.
        // Local coordinates of the bg stadium (origin top-left of the bg).
        const localPositions = computeStadiumPositions(bgW, bgH, N);

        // Tile dimensions (design space)
        const tileW = 32;
        const tileH = 50;
        const fontSize = 20;

        // Offset each local position into design-space coordinates
        // (add bgLeft / bgTop).
        // Then adjust the visual direction so 0 lands at the correct place.

        // We need to shift the array so that "0" (which is at index 0 in `order`)
        // lands at the correct visual position for the chosen provider:
        //   Evolution: right end, slightly below middle → roughly 8% past top-right corner
        //   Pragmatic: left end, slightly above middle → roughly 58% past top-left corner
        // (Percentages measured clockwise along the perimeter from top-left.)

        // Compute the tile positions array, then rotate the tile-mapping so that
        // order[i] is placed at positions[rotatedIndex(i)].

        const positions = localPositions.map(p => ({
            x: p.x + bgLeft,
            y: p.y + bgTop,
            angle: p.angle
        }));

        // The perimeter walk starts at top-left, going clockwise.
        // Find the index on the ring that corresponds to the provider's 0 tile.
        // Evolution: 0 is on the RIGHT cap, just below the horizontal midline.
        //   On the right cap, theta runs -90° (top) → +90° (bottom).
        //   "Below middle" ≈ theta = +30°, i.e., capT ≈ (30 + 90) / 180 = 0.67 of cap.
        //   Distance along perimeter: straightLen + capLen * 0.67
        // Pragmatic: 0 is on the LEFT cap, just above the horizontal midline.
        //   On the left cap, theta runs +90° → +270°.
        //   "Above middle" ≈ theta = 240° (equivalently -120°), i.e., capT ≈ (240 - 90) / 180 = 0.83 of cap.
        //   Distance along perimeter: 2*straightLen + capLen + capLen * 0.83

        const straightLen = bgW - bgH;
        const capLen = Math.PI * (bgH / 2);
        const totalPerim = 2 * straightLen + 2 * capLen;
        const step = totalPerim / N;

        let zeroDistFromStart;
        if (chosenProvider === 'evolution') {
            zeroDistFromStart = straightLen + capLen * 0.67;
        } else {
            zeroDistFromStart = 2 * straightLen + capLen + capLen * 0.83;
        }
        const zeroIndex = Math.round(zeroDistFromStart / step) % N;

        // Now assign order[i] to positions[(zeroIndex + i) % N]
        for (let i = 0; i < N; i++) {
            const posIndex = (zeroIndex + i) % N;
            const p = positions[posIndex];
            const num = order[i];

            const tile = document.createElement('div');
            tile.className = 'oval-tile';
            tile.textContent = num;
            if (num === 0) tile.classList.add('green');
            else if (redSet.has(num)) tile.classList.add('red');
            else tile.classList.add('black');

            // Highlight logic
            if (centerIndices.includes(num)) tile.classList.add('center');
            else if (neighborIndicesSet.has(num)) tile.classList.add('neighbor');

            tile.style.width = tileW + 'px';
            tile.style.height = tileH + 'px';
            tile.style.left = (p.x - tileW / 2) + 'px';
            tile.style.top = (p.y - tileH / 2) + 'px';
            tile.style.fontSize = fontSize + 'px';
            tile.style.transform = `rotate(${p.angle}rad)`;

            stage.appendChild(tile);
        }

        wrap.appendChild(stage);

        const note = document.createElement('div');
        note.className = 'wheel-note';
        note.innerHTML = '💗 <strong style="color:#FF69B4">PINK</strong> = Predicted &nbsp; 💛 <strong style="color:#FFD966">Yellow</strong> = ±2 Physical Neighbors';

        containerDiv.appendChild(closeBtn);
        containerDiv.appendChild(title);
        containerDiv.appendChild(wrap);
        containerDiv.appendChild(note);
        overlay.appendChild(containerDiv);
        document.body.appendChild(overlay);
        overlayVisible = true;

        // ---- Auto-scale the design stage to fit viewport ----
        function applyScale() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            // Reserve room for container padding, title, note, close button.
            const availW = Math.min(vw - 60, 1400);
            const availH = Math.max(200, vh - 200);

            const scaleW = availW / DS_W;
            const scaleH = availH / DS_H;
            let scale = Math.min(scaleW, scaleH);

            // Cap max up-scaling so 4K screens don't get an absurdly huge wheel.
            scale = Math.min(scale, 1.25);
            // Floor min scale so it never gets unreadably tiny.
            scale = Math.max(scale, 0.28);

            stage.style.transform = `scale(${scale})`;

            // Shrink the wrapper to the scaled size so layout doesn't leave empty space
            const scaledW = DS_W * scale;
            const scaledH = DS_H * scale;
            wrap.style.width = scaledW + 'px';
            wrap.style.height = scaledH + 'px';
        }

        applyScale();

        const onResize = () => applyScale();
        window.addEventListener('resize', onResize);

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                window.removeEventListener('resize', onResize);
                overlay.remove();
                overlayVisible = false;
            }
        });
        closeBtn.addEventListener('click', () => {
            window.removeEventListener('resize', onResize);
            overlay.remove();
            overlayVisible = false;
        });
    }

    // ==================== UI REFRESH ====================
    function scrollToTop(container) {
        if (container) container.scrollTop = 0;
    }

    function refreshUI() {
        spinContainer.innerHTML = '';
        [...spinHistory].reverse().forEach(spin => {
            const item = document.createElement('div');
            item.className = 'spin-item';
            item.innerText = spin;
            spinContainer.appendChild(item);
        });
        spinCountSpan.innerText = spinHistory.length;
        scrollToTop(spinContainer);
        
        groupContainer.innerHTML = '';
        groupHistory.forEach(grp => {
            const gItem = document.createElement('div');
            gItem.className = 'group-item';
            gItem.innerText = grp;
            groupContainer.appendChild(gItem);
        });
        groupCountSpan.innerText = groupHistory.length;
        if (groupContainer) groupContainer.scrollTop = groupContainer.scrollHeight;
        
        analiz();
        showWheelOverlay();
    }

    // ==================== ADD SPIN ====================
    function addSpin(number) {
        spinHistory.push(number);
        
        const groups = groupsPerNumber[number];
        if (groups && groups.length) {
            for (let g of groups) {
                groupHistory.push(g);
            }
        } else {
            groupHistory.push(`ERR-${number}`);
        }
        
        refreshUI();
        
        const spinItems = spinContainer.querySelectorAll('.spin-item');
        if (spinItems.length > 0) {
            spinItems[0].classList.add('spin-item-new');
            setTimeout(() => spinItems[0].classList.remove('spin-item-new'), 450);
        }
        
        predBox.classList.add('prediction-flash');
        setTimeout(() => predBox.classList.remove('prediction-flash'), 250);
    }

    // ==================== RESET FUNCTIONS ====================
    function hardResetFullReload() {
        window.location.reload();
    }

    // ==================== BUILD NUMBER PAD ====================
    function buildNumberPad() {
        numbersGrid.innerHTML = '';
        const redNumbers = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
        
        for (let i = 1; i <= 36; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.className = 'num-btn';
            if (redNumbers.has(i)) {
                btn.classList.add('red-num');
            } else {
                btn.classList.add('black-num');
            }
            btn.addEventListener('click', (function(val) { 
                return () => {
                    btn.classList.add('btn-flash');
                    setTimeout(() => btn.classList.remove('btn-flash'), 120);
                    addSpin(val);
                };
            })(i));
            numbersGrid.appendChild(btn);
        }
    }

    // ==================== INTERNAL REFRESH ====================
    function triggerInternalRefresh() {
        if (!appContainer) return;
        appContainer.classList.remove('internal-refresh-active');
        void appContainer.offsetWidth;
        appContainer.classList.add('internal-refresh-active');
        setTimeout(() => {
            if (appContainer) appContainer.classList.remove('internal-refresh-active');
        }, 280);
    }

    function setupInternalRefresh() {
        document.body.addEventListener('click', (e) => {
            const resetBtn = document.getElementById('clearAllBtn');
            if (resetBtn && (e.target === resetBtn || resetBtn.contains(e.target))) {
                return;
            }
            triggerInternalRefresh();
        });
    }

    // ==================== EVENT LISTENERS ====================
    zeroButton.addEventListener('click', () => {
        zeroButton.classList.add('zero-flash');
        setTimeout(() => zeroButton.classList.remove('zero-flash'), 120);
        addSpin(0);
    });

    clearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        hardResetFullReload();
    });

    // ==================== INITIALIZATION ====================
    buildNumberPad();
    
    spinHistory = [];
    groupHistory = [];
    refreshUI();
    mainPredictionSpan.innerText = "———";
    
    setupInternalRefresh();

    // Show provider picker on every load (Option 1)
    setTimeout(() => {
        showProviderPicker();
    }, 120);
</script>
