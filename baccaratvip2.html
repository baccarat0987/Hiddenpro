<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Baccarat VIP Plus · AI</title>

    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const REQUIRED_ENGINE_ID = "engine_18";

        window.signOutUser = function() {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                window.location.href = "index.html";
            });
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && 
                           (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                           userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) {
                alert("Access denied: you don't have permission for Baccarat VIP Plus.");
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.onkeydown = function(e) {
            if (
                e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83)) ||
                (e.ctrlKey && e.shiftKey && e.keyCode === 85)
            ) {
                e.preventDefault();
                return false;
            }
        };

        setInterval(function() {
            (function() { return false; }['constructor']('debugger')['call']());
        }, 50);

        if (typeof console !== "undefined") {
            console.log = console.debug = console.info = console.warn = console.error = function() {};
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        :root {
            --bg-body: #ffffff;
            --container-bg: #f8fafc;
            --surface: #f0f3f7;
            --surface-2: #e8ecf2;
            --line: rgba(0, 0, 0, 0.07);
            --line-soft: rgba(0, 0, 0, 0.04);
            --text: #2d3748;
            --text-muted: #6b7a8f;
            --violet: #7c3aed;
            --violet-dim: rgba(124, 58, 237, 0.25);
            --darkblue: #1e3a8a;
            --darkblue-dim: rgba(30, 58, 138, 0.25);
            --redpink: #db2777;
            --redpink-dim: rgba(219, 39, 119, 0.25);
            --win: #4a9a6a;
            --loss: #8a97a4;
            --player: #7c3aed;
            --banker: #db2777;
        }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            font-size: 16px;
            background: var(--bg-body);
            display: none;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .wrap {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .exit-nav {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 2000;
        }
        .exit-btn {
            background: rgba(0, 0, 0, 0.7);
            color: #db2777;
            padding: 8px 16px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 700;
            font-size: 11px;
            border: 1px solid rgba(219, 39, 119, 0.5);
            backdrop-filter: blur(8px);
            transition: 0.2s;
            font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            cursor: pointer;
            border: none;
        }
        .exit-btn:hover {
            background: #db2777;
            color: #ffffff;
            box-shadow: 0 0 12px #db2777;
        }

            background-color: var(--container-bg);

            to { opacity: 1; transform: translateY(0) scale(1); }

        @media (prefers-reduced-motion:reduce) {

        }

            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }
        .header h1 {
            font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
            font-size: clamp(20px, 4.8vw, 26px);
            font-weight: 700;
            letter-spacing: 1.5px;
            margin: 0;
            text-align: center;
        }
        .title-violet {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(124, 58, 237, 0.4), 0 0 60px rgba(124, 58, 237, 0.2);
        }
        .title-darkblue {
            background: linear-gradient(135deg, #1e3a8a, #1e40af);

            -webkit-text-fill-color: transparent;

        .ai-container {
            position: absolute;
            right: -8px;
            top: -8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #7c3aed, #1e3a8a, #db2777);
            border-radius: 6px;

            animation: pulseGlowContainer 2.5s ease-in-out infinite;
            border: 1px solid rgba(255, 255, 255, 0.15);

        .ai-container .ai-text {
            font-size: clamp(9px, 1.6vw, 12px);
            font-weight: 800;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.3px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);

            0%,100% { box-shadow: 0 0 20px rgba(124, 58, 237, 0.4), 0 0 40px rgba(219, 39, 119, 0.2); }

            letter-spacing: 2px;

            min-height: 34px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 4px;

        .prediction .player {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .prediction .banker {
            background: linear-gradient(135deg, #db2777, #be185d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .confidence {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            background: linear-gradient(135deg, #7c3aed, #1e3a8a, #db2777);

            padding: 16px 10px;

            font-weight: 700;

        #playerBtn {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);

            0%,100% { box-shadow: 0 0 20px rgba(124, 58, 237, 0.3), 0 0 40px rgba(124, 58, 237, 0.1); }
            50% { box-shadow: 0 0 30px rgba(124, 58, 237, 0.6), 0 0 60px rgba(124, 58, 237, 0.3); }
        }
        @keyframes glowPulseRedpink {
            0%,100% { box-shadow: 0 0 20px rgba(219, 39, 119, 0.3), 0 0 40px rgba(219, 39, 119, 0.1); }

        .buttons button:active { transform: scale(0.96); filter: brightness(0.93); }

        .buttons button:disabled,
        .buttons button.disabled {
            cursor: not-allowed !important;
            filter: grayscale(0.85) brightness(0.85) !important;

            animation: none !important;
            box-shadow: none !important;

            pointer-events: none !important;

            font-size: 11px;
            background: #e4e9f0;
            color: #3a4555;
            font-weight: 600;
            border: 1px solid var(--line-soft);
            letter-spacing: 0.5px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(124, 58, 237, 0.1);
            transition: box-shadow 0.3s ease;
        }
        .util-btns button:hover {
            filter: none;
            border-color: var(--line);
            color: var(--text);
            background: #d5dce6;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.2);
        }

        #resetBtn.blink-reset {
            animation: resetBlink 1.2s ease-in-out infinite !important;
            font-weight: 800 !important;
            color: #ffffff !important;
            border-color: transparent !important;
        }

        @keyframes resetBlink {
            0% {
                background: #7c3aed;
                color: #ffffff;
                border-color: #7c3aed;
                box-shadow: 0 0 16px rgba(124, 58, 237, 0.75), 0 0 32px rgba(124, 58, 237, 0.35);
                transform: scale(1);
            }
            33% {
                background: #1e3a8a;
                color: #ffffff;
                border-color: #1e3a8a;
                box-shadow: 0 0 16px rgba(30, 58, 138, 0.75), 0 0 32px rgba(30, 58, 138, 0.35);
                transform: scale(1.04);
            }
            66% {
                background: #db2777;
                color: #ffffff;
                border-color: #db2777;
                box-shadow: 0 0 16px rgba(219, 39, 119, 0.75), 0 0 32px rgba(219, 39, 119, 0.35);

            }
            100% {
                background: #7c3aed;
                color: #ffffff;
                border-color: #7c3aed;
                box-shadow: 0 0 16px rgba(124, 58, 237, 0.75), 0 0 32px rgba(124, 58, 237, 0.35);
                transform: scale(1);
            }
        }

        #resetBtn:disabled,
        #resetBtn.disabled {
            opacity: 1 !important;
            filter: none !important;
            cursor: pointer !important;
            pointer-events: auto !important;
        }

        .container { background-color: #f8fafc; }
        .prediction { background: #f0f3f7; }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            font-size: 10px;
            color: var(--text-muted);
            margin: 6px 0 10px 0;
            padding: 4px 0;
            border-top: 1px solid var(--line-soft);
            border-bottom: 1px solid var(--line-soft);
        }
        .stats-bar span {
            font-weight: 600;
        }
        .stats-bar .win-rate {
            color: var(--win);
        }
        .stats-bar .loss-rate {
            color: var(--loss);
        }
        
        .streak-indicator {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 10px;
            margin-top: 4px;
        }
        .streak-indicator.win-streak {
            background: rgba(74, 154, 106, 0.15);
            color: var(--win);
        }
        .streak-indicator.loss-streak {
            background: rgba(219, 39, 119, 0.1);
            color: #db2777;
        }
        
        .hidden {
            display: none !important;
        }

        .elo-sharp-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e8ecf2;
            border-radius: 12px;
            padding: 8px 16px;
            margin: 6px 0 4px 0;
            border: 1px solid var(--line-soft);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: #2d3748;
        }
        .elo-sharp-bar .metric {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .elo-sharp-bar .metric .label {
            color: #6b7a8f;
            font-weight: 500;
        }
        .elo-sharp-bar .metric .value {
            font-family: 'Courier New', monospace;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 8px;
            background: #ffffff;
            border: 1px solid rgba(0,0,0,0.05);
            min-width: 48px;
            text-align: center;
        }
        .elo-sharp-bar .metric .value.elo {
            color: #7c3aed;
        }
        .elo-sharp-bar .metric .value.sharp {
            color: #db2777;
        }
        .elo-sharp-bar .metric .value.sharp.high {
            color: #1e3a8a;
            text-shadow: 0 0 10px rgba(30,58,138,0.3);
        }
        .elo-sharp-bar .metric .value.elo.high {
            color: #6d28d9;
            text-shadow: 0 0 10px rgba(124,58,237,0.4);
        }

            font-size: 9px;
            font-weight: 600;
            opacity: 0.7;
        }
        .elo-sharp-bar .metric .delta.pos { color: #4a9a6a; }
        .elo-sharp-bar .metric .delta.neg { color: #db2777; }
    </style>
</head>
<body>

    <div class="exit-nav">
        <button onclick="window.signOutUser()" class="exit-btn">✕ EXIT</button>
    </div>

    <div class="wrap">
        <div class="container">
            <div class="header">
                <h1>
                    <span class="title-violet">Baccarat</span>
                    <span class="title-darkblue">VIP</span>
                    <span class="title-redpink">Plus</span>
                </h1>
                <div class="ai-container">
                    <span class="ai-text">AI</span>
                </div>
            </div>
            <div class="tag" style="text-align:center; color:var(--text-muted); font-size:11px; letter-spacing:2px; margin-bottom:18px; opacity:0.7;">Results are insights, not Guarantees</div>

            <div class="sequence" id="historyBox">READY FOR DATA</div>
            <div class="results" id="resultsBox"></div>
            
            <div class="stats-bar" id="statsBar">
                <span>W: <strong id="winCount">0</strong></span>
                <span>L: <strong id="lossCount">0</strong></span>
                <span class="win-rate" id="winRateDisplay">WR: 0%</span>
                <span id="streakDisplay">Streak: 0</span>
            </div>

            <div class="elo-sharp-bar" id="eloSharpBar">
                <div class="metric">
                    <span class="label">ELO</span>
                    <span class="value elo" id="eloValue">1200</span>
                    <span class="delta" id="eloDelta"></span>
                </div>
                <div class="metric">
                    <span class="label">SHARP</span>
                    <span class="value sharp" id="sharpValue">0.00</span>
                    <span class="delta" id="sharpDelta"></span>
                </div>
            </div>

            <div class="prediction" id="predictionBox">
                <span>INITIALIZING...</span>
            </div>

            <div class="buttons">
                <button onclick="recordResult('P')" id="playerBtn">PLAYER</button>
                <button onclick="recordResult('B')" id="bankerBtn">BANKER</button>
                <div class="util-btns">
                    <button onclick="undo()" id="undoBtn">UNDO LAST</button>
                    <button onclick="resetAll()" id="resetBtn">RESET SHOE</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
           SHARP + LOW-SKIP ENGINE with integrated ELO & Sharpness
           ========================================================= */

        let sequence = JSON.parse(localStorage.getItem('bt_sequence')) || [];
        let results = JSON.parse(localStorage.getItem('bt_results')) || [];
        let lastPrediction = null;
        let lastPredictionConfidence = 0;
        let detailedHistory = JSON.parse(localStorage.getItem('bt_detailed')) || [];
        let wins = 0, losses = 0, skips = 0;
        const MIN_HANDS = 10;
        const MAX_RECENT = 10;

        // ========== REAL ACCURACY TRACKING ==========
        let predictionHistory = JSON.parse(localStorage.getItem('bt_prediction_history')) || [];
        let patternAccuracy = { P: { correct: 0, total: 0 }, B: { correct: 0, total: 0 } };
        let overallAccuracy = { correct: 0, total: 0 };

        // ========== ELO & SHARPNESS STATE (persisted) ==========
        let eloRating = parseFloat(localStorage.getItem('bt_elo_rating')) || 1200;
        let sharpness = parseFloat(localStorage.getItem('bt_sharpness')) || 0.0;
        let lastEloChange = parseFloat(localStorage.getItem('bt_last_elo_change')) || 0;
        let lastSharpChange = parseFloat(localStorage.getItem('bt_last_sharp_change')) || 0;

        // ELO K-factor: adaptive based on total predictions
        function getKFactor() {
            const total = overallAccuracy.total;
            if (total < 20) return 32;
            if (total < 50) return 24;
            if (total < 100) return 16;
            return 12;
        }

        // ========== ELO UPDATE ==========
        function updateElo(wasCorrect, confidence) {
            const K = getKFactor();
            const opponentElo = 1200;
            const expectedScore = 1 / (1 + Math.pow(10, (opponentElo - eloRating) / 400));
            const actualScore = wasCorrect ? 1 : 0;
            const confidenceFactor = confidence ? (confidence / 100) * 1.2 + 0.4 : 1.0;
            const delta = K * confidenceFactor * (actualScore - expectedScore);
            eloRating = Math.max(800, Math.min(2200, eloRating + delta));
            return delta;
        }

        // ========== SHARPNESS UPDATE ==========
        function updateSharpness(wasCorrect, confidence) {
            if (confidence === undefined || confidence === null) return 0;
            const confNorm = confidence / 100;
            let delta = 0;
            if (wasCorrect) {
                delta = confNorm * 0.04;
            } else {
                delta = -confNorm * 0.06;
            }
            const decay = (0.5 - sharpness) * 0.005;
            delta += decay;
            sharpness = Math.max(0.0, Math.min(1.0, sharpness + delta));
            return delta;
        }

        // Bootstrap sharpness from historical accuracy
        if (predictionHistory.length > 5 && sharpness === 0.0) {
            const acc = overallAccuracy.total > 0 ? overallAccuracy.correct / overallAccuracy.total : 0.5;
            sharpness = Math.max(0.1, Math.min(0.9, acc * 0.8 + 0.1));
            localStorage.setItem('bt_sharpness', sharpness.toFixed(4));
        }

        if (predictionHistory.length > 0) {
            predictionHistory.forEach(p => {
                if (p.prediction === 'P') {
                    patternAccuracy.P.total++;
                    if (p.correct) patternAccuracy.P.correct++;
                } else if (p.prediction === 'B') {
                    patternAccuracy.B.total++;
                    if (p.correct) patternAccuracy.B.correct++;
                }
                overallAccuracy.total++;
                if (p.correct) overallAccuracy.correct++;
            });
        }

        function clampConfidence(raw) { return Math.min(96, Math.max(0, Math.round(raw))); }
        function oppositeSide(side) { return side === 'P' ? 'B' : 'P'; }

        // ========== CHANGE TABLE ==========
        function checkChangeTable() {
            const window9 = results.slice(-9);
            const nonSkip = window9.filter(r => r === 'W' || r === 'L');
            const skipped = window9.filter(r => r === '').length;

            if (nonSkip.length < 7) return { show: false, reason: '', wins: 0, losses: 0, winRate: 0 };

            const winsCount = nonSkip.filter(r => r === 'W').length;
            const lossesCount = nonSkip.filter(r => r === 'L').length;
            const total = winsCount + lossesCount;
            const winRate = winsCount / total;
            const lossDiff = lossesCount - winsCount;

            if (lossDiff >= 2 && skipped <= 2) {
                return {
                    show: true,
                    reason: 'CHANGE TABLE',
                    wins: winsCount,
                    losses: lossesCount,
                    winRate: Math.round(winRate * 100),
                    lossDiff: lossDiff
                };
            }
            return {
                show: false,
                reason: '',
                wins: winsCount,
                losses: lossesCount,
                winRate: Math.round(winRate * 100),
                lossDiff: lossDiff
            };
        }

        // ========== PATTERN DETECTORS ==========
        function detectPatterns() {
            if (sequence.length < 4) return null;

            const patterns = {};
            const maxLen = Math.min(8, sequence.length - 1);

            for (let len = 2; len <= maxLen; len++) {
                const pattern = sequence.slice(-len).join('');
                const occurrences = [];

                for (let i = 0; i <= sequence.length - len - 1; i++) {
                    const current = sequence.slice(i, i + len).join('');
                    if (current === pattern && i + len < sequence.length) {
                        occurrences.push(sequence[i + len]);
                    }
                }

                if (occurrences.length >= 1) {
                    const pCount = occurrences.filter(o => o === 'P').length;
                    const bCount = occurrences.length - pCount;
                    const confidence = occurrences.length === 1
                        ? 55
                        : (Math.max(pCount, bCount) / occurrences.length) * 100;
                    const prediction = pCount >= bCount ? 'P' : 'B';
                    const weight = len * occurrences.length;

                    if (!patterns[prediction] || patterns[prediction].weight < weight) {
                        patterns[prediction] = { confidence, weight, matches: occurrences.length };
                    }
                }
            }

            if (Object.keys(patterns).length === 0) return null;

            let best = null, bestScore = 0;
            for (const [side, data] of Object.entries(patterns)) {
                const score = data.confidence * (data.weight / 10);
                if (score > bestScore) {
                    bestScore = score;
                    best = { prediction: side, confidence: data.confidence, matches: data.matches };
                }
            }
            return best;
        }

        function detectStreakBias() {
            if (sequence.length < 2) return null;
            const last = sequence[sequence.length - 1];
            let streakLength = 1;
            for (let i = sequence.length - 2; i >= 0; i--) {
                if (sequence[i] === last) streakLength++;
                else break;
            }

            const window = sequence.slice(-12);
            let streakData = { P: { continue: 0, break: 0 }, B: { continue: 0, break: 0 } };
            for (let i = 1; i < window.length; i++) {
                if (window[i] === window[i - 1]) streakData[window[i - 1]].continue++;
                else streakData[window[i - 1]].break++;
            }

            const side = last;
            const total = streakData[side].continue + streakData[side].break;
            if (total >= 1) {
                const continueRate = streakData[side].continue / total;
                if (streakLength >= 2 && continueRate > 0.52) {
                    const confidence = Math.min(80, 55 + (continueRate - 0.5) * 120 + streakLength * 2);
                    return { prediction: side, confidence: clampConfidence(confidence), type: 'streak_continue' };
                }
                if (streakLength >= 2 && continueRate < 0.48) {
                    const confidence = Math.min(80, 55 + (0.5 - continueRate) * 120 + streakLength * 2);
                    return { prediction: oppositeSide(side), confidence: clampConfidence(confidence), type: 'streak_break' };
                }
            }
            return null;
        }

        function detectZigzagBias() {
            if (sequence.length < 4) return null;

            const rates = [];
            for (const win of [5, 7, 10, 14]) {
                if (sequence.length < win + 1) continue;
                const seg = sequence.slice(-win - 1);
                let alt = 0;
                for (let i = 0; i < seg.length - 1; i++) {
                    if (seg[i] !== seg[i + 1]) alt++;
                }
                rates.push(alt / (seg.length - 1));
            }
            if (rates.length === 0) return null;

            const avgRate = rates.reduce((a, b) => a + b, 0) / rates.length;

            if (avgRate > 0.62) {
                const confidence = 55 + (avgRate - 0.5) * 90;
                return { prediction: oppositeSide(sequence[sequence.length - 1]), confidence: clampConfidence(confidence), type: 'zigzag' };
            }
            if (avgRate < 0.38) {
                const confidence = 55 + (0.5 - avgRate) * 90;
                return { prediction: sequence[sequence.length - 1], confidence: clampConfidence(confidence), type: 'streak' };
            }
            return null;
        }

        function detectFrequencyBias() {
            if (sequence.length < 6) return null;

            const recent = sequence.slice(-20);
            const recentP = recent.filter(s => s === 'P').length / recent.length;
            const recentB = 1 - recentP;

            if (recentP > 0.55) {
                const confidence = 52 + (recentP - 0.5) * 120;
                return { prediction: 'B', confidence: clampConfidence(confidence), type: 'overbias' };
            }
            if (recentB > 0.55) {
                const confidence = 52 + (recentB - 0.5) * 120;
                return { prediction: 'P', confidence: clampConfidence(confidence), type: 'overbias' };
            }
            return null;
        }

        function detectRecentBias() {
            if (sequence.length < 5) return null;

            const weights = [8, 7, 6, 5, 4];
            const recent = sequence.slice(-5);

            let pWeight = 0, bWeight = 0;
            for (let i = 0; i < recent.length; i++) {
                if (recent[i] === 'P') pWeight += weights[i];
                else bWeight += weights[i];
            }
            const total = pWeight + bWeight;
            if (total === 0) return null;

            const pRate = pWeight / total;
            const bRate = bWeight / total;

            if (pRate > 0.58) {
                const confidence = 52 + (pRate - 0.5) * 130;
                return { prediction: 'B', confidence: clampConfidence(confidence), type: 'recent_bias' };
            }
            if (bRate > 0.58) {
                const confidence = 52 + (bRate - 0.5) * 130;
                return { prediction: 'P', confidence: clampConfidence(confidence), type: 'recent_bias' };
            }
            return null;
        }

        function getPatternPrediction() {
            if (sequence.length < 3) return null;

            const detectors = [
                detectPatterns(),
                detectStreakBias(),
                detectZigzagBias(),
                detectFrequencyBias(),
                detectRecentBias()
            ].filter(p => p !== null);

            if (detectors.length === 0) return null;

            let pVotes = 0, bVotes = 0;
            let pConfSum = 0, bConfSum = 0;

            for (const d of detectors) {
                if (d.prediction === 'P') { pVotes++; pConfSum += d.confidence; }
                else { bVotes++; bConfSum += d.confidence; }
            }

            let winner, winnerConfSum;

            if (pVotes === bVotes) {
                if (pConfSum === bConfSum) return null;
                winner = pConfSum > bConfSum ? 'P' : 'B';
                winnerConfSum = winner === 'P' ? pConfSum : bConfSum;
            } else {
                winner = pVotes > bVotes ? 'P' : 'B';
                winnerConfSum = winner === 'P' ? pConfSum : bConfSum;
            }

            const winnerVotes = winner === 'P' ? pVotes : bVotes;
            if (winnerVotes < 1) return null;

            const confidence = winnerConfSum / winnerVotes;

            return {
                prediction: winner,
                confidence: clampConfidence(confidence),
                patternCount: detectors.length,
                votes: winnerVotes
            };
        }

        // ========== REAL CONFIDENCE — now blends ELO + Sharpness ==========
        function getRealConfidence(prediction, patternConfidence) {
            const sideData = prediction === 'P' ? patternAccuracy.P : patternAccuracy.B;
            const totalPredictions = sideData.total;

            // Base from prediction history
            let baseConfidence;
            if (totalPredictions >= 10) {
                const realAccuracy = (sideData.correct / totalPredictions) * 100;
                baseConfidence = clampConfidence((realAccuracy * 0.8) + (patternConfidence * 0.2));
            } else if (totalPredictions >= 5) {
                const realAccuracy = (sideData.correct / totalPredictions) * 100;
                baseConfidence = clampConfidence((realAccuracy * 0.5) + (patternConfidence * 0.5));
            } else if (totalPredictions >= 3) {
                const realAccuracy = (sideData.correct / totalPredictions) * 100;
                baseConfidence = clampConfidence((realAccuracy * 0.35) + (patternConfidence * 0.65));
            } else {
                baseConfidence = clampConfidence(Math.min(patternConfidence, 75));
            }

            // ELO modifier: ±0 to ±8 pts based on rating vs 1200 baseline
            //   ELO 1600 → +8, ELO 800 → -8
            const eloMod = Math.max(-8, Math.min(8, (eloRating - 1200) / 50));

            // Sharpness modifier: sharpness 0.0 → -6, sharpness 1.0 → +6
            const sharpMod = (sharpness - 0.5) * 12;

            const adjusted = baseConfidence + eloMod + sharpMod;
            return clampConfidence(adjusted);
        }

        // ========== DYNAMIC SKIP THRESHOLD — now uses ELO ==========
        function getDynamicSkipThreshold() {
            const total = overallAccuracy.total;

            // Base threshold from accuracy
            let baseThreshold;
            if (total < 10) {
                baseThreshold = 50;
            } else {
                const realAccuracy = (overallAccuracy.correct / total) * 100;
                if (realAccuracy >= 70) baseThreshold = 46;
                else if (realAccuracy >= 55) baseThreshold = 50;
                else baseThreshold = 56;
            }

            // ELO modifier: high ELO → lower threshold (bet more),
            //                low ELO → higher threshold (bet less)
            // ELO 1600 → -6, ELO 800 → +6
            const eloMod = -Math.max(-6, Math.min(6, (eloRating - 1200) / 60));

            // Recent accuracy nudge
            let recentNudge = 0;
            const recentPredictions = predictionHistory.slice(-20);
            if (recentPredictions.length >= 10 && total >= 10) {
                const realAccuracy = (overallAccuracy.correct / total) * 100;
                const recentCorrect = recentPredictions.filter(p => p.correct).length;
                const recentAcc = (recentCorrect / recentPredictions.length) * 100;
                if (recentAcc > realAccuracy + 5) recentNudge = -3;
                else if (recentAcc < realAccuracy - 5) recentNudge = 3;
            }

            const finalThreshold = baseThreshold + eloMod + recentNudge;
            return Math.round(Math.min(85, Math.max(45, finalThreshold)));
        }

        // ========== FINAL PREDICTION ==========
        function finalPrediction() {
            if (sequence.length < MIN_HANDS) return null;

            const patternResult = getPatternPrediction();
            if (!patternResult) return null;

            const realConfidence = getRealConfidence(patternResult.prediction, patternResult.confidence);
            const threshold = getDynamicSkipThreshold();
            const shouldBet = realConfidence >= threshold;

            return {
                pred: shouldBet ? patternResult.prediction : null,
                confidence: realConfidence,
                threshold,
                skip: !shouldBet,
                patternCount: patternResult.patternCount
            };
        }

        function getRunLength(arr) {
            if (arr.length === 0) return 0;
            const last = arr[arr.length - 1];
            let count = 1;
            for (let i = arr.length - 2; i >= 0; i--) {
                if (arr[i] === last) count++;
                else break;
            }
            return count;
        }

        // ========== UI ==========
        function updateHistory() {
            const box = document.getElementById('historyBox');
            const rBox = document.getElementById('resultsBox');
            if (sequence.length === 0) { box.innerHTML = "READY FOR DATA"; rBox.innerHTML = ""; return; }
            box.innerHTML = '';
            sequence.slice(-10).forEach(r => {
                const span = document.createElement('span');
                span.className = r;
                span.textContent = r;
                box.appendChild(span);
            });

            rBox.innerHTML = '';
            const filteredResults = results.filter(r => r === 'W' || r === 'L');
            const last10 = filteredResults.slice(-10);
            last10.forEach(wl => {
                const span = document.createElement('span');
                span.className = wl;
                span.textContent = wl;
                rBox.appendChild(span);
            });
        }

        function setChangeTableLock(locked) {
            const playerBtn = document.getElementById('playerBtn');
            const bankerBtn = document.getElementById('bankerBtn');
            const undoBtn = document.getElementById('undoBtn');
            const resetBtn = document.getElementById('resetBtn');

            [playerBtn, bankerBtn, undoBtn].forEach(btn => {
                if (!btn) return;
                btn.disabled = locked;
                btn.classList.toggle('disabled', locked);
            });

            if (resetBtn) {
                resetBtn.disabled = false;
                resetBtn.classList.remove('disabled');
                if (locked) {
                    resetBtn.classList.add('blink-reset');
                } else {
                    resetBtn.classList.remove('blink-reset');
                }
            }
        }

        function updatePredictionBox() {
            const box = document.getElementById('predictionBox');

            if (sequence.length < MIN_HANDS) {
                box.innerHTML = `<span style="font-size:clamp(11px,2.5vw,13px); color:#7a8595; letter-spacing:1px;">LOGGING: ${MIN_HANDS-sequence.length} MORE HANDS NEEDED</span>`;
                lastPrediction = null;
                setChangeTableLock(false);
                updateStatsBar();
                updateEloSharpBar();
                return;
            }
            
            const changeTable = checkChangeTable();
            
            if (changeTable.show) {
                box.innerHTML = `
                    <span class="change-table">
                        ⚠️ ${changeTable.reason}
                        <span class="sub">Please click <span class="highlight" onclick="resetAll()">RESET</span> and find another table</span>
                    </span>
                `;
                lastPrediction = null;
                setChangeTableLock(true);
                updateStatsBar();
                updateEloSharpBar();
                return;
            }
            
            const result = finalPrediction();
            let html = '';
            
            if (result && result.pred) {
                const text = result.pred === 'P' ? 'PLAYER' : 'BANKER';
                const cls = result.pred === 'P' ? 'player' : 'banker';
                html = `NEXT: <span class="${cls}">${text}</span> <span class="confidence">${result.confidence}%</span>`;
                lastPrediction = result.pred;
                lastPredictionConfidence = result.confidence;
            } else if (result && result.skip) {
                html = `<span style="font-size:clamp(14px,3vw,16px); color:#db2777;">⏭ SKIP (${result.confidence}%)</span>`;
                lastPrediction = null;
            } else {
                html = "<span style='font-size:clamp(14px,3vw,16px); color:#7a8595'>ANALYZING PATTERNS...</span>";
                lastPrediction = null;
            }
            
            box.innerHTML = html;
            setChangeTableLock(false);
            updateStatsBar();
            updateEloSharpBar();
        }

        function updateStatsBar() {
            document.getElementById('winCount').textContent = wins;
            document.getElementById('lossCount').textContent = losses;
            const total = wins + losses;
            const winRate = total > 0 ? Math.round((wins / total) * 100) : 0;
            
            const realAcc = (overallAccuracy.total > 0) ? 
                Math.round((overallAccuracy.correct / overallAccuracy.total) * 100) : 0;
            
            document.getElementById('winRateDisplay').textContent = `WR: ${winRate}% | Real: ${realAcc}%`;
            
            const streak = getRunLength(sequence);
            const last = sequence.length > 0 ? sequence[sequence.length - 1] : null;
            const streakDisplay = document.getElementById('streakDisplay');
            if (last && streak > 0) {
                streakDisplay.textContent = `Streak: ${streak} ${last}`;
                streakDisplay.className = 'streak-indicator ' + (streak >= 3 ? 'win-streak' : '');
            } else {
                streakDisplay.textContent = 'Streak: 0';
                streakDisplay.className = 'streak-indicator';
            }
        }

        // ========== ELO & SHARPNESS BAR (current → new format) ==========
        function updateEloSharpBar() {
            const eloEl = document.getElementById('eloValue');
            const sharpEl = document.getElementById('sharpValue');
            const eloDeltaEl = document.getElementById('eloDelta');
            const sharpDeltaEl = document.getElementById('sharpDelta');

            if (!eloEl || !sharpEl) return;

            // ELO display
            eloEl.textContent = Math.round(eloRating);
            sharpEl.textContent = sharpness.toFixed(2);

            // Delta display — uses persisted lastEloChange / lastSharpChange
            if (Math.abs(lastEloChange) > 0.05) {
                eloDeltaEl.textContent = (lastEloChange > 0 ? '+' : '') + lastEloChange.toFixed(1);
                eloDeltaEl.className = 'delta ' + (lastEloChange > 0 ? 'pos' : 'neg');
            } else {
                eloDeltaEl.textContent = '';
                eloDeltaEl.className = 'delta';
            }

            if (Math.abs(lastSharpChange) > 0.0005) {
                sharpDeltaEl.textContent = (lastSharpChange > 0 ? '+' : '') + lastSharpChange.toFixed(2);
                sharpDeltaEl.className = 'delta ' + (lastSharpChange > 0 ? 'pos' : 'neg');
            } else {
                sharpDeltaEl.textContent = '';
                sharpDeltaEl.className = 'delta';
            }

            eloEl.classList.toggle('high', eloRating > 1400);
            sharpEl.classList.toggle('high', sharpness > 0.65);
        }

        // ========== RECORD RESULT ==========
        function recordResult(r) {
            if (checkChangeTable().show) return;

            if (lastPrediction) {
                const wasCorrect = (lastPrediction === r);

                // Snapshot ELO & Sharpness BEFORE update (for undo + delta)
                const beforeElo = eloRating;
                const beforeSharp = sharpness;

                // Update ELO & Sharpness
                updateElo(wasCorrect, lastPredictionConfidence);
                updateSharpness(wasCorrect, lastPredictionConfidence);

                const eloChange = eloRating - beforeElo;
                const sharpChange = sharpness - beforeSharp;

                // Persist the change history (used by undo)
                predictionHistory.push({
                    prediction: lastPrediction,
                    actual: r,
                    correct: wasCorrect,
                    confidence: lastPredictionConfidence,
                    timestamp: Date.now(),
                    eloBefore: beforeElo,
                    eloAfter: eloRating,
                    sharpBefore: beforeSharp,
                    sharpAfter: sharpness
                });

                if (lastPrediction === 'P') {
                    patternAccuracy.P.total++;
                    if (wasCorrect) patternAccuracy.P.correct++;
                } else if (lastPrediction === 'B') {
                    patternAccuracy.B.total++;
                    if (wasCorrect) patternAccuracy.B.correct++;
                }
                overallAccuracy.total++;
                if (wasCorrect) overallAccuracy.correct++;

                // Set delta for display
                lastEloChange = eloChange;
                lastSharpChange = sharpChange;

                // Persist state
                localStorage.setItem('bt_prediction_history', JSON.stringify(predictionHistory));
                localStorage.setItem('bt_elo_rating', eloRating.toFixed(2));
                localStorage.setItem('bt_sharpness', sharpness.toFixed(4));
                localStorage.setItem('bt_last_elo_change', lastEloChange.toFixed(4));
                localStorage.setItem('bt_last_sharp_change', lastSharpChange.toFixed(4));

                results.push(wasCorrect ? 'W' : 'L');
                if (wasCorrect) { wins++; detailedHistory.push({ type: 'win', wasSkip: false }); }
                else { losses++; detailedHistory.push({ type: 'loss', wasSkip: false }); }
            } else {
                // SKIP — no ELO/Sharpness change, but keep last delta as-is
                results.push('');
                skips++;
                detailedHistory.push({ type: 'skip', wasSkip: true });
            }

            sequence.push(r);
            saveAndUpdate();
        }

        // ========== UNDO — now rolls back ELO, Sharpness, and deltas ==========
        function undo() {
            if (checkChangeTable().show) return;

            if (sequence.length === 0) return;

            // If the last sequence entry was a bet (not a skip), roll back ELO/Sharpness
            if (predictionHistory.length > 0) {
                const lastPred = predictionHistory[predictionHistory.length - 1];
                // Restore ELO & Sharpness to pre-hand values if stored
                if (typeof lastPred.eloBefore === 'number') {
                    eloRating = lastPred.eloBefore;
                    sharpness = lastPred.sharpBefore;
                    localStorage.setItem('bt_elo_rating', eloRating.toFixed(2));
                    localStorage.setItem('bt_sharpness', sharpness.toFixed(4));
                }
                // Undo accuracy counters
                if (lastPred.prediction === 'P') {
                    patternAccuracy.P.total--;
                    if (lastPred.correct) patternAccuracy.P.correct--;
                } else if (lastPred.prediction === 'B') {
                    patternAccuracy.B.total--;
                    if (lastPred.correct) patternAccuracy.B.correct--;
                }
                overallAccuracy.total--;
                if (lastPred.correct) overallAccuracy.correct--;

                predictionHistory.pop();
                localStorage.setItem('bt_prediction_history', JSON.stringify(predictionHistory));
            }

            sequence.pop();
            const lastResultData = results.pop();
            detailedHistory.pop();

            if (lastResultData === 'W') wins--;
            else if (lastResultData === 'L') losses--;
            else if (lastResultData === '') skips--;

            // Clear the delta display on undo (since the change is gone)
            lastEloChange = 0;
            lastSharpChange = 0;
            localStorage.setItem('bt_last_elo_change', '0');
            localStorage.setItem('bt_last_sharp_change', '0');

            saveAndUpdate();
        }

        function resetAll() {
            if (confirm("Reset all data?")) {
                sequence = [];
                results = [];
                lastPrediction = null;
                lastPredictionConfidence = 0;
                detailedHistory = [];
                predictionHistory = [];
                patternAccuracy = { P: { correct: 0, total: 0 }, B: { correct: 0, total: 0 } };
                overallAccuracy = { correct: 0, total: 0 };
                wins = 0;
                losses = 0;
                skips = 0;
                eloRating = 1200;
                sharpness = 0.0;
                lastEloChange = 0;
                lastSharpChange = 0;

                localStorage.removeItem('bt_sequence');
                localStorage.removeItem('bt_results');
                localStorage.removeItem('bt_detailed');
                localStorage.removeItem('bt_prediction_history');
                localStorage.removeItem('bt_elo_rating');
                localStorage.removeItem('bt_sharpness');
                localStorage.removeItem('bt_last_elo_change');
                localStorage.removeItem('bt_last_sharp_change');

                window.location.reload();
            }
        }

        function saveAndUpdate() {
            localStorage.setItem('bt_sequence', JSON.stringify(sequence));
            localStorage.setItem('bt_results', JSON.stringify(results));
            localStorage.setItem('bt_detailed', JSON.stringify(detailedHistory));
            updateHistory();
            updatePredictionBox();
        }

        if (sequence.length > 0 || results.length > 0) {
            results.forEach(r => { if (r === 'W') wins++; else if (r === 'L') losses++; else if (r === '') skips++; });
        }

        updateHistory();
        updatePredictionBox();
    </script>
