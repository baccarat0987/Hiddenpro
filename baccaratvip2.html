<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Roulette VIP PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    
    <!-- ========== ADDED 1: CLEAN URL SCRIPT ========== -->
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <!-- ========== ADDED 2: FIREBASE AUTHENTICATION MODULE ========== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const REQUIRED_ENGINE_ID = "engine_15";

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && 
                           (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                           userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) {
                alert("Access denied: you don't have permission for Roulette VIP PRO (engine_14).");
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>
    
    <!-- ========== ADDED 3: RIGHT-CLICK & SHORTCUT BLOCKER ========== -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) {
                return false;
            }
        };
    </script>
    
    <!-- ========== ADDED 4: EXIT BUTTON STYLES ========== -->
    <style>
        .exit-nav {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
        }
        .exit-btn {
            background: rgba(0, 0, 0, 0.7);
            color: #9D6AF5;
            padding: 6px 14px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 700;
            font-size: 11px;
            border: 1px solid rgba(157, 106, 245, 0.5);
            backdrop-filter: blur(8px);
            transition: 0.2s;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .exit-btn:hover {
            background: #9D6AF5;
            color: #030407;
            box-shadow: 0 0 12px #9D6AF5;
        }
    </style>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0A0E1A 0%, #03050A 100%);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .internal-refresh-active {
            animation: internalRefreshPulse 0.28s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }
        
        @keyframes internalRefreshPulse {
            0% { opacity: 1; box-shadow: 0 0 0px rgba(157, 106, 245, 0); }
            35% { opacity: 0.95; box-shadow: 0 0 18px 3px rgba(157, 106, 245, 0.8), inset 0 0 8px rgba(201, 179, 255, 0.4); }
            100% { opacity: 1; box-shadow: 0 0 0px rgba(157, 106, 245, 0); }
        }

        .aequitas-app {
            width: 620px;
            max-width: 100%;
            background: linear-gradient(145deg, #12172B, #0A0E1F);
            border-radius: 24px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.6), inset 0 1px 0 rgba(157, 106, 245, 0.12);
            border: 1px solid rgba(157, 106, 245, 0.35);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .title-bar-brand {
            background: linear-gradient(90deg, #0C1126, #080C1C);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(157, 106, 245, 0.45);
        }
        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .minimal-ai-logo {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: slowRotate 8s linear infinite;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .minimal-ai-logo:hover {
            transform: scale(1.05);
            animation: slowRotate 4s linear infinite;
        }
        
        .minimal-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.5));
        }
        
        @keyframes slowRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .brand-text {
            display: flex;
            flex-direction: column;
        }
        .brand-name {
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #C9B3FF, #9D6AF5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand-sub {
            font-size: 0.5rem;
            font-weight: 600;
            color: #9D6AF5;
            letter-spacing: 0.8px;
        }
        .brand-badge {
            background: rgba(157, 106, 245, 0.18);
            border: 1px solid rgba(157, 106, 245, 0.45);
            border-radius: 30px;
            padding: 3px 10px;
            font-size: 0.55rem;
            font-weight: 700;
            color: #C9B3FF;
        }

        .four-columns {
            display: grid;
            grid-template-columns: 125px 90px 105px 1fr;
            gap: 10px;
            padding: 14px;
        }

        .numbers-col {
            background: rgba(10, 14, 28, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 18px;
            padding: 10px 6px;
            border: 1px solid rgba(157, 106, 245, 0.3);
        }
        .col-header {
            font-size: 0.55rem;
            font-weight: 800;
            color: #B88AFF;
            text-align: center;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .zero-container {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .zero-btn {
            background: linear-gradient(145deg, #2D5A3F, #1E3D2A);
            border: none;
            color: white;
            font-weight: 800;
            font-size: 0.85rem;
            font-family: monospace;
            cursor: pointer;
            text-align: center;
            width: 52px;
            padding: 6px 0;
            border-radius: 35px;
            box-shadow: 0 2px 0 #0F2A1A;
            transition: 0.03s linear;
        }
        .zero-btn:active { transform: translateY(2px); box-shadow: none; }
        
        .number-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }
        .num-btn {
            background: rgba(25, 30, 50, 0.9);
            border: 1px solid rgba(157, 106, 245, 0.4);
            padding: 6px 0;
            border-radius: 25px;
            font-weight: 800;
            font-size: 0.7rem;
            font-family: monospace;
            cursor: pointer;
            text-align: center;
            color: #F0E6FF;
        }
        .num-btn:active { transform: translateY(1px); background: rgba(157, 106, 245, 0.4); }
        .btn-flash {
            animation: flashBrand 0.12s ease-out;
        }
        @keyframes flashBrand {
            0% { transform: scale(1); background: rgba(157, 106, 245, 0.3); }
            50% { transform: scale(0.92); background: #9D6AF5; color: white; }
            100% { transform: scale(1); background: rgba(25, 30, 50, 0.9); }
        }
        .red-num { background: rgba(198, 40, 40, 0.85); border-color: rgba(198, 80, 80, 0.5); color: #FFE0E0; }
        .black-num { background: rgba(35, 35, 55, 0.95); border-color: rgba(120, 120, 160, 0.4); color: #E0D4FF; }
        .zero-flash {
            animation: zeroBrandFlash 0.12s ease-out;
        }
        @keyframes zeroBrandFlash {
            0% { transform: scale(1); background: #2D5A3F; }
            50% { transform: scale(0.92); background: #9D6AF5; color: white; }
            100% { transform: scale(1); background: #2D5A3F; }
        }

        .history-col {
            background: rgba(10, 14, 28, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 18px;
            padding: 10px 6px;
            border: 1px solid rgba(157, 106, 245, 0.3);
            display: flex;
            flex-direction: column;
            height: 340px;
        }
        .history-scroll {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-right: 2px;
        }
        .spin-item {
            background: linear-gradient(135deg, rgba(157, 106, 245, 0.25), rgba(108, 63, 217, 0.2));
            padding: 6px;
            text-align: center;
            border-radius: 20px;
            font-weight: 800;
            font-family: monospace;
            font-size: 0.85rem;
            border-left: 3px solid #C9B3FF;
            color: #F5EFFF;
            text-shadow: 0 0 2px rgba(0,0,0,0.3);
        }
        .spin-item-new {
            background: linear-gradient(135deg, #9D6AF5, #7B4FDD);
            color: #FFFFFF;
            border-left-color: #FFE8B6;
            animation: highlightBrand 0.45s ease-out;
        }
        @keyframes highlightBrand {
            0% { background: #C9B3FF; transform: translateX(-2px); }
            100% { background: linear-gradient(135deg, #9D6AF5, #7B4FDD); transform: translateX(0); }
        }
        .history-count {
            font-size: 0.55rem;
            text-align: center;
            margin-top: 8px;
            color: #B88AFF;
            font-weight: 700;
        }

        .group-col {
            background: rgba(10, 14, 28, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 18px;
            padding: 10px 6px;
            border: 1px solid rgba(157, 106, 245, 0.3);
            height: 340px;
            display: flex;
            flex-direction: column;
        }
        .group-scroll {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .group-item {
            background: rgba(157, 106, 245, 0.15);
            padding: 5px;
            text-align: center;
            border-radius: 18px;
            font-size: 0.7rem;
            font-family: monospace;
            font-weight: 700;
            word-break: break-word;
            color: #E0D0FF;
            border: 1px solid rgba(157, 106, 245, 0.3);
        }

        .prediction-col {
            background: rgba(10, 14, 28, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 18px;
            padding: 10px;
            border: 1px solid rgba(157, 106, 245, 0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .pred-glass {
            background: rgba(157, 106, 245, 0.2);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(201, 179, 255, 0.6);
            box-shadow: 0 0 20px rgba(157, 106, 245, 0.5), inset 0 0 8px rgba(201, 179, 255, 0.3);
            transition: all 0.1s;
        }
        .prediction-flash {
            animation: predGlassPulse 0.25s ease-out;
        }
        @keyframes predGlassPulse {
            0% { box-shadow: 0 0 0px rgba(157, 106, 245, 0.5); transform: scale(1); background: rgba(157, 106, 245, 0.2); }
            50% { box-shadow: 0 0 35px rgba(157, 106, 245, 0.9); transform: scale(1.02); background: rgba(157, 106, 245, 0.45); }
            100% { box-shadow: 0 0 20px rgba(157, 106, 245, 0.5); transform: scale(1); background: rgba(157, 106, 245, 0.2); }
        }
        .pred-label-small {
            font-size: 0.55rem;
            font-weight: 800;
            color: #F0E6FF;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .pred-value {
            font-size: 1rem;
            font-weight: 900;
            font-family: monospace;
            background: rgba(10, 14, 26, 0.8);
            display: inline-block;
            padding: 5px 14px;
            border-radius: 35px;
            margin-top: 8px;
            color: #FFE8B6;
            letter-spacing: 1px;
            border: 1px solid rgba(201, 179, 255, 0.5);
        }
        
        .alternatives-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .alt-row {
            background: linear-gradient(135deg, rgba(157, 106, 245, 0.2), rgba(108, 63, 217, 0.15));
            border-radius: 25px;
            padding: 7px 10px;
            text-align: center;
            font-weight: 800;
            font-family: monospace;
            font-size: 0.75rem;
            border: 1px solid rgba(157, 106, 245, 0.45);
            color: #F2E8FF;
            text-shadow: 0 0 1px rgba(0,0,0,0.2);
        }
        
        .clear-btn {
            background: linear-gradient(145deg, #2D1F3A, #1A1225);
            border: 1px solid rgba(157, 106, 245, 0.6);
            width: 100%;
            padding: 9px;
            border-radius: 35px;
            font-weight: 800;
            font-size: 0.7rem;
            color: #D9C8FF;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            margin-top: 4px;
            transition: 0.05s linear;
        }
        .clear-btn:active { transform: scale(0.97); background: #2D1F3A; }

        .history-scroll::-webkit-scrollbar, .group-scroll::-webkit-scrollbar {
            width: 3px;
        }
        .history-scroll::-webkit-scrollbar-track, .group-scroll::-webkit-scrollbar-track {
            background: #1A1F30;
            border-radius: 3px;
        }
        .history-scroll::-webkit-scrollbar-thumb, .group-scroll::-webkit-scrollbar-thumb {
            background: #9D6AF5;
            border-radius: 3px;
        }

        @media (max-width: 580px) {
            .four-columns { grid-template-columns: 1fr; gap: 10px; }
            .aequitas-app { width: 95%; }
            .history-col, .group-col { height: auto; min-height: 180px; }
        }

        /* ==================== PROVIDER PICKER (TEXT-ONLY) ==================== */
        .provider-picker-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 12, 0.96);
            backdrop-filter: blur(14px);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeInOverlay 0.35s ease;
            gap: 28px;
            overflow-y: auto;
        }
        @keyframes fadeInOverlay {
            from { opacity: 0; backdrop-filter: blur(0px); }
            to { opacity: 1; backdrop-filter: blur(12px); }
        }
        .provider-picker-title {
            font-size: clamp(0.85rem, 4vw, 1.15rem);
            font-weight: 800;
            letter-spacing: 5px;
            color: #C9B3FF;
            text-transform: uppercase;
            text-align: center;
            background: rgba(157,106,245,0.2);
            padding: 10px 32px;
            border-radius: 60px;
            border: 1px solid rgba(157,106,245,0.5);
            backdrop-filter: blur(4px);
        }
        .provider-picker-sub {
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 2.5px;
            color: #8A7ACC;
            text-align: center;
            margin-top: -14px;
            text-transform: uppercase;
        }
        .provider-buttons-stack {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: min(380px, 88vw);
        }
        .provider-btn {
            width: 100%;
            padding: 22px 28px;
            border-radius: 20px;
            background: linear-gradient(145deg, #12172B, #0A0E1F);
            border: 2px solid rgba(157, 106, 245, 0.55);
            color: #E8DBFF;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: clamp(0.95rem, 3.6vw, 1.15rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
            box-shadow: 0 12px 24px rgba(0,0,0,0.55);
            text-align: center;
        }
        .provider-btn:hover {
            transform: translateY(-3px) scale(1.015);
            border-color: #C9B3FF;
            background: linear-gradient(145deg, #1E2544, #10162E);
            box-shadow: 0 16px 38px rgba(157,106,245,0.6), 0 0 0 1px rgba(201,179,255,0.5);
            color: #FFFFFF;
        }
        .provider-btn:active {
            transform: translateY(-1px) scale(0.99);
        }

        /* ==================== PREDICTION WHEEL OVERLAY ==================== */
        .wheel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 12, 0.94);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            animation: fadeInOverlay 0.25s ease;
            padding: 12px;
            overflow: hidden;
        }
        .wheel-container {
            background: linear-gradient(145deg, #12172B, #0A0E1F);
            border-radius: 28px;
            padding: 16px 18px 16px;
            border: 2px solid rgba(157, 106, 245, 0.8);
            box-shadow: 0 30px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,179,255,0.2), 0 0 35px rgba(157,106,245,0.5);
            position: relative;
            width: auto;
            max-width: 98vw;
            display: inline-block;
        }
        .close-wheel-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            background: rgba(10, 14, 28, 0.9);
            border: 1px solid rgba(157, 106, 245, 0.8);
            color: #D9C8FF;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
            font-family: monospace;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        .close-wheel-btn:hover {
            background: #9D6AF5;
            color: #0A0E1A;
            transform: scale(1.07);
            box-shadow: 0 0 12px #9D6AF5;
        }
        .wheel-title {
            text-align: center;
            font-size: clamp(0.55rem, 2.4vw, 0.72rem);
            font-weight: 800;
            letter-spacing: 1.6px;
            color: #C9B3FF;
            margin-bottom: 10px;
            text-transform: uppercase;
            background: rgba(157,106,245,0.2);
            display: inline-block;
            padding: 5px 18px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        /* Racetrack wrapper — sizes dynamically via JS scale */
        .racetrack-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            overflow: hidden;
        }
        .racetrack-svg {
            display: block;
            width: 100%;
            height: auto;
            max-height: 60vh;
            filter: drop-shadow(0 12px 28px rgba(0,0,0,0.9));
        }

        /* --- SVG tile styles (matches reference) --- */
        .tile-path {
            stroke: #b39b82;
            stroke-width: 1.1px;
            transition: filter 0.12s ease, stroke 0.12s ease, fill 0.12s ease;
        }
        .tile-text {
            fill: #ebdcd0;
            font-weight: 700;
            font-size: 25px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            font-family: 'Inter', system-ui, sans-serif;
            letter-spacing: -0.02em;
        }
        .racetrack-outline {
            fill: none;
            stroke: #c2ac97;
            stroke-width: 1.5px;
            pointer-events: none;
        }
        /* Highlight classes applied on top of the base fill */
        .tile-path.hl-center {
            fill: #FF69B4 !important;
            stroke: #FFFFFF !important;
            stroke-width: 2px !important;
            filter: drop-shadow(0 0 10px rgba(255,105,180,0.95));
        }
        .tile-path.hl-neighbor {
            fill: #FFD966 !important;
            stroke: #FFF2C0 !important;
            stroke-width: 1.8px !important;
            filter: drop-shadow(0 0 8px rgba(255,217,102,0.9));
        }
        .tile-text.hl-dark {
            fill: #0A0E1A;
            font-weight: 900;
        }

        .wheel-note {
            text-align: center;
            margin-top: 10px;
            font-size: clamp(0.5rem, 2.1vw, 0.6rem);
            font-weight: 600;
            color: #B88AFF;
            background: rgba(0,0,0,0.35);
            padding: 5px 14px;
            border-radius: 40px;
            display: inline-block;
            letter-spacing: 0.5px;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }
    </style>
</head>
<body>

<!-- ========== ADDED 5: EXIT BUTTON HTML ========== -->
<div class="exit-nav">
    <a href="index.html" class="exit-btn">← EXIT TERMINAL</a>
</div>

<div class="aequitas-app" id="mainAppContainer">
    <div class="title-bar-brand">
        <div class="brand-container">

    // ==================== ENHANCED PREDICTION LOGIC (v2) ====================
    function analiz() {
        if (lastPrediction && lastPredictionGroups.length > 0 && groupHistory.length > 0) {
            const evalWindow = groupHistory.slice(-lastPredictionGroups.length);
            const hit = evalWindow.some(g => g === lastPrediction);
            if (hit) hitCount++;
            else missCount++;
            lastPrediction = null;
            lastPredictionGroups = [];
        }

        if (groupHistory.length === 0) {
            mainPredictionSpan.innerText = "———";
            alternativesContainer.innerHTML = `
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
            `;
            return;
        }

        const norm = (g) => g.split('-').map(Number).sort((a, b) => a - b).join('-');
        const normalizedHistory = groupHistory.map(norm);

        const startIdx = Math.max(0, normalizedHistory.length - 20);
        const lastGroups = normalizedHistory.slice(startIdx);
        const DECAY = 0.85;

        const freqMap = new Map();
        lastGroups.forEach((g, idx) => {
            const age = lastGroups.length - 1 - idx;
            const weight = Math.pow(DECAY, age);
            freqMap.set(g, (freqMap.get(g) || 0) + weight);
        });

        if (normalizedHistory.length >= 4) {
            const lastThree = normalizedHistory.slice(-3).join(',');
            const patternHits = [];

            for (let i = 0; i <= normalizedHistory.length - 4; i++) {
                const pattern = normalizedHistory.slice(i, i + 3).join(',');
                if (pattern === lastThree) {
                    const nextGroup = normalizedHistory[i + 3];
                    const distFromEnd = normalizedHistory.length - (i + 3);
                    patternHits.push({ nextGroup, distFromEnd });
                }
            }

            const totalEval = hitCount + missCount;
            const hitRateScale = totalEval >= 3 ? (0.5 + 0.5 * (hitCount / totalEval)) : 1.0;

            for (const { nextGroup, distFromEnd } of patternHits) {
                const decay = Math.pow(0.9, distFromEnd);
                const boost = 4 * decay * hitRateScale;
                freqMap.set(nextGroup, (freqMap.get(nextGroup) || 0) + boost);
            }
        }

        const sorted = Array.from(freqMap.entries()).sort((a, b) => {
            if (b[1] !== a[1]) return b[1] - a[1];
            return a[0].localeCompare(b[0]);
        });

        const selected = [];
        const selectedNums = [];
        for (const [grp, score] of sorted) {
            const nums = grp.split('-').map(Number);
            const overlap = nums.filter(n => selectedNums.includes(n)).length;
            if (overlap >= 2) continue;
            selected.push([grp, score]);
            selectedNums.push(...nums);
            if (selected.length === 5) break;
        }

        if (selected.length === 0) {
            mainPredictionSpan.innerText = "———";
        } else {
            mainPredictionSpan.innerText = selected[0][0];
            lastPrediction = selected[0][0];
            lastPredictionGroups = [selected[0][0]];
        }

        alternativesContainer.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            const groupValue = (i < selected.length) ? selected[i][0] : '———';
            const row = document.createElement('div');
            row.className = 'alt-row';
            row.innerText = groupValue;
            alternativesContainer.appendChild(row);
        }
    }

    // ==================== PHYSICAL WHEEL ORDER ====================

    // Layout data taken 1:1 from the reference racetrack replica:

    const TOP_STRAIGHT = [
        { num: 16, type: 'red' },

    const COLOR_RED   = '#7d1316';
    const COLOR_BLACK = '#120d0e';
    const COLOR_GREEN = '#0d4a3a';
    const COLOR_EVO_BG = 'radial-gradient(ellipse at center, #4A1010 0%, #2A0808 70%, #150404 100%)';

    function tileFill(type) {
        if (type === 'red') return COLOR_RED;
        if (type === 'black') return COLOR_BLACK;
        if (type === 'green') return COLOR_GREEN;
        return COLOR_BLACK;
    }

    function svgEl(tag, attrs) {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        return el;

    function showWheelOverlay() {
        if (!chosenProvider) return;
        if (overlayVisible) return;
        if (spinHistory.length < 5) return;
        const mainPredRaw = mainPredictionSpan.innerText;
        if (!mainPredRaw || mainPredRaw === '———') return;

        const numbersInGroup = mainPredRaw.split('-').map(Number).filter(n => !isNaN(n) && n >= 0 && n <= 36);
        if (numbersInGroup.length === 0) return;

        // Highlight sets: predicted numbers + their ±2 physical neighbors
        const centerNums = new Set(numbersInGroup);
        const neighborNums = new Set();
        numbersInGroup.forEach(num => {
            const idx = wheelNumbers.indexOf(num);
            if (idx === -1) return;
            for (let offset = -2; offset <= 2; offset++) {
                if (offset === 0) continue;
                const neighborIdx = (idx + offset + wheelNumbers.length) % wheelNumbers.length;
                neighborNums.add(wheelNumbers[neighborIdx]);
            }
        });

        // Build overlay DOM
        const overlay = document.createElement('div');
        overlay.className = 'wheel-overlay';

        const containerDiv = document.createElement('div');
        containerDiv.className = 'wheel-container';

        const closeBtn = document.createElement('div');
        closeBtn.className = 'close-wheel-btn';
        closeBtn.innerHTML = '✕';
        closeBtn.addEventListener('click', () => {
            overlay.remove();
            overlayVisible = false;
        });

        const title = document.createElement('div');
        title.className = 'wheel-title';
        const providerLabel = chosenProvider === 'evolution' ? 'EVOLUTION' : 'PRAGMATIC';
        title.innerText = `${providerLabel} • PREDICTION: ${mainPredRaw}`;

        // ----- Build the SVG racetrack -----
        const wrap = document.createElement('div');
        wrap.className = 'racetrack-wrap';

        const svg = svgEl('svg', {
            viewBox: '0 0 960 280',
            preserveAspectRatio: 'xMidYMid meet',
            class: 'racetrack-svg'
        });

        // Geometry constants (from reference)
        const R_out = 125;
        const R_in = 68;
        const centerLeft = 145;
        const centerRight = 815;
        const yCenter = 140;
        const rMid = (R_out + R_in) / 2;
        const straightWidth = centerRight - centerLeft; // 670
        const cellW = straightWidth / 13;

        // Felt background (fills the outer racetrack shape)
        const outerPathBg = `M ${centerLeft} ${yCenter - R_out} L ${centerRight} ${yCenter - R_out} A ${R_out} ${R_out} 0 0 1 ${centerRight} ${yCenter + R_out} L ${centerLeft} ${yCenter + R_out} A ${R_out} ${R_out} 0 0 1 ${centerLeft} ${yCenter - R_out} Z`;
        const bg = svgEl('path', {
            d: outerPathBg,
            fill: '#3A0C0C'
        });
        svg.appendChild(bg);

        // Helper to build a tile with optional highlight
        function buildTile(num, type, pathD, tx, ty) {
            const g = svgEl('g', {});
            const path = svgEl('path', {
                d: pathD,
                fill: tileFill(type),
                class: 'tile-path'
            });
            // Highlight override
            if (centerNums.has(num)) {
                path.classList.add('hl-center');
            } else if (neighborNums.has(num)) {
                path.classList.add('hl-neighbor');
            }
            const text = svgEl('text', {
                x: tx,
                y: ty,
                class: 'tile-text'
            });
            if (centerNums.has(num) || neighborNums.has(num)) {
                text.classList.add('hl-dark');
            }
            text.textContent = num;
            g.appendChild(path);
            g.appendChild(text);
            svg.appendChild(g);
        }

        // --- Top straight (13) ---
        TOP_STRAIGHT.forEach((item, i) => {
            const x1 = centerLeft + i * cellW;
            const x2 = x1 + cellW;
            const yOut = yCenter - R_out;
            const yIn = yCenter - R_in;
            const pathD = `M ${x1} ${yOut} L ${x2} ${yOut} L ${x2} ${yIn} L ${x1} ${yIn} Z`;
            buildTile(item.num, item.type, pathD, (x1 + x2) / 2, (yOut + yIn) / 2);
        });

        // --- Bottom straight (13) ---
        BOTTOM_STRAIGHT.forEach((item, i) => {
            const x1 = centerLeft + i * cellW;
            const x2 = x1 + cellW;
            const yIn = yCenter + R_in;
            const yOut = yCenter + R_out;
            const pathD = `M ${x1} ${yIn} L ${x2} ${yIn} L ${x2} ${yOut} L ${x1} ${yOut} Z`;
            buildTile(item.num, item.type, pathD, (x1 + x2) / 2, (yOut + yIn) / 2);
        });

        // --- Right arc (5 tiles across 180°) ---
        const rightStep = Math.PI / 5;
        RIGHT_ARC.forEach((item, i) => {
            const a1 = -Math.PI / 2 + i * rightStep;
            const a2 = -Math.PI / 2 + (i + 1) * rightStep;

            const x1_out = centerRight + R_out * Math.cos(a1);
            const y1_out = yCenter + R_out * Math.sin(a1);
            const x2_out = centerRight + R_out * Math.cos(a2);
            const y2_out = yCenter + R_out * Math.sin(a2);

            const x1_in = centerRight + R_in * Math.cos(a1);
            const y1_in = yCenter + R_in * Math.sin(a1);
            const x2_in = centerRight + R_in * Math.cos(a2);
            const y2_in = yCenter + R_in * Math.sin(a2);

            const pathD = `M ${x1_out} ${y1_out} A ${R_out} ${R_out} 0 0 1 ${x2_out} ${y2_out} L ${x2_in} ${y2_in} A ${R_in} ${R_in} 0 0 0 ${x1_in} ${y1_in} Z`;

            const midA = (a1 + a2) / 2;
            const tx = centerRight + rMid * Math.cos(midA);
            const ty = yCenter + rMid * Math.sin(midA);

            buildTile(item.num, item.type, pathD, tx, ty);
        });

        // --- Left arc (6 tiles across 180°) ---
        const leftStep = Math.PI / 6;
        LEFT_ARC.forEach((item, i) => {
            const a1 = -Math.PI / 2 + i * leftStep;
            const a2 = -Math.PI / 2 + (i + 1) * leftStep;

            const x1_out = centerLeft - R_out * Math.sin(a1 + Math.PI / 2);
            const y1_out = yCenter - R_out * Math.cos(a1 + Math.PI / 2);
            const x2_out = centerLeft - R_out * Math.sin(a2 + Math.PI / 2);
            const y2_out = yCenter - R_out * Math.cos(a2 + Math.PI / 2);

            const x1_in = centerLeft - R_in * Math.sin(a1 + Math.PI / 2);
            const y1_in = yCenter - R_in * Math.cos(a1 + Math.PI / 2);
            const x2_in = centerLeft - R_in * Math.sin(a2 + Math.PI / 2);
            const y2_in = yCenter - R_in * Math.cos(a2 + Math.PI / 2);

            const pathD = `M ${x1_out} ${y1_out} A ${R_out} ${R_out} 0 0 0 ${x2_out} ${y2_out} L ${x2_in} ${y2_in} A ${R_in} ${R_in} 0 0 1 ${x1_in} ${y1_in} Z`;

            const midA = (a1 + a2) / 2;
            const tx = centerLeft - rMid * Math.sin(midA + Math.PI / 2);
            const ty = yCenter - rMid * Math.cos(midA + Math.PI / 2);

            buildTile(item.num, item.type, pathD, tx, ty);
        });

        // --- Continuous outline paths (drawn last so they sit on top) ---
        const outerPath = `M ${centerLeft} ${yCenter - R_out} L ${centerRight} ${yCenter - R_out} A ${R_out} ${R_out} 0 0 1 ${centerRight} ${yCenter + R_out} L ${centerLeft} ${yCenter + R_out} A ${R_out} ${R_out} 0 0 1 ${centerLeft} ${yCenter - R_out} Z`;
        const innerPath = `M ${centerLeft} ${yCenter - R_in} L ${centerRight} ${yCenter - R_in} A ${R_in} ${R_in} 0 0 1 ${centerRight} ${yCenter + R_in} L ${centerLeft} ${yCenter + R_in} A ${R_in} ${R_in} 0 0 1 ${centerLeft} ${yCenter - R_in} Z`;
        svg.appendChild(svgEl('path', { d: outerPath, class: 'racetrack-outline' }));
        svg.appendChild(svgEl('path', { d: innerPath, class: 'racetrack-outline' }));

        wrap.appendChild(svg);

        const note = document.createElement('div');
        note.className = 'wheel-note';
        note.innerHTML = '💗 <strong style="color:#FF69B4">PINK</strong> = Predicted &nbsp; 💛 <strong style="color:#FFD966">Yellow</strong> = ±2 Physical Neighbors';

        containerDiv.appendChild(closeBtn);
        containerDiv.appendChild(title);
        containerDiv.appendChild(wrap);
        containerDiv.appendChild(note);
        overlay.appendChild(containerDiv);
        document.body.appendChild(overlay);
        overlayVisible = true;

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.remove();
                overlayVisible = false;
            }
        });
    }

    // ==================== UI REFRESH ====================
    function scrollToTop(container) {
        if (container) container.scrollTop = 0;
    }

    function refreshUI() {
        spinContainer.innerHTML = '';
        [...spinHistory].reverse().forEach(spin => {
            const item = document.createElement('div');
            item.className = 'spin-item';
            item.innerText = spin;
            spinContainer.appendChild(item);
        });
        spinCountSpan.innerText = spinHistory.length;
        scrollToTop(spinContainer);

        groupContainer.innerHTML = '';
        groupHistory.forEach(grp => {
            const gItem = document.createElement('div');
            gItem.className = 'group-item';
            gItem.innerText = grp;
            groupContainer.appendChild(gItem);
        });
        groupCountSpan.innerText = groupHistory.length;
        if (groupContainer) groupContainer.scrollTop = groupContainer.scrollHeight;

        analiz();
        showWheelOverlay();
    }

    // ==================== ADD SPIN ====================
    function addSpin(number) {
        spinHistory.push(number);

        const groups = groupsPerNumber[number];
        if (groups && groups.length) {
            for (let g of groups) groupHistory.push(g);
        } else {
            groupHistory.push(`ERR-${number}`);
        }

        refreshUI();

        const spinItems = spinContainer.querySelectorAll('.spin-item');
        if (spinItems.length > 0) {
            spinItems[0].classList.add('spin-item-new');
            setTimeout(() => spinItems[0].classList.remove('spin-item-new'), 450);
        }

        predBox.classList.add('prediction-flash');
        setTimeout(() => predBox.classList.remove('prediction-flash'), 250);
    }

    // ==================== RESET ====================
    function hardResetFullReload() {
        window.location.reload();
    }

    // ==================== BUILD NUMBER PAD ====================
    function buildNumberPad() {
        numbersGrid.innerHTML = '';
        const redNumbers = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);

        for (let i = 1; i <= 36; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.className = 'num-btn';
            if (redNumbers.has(i)) btn.classList.add('red-num');
            else btn.classList.add('black-num');
            btn.addEventListener('click', (function(val) {
                return () => {
                    btn.classList.add('btn-flash');
                    setTimeout(() => btn.classList.remove('btn-flash'), 120);
                    addSpin(val);
                };
            })(i));
            numbersGrid.appendChild(btn);
        }
    }

    // ==================== INTERNAL REFRESH ====================
    function triggerInternalRefresh() {
        if (!appContainer) return;
        appContainer.classList.remove('internal-refresh-active');
        void appContainer.offsetWidth;
        appContainer.classList.add('internal-refresh-active');
        setTimeout(() => {
            if (appContainer) appContainer.classList.remove('internal-refresh-active');
        }, 280);
    }

    function setupInternalRefresh() {
        document.body.addEventListener('click', (e) => {
            const resetBtn = document.getElementById('clearAllBtn');
            if (resetBtn && (e.target === resetBtn || resetBtn.contains(e.target))) return;
            triggerInternalRefresh();
        });
    }

    // ==================== EVENT LISTENERS ====================
    zeroButton.addEventListener('click', () => {
        zeroButton.classList.add('zero-flash');
        setTimeout(() => zeroButton.classList.remove('zero-flash'), 120);
        addSpin(0);
    });

    clearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        hardResetFullReload();
    });

    // ==================== INITIALIZATION ====================
    buildNumberPad();

    spinHistory = [];
    groupHistory = [];
    refreshUI();
    mainPredictionSpan.innerText = "———";

    setupInternalRefresh();

    // Show the provider picker on every page load
    setTimeout(() => {
        showProviderPicker();
    }, 120);
</script>
</body>
</html>
