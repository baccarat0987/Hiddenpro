<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Baccarat VIP Plus · AI</title>

    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const REQUIRED_ENGINE_ID = "engine_18";

        window.signOutUser = function() {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                window.location.href = "index.html";
            });
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && 
                           (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                           userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) {
                alert("Access denied: you don't have permission for Baccarat VIP Plus.");
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.onkeydown = function(e) {
            if (
                e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83)) ||
                (e.ctrlKey && e.shiftKey && e.keyCode === 85)
            ) {
                e.preventDefault();
                return false;
            }
        };

        setInterval(function() {
            (function() { return false; }['constructor']('debugger')['call']());
        }, 50);

        if (typeof console !== "undefined") {
            console.log = console.debug = console.info = console.warn = console.error = function() {};
        }
    </script>

    <style>

            margin: 0;
            padding: 0;

<body>

    <div class="exit-nav">
        <button onclick="window.signOutUser()" class="exit-btn">✕ EXIT</button>
    </div>

    <div class="wrap">
        <div class="container">
            <div class="header">
                <h1>
                    <span class="title-violet">Baccarat</span>
                    <span class="title-darkblue">VIP</span>
                    <span class="title-redpink">Plus</span>
                </h1>
                <div class="ai-container">
                    <span class="ai-text">AI</span>
                </div>
            </div>
            <div class="tag">Results are insights, not Guarantees</div>

            <div class="sequence" id="historyBox">READY FOR DATA</div>
            <div class="results" id="resultsBox"></div>
            
            <div class="stats-bar" id="statsBar">
                <span>W: <strong id="winCount">0</strong></span>
                <span>L: <strong id="lossCount">0</strong></span>
                <span class="win-rate" id="winRateDisplay">WR: 0%</span>
                <span id="streakDisplay">Streak: 0</span>
            </div>

            <div class="prediction" id="predictionBox">
                <span>INITIALIZING...</span>
            </div>

            <div class="buttons">
                <button onclick="recordResult('P')" id="playerBtn">PLAYER</button>
                <button onclick="recordResult('B')" id="bankerBtn">BANKER</button>
                <div class="util-btns">
                    <button onclick="undo()" id="undoBtn">UNDO LAST</button>
                    <button onclick="resetAll()" id="resetBtn">RESET SHOE</button>
                </div>
            </div>

            <!-- ENGINE METRICS PANEL (collapsed by default) -->
            <button class="metrics-toggle" id="metricsToggle" onclick="toggleMetrics()">
                <span>▸ ENGINE METRICS</span>
                <span class="arrow">▶</span>
            </button>
            <div class="metrics-panel" id="metricsPanel">
                <div class="metrics-inner" id="metricsInner">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
           HONEST ENGINE — no fake calculations
           - ELO and Sharpness removed entirely
           - All displayed metrics are direct counts
           - Prediction path uses only measured inputs:
             * per-detector rolling hit rate (reliability weighting)
             * confidence gap (detector trust)
             * calibration curve (confidence shrinkage)
             * skip threshold floor at 55
        ========================================================= */

        let sequence = JSON.parse(localStorage.getItem('bt_sequence')) || [];
        let results = JSON.parse(localStorage.getItem('bt_results')) || [];
        let lastPrediction = null;
        let lastPredictionConfidence = 0;
        let detailedHistory = JSON.parse(localStorage.getItem('bt_detailed')) || [];
        let wins = 0, losses = 0, skips = 0;
        const MIN_HANDS = 10;
        const SKIP_THRESHOLD_FLOOR = 55;

        // Prediction history (with detector attribution)
        let predictionHistory = JSON.parse(localStorage.getItem('bt_prediction_history')) || [];
        let overallAccuracy = { correct: 0, total: 0 };
        let patternAccuracy = { P: { correct: 0, total: 0 }, B: { correct: 0, total: 0 } };

        // ===== Per-detector rolling tracker (last 100 fires each) =====
        const DETECTOR_NAMES = ['Pattern', 'Streak', 'Zigzag', 'Frequency', 'Recent'];
        const DETECTOR_WINDOW = 100;
        let detectorHistory = JSON.parse(localStorage.getItem('bt_detector_history')) || {};
        DETECTOR_NAMES.forEach(name => {
            if (!detectorHistory[name]) detectorHistory[name] = [];
        });

        // ===== Calibration curve (6 bands) =====
        const CALIBRATION_BANDS = [
            { min: 50, max: 59, count: 0, correct: 0 },
            { min: 60, max: 69, count: 0, correct: 0 },
            { min: 70, max: 79, count: 0, correct: 0 },
            { min: 80, max: 89, count: 0, correct: 0 },
            { min: 90, max: 100, count: 0, correct: 0 },
            { min: 0, max: 49, count: 0, correct: 0 } // below threshold, tracked for completeness
        ];

        // Rebuild calibration from stored history
        function rebuildCalibration() {
            CALIBRATION_BANDS.forEach(b => { b.count = 0; b.correct = 0; });
            predictionHistory.forEach(p => {
                const c = p.confidence;
                const band = CALIBRATION_BANDS.find(b => c >= b.min && c <= b.max);
                if (band) {
                    band.count++;
                    if (p.correct) band.correct++;
                }
            });
        }
        rebuildCalibration();

        // Rebuild overall accuracy
        if (predictionHistory.length > 0) {
            predictionHistory.forEach(p => {
                if (p.prediction === 'P') {
                    patternAccuracy.P.total++;
                    if (p.correct) patternAccuracy.P.correct++;
                } else if (p.prediction === 'B') {
                    patternAccuracy.B.total++;
                    if (p.correct) patternAccuracy.B.correct++;
                }
                overallAccuracy.total++;
                if (p.correct) overallAccuracy.correct++;
            });
        }

        // ===== Metrics panel toggle (persisted) =====
        const metricsOpen = localStorage.getItem('bt_metrics_open') === '1';
        document.addEventListener('DOMContentLoaded', () => {
            if (metricsOpen) {
                const panel = document.getElementById('metricsPanel');
                const toggle = document.getElementById('metricsToggle');
                if (panel) panel.classList.add('open');
                if (toggle) toggle.classList.add('open');
            }
        });

        function toggleMetrics() {
            const panel = document.getElementById('metricsPanel');
            const toggle = document.getElementById('metricsToggle');
            if (!panel || !toggle) return;
            panel.classList.toggle('open');
            toggle.classList.toggle('open');
            localStorage.setItem('bt_metrics_open', panel.classList.contains('open') ? '1' : '0');
        }

        function clampConfidence(raw) { return Math.min(96, Math.max(0, Math.round(raw))); }
        function oppositeSide(side) { return side === 'P' ? 'B' : 'P'; }

        // ===== CHANGE TABLE (unchanged rule) =====
        function checkChangeTable() {
            const window9 = results.slice(-9);
            const nonSkip = window9.filter(r => r === 'W' || r === 'L');
            const skipped = window9.filter(r => r === '').length;

            if (nonSkip.length < 7) return { show: false, reason: '', wins: 0, losses: 0, winRate: 0 };

            const winsCount = nonSkip.filter(r => r === 'W').length;
            const lossesCount = nonSkip.filter(r => r === 'L').length;
            const total = winsCount + lossesCount;
            const winRate = winsCount / total;
            const lossDiff = lossesCount - winsCount;

            if (lossDiff >= 2 && skipped <= 2) {
                return {
                    show: true,
                    reason: 'CHANGE TABLE',
                    wins: winsCount,
                    losses: lossesCount,
                    winRate: Math.round(winRate * 100),
                    lossDiff: lossDiff
                };
            }
            return { show: false, reason: '', wins: winsCount, losses: lossesCount, winRate: Math.round(winRate * 100), lossDiff: lossDiff };
        }

        // ========== PATTERN DETECTORS (each returns prediction + confidence + name) ==========
        function detectPatterns() {
            if (sequence.length < 4) return null;
            const patterns = {};
            const maxLen = Math.min(8, sequence.length - 1);

            for (let len = 2; len <= maxLen; len++) {
                const pattern = sequence.slice(-len).join('');
                const occurrences = [];
                for (let i = 0; i <= sequence.length - len - 1; i++) {
                    const current = sequence.slice(i, i + len).join('');
                    if (current === pattern && i + len < sequence.length) {
                        occurrences.push(sequence[i + len]);
                    }
                }
                if (occurrences.length >= 1) {
                    const pCount = occurrences.filter(o => o === 'P').length;
                    const bCount = occurrences.length - pCount;
                    const confidence = occurrences.length === 1
                        ? 55
                        : (Math.max(pCount, bCount) / occurrences.length) * 100;
                    const prediction = pCount >= bCount ? 'P' : 'B';
                    const weight = len * occurrences.length;
                    if (!patterns[prediction] || patterns[prediction].weight < weight) {
                        patterns[prediction] = { confidence, weight, matches: occurrences.length };
                    }
                }
            }
            if (Object.keys(patterns).length === 0) return null;
            let best = null, bestScore = 0;
            for (const [side, data] of Object.entries(patterns)) {
                const score = data.confidence * (data.weight / 10);
                if (score > bestScore) {
                    bestScore = score;
                    best = { prediction: side, confidence: data.confidence };
                }
            }
            if (best) best.name = 'Pattern';
            return best;
        }

        function detectStreakBias() {
            if (sequence.length < 2) return null;
            const last = sequence[sequence.length - 1];
            let streakLength = 1;
            for (let i = sequence.length - 2; i >= 0; i--) {
                if (sequence[i] === last) streakLength++;
                else break;
            }
            const window = sequence.slice(-12);
            let streakData = { P: { continue: 0, break: 0 }, B: { continue: 0, break: 0 } };
            for (let i = 1; i < window.length; i++) {
                if (window[i] === window[i - 1]) streakData[window[i - 1]].continue++;
                else streakData[window[i - 1]].break++;
            }
            const side = last;
            const total = streakData[side].continue + streakData[side].break;
            if (total >= 1) {
                const continueRate = streakData[side].continue / total;
                if (streakLength >= 2 && continueRate > 0.52) {
                    const confidence = Math.min(80, 55 + (continueRate - 0.5) * 120 + streakLength * 2);
                    return { prediction: side, confidence: clampConfidence(confidence), name: 'Streak' };
                }
                if (streakLength >= 2 && continueRate < 0.48) {
                    const confidence = Math.min(80, 55 + (0.5 - continueRate) * 120 + streakLength * 2);
                    return { prediction: oppositeSide(side), confidence: clampConfidence(confidence), name: 'Streak' };
                }
            }
            return null;
        }

        function detectZigzagBias() {
            if (sequence.length < 4) return null;
            const rates = [];
            for (const win of [5, 7, 10, 14]) {
                if (sequence.length < win + 1) continue;
                const seg = sequence.slice(-win - 1);
                let alt = 0;
                for (let i = 0; i < seg.length - 1; i++) {
                    if (seg[i] !== seg[i + 1]) alt++;
                }
                rates.push(alt / (seg.length - 1));
            }
            if (rates.length === 0) return null;
            const avgRate = rates.reduce((a, b) => a + b, 0) / rates.length;
            if (avgRate > 0.62) {
                const confidence = 55 + (avgRate - 0.5) * 90;
                return { prediction: oppositeSide(sequence[sequence.length - 1]), confidence: clampConfidence(confidence), name: 'Zigzag' };
            }
            if (avgRate < 0.38) {
                const confidence = 55 + (0.5 - avgRate) * 90;
                return { prediction: sequence[sequence.length - 1], confidence: clampConfidence(confidence), name: 'Zigzag' };
            }
            return null;
        }

        function detectFrequencyBias() {
            if (sequence.length < 6) return null;
            const recent = sequence.slice(-20);
            const recentP = recent.filter(s => s === 'P').length / recent.length;
            const recentB = 1 - recentP;
            if (recentP > 0.55) {
                const confidence = 52 + (recentP - 0.5) * 120;
                return { prediction: 'B', confidence: clampConfidence(confidence), name: 'Frequency' };
            }
            if (recentB > 0.55) {
                const confidence = 52 + (recentB - 0.5) * 120;
                return { prediction: 'P', confidence: clampConfidence(confidence), name: 'Frequency' };
            }
            return null;
        }

        function detectRecentBias() {
            if (sequence.length < 5) return null;
            const weights = [8, 7, 6, 5, 4];
            const recent = sequence.slice(-5);
            let pWeight = 0, bWeight = 0;
            for (let i = 0; i < recent.length; i++) {
                if (recent[i] === 'P') pWeight += weights[i];
                else bWeight += weights[i];
            }
            const total = pWeight + bWeight;
            if (total === 0) return null;
            const pRate = pWeight / total;
            const bRate = bWeight / total;
            if (pRate > 0.58) {
                const confidence = 52 + (pRate - 0.5) * 130;
                return { prediction: 'B', confidence: clampConfidence(confidence), name: 'Recent' };
            }
            if (bRate > 0.58) {
                const confidence = 52 + (bRate - 0.5) * 130;
                return { prediction: 'P', confidence: clampConfidence(confidence), name: 'Recent' };
            }
            return null;
        }

        // ===== Real detector reliability (from measured hit rate + gap) =====
        function getDetectorReliability(name) {
            const hist = detectorHistory[name] || [];
            if (hist.length < 15) return 1.0; // not enough data — neutral weight

            const hits = hist.filter(h => h.correct).length;
            const hitRate = hits / hist.length;
            const edge = hitRate - 0.5;

            // Confidence gap: avg conf on correct minus avg conf on wrong
            const correctEntries = hist.filter(h => h.correct);
            const wrongEntries = hist.filter(h => !h.correct);
            const avgConfCorrect = correctEntries.length > 0
                ? correctEntries.reduce((a, b) => a + b.confidence, 0) / correctEntries.length
                : 0;
            const avgConfWrong = wrongEntries.length > 0
                ? wrongEntries.reduce((a, b) => a + b.confidence, 0) / wrongEntries.length
                : 0;
            const gap = (avgConfCorrect - avgConfWrong) / 100; // normalized

            // Reliability weight: damped range [0.5, 1.5]
            // Base from edge, secondary from gap
            let weight = 1.0 + edge * 3.0 + gap * 1.5;
            weight = Math.max(0.5, Math.min(1.5, weight));

            return weight;
        }

        // ===== Aggregation with reliability weighting =====
        function getPatternPrediction() {
            if (sequence.length < 3) return null;

            const rawDetectors = [
                detectPatterns(),
                detectStreakBias(),
                detectZigzagBias(),
                detectFrequencyBias(),
                detectRecentBias()
            ];

            const detectors = rawDetectors.filter(p => p !== null);
            if (detectors.length === 0) return null;

            let pVotes = 0, bVotes = 0;
            let pConfSum = 0, bConfSum = 0;
            const activeDetectors = [];

            for (const d of detectors) {
                const weight = getDetectorReliability(d.name);
                activeDetectors.push({ name: d.name, prediction: d.prediction, confidence: d.confidence, weight });
                if (d.prediction === 'P') { pVotes += weight; pConfSum += d.confidence * weight; }
                else { bVotes += weight; bConfSum += d.confidence * weight; }
            }

            let winner, winnerConfSum, winnerWeight;
            if (Math.abs(pVotes - bVotes) < 0.001) {
                if (Math.abs(pConfSum - bConfSum) < 0.001) return null;
                winner = pConfSum > bConfSum ? 'P' : 'B';
                winnerConfSum = winner === 'P' ? pConfSum : bConfSum;
                winnerWeight = winner === 'P' ? pVotes : bVotes;
            } else {
                winner = pVotes > bVotes ? 'P' : 'B';
                winnerConfSum = winner === 'P' ? pConfSum : bConfSum;
                winnerWeight = winner === 'P' ? pVotes : bVotes;
            }

            if (winnerWeight < 0.1) return null;

            const confidence = winnerConfSum / winnerWeight;

            return {
                prediction: winner,
                confidence: clampConfidence(confidence),
                activeDetectors
            };
        }

        // ===== Calibration adjustment: shrink overconfident predictions =====
        function applyCalibration(confidence) {
            // Find the band this confidence falls into
            const band = CALIBRATION_BANDS.find(b => confidence >= b.min && confidence <= b.max);
            if (!band || band.count < 8) return confidence; // not enough data

            const observedRate = (band.correct / band.count) * 100;
            const bandMid = (band.min + band.max) / 2;
            const overconfidence = bandMid - observedRate;

            // Shrink confidence by the measured overconfidence (damped 50%)
            const adjustment = -overconfidence * 0.5;
            return clampConfidence(confidence + adjustment);
        }

        // ===== Real confidence (no fake modifiers) =====
        function getRealConfidence(prediction, patternConfidence) {
            // Side-specific accuracy nudge (small, real)
            const sideData = prediction === 'P' ? patternAccuracy.P : patternAccuracy.B;
            let sideNudge = 0;
            if (sideData.total >= 8) {
                const sideAcc = (sideData.correct / sideData.total) * 100;
                sideNudge = (sideAcc - 50) * 0.12; // -6 .. +6 max
            }

            const raw = patternConfidence + sideNudge;
            const calibrated = applyCalibration(raw);
            return clampConfidence(calibrated);
        }

        // ===== Skip threshold: floor at 55 =====
        function getDynamicSkipThreshold() {
            let threshold = SKIP_THRESHOLD_FLOOR;

            // Recent accuracy nudge (real, measurable)
            const recentPredictions = predictionHistory.slice(-20);
            if (recentPredictions.length >= 10 && overallAccuracy.total >= 10) {
                const realAccuracy = (overallAccuracy.correct / overallAccuracy.total) * 100;
                const recentCorrect = recentPredictions.filter(p => p.correct).length;
                const recentAcc = (recentCorrect / recentPredictions.length) * 100;
                if (recentAcc > realAccuracy + 6) threshold -= 3;
                else if (recentAcc < realAccuracy - 6) threshold += 3;
            }

            return Math.round(Math.min(85, Math.max(SKIP_THRESHOLD_FLOOR, threshold)));
        }

        // ===== Final prediction =====
        function finalPrediction() {
            if (sequence.length < MIN_HANDS) return null;
            const patternResult = getPatternPrediction();
            if (!patternResult) return null;

            const realConfidence = getRealConfidence(patternResult.prediction, patternResult.confidence);
            const threshold = getDynamicSkipThreshold();
            const shouldBet = realConfidence >= threshold;

            return {
                pred: shouldBet ? patternResult.prediction : null,
                confidence: realConfidence,
                threshold,
                skip: !shouldBet,
                activeDetectors: patternResult.activeDetectors
            };
        }

        function getRunLength(arr) {
            if (arr.length === 0) return 0;
            const last = arr[arr.length - 1];
            let count = 1;
            for (let i = arr.length - 2; i >= 0; i--) {
                if (arr[i] === last) count++;
                else break;
            }
            return count;
        }

        // ========== UI ==========
        function updateHistory() {
            const box = document.getElementById('historyBox');
            const rBox = document.getElementById('resultsBox');
            if (sequence.length === 0) { box.innerHTML = "READY FOR DATA"; rBox.innerHTML = ""; return; }

        function setChangeTableLock(locked) {

            const bankerBtn = document.getElementById('bankerBtn');
            const undoBtn = document.getElementById('undoBtn');
            const resetBtn = document.getElementById('resetBtn');

            [playerBtn, bankerBtn, undoBtn].forEach(btn => {

            });

        function updatePredictionBox() {
            const box = document.getElementById('predictionBox');

            if (sequence.length < MIN_HANDS) {
                box.innerHTML = `<span style="font-size:clamp(11px,2.5vw,13px); color:#7a8595; letter-spacing:1px;">LOGGING: ${MIN_HANDS-sequence.length} MORE HANDS NEEDED</span>`;
                lastPrediction = null;
                setChangeTableLock(false);
                updateStatsBar();
                updateMetricsPanel();
                return;
            }
            
            const changeTable = checkChangeTable();
            
            if (changeTable.show) {
                box.innerHTML = `
                    <span class="change-table">
                        ⚠️ ${changeTable.reason}
                        <span class="sub">Please click <span class="highlight" onclick="resetAll()">RESET</span> and find another table</span>
                    </span>
                `;
                lastPrediction = null;
                setChangeTableLock(true);
                updateStatsBar();
                updateMetricsPanel();
                return;
            }
            
            const result = finalPrediction();
            let html = '';
            
            if (result && result.pred) {
                const text = result.pred === 'P' ? 'PLAYER' : 'BANKER';
                const cls = result.pred === 'P' ? 'player' : 'banker';
                html = `NEXT: <span class="${cls}">${text}</span> <span class="confidence">${result.confidence}%</span>`;
                lastPrediction = result.pred;
                lastPredictionConfidence = result.confidence;
            } else if (result && result.skip) {
                html = `<span style="font-size:clamp(14px,3vw,16px); color:#db2777;">⏭ SKIP (${result.confidence}% &lt; ${result.threshold}%)</span>`;
                lastPrediction = null;
            } else {
                html = "<span style='font-size:clamp(14px,3vw,16px); color:#7a8595'>ANALYZING PATTERNS...</span>";
                lastPrediction = null;
            }
            
            box.innerHTML = html;
            setChangeTableLock(false);
            updateStatsBar();
            updateMetricsPanel();
        }

        function updateStatsBar() {
            document.getElementById('winCount').textContent = wins;
            document.getElementById('lossCount').textContent = losses;
            const total = wins + losses;
            const winRate = total > 0 ? Math.round((wins / total) * 100) : 0;
            
            const realAcc = (overallAccuracy.total > 0) ? 
                Math.round((overallAccuracy.correct / overallAccuracy.total) * 100) : 0;
            
            document.getElementById('winRateDisplay').textContent = `WR: ${winRate}% | Real: ${realAcc}%`;
            
            const streak = getRunLength(sequence);
            const last = sequence.length > 0 ? sequence[sequence.length - 1] : null;
            const streakDisplay = document.getElementById('streakDisplay');
            if (last && streak > 0) {
                streakDisplay.textContent = `Streak: ${streak} ${last}`;
            } else {
                streakDisplay.textContent = 'Streak: 0';
            }
        }

        // ========== ENGINE METRICS PANEL (all direct counts) ==========
        function updateMetricsPanel() {
            const inner = document.getElementById('metricsInner');
            if (!inner) return;

            // Overall accuracy
            const total = overallAccuracy.total;
            const correct = overallAccuracy.correct;
            const acc = total > 0 ? ((correct / total) * 100).toFixed(1) : '—';

            // Per-detector stats from rolling window
            const detectorRows = DETECTOR_NAMES.map(name => {
                const hist = detectorHistory[name] || [];
                const fires = hist.length;
                if (fires === 0) {
                    return { name, fires: 0, hits: 0, hitPct: '—', edge: '—', edgeClass: 'edge-neu', gap: '—' };
                }
                const hits = hist.filter(h => h.correct).length;
                const hitRate = (hits / fires) * 100;
                const edge = hitRate - 50;
                const edgeClass = edge > 2 ? 'edge-pos' : edge < -2 ? 'edge-neg' : 'edge-neu';

                const correctEntries = hist.filter(h => h.correct);
                const wrongEntries = hist.filter(h => !h.correct);
                const avgConfC = correctEntries.length > 0
                    ? correctEntries.reduce((a, b) => a + b.confidence, 0) / correctEntries.length
                    : 0;
                const avgConfW = wrongEntries.length > 0
                    ? wrongEntries.reduce((a, b) => a + b.confidence, 0) / wrongEntries.length
                    : 0;
                const gap = correctEntries.length > 0 && wrongEntries.length > 0
                    ? (avgConfC - avgConfW).toFixed(1)
                    : '—';

                return {
                    name,
                    fires,
                    hits,
                    hitPct: hitRate.toFixed(1) + '%',
                    edge: (edge >= 0 ? '+' : '') + edge.toFixed(1) + '%',
                    edgeClass,
                    gap
                };
            }).sort((a, b) => parseFloat(b.edge) - parseFloat(a.edge));

            // Calibration table
            const calibrationRows = CALIBRATION_BANDS
                .filter(b => b.count > 0)
                .sort((a, b) => a.min - b.min)
                .map(b => {
                    const predicted = ((b.min + b.max) / 2).toFixed(0) + '%';
                    const actual = ((b.correct / b.count) * 100).toFixed(1) + '%';
                    const diff = ((b.correct / b.count) * 100) - ((b.min + b.max) / 2);
                    const diffClass = Math.abs(diff) < 5 ? 'neutral' : diff > 0 ? 'pos' : 'neg';
                    return { predicted, actual, count: b.count, diff: (diff >= 0 ? '+' : '') + diff.toFixed(1), diffClass };
                });

            let html = '';

            // Section 1: Overall
            html += `
                <div class="metrics-section">
                    <div class="metrics-section-title">Overall (all-time)</div>
                    <div class="metric-row"><span class="name">Predictions logged</span><span class="val">${total}</span></div>
                    <div class="metric-row"><span class="name">Correct</span><span class="val">${correct}</span></div>
                    <div class="metric-row"><span class="name">Hit rate</span><span class="val">${acc}${total > 0 ? '%' : ''}</span></div>
                </div>
            `;

            // Section 2: Detector table
            html += `
                <div class="metrics-section">
                    <div class="metrics-section-title">Detector Reliability (last ${DETECTOR_WINDOW} fires)</div>
                    <table class="detector-table">
                        <thead>
                            <tr>
                                <th>DETECTOR</th>
                                <th>HIT%</th>
                                <th>EDGE</th>
                                <th>FIRES</th>
                                <th>CONF GAP</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            detectorRows.forEach(r => {
                html += `
                    <tr>
                        <td>${r.name}</td>
                        <td>${r.hitPct}</td>
                        <td class="${r.edgeClass}">${r.edge}</td>
                        <td>${r.fires}</td>
                        <td>${r.gap}</td>
                    </tr>
                `;
            });
            html += `</tbody></table></div>`;

            // Section 3: Calibration
            if (calibrationRows.length > 0) {
                html += `
                    <div class="metrics-section">
                        <div class="metrics-section-title">Calibration (predicted vs actual)</div>
                        <table class="detector-table">
                            <thead>
                                <tr>
                                    <th>BAND</th>
                                    <th>ACTUAL</th>
                                    <th>DIFF</th>
                                    <th>SAMPLES</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                calibrationRows.forEach(r => {
                    html += `
                        <tr>
                            <td>${r.predicted}</td>
                            <td>${r.actual}</td>
                            <td class="${r.diffClass}">${r.diff}</td>
                            <td>${r.count}</td>
                        </tr>
                    `;
                });
                html += `</tbody></table></div>`;
            } else {
                html += `
                    <div class="metrics-section">
                        <div class="metrics-section-title">Calibration</div>
                        <div class="metric-row"><span class="name">Not enough data</span><span class="val">—</span></div>
                    </div>
                `;
            }

            inner.innerHTML = html;
        }

        // ========== RECORD RESULT ==========
        function recordResult(r) {
            if (checkChangeTable().show) return;

            if (lastPrediction) {
                const wasCorrect = (lastPrediction === r);

                // Update prediction history
                predictionHistory.push({
                    prediction: lastPrediction,
                    actual: r,
                    correct: wasCorrect,
                    confidence: lastPredictionConfidence,
                    timestamp: Date.now()
                });

                // Update detector rolling windows (attribute all active detectors)
                // We re-run the detectors to know which ones fired on the hand just recorded.
                // Note: the sequence used must be the one BEFORE this hand was appended,
                // so we compute attribution from the current sequence + the prediction.
                const attributionDetectors = [
                    detectPatterns(),
                    detectStreakBias(),
                    detectZigzagBias(),
                    detectFrequencyBias(),
                    detectRecentBias()
                ].filter(d => d !== null);

                attributionDetectors.forEach(d => {
                    const hist = detectorHistory[d.name] || [];
                    hist.push({
                        prediction: d.prediction,
                        confidence: d.confidence,
                        actual: r,
                        correct: (d.prediction === r)
                    });
                    if (hist.length > DETECTOR_WINDOW) hist.shift();
                    detectorHistory[d.name] = hist;
                });

                if (lastPrediction === 'P') {
                    patternAccuracy.P.total++;
                    if (wasCorrect) patternAccuracy.P.correct++;
                } else if (lastPrediction === 'B') {
                    patternAccuracy.B.total++;
                    if (wasCorrect) patternAccuracy.B.correct++;
                }
                overallAccuracy.total++;
                if (wasCorrect) overallAccuracy.correct++;

                localStorage.setItem('bt_prediction_history', JSON.stringify(predictionHistory));
                localStorage.setItem('bt_detector_history', JSON.stringify(detectorHistory));

                results.push(wasCorrect ? 'W' : 'L');
                if (wasCorrect) { wins++; detailedHistory.push({ type: 'win', wasSkip: false }); }
                else { losses++; detailedHistory.push({ type: 'loss', wasSkip: false }); }
            } else {
                results.push('');
                skips++;
                detailedHistory.push({ type: 'skip', wasSkip: true });
            }

            sequence.push(r);
            rebuildCalibration();
            saveAndUpdate();
        }

        // ========== UNDO ==========
        function undo() {
            if (checkChangeTable().show) return;
            if (sequence.length === 0) return;

            // Roll back prediction history entry
            if (predictionHistory.length > 0) {
                const lastPred = predictionHistory[predictionHistory.length - 1];

                if (lastPred.prediction === 'P') {
                    patternAccuracy.P.total--;
                    if (lastPred.correct) patternAccuracy.P.correct--;
                } else if (lastPred.prediction === 'B') {
                    patternAccuracy.B.total--;
                    if (lastPred.correct) patternAccuracy.B.correct--;
                }
                overallAccuracy.total--;
                if (lastPred.correct) overallAccuracy.correct--;

                predictionHistory.pop();
                localStorage.setItem('bt_prediction_history', JSON.stringify(predictionHistory));
            }

            // Roll back detector history entries for this hand
            // We pop the last entry from each detector that fired
            DETECTOR_NAMES.forEach(name => {
                const hist = detectorHistory[name] || [];
                if (hist.length > 0) hist.pop();
                detectorHistory[name] = hist;
            });
            localStorage.setItem('bt_detector_history', JSON.stringify(detectorHistory));

            sequence.pop();
            const lastResultData = results.pop();
            detailedHistory.pop();

            if (lastResultData === 'W') wins--;
            else if (lastResultData === 'L') losses--;
            else if (lastResultData === '') skips--;

            rebuildCalibration();
            saveAndUpdate();
        }

        function resetAll() {
            if (confirm("Reset all data?")) {
                sequence = [];
                results = [];
                lastPrediction = null;
                lastPredictionConfidence = 0;
                detailedHistory = [];
                predictionHistory = [];
                overallAccuracy = { correct: 0, total: 0 };
                patternAccuracy = { P: { correct: 0, total: 0 }, B: { correct: 0, total: 0 } };
                detectorHistory = {};
                DETECTOR_NAMES.forEach(name => { detectorHistory[name] = []; });
                wins = 0;
                losses = 0;
                skips = 0;

                localStorage.removeItem('bt_sequence');
                localStorage.removeItem('bt_results');
                localStorage.removeItem('bt_detailed');
                localStorage.removeItem('bt_prediction_history');
                localStorage.removeItem('bt_detector_history');
                // Wipe orphaned ELO/Sharpness keys from previous versions
                localStorage.removeItem('bt_elo_rating');
                localStorage.removeItem('bt_sharpness');
                localStorage.removeItem('bt_last_elo_change');
                localStorage.removeItem('bt_last_sharp_change');

                window.location.reload();
            }
        }

        function saveAndUpdate() {
            localStorage.setItem('bt_sequence', JSON.stringify(sequence));
            localStorage.setItem('bt_results', JSON.stringify(results));
            localStorage.setItem('bt_detailed', JSON.stringify(detailedHistory));
            updateHistory();
            updatePredictionBox();
        }

        if (sequence.length > 0 || results.length > 0) {
            results.forEach(r => { if (r === 'W') wins++; else if (r === 'L') losses++; else if (r === '') skips++; });
        }

        updateHistory();
        updatePredictionBox();
        rebuildCalibration();
        updateMetricsPanel();
    </script>
