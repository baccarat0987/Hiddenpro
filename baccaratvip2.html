<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Roulette VIP PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    
    <!-- ========== ADDED 1: CLEAN URL SCRIPT ========== -->
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <!-- ========== ADDED 2: FIREBASE AUTHENTICATION MODULE ========== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const REQUIRED_ENGINE_ID = "engine_15";

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && 
                           (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                           userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) {
                alert("Access denied: you don't have permission for Roulette VIP PRO (engine_14).");
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>
    
    <!-- ========== ADDED 3: RIGHT-CLICK & SHORTCUT BLOCKER ========== -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) {
                return false;
            }
        };
    </script>
    
    <!-- ========== ADDED 4: EXIT BUTTON STYLES ========== -->

        /* ==================== WHEEL OVERLAY (OVAL) ==================== */
        .wheel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 12, 0.94);
            backdrop-filter: blur(12px);

            to { opacity: 1; backdrop-filter: blur(12px); }

            background: linear-gradient(145deg, #12172B, #0A0E1F);

            text-align: center;
            font-size: clamp(0.6rem, 2.6vw, 0.78rem);

            letter-spacing: 1.8px;
            color: #C9B3FF;

            backdrop-filter: blur(4px);
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }
        /* Oval track container */
        .track-oval {
            position: relative;
            width: min(88vw, 620px);
            height: min(44vw, 310px);
            margin: 0 auto;
            border-radius: 999px;
        }
        /* Evolution felt background */
        .track-oval.evo {
            background: radial-gradient(ellipse at center, #6B1A1A 0%, #3A0C0C 70%, #250808 100%);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.7), 0 0 0 2px rgba(80, 30, 30, 0.6);
        }
        /* Pragmatic navy background */
        .track-oval.prag {
            background: radial-gradient(ellipse at center, #1F2A4A 0%, #111A30 70%, #0A1120 100%);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.7), 0 0 0 2px rgba(40, 60, 100, 0.6);
        }
        /* Inner empty window */
        .track-oval-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68%;
            height: 42%;
            border-radius: 999px;
            background: rgba(0,0,0,0.35);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.85);
        }
        /* Number tile base */
        .oval-num {
            position: absolute;
            display: flex;

    // ==================== APP STATE ====================
    let spinHistory = [];

    let lastPrediction = null;

    let hitCount = 0;

    // --- Chosen provider for wheel layout (set by picker overlay) ---
    let chosenProvider = null; // "evolution" | "pragmatic"

    // DOM Elements
    const numbersGrid = document.getElementById('numbersGrid');

    // ==================== ENHANCED PREDICTION LOGIC (v2, original show-behavior) ====================
    function analiz() {
        // ---- 0. HIT/MISS FEEDBACK ----
        if (lastPrediction && lastPredictionGroups.length > 0 && groupHistory.length > 0) {
            const evalWindow = groupHistory.slice(-lastPredictionGroups.length);
            const hit = evalWindow.some(g => g === lastPrediction);
            if (hit) hitCount++;
            else missCount++;
            lastPrediction = null;
            lastPredictionGroups = [];
        }

        // ---- 1. EMPTY GUARD (matches original: block only if truly empty) ----
        if (groupHistory.length === 0) {
            mainPredictionSpan.innerText = "———";
            alternativesContainer.innerHTML = `
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
            `;
            return;
        }

        // ---- 2. NORMALIZE GROUP KEYS ----
        const norm = (g) => g.split('-').map(Number).sort((a, b) => a - b).join('-');
        const normalizedHistory = groupHistory.map(norm);

        // ---- 3. WEIGHTED FREQUENCY WITH EXPONENTIAL RECENCY DECAY ----
        const startIdx = Math.max(0, normalizedHistory.length - 20);
        const lastGroups = normalizedHistory.slice(startIdx);
        const DECAY = 0.85;

        const freqMap = new Map();
        lastGroups.forEach((g, idx) => {
            const age = lastGroups.length - 1 - idx;
            const weight = Math.pow(DECAY, age);
            freqMap.set(g, (freqMap.get(g) || 0) + weight);
        });

        // ---- 4. PATTERN MATCH WITH COUNT + RECENCY DECAY ----
        if (normalizedHistory.length >= 4) {
            const lastThree = normalizedHistory.slice(-3).join(',');
            const patternHits = [];

            for (let i = 0; i <= normalizedHistory.length - 4; i++) {
                const pattern = normalizedHistory.slice(i, i + 3).join(',');
                if (pattern === lastThree) {
                    const nextGroup = normalizedHistory[i + 3];
                    const distFromEnd = normalizedHistory.length - (i + 3);
                    patternHits.push({ nextGroup, distFromEnd });
                }
            }

            const totalEval = hitCount + missCount;
            const hitRateScale = totalEval >= 3 ? (0.5 + 0.5 * (hitCount / totalEval)) : 1.0;

            for (const { nextGroup, distFromEnd } of patternHits) {
                const decay = Math.pow(0.9, distFromEnd);
                const boost = 4 * decay * hitRateScale;
                freqMap.set(nextGroup, (freqMap.get(nextGroup) || 0) + boost);
            }
        }

        // ---- 5. SORT BY SCORE (stable tie-break) ----
        const sorted = Array.from(freqMap.entries()).sort((a, b) => {
            if (b[1] !== a[1]) return b[1] - a[1];
            return a[0].localeCompare(b[0]);
        });

        // ---- 6. DEDUPLICATE ALTERNATIVES BY NUMBER OVERLAP (max 2 shared) ----
        const selected = [];
        const selectedNums = [];
        for (const [grp, score] of sorted) {
            const nums = grp.split('-').map(Number);
            const overlap = nums.filter(n => selectedNums.includes(n)).length;
            if (overlap >= 2) continue;
            selected.push([grp, score]);
            selectedNums.push(...nums);
            if (selected.length === 5) break;
        }

        // ---- 7. MAIN PREDICTION (always show top — original behavior) ----
        if (selected.length === 0) {
            mainPredictionSpan.innerText = "———";
        } else {
            mainPredictionSpan.innerText = selected[0][0];
            lastPrediction = selected[0][0];
            lastPredictionGroups = [selected[0][0]];
        }

        // ---- 8. RENDER ALTERNATIVES ----
        alternativesContainer.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            const groupValue = (i < selected.length) ? selected[i][0] : '———';
            const row = document.createElement('div');
            row.className = 'alt-row';
            row.innerText = groupValue;
            alternativesContainer.appendChild(row);
        }
    }

    // ==================== WHEEL SEQUENCE ====================
    // Standard European wheel sequence (identical for both Evolution and Pragmatic).
    // Clockwise starting from 0.
    const wheelNumbers = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
    const redSet = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);

    // ==================== PROVIDER PICKER OVERLAY ====================
    function showProviderPicker() {
        const overlay = document.createElement('div');

        // Mini preview rendering (draw each card's oval in miniature)

    // Small oval preview for the picker cards
    function renderMiniPreview(container, provider) {
        if (!container) return;
        const w = container.clientWidth;
        const h = container.clientHeight;
        const radiusX = w * 0.42;
        const radiusY = h * 0.42;
        const cx = w / 2;
        const cy = h / 2;
        const total = wheelNumbers.length;
        const tileW = Math.max(6, Math.round(w / 45));
        const tileH = Math.max(5, Math.round(h / 22));

        const inner = document.createElement('div');
        inner.style.position = 'absolute';
        inner.style.top = '50%';
        inner.style.left = '50%';
        inner.style.transform = 'translate(-50%,-50%)';
        inner.style.width = '65%';
        inner.style.height = '40%';
        inner.style.borderRadius = '999px';
        inner.style.background = 'rgba(0,0,0,0.4)';
        container.appendChild(inner);

        for (let i = 0; i < total; i++) {
            const num = wheelNumbers[i];
            const tile = document.createElement('div');
            // Layout direction depends on provider
            const angle = provider === 'evolution'
                ? (i / total) * Math.PI * 2 + Math.PI
                : -(i / total) * Math.PI * 2 + Math.PI;
            const x = cx + radiusX * Math.cos(angle) - tileW / 2;
            const y = cy + radiusY * Math.sin(angle) - tileH / 2;
            tile.style.position = 'absolute';
            tile.style.left = x + 'px';
            tile.style.top = y + 'px';
            tile.style.width = tileW + 'px';
            tile.style.height = tileH + 'px';
            tile.style.borderRadius = '1px';
            if (num === 0) tile.style.background = '#0E8F3A';
            else if (redSet.has(num)) tile.style.background = '#C62828';
            else tile.style.background = '#111114';
            container.appendChild(tile);
        }
    }

    function closePickerAndStart() {
        const picker = document.getElementById('providerPickerOverlay');
        if (picker) picker.remove();
        // Kick off the app overlay if a prediction exists
        showWheelOverlay();
    }

    // ==================== WHEEL OVERLAY (OVAL — Evolution / Pragmatic) ====================
    function showWheelOverlay() {
        // Must have a provider chosen and enough history
        if (!chosenProvider) return;
        if (overlayVisible) return;
        if (spinHistory.length < 5) return;
        const mainPredRaw = mainPredictionSpan.innerText;
        if (!mainPredRaw || mainPredRaw === '———') return;

        const numbersInGroup = mainPredRaw.split('-').map(Number).filter(n => !isNaN(n) && n >= 0 && n <= 36);
        if (numbersInGroup.length === 0) return;

        const centerIndices = [];
        const neighborIndicesSet = new Set();
        numbersInGroup.forEach(num => {
            const idx = wheelNumbers.indexOf(num);
            if (idx !== -1) {
                centerIndices.push(idx);
                for (let offset = -2; offset <= 2; offset++) {
                    if (offset === 0) continue;
                    const neighborIdx = (idx + offset + wheelNumbers.length) % wheelNumbers.length;
                    neighborIndicesSet.add(neighborIdx);
                }
            }
        });

        const overlay = document.createElement('div');
        overlay.className = 'wheel-overlay';

        const containerDiv = document.createElement('div');
        containerDiv.className = 'wheel-container';

        const closeBtn = document.createElement('div');
        closeBtn.className = 'close-wheel-btn';
        closeBtn.innerHTML = '✕';
        closeBtn.addEventListener('click', () => {
            overlay.remove();
            overlayVisible = false;
        });

        const title = document.createElement('div');
        title.className = 'wheel-title';
        const providerLabel = chosenProvider === 'evolution' ? 'EVOLUTION' : 'PRAGMATIC';
        title.innerText = `${providerLabel} • PREDICTION: ${mainPredRaw}`;

        const trackDiv = document.createElement('div');
        trackDiv.className = 'track-oval ' + (chosenProvider === 'evolution' ? 'evo' : 'prag');

        // Inner empty window
        const inner = document.createElement('div');
        inner.className = 'track-oval-inner';
        trackDiv.appendChild(inner);

        const numbersDivs = [];

        // Compute tile size based on container size
        function computeTileSize() {
            const rect = trackDiv.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            // Tile width ~= perimeter / count with a small gap
            // Approximate perimeter of oval: pi * (a+b) where a,b are semi-axes
            const a = w * 0.42;
            const b = h * 0.42;
            const perim = Math.PI * (a + b) * 1.02; // Ramanujan-lite approx for oval
            const tileW = Math.max(14, Math.floor(perim / wheelNumbers.length) - 1);
            const tileH = Math.max(22, Math.round(tileW * 1.65));
            const fontSize = Math.max(9, Math.round(tileW * 0.62));
            return { tileW, tileH, fontSize, w, h };
        }

        function positionAll() {
            const { tileW, tileH, fontSize, w, h } = computeTileSize();
            const cx = w / 2;
            const cy = h / 2;
            const radiusX = w * 0.42;
            const radiusY = h * 0.42;

            for (let i = 0; i < wheelNumbers.length; i++) {
                const tile = numbersDivs[i];
                if (!tile) continue;

                let angle;
                if (chosenProvider === 'evolution') {
                    // 0 on right edge, clockwise
                    angle = (i / wheelNumbers.length) * Math.PI * 2 + Math.PI;
                } else {
                    // Pragmatic: 0 on left edge, counter-clockwise
                    angle = -(i / wheelNumbers.length) * Math.PI * 2 + Math.PI;
                }

                const x = cx + radiusX * Math.cos(angle) - tileW / 2;
                const y = cy + radiusY * Math.sin(angle) - tileH / 2;

                tile.style.width = tileW + 'px';
                tile.style.height = tileH + 'px';
                tile.style.left = x + 'px';
                tile.style.top = y + 'px';
                tile.style.fontSize = fontSize + 'px';
            }
        }

        wheelNumbers.forEach((num, i) => {
            const tile = document.createElement('div');
            tile.classList.add('oval-num');
            tile.textContent = num;
            if (num === 0) tile.classList.add('green');
            else if (redSet.has(num)) tile.classList.add('red');
            else tile.classList.add('black');
            trackDiv.appendChild(tile);
            numbersDivs.push(tile);
        });

        centerIndices.forEach(idx => numbersDivs[idx]?.classList.add('center'));
        neighborIndicesSet.forEach(idx => {
            if (!centerIndices.includes(idx)) numbersDivs[idx]?.classList.add('neighbor');
        });

        const note = document.createElement('div');
        note.className = 'wheel-note';
        note.innerHTML = '💗 <strong style="color:#FF69B4">PINK</strong> = Main Predicted &nbsp; 💛 <strong style="color:#FFD966">Yellow</strong> = +2 Neighbors';

        containerDiv.appendChild(closeBtn);
        containerDiv.appendChild(title);
        containerDiv.appendChild(trackDiv);
        containerDiv.appendChild(note);
        overlay.appendChild(containerDiv);
        document.body.appendChild(overlay);
        overlayVisible = true;

        const resizeObserver = new ResizeObserver(() => positionAll());
        resizeObserver.observe(trackDiv);
        setTimeout(positionAll, 20);

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                resizeObserver.disconnect();
                overlay.remove();
                overlayVisible = false;
            }
        });
        closeBtn.addEventListener('click', () => {
            resizeObserver.disconnect();
            overlay.remove();
            overlayVisible = false;
        });
    }

    // ==================== UI REFRESH ====================
    function scrollToTop(container) {
        if (container) container.scrollTop = 0;
    }

    function refreshUI() {
        spinContainer.innerHTML = '';
        [...spinHistory].reverse().forEach(spin => {
            const item = document.createElement('div');
            item.className = 'spin-item';
            item.innerText = spin;
            spinContainer.appendChild(item);

        spinCountSpan.innerText = spinHistory.length;
        scrollToTop(spinContainer);
        
        groupContainer.innerHTML = '';
        groupHistory.forEach(grp => {
            const gItem = document.createElement('div');
            gItem.className = 'group-item';
            gItem.innerText = grp;
            groupContainer.appendChild(gItem);
        });
        groupCountSpan.innerText = groupHistory.length;
        if (groupContainer) groupContainer.scrollTop = groupContainer.scrollHeight;
        
        analiz();
        showWheelOverlay();
    }

    // ==================== ADD SPIN ====================
    function addSpin(number) {
        spinHistory.push(number);
        
        const groups = groupsPerNumber[number];
        if (groups && groups.length) {
            for (let g of groups) {
                groupHistory.push(g);
            }
        } else {
            groupHistory.push(`ERR-${number}`);
        }
        
        refreshUI();
        
        const spinItems = spinContainer.querySelectorAll('.spin-item');
        if (spinItems.length > 0) {
            spinItems[0].classList.add('spin-item-new');
            setTimeout(() => spinItems[0].classList.remove('spin-item-new'), 450);
        }
        
        predBox.classList.add('prediction-flash');
        setTimeout(() => predBox.classList.remove('prediction-flash'), 250);
    }

    // ==================== RESET FUNCTIONS ====================
    function hardResetFullReload() {
        window.location.reload();
    }

    // ==================== BUILD NUMBER PAD ====================
    function buildNumberPad() {
        numbersGrid.innerHTML = '';
        const redNumbers = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
        
        for (let i = 1; i <= 36; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.className = 'num-btn';
            if (redNumbers.has(i)) {
                btn.classList.add('red-num');
            } else {
                btn.classList.add('black-num');
            }
            btn.addEventListener('click', (function(val) { 
                return () => {
                    btn.classList.add('btn-flash');
                    setTimeout(() => btn.classList.remove('btn-flash'), 120);
                    addSpin(val);
                };
            })(i));
            numbersGrid.appendChild(btn);
        }
    }

    // ==================== INTERNAL REFRESH ====================
    function triggerInternalRefresh() {
        if (!appContainer) return;
        appContainer.classList.remove('internal-refresh-active');
        void appContainer.offsetWidth;
        appContainer.classList.add('internal-refresh-active');
        setTimeout(() => {
            if (appContainer) appContainer.classList.remove('internal-refresh-active');
        }, 280);
    }

    function setupInternalRefresh() {
        document.body.addEventListener('click', (e) => {
            const resetBtn = document.getElementById('clearAllBtn');
            if (resetBtn && (e.target === resetBtn || resetBtn.contains(e.target))) {
                return;
            }
            triggerInternalRefresh();
        });
    }

    // ==================== EVENT LISTENERS ====================
    zeroButton.addEventListener('click', () => {
        zeroButton.classList.add('zero-flash');
        setTimeout(() => zeroButton.classList.remove('zero-flash'), 120);
        addSpin(0);
    });

    clearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        hardResetFullReload();
    });

    // ==================== INITIALIZATION ====================
    buildNumberPad();
    
    spinHistory = [];
    groupHistory = [];
    refreshUI();
    mainPredictionSpan.innerText = "———";
    
    setupInternalRefresh();

    // Show the provider picker after a short delay to ensure fonts/DOM are ready.
    // The main app UI is visible behind the overlay but the overlay covers the screen.
    setTimeout(() => {
        showProviderPicker();
    }, 120);
</script>
</body>
</html>
