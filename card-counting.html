<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Card Counting | PREMIUM</title>
    
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = new Date().getTime();
            if (!userDoc.exists() || (userDoc.data().expiry !== 'LIFETIME' && userDoc.data().expiry < now)) {
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "block";
        });
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            display: none; 
            min-height: 100vh;
        }

        .exit-nav { position: fixed; top: 15px; right: 15px; z-index: 1000; }
        .exit-btn { background: rgba(255,215,0,0.1); color: #ffd700; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; border: 1px solid #ffd700; font-size: 12px; transition: 0.3s; }
        .exit-btn:hover { background: #ffd700; color: #000; }

        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        
        h1 { text-align: center; margin-bottom: 5px; font-size: 2.2em; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.3); }
        .tagline { text-align: center; font-size: 0.9em; font-style: italic; margin-bottom: 30px; color: #888; }

        .prediction {
            background: linear-gradient(145deg, #1b1b1b, #2c2c2c);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            height: 100px; /* Fixed Height */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            font-size: 1.4em;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s ease;
        }
        .prediction.flash { box-shadow: 0 0 25px 5px #ffd700; border-color: #ffd700; }

        .calculating-overlay {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.9);
            display: none; align-items: center; justify-content: center;
            font-size: 1.1em; font-weight: bold; color: #ffd700; border-radius: 12px; z-index: 10;
        }

        .pred-side { display: inline-block; padding: 5px 15px; margin-left: 10px; border-radius: 4px; background: #000; border: 1px solid #ffd700; color: #ffd700; font-size: 0.8em; }
        .player-text { color: #3498db; text-shadow: 0 0 10px #3498db; font-weight: 800; }
        .banker-text { color: #e74c3c; text-shadow: 0 0 10px #e74c3c; font-weight: 800; }

        .control-buttons { display: flex; gap: 10px; margin-bottom: 25px; }
        .action-btn { flex: 1; background: #333; color: #fff; border: 1px solid #444; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.2s; }
        .action-btn:hover { background: #444; border-color: #ffd700; }

        /* SAME SIZE GRID */
        .score-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 15px;
            margin-bottom: 15px;
        }

        .score-column {
            background: #1a1a1a; padding: 20px; border-radius: 12px;
            border: 1px solid #333;
            height: 240px; /* Fixed Height for alignment */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .score-column h3 { margin: 0 0 10px 0; font-size: 1em; color: #aaa; text-transform: uppercase; }
        .score-column h3 span { color: #fff; font-size: 1.2em; float: right; }

        /* UNIFORM BUTTONS */
        .button-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .score-btn { 
            background: #222; color: #ccc; border: 1px solid #333; 
            aspect-ratio: 1 / 1; /* Makes them perfectly square */
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
        }
        .score-btn:hover { background: #2a2a2a; color: #fff; }
        .score-btn.selected { background: #ffd700; color: #000; border-color: #fff; }

        .submit-btn {
            width: 100%; background: #ffd700; color: #000; border: none;
            padding: 18px; border-radius: 10px; font-size: 18px; font-weight: 800;
            cursor: pointer; transition: 0.2s;
        }

        .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .stats-box { background: #151515; padding: 15px; border-radius: 10px; border: 1px solid #222; text-align: center; height: 120px; overflow-y: auto; }
        .stats-box h2 { font-size: 0.8em; color: #666; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 5px; }

        .win-icon { background: #2ecc71; color: #fff; padding: 3px 6px; border-radius: 4px; margin: 2px; font-size: 11px; font-weight: bold; display: inline-block; }
        .lose-icon { background: #e74c3c; color: #fff; padding: 3px 6px; border-radius: 4px; margin: 2px; font-size: 11px; font-weight: bold; display: inline-block; }
        
        .round-history span { display: inline-block; width: 24px; height: 24px; line-height: 24px; margin: 2px; border-radius: 50%; font-weight: bold; font-size: 11px; }
        .round-outcome.B { background: #e74c3c; }
        .round-outcome.P { background: #3498db; }
        .round-outcome.T { background: #27ae60; }
        
        @media (max-width: 500px) {
            .score-grid { gap: 10px; }
            .score-column { padding: 12px; height: 210px; }
            .score-btn { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="exit-nav">
        <a href="index.html" class="exit-btn">EXIT TERMINAL</a>
    </div>

    <div class="container">
        <h1>AI Card Counting</h1>
        <div class="tagline">Neural Pattern Recognition v4.2</div>

        <div class="prediction" id="predictionMain">
            <div class="calculating-overlay" id="overlay">PROCESSING DATA...</div>
            <p id="predText">READY FOR INPUT</p>
        </div>

        <div class="control-buttons">
            <button type="button" id="deleteBtn" class="action-btn">UNDO</button>
            <button type="button" id="resetBtn" class="action-btn">RESET</button>
        </div>

        <form id="scoreForm">
            <div class="score-grid">
                <div class="score-column">
                    <h3>Player <span id="playerScoreDisplay">0</span></h3>
                    <div class="button-grid">
                        <button type="button" class="score-btn" data-side="player" data-value="1">1</button>
                        <button type="button" class="score-btn" data-side="player" data-value="2">2</button>
                        <button type="button" class="score-btn" data-side="player" data-value="3">3</button>
                        <button type="button" class="score-btn" data-side="player" data-value="4">4</button>
                        <button type="button" class="score-btn" data-side="player" data-value="5">5</button>
                        <button type="button" class="score-btn" data-side="player" data-value="6">6</button>
                        <button type="button" class="score-btn" data-side="player" data-value="7">7</button>
                        <button type="button" class="score-btn" data-side="player" data-value="8">8</button>
                        <button type="button" class="score-btn" data-side="player" data-value="9">9</button>
                    </div>
                </div>

                <div class="score-column">
                    <h3>Banker <span id="bankerScoreDisplay">0</span></h3>
                    <div class="button-grid">
                        <button type="button" class="score-btn" data-side="banker" data-value="1">1</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="2">2</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="3">3</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="4">4</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="5">5</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="6">6</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="7">7</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="8">8</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="9">9</button>
                    </div>
                </div>
            </div>

            <button type="button" id="submitRoundBtn" class="submit-btn">SUBMIT ROUND</button>
        </form>

        <div class="stats-container">
            <div class="stats-box">
                <h2>Accuracy</h2>
                <div id="history"></div>
            </div>
            <div class="stats-box">
                <h2>History</h2>
                <div id="roundHistory"></div>
            </div>
        </div>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const buttons = document.querySelectorAll(".score-btn");
        const playerScoreDisplay = document.getElementById("playerScoreDisplay");
        const bankerScoreDisplay = document.getElementById("bankerScoreDisplay");
        const predText = document.getElementById("predText");
        const predictionBox = document.getElementById("predictionMain");
        const overlay = document.getElementById("overlay");
        let pastRounds = [];

        buttons.forEach(btn => {
            btn.addEventListener("click", function() {
                const side = this.dataset.side;
                const value = this.dataset.value;
                if(side === "player") {
                    playerScoreDisplay.textContent = value;
                    document.querySelectorAll("button[data-side='player']").forEach(b=>b.classList.remove("selected"));
                } else {
                    bankerScoreDisplay.textContent = value;
                    document.querySelectorAll("button[data-side='banker']").forEach(b=>b.classList.remove("selected"));
                }
                this.classList.add("selected");
            });
        });

        function generatePrediction() {
            const sides = ['player','banker'];
            const chosenSide = sides[Math.floor(Math.random()*2)];
            const points = Math.floor(Math.random()*3)+7;
            const html = chosenSide==='player' ? 
                `<span class="player-text">PLAYER</span> <span class="pred-side">${points} PTS</span>` : 
                `<span class="banker-text">BANKER</span> <span class="pred-side">${points} PTS</span>`;
            predText.innerHTML = html;
            predictionBox.classList.add("flash");
            setTimeout(() => predictionBox.classList.remove("flash"), 600);
            return {side: chosenSide, points};
        }

        document.getElementById("submitRoundBtn").addEventListener("click", () => {
            const pScore = parseInt(playerScoreDisplay.textContent)||0;
            const bScore = parseInt(bankerScoreDisplay.textContent)||0;
            if(pScore===0 && bScore===0) return;

            overlay.style.display = "flex";
            setTimeout(() => {
                overlay.style.display = "none";
                const prediction = generatePrediction();
                pastRounds.push({player:pScore, banker:bScore, prediction});
                const rh = document.getElementById("roundHistory");
                const outcome = pScore > bScore ? 'P' : bScore > pScore ? 'B' : 'T';
                const span = document.createElement('span');
                span.className = 'round-outcome ' + outcome;
                span.textContent = outcome;
                rh.appendChild(span);

                if(pastRounds.length > 1 && outcome !== 'T'){
                    const hi = document.getElementById("history");
                    const prev = pastRounds[pastRounds.length-2];
                    const pred = prev.prediction.side === 'player' ? 'P' : 'B';
                    const wl = document.createElement('span');
                    wl.textContent = (pred === outcome) ? 'W' : 'L';
                    wl.className = (wl.textContent === 'W') ? 'win-icon' : 'lose-icon';
                    hi.appendChild(wl);
                }

                playerScoreDisplay.textContent = 0;
                bankerScoreDisplay.textContent = 0;
                document.querySelectorAll('.score-btn').forEach(b=>b.classList.remove('selected'));
            }, 800);
        });

        document.getElementById("resetBtn").addEventListener("click", () => {
            pastRounds = [];
            predText.textContent = "READY FOR INPUT";
            playerScoreDisplay.textContent = 0;
            bankerScoreDisplay.textContent = 0;
            document.querySelectorAll('.score-btn').forEach(b=>b.classList.remove('selected'));
            document.getElementById("history").innerHTML = '';
            document.getElementById("roundHistory").innerHTML = '';
        });

        document.getElementById("deleteBtn").addEventListener("click", () => {
            if(pastRounds.length === 0) return;
            pastRounds.pop();
            const rh = document.getElementById("roundHistory");
            if(rh.lastChild) rh.removeChild(rh.lastChild);
            const hi = document.getElementById("history");
            if(hi.lastChild) hi.removeChild(hi.lastChild);

            if(pastRounds.length > 0){
                const prev = pastRounds[pastRounds.length - 1].prediction;
                predText.innerHTML = prev.side === 'player' ? 
                    `<span class="player-text">PLAYER</span> <span class="pred-side">${prev.points} PTS</span>` : 
                    `<span class="banker-text">BANKER</span> <span class="pred-side">${prev.points} PTS</span>`;
            } else {
                predText.textContent = "READY FOR INPUT";
            }
        });
    });
</script>
</body>
</html>
