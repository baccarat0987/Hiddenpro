<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Card Counting Premium</title>
    
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { 
                window.location.href = "index.html"; 
                return; 
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = new Date().getTime();
            
            if (!userDoc.exists() || (userDoc.data().expiry !== 'LIFETIME' && userDoc.data().expiry < now)) {
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "block";
        });
    </script>

    <style>
        :root {
            --gold: #ffd700;
            --player-blue: #3498db;
            --banker-red: #e74c3c;
            --bg-dark: #0d0d0d;
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark), #1a1a1a);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            display: none; /* Security Guard */
            min-height: 100vh;
        }

        .exit-nav { position: fixed; top: 15px; right: 15px; z-index: 1000; }
        .exit-btn { 
            background: rgba(255, 215, 0, 0.1); 
            color: var(--gold); 
            padding: 8px 16px; 
            border-radius: 5px; 
            text-decoration: none; 
            font-weight: bold; 
            border: 1px solid var(--gold); 
            font-size: 12px; 
            transition: 0.3s; 
            text-transform: uppercase;
        }
        .exit-btn:hover { background: var(--gold); color: #000; }

        .container { max-width: 650px; margin: 0 auto; padding: 40px 15px; box-sizing: border-box; }
        
        h1 { text-align: center; margin-bottom: 5px; font-size: 1.8em; color: var(--gold); letter-spacing: 2px; }
        .tagline { text-align: center; font-size: 0.8em; margin-bottom: 25px; color: #666; text-transform: uppercase; letter-spacing: 1px; }

        .prediction {
            background: #111;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            height: 110px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .calculating-overlay {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.95);
            display: none; align-items: center; justify-content: center;
            font-size: 1em; color: var(--gold); border-radius: 12px; z-index: 10;
            font-weight: bold; letter-spacing: 2px;
        }

        .player-text { color: var(--player-blue); font-weight: 800; font-size: 2.3em; text-shadow: 0 0 15px rgba(52, 152, 219, 0.4); }
        .banker-text { color: var(--banker-red); font-weight: 800; font-size: 2.3em; text-shadow: 0 0 15px rgba(231, 76, 60, 0.4); }
        .pred-side { display: inline-block; padding: 6px 14px; margin-left: 12px; border-radius: 4px; background: #000; border: 1px solid var(--gold); color: var(--gold); font-size: 0.8em; font-weight: bold; }

        .control-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .action-btn { flex: 1; background: #222; color: #fff; border: 1px solid #444; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .action-btn:hover { border-color: var(--gold); color: var(--gold); }

        .score-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 15px;
            margin-bottom: 15px;
        }

        .score-column {
            background: #181818; 
            padding: 18px; 
            border-radius: 12px;
            border: 1px solid #333;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .score-column h3 { margin: 0 0 15px 0; font-size: 0.85em; color: var(--gold); display: flex; justify-content: space-between; align-items: center; opacity: 0.8; }
        .score-column h3 span { color: #fff; font-size: 1.5em; font-weight: 900; }

        .button-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
        }

        .score-btn { 
            background: #252525; 
            color: #fff; 
            border: 1px solid #3d3d3d; 
            padding: 15px 0; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 20px;
            transition: 0.2s;
            width: 100%;
        }

        .score-btn:hover { background: #333; border-color: #555; }
        .score-btn.selected { background: var(--gold); color: #000; border-color: #fff; box-shadow: 0 0 15px rgba(255,215,0,0.3); }

        /* New zero button style */
        .zero-btn {
            background: #1e1e1e;
            border-color: #555;
            color: #aaa;
            font-size: 18px;
        }
        .zero-btn.selected {
            background: #888;
            color: #000;
            border-color: #fff;
        }

        .submit-btn {
            width: 100%; background: var(--gold); color: #000; border: none;
            padding: 20px; border-radius: 10px; font-size: 20px; font-weight: 900;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            text-transform: uppercase; letter-spacing: 1px;
        }

        .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .stats-box { background: #111; padding: 15px; border-radius: 10px; border: 1px solid #222; text-align: center; height: 110px; overflow-y: auto; }
        .stats-box h2 { font-size: 0.7em; color: #444; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 5px; letter-spacing: 1px; }

        .win-icon { background: #2ecc71; color: #fff; padding: 3px 8px; border-radius: 4px; margin: 2px; font-size: 11px; font-weight: bold; display: inline-block; }
        .lose-icon { background: #e74c3c; color: #fff; padding: 3px 8px; border-radius: 4px; margin: 2px; font-size: 11px; font-weight: bold; display: inline-block; }
        
        .round-outcome { display: inline-block; width: 26px; height: 26px; line-height: 26px; margin: 2px; border-radius: 50%; font-weight: bold; font-size: 11px; color: #fff; text-shadow: 1px 1px 1px #000; text-align: center;}
        .round-outcome.B { background: var(--banker-red); }
        .round-outcome.P { background: var(--player-blue); }
        .round-outcome.T { background: #27ae60; }

        @media (max-width: 480px) {
            .score-grid { grid-template-columns: 1fr; }
            .player-text, .banker-text { font-size: 1.8em; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="exit-nav">
        <a href="index.html" class="exit-btn">EXIT TERMINAL</a>
    </div>

    <div class="container">
        <h1>AI CARD COUNTING</h1>
        <div class="tagline">Neural Logic Engine v4.2</div>

        <div class="prediction" id="predictionMain">
            <div class="calculating-overlay" id="overlay">ANALYZING SHOE...</div>
            <p id="predText" style="color: #444; font-size: 0.85em; font-weight: bold;">[ ENGINE STANDBY ]</p>
        </div>

        <div class="control-buttons">
            <button type="button" id="deleteBtn" class="action-btn">UNDO ENTRY</button>
            <button type="button" id="resetBtn" class="action-btn">CLEAR CACHE</button>
        </div>

        <form id="scoreForm">
            <div class="score-grid">
                <div class="score-column">
                    <h3>PLAYER <span id="playerScoreDisplay">0</span></h3>
                    <div class="button-grid">
                        <!-- 0 button added as first item -->
                        <button type="button" class="score-btn zero-btn" data-side="player" data-value="0">0</button>
                        <button type="button" class="score-btn" data-side="player" data-value="1">1</button>
                        <button type="button" class="score-btn" data-side="player" data-value="2">2</button>
                        <button type="button" class="score-btn" data-side="player" data-value="3">3</button>
                        <button type="button" class="score-btn" data-side="player" data-value="4">4</button>
                        <button type="button" class="score-btn" data-side="player" data-value="5">5</button>
                        <button type="button" class="score-btn" data-side="player" data-value="6">6</button>
                        <button type="button" class="score-btn" data-side="player" data-value="7">7</button>
                        <button type="button" class="score-btn" data-side="player" data-value="8">8</button>
                        <button type="button" class="score-btn" data-side="player" data-value="9">9</button>
                    </div>
                </div>

                <div class="score-column">
                    <h3>BANKER <span id="bankerScoreDisplay">0</span></h3>
                    <div class="button-grid">
                        <!-- 0 button added as first item -->
                        <button type="button" class="score-btn zero-btn" data-side="banker" data-value="0">0</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="1">1</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="2">2</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="3">3</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="4">4</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="5">5</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="6">6</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="7">7</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="8">8</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="9">9</button>
                    </div>
                </div>
            </div>

            <button type="button" id="submitRoundBtn" class="submit-btn">SUBMIT ROUND</button>
        </form>

        <div class="stats-container">
            <div class="stats-box">
                <h2>AI Accuracy</h2>
                <div id="history"></div>
            </div>
            <div class="stats-box">
                <h2>Shoe Pattern</h2>
                <div id="roundHistory"></div>
            </div>
        </div>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const buttons = document.querySelectorAll(".score-btn");
        const playerScoreDisplay = document.getElementById("playerScoreDisplay");
        const bankerScoreDisplay = document.getElementById("bankerScoreDisplay");
        const predText = document.getElementById("predText");
        const overlay = document.getElementById("overlay");
        let pastRounds = [];

        // Initialize scores at 0 (already default, but explicit)
        // Player and Banker displays start at 0
        playerScoreDisplay.textContent = '0';
        bankerScoreDisplay.textContent = '0';

        buttons.forEach(btn => {
            btn.addEventListener("click", function() {
                const side = this.dataset.side;
                if(side === "player") {
                    playerScoreDisplay.textContent = this.dataset.value;
                    document.querySelectorAll("button[data-side='player']").forEach(b=>b.classList.remove("selected"));
                } else {
                    bankerScoreDisplay.textContent = this.dataset.value;
                    document.querySelectorAll("button[data-side='banker']").forEach(b=>b.classList.remove("selected"));
                }
                this.classList.add("selected");
            });
        });

        function generatePrediction() {
            const sides = ['player','banker'];
            const chosenSide = sides[Math.floor(Math.random()*2)];
            const points = Math.floor(Math.random()*3)+7;
            predText.innerHTML = chosenSide==='player' ? 
                `<span class="player-text">PLAYER</span> <span class="pred-side">${points} PTS</span>` : 
                `<span class="banker-text">BANKER</span> <span class="pred-side">${points} PTS</span>`;
            return {side: chosenSide, points};
        }

        document.getElementById("submitRoundBtn").addEventListener("click", () => {
            const p = parseInt(playerScoreDisplay.textContent)||0;
            const b = parseInt(bankerScoreDisplay.textContent)||0;
            // Allow submit even if both are 0? We'll keep the check as is: if both are 0, ignore
            // But after adding 0 button, user might want to record 0-0? The original behaviour blocks 0-0.
            // We'll keep it, but we also want to clear after submit as per new requirement.
            if(p===0 && b===0) return;

            overlay.style.display = "flex";
            setTimeout(() => {
                overlay.style.display = "none";
                const prediction = generatePrediction();
                pastRounds.push({p, b, prediction});
                
                const outcome = p > b ? 'P' : b > p ? 'B' : 'T';
                const span = document.createElement('span');
                span.className = 'round-outcome ' + outcome;
                span.textContent = outcome;
                document.getElementById("roundHistory").appendChild(span);

                if(pastRounds.length > 1 && outcome !== 'T'){
                    const prev = pastRounds[pastRounds.length-2];
                    const predSide = prev.prediction.side === 'player' ? 'P' : 'B';
                    const wl = document.createElement('span');
                    wl.textContent = (predSide === outcome) ? 'W' : 'L';
                    wl.className = (wl.textContent === 'W') ? 'win-icon' : 'lose-icon';
                    document.getElementById("history").appendChild(wl);
                }

                // Reset the score displays to 0 (dash effect? we use 0)
                // The requirement: after submit the record number of player and banker are ( - )
                // So we replace the number with a dash '-'
                playerScoreDisplay.textContent = '-';
                bankerScoreDisplay.textContent = '-';
                document.querySelectorAll('.score-btn').forEach(b=>b.classList.remove('selected'));
            }, 700);
        });

        document.getElementById("resetBtn").addEventListener("click", () => {
            if(confirm("Wipe all engine data for this session?")) location.reload();
        });

        document.getElementById("deleteBtn").addEventListener("click", () => {
            if(pastRounds.length === 0) return;
            pastRounds.pop();
            const rh = document.getElementById("roundHistory");
            if(rh.lastChild) rh.removeChild(rh.lastChild);
            const hi = document.getElementById("history");
            if(hi.lastChild) hi.removeChild(hi.lastChild);
        });
    });

    // Terminal Security
    (function() {
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };
        setInterval(function() {
            (function() { return false; }['constructor']('debugger')['call']());
        }, 50);
    })();
</script>
</body>
</html>
