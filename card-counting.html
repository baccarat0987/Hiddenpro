<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Card Counting · Table Change Advisor</title>
    
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { 
                window.location.href = "index.html"; 
                return; 
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = new Date().getTime();
            
            if (!userDoc.exists() || (userDoc.data().expiry !== 'LIFETIME' && userDoc.data().expiry < now)) {
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>

    <style>
        :root {
            --gold: #ffd700;
            --player-cyan: #00e5ff;
            --player-blue: #1565c0;
            --player-navy: #0d1b4c;
            --banker-red: #ff1744;
            --banker-pink: #ff4081;
            --banker-deep: #8b0030;
            --bg-dark: #0d0d0d;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark), #1a1a1a);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: none; /* Security Guard */
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* ===== EXIT APPS BUTTON (themed to app palette) ===== */
        .exit-nav { position: fixed; top: 18px; right: 18px; z-index: 1000; }
        .exit-btn { 
            background: linear-gradient(135deg,
                rgba(0, 229, 255, 0.15) 0%,
                rgba(21, 101, 192, 0.15) 50%,
                rgba(255, 64, 129, 0.15) 100%);
            color: #fff; 
            padding: 12px 20px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-weight: 900; 
            border: 1px solid rgba(0, 229, 255, 0.6);
            font-size: 10px; 
            letter-spacing: 1.5px;
            transition: 0.3s; 
            text-transform: uppercase;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow:
                0 0 15px rgba(0, 229, 255, 0.35),
                0 0 25px rgba(255, 64, 129, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }
        .exit-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
                var(--player-cyan) 0%,
                var(--player-blue) 35%,
                var(--banker-red) 65%,
                var(--banker-pink) 100%);
            opacity: 0;
            transition: 0.3s;
            z-index: -1;
        }
        .exit-btn:hover { 
            color: #fff;
            border-color: #fff;
            box-shadow:
                0 0 25px rgba(0, 229, 255, 0.8),
                0 0 35px rgba(255, 64, 129, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transform: scale(1.06);
            text-shadow: 0 0 8px rgba(255,255,255,0.9);
        }
        .exit-btn:hover::before { opacity: 1; }

        .container { 
            width: 100%;
            max-width: 420px; 
            margin: 0 auto; 
            padding: 20px 12px; 
            transform: scale(1.2);
            transform-origin: center center;
            position: relative;
        }
        
        /* ===== ANIMATED GRADIENT TITLE ===== */
        h1 { 
            text-align: center; 
            margin-bottom: 3px; 
            font-size: 1.3em; 
            letter-spacing: 2px; 
            font-weight: 900;

            background: linear-gradient(90deg,
                var(--player-cyan) 0%,
                var(--player-blue) 20%,
                var(--banker-red) 50%,
                var(--banker-pink) 70%,
                var(--player-cyan) 100%);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;

            animation: gradientFlow 4s linear infinite;

            filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.45))
                    drop-shadow(0 0 10px rgba(255, 64, 129, 0.35));
        }

        @keyframes gradientFlow {
            0%   { background-position:   0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .tagline { 
            text-align: center; 
            font-size: 0.65em; 
            margin-bottom: 14px; 
            color: #666; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        .prediction {
            background: #111;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 12px;
            height: 80px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* ===== ANIMATED LOADER OVERLAY ===== */
        .calculating-overlay {
            position: absolute; inset: 0; 
            background: rgba(0, 0, 0, 0.96);
            display: none; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            border-radius: 10px; 
            z-index: 10;
            padding: 10px 20px;
            gap: 8px;
        }

        .calculating-overlay.active {
            display: flex;
        }

        .loader-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .loader-label {
            font-size: 0.7em;
            font-weight: bold;
            letter-spacing: 2px;
            background: linear-gradient(90deg,
                var(--player-cyan),
                var(--player-blue),
                var(--banker-red),
                var(--banker-pink),
                var(--player-cyan));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: gradientFlow 2s linear infinite;
        }

        .loader-counter {
            font-size: 0.9em;
            font-weight: 900;
            color: var(--player-cyan);
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.7);
            min-width: 42px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            transition: color 0.2s, text-shadow 0.2s;
        }

        .loader-bar-track {
            width: 85%;
            height: 7px;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.7);
        }

        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg,
                var(--player-blue),
                var(--player-cyan),
                var(--banker-red),
                var(--banker-pink));
            background-size: 200% 100%;
            border-radius: 4px;
            animation: barFlow 1.5s linear infinite;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.6), 0 0 12px rgba(255, 23, 68, 0.5);
            transition: width 0.1s linear;
        }

        @keyframes barFlow {
            0%   { background-position:   0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .loader-dots {
            display: flex;
            gap: 5px;
        }
        .loader-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: dotPulse 1.2s ease-in-out infinite;
        }
        .loader-dots span:nth-child(1) { background: var(--player-cyan); animation-delay: 0s; }
        .loader-dots span:nth-child(2) { background: var(--player-blue); animation-delay: 0.2s; }
        .loader-dots span:nth-child(3) { background: var(--banker-red); animation-delay: 0.4s; }
        .loader-dots span:nth-child(4) { background: var(--banker-pink); animation-delay: 0.6s; }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.3; transform: scale(0.7); }
            50%      { opacity: 1;   transform: scale(1.2); }
        }

        .player-text { 
            color: var(--player-cyan); 
            font-weight: 800; 
            font-size: 1.6em; 
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.5); 
        }
        .banker-text { 
            color: var(--banker-red); 
            font-weight: 800; 
            font-size: 1.6em; 
            text-shadow: 0 0 15px rgba(255, 23, 68, 0.5); 
        }
        .pred-side { 
            display: inline-block; 
            padding: 3px 8px; 
            margin-left: 8px; 
            border-radius: 4px; 
            background: #000; 
            border: 1px solid var(--gold); 
            color: var(--gold); 
            font-size: 0.65em; 
            font-weight: bold; 
        }

        .control-buttons { display: flex; gap: 8px; margin-bottom: 12px; }
        .action-btn { flex: 1; background: #222; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; transition: 0.2s; }
        .action-btn:hover { border-color: var(--gold); color: var(--gold); }

        .score-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 10px;
            margin-bottom: 10px;
        }

        .score-column {
            background: #181818; 
            padding: 12px; 
            border-radius: 10px;
            border: 1px solid #333;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .score-column.player-col {
            border-color: var(--player-blue);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 0 12px rgba(21, 101, 192, 0.3);
        }
        .score-column.player-col h3 { color: var(--player-cyan); }
        .score-column.player-col h3 span { color: var(--player-cyan); }

        .score-column.banker-col {
            border-color: var(--banker-red);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 0 12px rgba(255, 23, 68, 0.3);
        }
        .score-column.banker-col h3 { color: var(--banker-pink); }
        .score-column.banker-col h3 span { color: var(--banker-pink); }

        .score-column h3 { margin: 0 0 10px 0; font-size: 0.7em; display: flex; justify-content: space-between; align-items: center; opacity: 0.9; }
        .score-column h3 span { font-size: 1.2em; font-weight: 900; }

        .keypad {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .keypad-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .keypad-row.single {
            display: flex;
            justify-content: center;
        }
        .keypad-row.single .score-btn {
            width: calc((100% - 12px) / 3);
        }

        .score-btn { 
            background: #252525; 
            color: #fff; 
            border: 1px solid #3d3d3d; 
            padding: 10px 0; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px;
            transition: 0.2s;
            width: 100%;
        }

        .player-col .score-btn:hover { 
            background: #1a237e; 
            border-color: var(--player-cyan); 
            color: var(--player-cyan);
        }
        .player-col .score-btn.selected { 
            background: var(--player-cyan); 
            color: #000; 
            border-color: #fff; 
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.6); 
        }

        .banker-col .score-btn:hover { 
            background: #4a0020; 
            border-color: var(--banker-pink); 
            color: var(--banker-pink);
        }
        .banker-col .score-btn.selected { 
            background: var(--banker-red); 
            color: #fff; 
            border-color: #fff; 
            box-shadow: 0 0 12px rgba(255, 23, 68, 0.6); 
        }

        .zero-btn {
            background: #1e1e1e;
            border-color: #555;
            color: #aaa;
            font-size: 13px;
        }
        .player-col .zero-btn.selected {
            background: var(--player-cyan);
            color: #000;
            border-color: #fff;
        }
        .banker-col .zero-btn.selected {
            background: var(--banker-red);
            color: #fff;
            border-color: #fff;
        }

        .submit-btn {
            width: 100%; 
            background: linear-gradient(90deg, var(--player-blue) 0%, var(--player-cyan) 35%, var(--banker-red) 65%, var(--banker-pink) 100%);
            color: #fff; 
            border: 1px solid rgba(255,255,255,0.2);
            padding: 14px; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: 900;
            cursor: pointer; 
            box-shadow: 0 5px 20px rgba(0, 229, 255, 0.25), 0 5px 20px rgba(255, 23, 68, 0.25);
            text-transform: uppercase; 
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            transition: 0.3s;
        }
        .submit-btn:hover {
            box-shadow: 0 5px 25px rgba(0, 229, 255, 0.5), 0 5px 25px rgba(255, 23, 68, 0.5);
            filter: brightness(1.1);
        }

        .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
        .stats-box { background: #111; padding: 10px; border-radius: 8px; border: 1px solid #222; text-align: center; height: 80px; overflow-y: auto; }
        .stats-box h2 { font-size: 0.6em; color: #444; text-transform: uppercase; margin-bottom: 6px; border-bottom: 1px solid #222; padding-bottom: 3px; letter-spacing: 1px; }

        .win-icon { 
            background: linear-gradient(135deg, var(--player-blue), var(--player-cyan));
            color: #fff; 
            padding: 2px 6px; 
            border-radius: 3px; 
            margin: 1px; 
            font-size: 9px; 
            font-weight: bold; 
            display: inline-block; 
            box-shadow: 0 0 6px rgba(0, 229, 255, 0.45);
        }
        .lose-icon { 
            background: linear-gradient(135deg, var(--banker-deep), var(--banker-red));
            color: #fff; 
            padding: 2px 6px; 
            border-radius: 3px; 
            margin: 1px; 
            font-size: 9px; 
            font-weight: bold; 
            display: inline-block; 
            box-shadow: 0 0 6px rgba(255, 23, 68, 0.45);
        }
        
        .round-outcome { display: inline-block; width: 20px; height: 20px; line-height: 20px; margin: 1px; border-radius: 50%; font-weight: bold; font-size: 9px; color: #fff; text-shadow: 1px 1px 1px #000; text-align: center;}
        .round-outcome.B { background: var(--banker-red); }
        .round-outcome.P { background: var(--player-blue); }
        .round-outcome.T { background: #27ae60; }

        /* ===== TABLE CHANGE OVERLAY (full screen grey-out) ===== */
        .table-change-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 10, 0.88);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
            padding: 20px;
            text-align: center;
            animation: overlayFadeIn 0.4s ease;
        }
        .table-change-overlay.active {
            display: flex;
        }
        @keyframes overlayFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* Blinking border/glow wrapper for the advice box */
        .advice-box {
            background: rgba(15, 15, 15, 0.95);
            border-radius: 14px;
            padding: 28px 24px;
            max-width: 340px;
            width: 100%;
            border: 2px solid rgba(255, 215, 0, 0.4);
            animation: blinkBorder 2s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2), 0 0 30px rgba(255, 64, 129, 0.15);
        }

        @keyframes blinkBorder {
            0%, 100% {
                border-color: rgba(255, 215, 0, 0.25);
                box-shadow: 0 0 20px rgba(0, 229, 255, 0.15), 0 0 20px rgba(255, 64, 129, 0.1);
            }
            50% {
                border-color: rgba(255, 215, 0, 0.9);
                box-shadow: 0 0 40px rgba(0, 229, 255, 0.45), 0 0 40px rgba(255, 64, 129, 0.35);
            }
        }

        .advice-title {
            font-size: 1.2em;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg,
                var(--player-cyan),
                var(--player-blue),
                var(--banker-red),
                var(--banker-pink),
                var(--player-cyan));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientFlow 3s linear infinite;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.4));
        }

        .advice-stats {
            font-size: 0.95em;
            color: #fff;
            margin-bottom: 14px;
            line-height: 1.6;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .advice-stats .bad {
            color: var(--banker-red);
            font-weight: 900;
            text-shadow: 0 0 8px rgba(255, 23, 68, 0.6);
        }
        .advice-stats .good {
            color: var(--player-cyan);
            font-weight: 900;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
        }

        .advice-description {
            font-size: 0.72em;
            color: #999;
            margin-bottom: 20px;
            line-height: 1.6;
            padding: 0 5px;
            font-weight: 400;
            letter-spacing: 0.3px;
            font-style: italic;
            border-top: 1px solid rgba(255,255,255,0.08);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 10px 5px;
        }

        .dismiss-btn {
            background: linear-gradient(135deg,
                rgba(0, 229, 255, 0.15) 0%,
                rgba(21, 101, 192, 0.15) 50%,
                rgba(255, 64, 129, 0.15) 100%);
            color: #fff;
            border: 1px solid rgba(0, 229, 255, 0.6);
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 0.85em;
            letter-spacing: 1.5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.25), 0 0 15px rgba(255, 64, 129, 0.15);
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }
        .dismiss-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
                var(--player-cyan) 0%,
                var(--player-blue) 35%,
                var(--banker-red) 65%,
                var(--banker-pink) 100%);
            opacity: 0;
            transition: 0.3s;
            z-index: -1;
        }
        .dismiss-btn:hover {
            border-color: #fff;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.8), 0 0 30px rgba(255, 64, 129, 0.5);
            transform: scale(1.05);
            text-shadow: 0 0 8px rgba(255,255,255,0.9);
        }
        .dismiss-btn:hover::before { opacity: 1; }

        /* When overlay is active, dim and disable everything except RESET */
        body.overlay-active .exit-nav,
        body.overlay-active .container > h1,
        body.overlay-active .container > .tagline,
        body.overlay-active .prediction,
        body.overlay-active .control-buttons .action-btn:not(#resetBtn),
        body.overlay-active #scoreForm,
        body.overlay-active .stats-container {
            pointer-events: none;
            opacity: 0.25;
            filter: grayscale(0.8);
            transition: opacity 0.3s, filter 0.3s;
        }
        /* Keep RESET button fully visible and clickable */
        body.overlay-active .control-buttons #resetBtn {
            pointer-events: auto;
            opacity: 1;
            filter: none;
            position: relative;
            z-index: 600;
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        @media (max-width: 400px) {
            .score-grid { grid-template-columns: 1fr; }
            .container { transform: scale(1); padding: 15px 10px; }
            .player-text, .banker-text { font-size: 1.3em; }
            .exit-btn { font-size: 13px; padding: 10px 18px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="exit-nav">
        <a href="index.html" class="exit-btn">EXIT APPS</a>
    </div>

    <div class="container">
        <h1>AI CARD COUNTING</h1>
        <div class="tagline">Edward O.Thorp</div>

        <div class="prediction" id="predictionMain">
            <div class="calculating-overlay" id="overlay">
                <div class="loader-row">
                    <span class="loader-label">ANALYZING</span>
                    <span class="loader-counter" id="loaderCounter">000</span>
                </div>
                <div class="loader-bar-track">
                    <div class="loader-bar-fill" id="loaderBar"></div>
                </div>
                <div class="loader-dots">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>

            <p id="predText" style="color: #444; font-size: 0.7em; font-weight: bold;">[ STANDBY ]</p>
        </div>

        <div class="control-buttons">
            <button type="button" id="deleteBtn" class="action-btn">UNDO</button>
            <button type="button" id="resetBtn" class="action-btn">RESET</button>
        </div>

        <form id="scoreForm">
            <div class="score-grid">
                <div class="score-column player-col">
                    <h3>PLAYER <span id="playerScoreDisplay">-</span></h3>
                    <div class="keypad">
                        <div class="keypad-row single">
                            <button type="button" class="score-btn zero-btn" data-side="player" data-value="0">0</button>
                        </div>
                        <div class="keypad-row">
                            <button type="button" class="score-btn" data-side="player" data-value="1">1</button>
                            <button type="button" class="score-btn" data-side="player" data-value="2">2</button>
                            <button type="button" class="score-btn" data-side="player" data-value="3">3</button>
                        </div>
                        <div class="keypad-row">
                            <button type="button" class="score-btn" data-side="player" data-value="4">4</button>
                            <button type="button" class="score-btn" data-side="player" data-value="5">5</button>
                            <button type="button" class="score-btn" data-side="player" data-value="6">6</button>
                        </div>
                        <div class="keypad-row">
                            <button type="button" class="score-btn" data-side="player" data-value="7">7</button>
                            <button type="button" class="score-btn" data-side="player" data-value="8">8</button>
                            <button type="button" class="score-btn" data-side="player" data-value="9">9</button>
                        </div>
                    </div>
                </div>

                <div class="score-column banker-col">
                    <h3>BANKER <span id="bankerScoreDisplay">-</span></h3>
                    <div class="keypad">
                        <div class="keypad-row single">
                            <button type="button" class="score-btn zero-btn" data-side="banker" data-value="0">0</button>
                        </div>
                        <div class="keypad-row">
                            <button type="button" class="score-btn" data-side="banker" data-value="1">1</button>
                            <button type="button" class="score-btn" data-side="banker" data-value="2">2</button>
                            <button type="button" class="score-btn" data-side="banker" data-value="3">3</button>
                        </div>
                        <div class="keypad-row">
                            <button type="button" class="score-btn" data-side="banker" data-value="4">4</button>
                            <button type="button" class="score-btn" data-side="banker" data-value="5">5</button>
                            <button type="button" class="score-btn" data-side="banker" data-value="6">6</button>
                        </div>
                        <div class="keypad-row">
                            <button type="button" class="score-btn" data-side="banker" data-value="7">7</button>
                            <button type="button" class="score-btn" data-side="banker" data-value="8">8</button>
                            <button type="button" class="score-btn" data-side="banker" data-value="9">9</button>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" id="submitRoundBtn" class="submit-btn">SUBMIT ROUND</button>
        </form>

        <div class="stats-container">
            <div class="stats-box">
                <h2>WIN/LOSE History</h2>
                <div id="history"></div>
            </div>
            <div class="stats-box">
                <h2>History</h2>
                <div id="roundHistory"></div>
            </div>
        </div>
    </div>

    <!-- ===== TABLE CHANGE OVERLAY (full screen, no icon) ===== -->
    <div class="table-change-overlay" id="tableChangeOverlay">
        <div class="advice-box">
            <div class="advice-title">CHANGE TABLE</div>
            <div class="advice-stats" id="adviceStats"></div>
            <div class="advice-description" id="adviceDescription">
                Current pattern indicates more losses than wins. For optimal performance, it is recommended to switch tables and reset your session.
            </div>
            <button type="button" class="dismiss-btn" id="dismissOverlayBtn">RESET</button>
        </div>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const buttons = document.querySelectorAll(".score-btn");
        const playerScoreDisplay = document.getElementById("playerScoreDisplay");
        const bankerScoreDisplay = document.getElementById("bankerScoreDisplay");
        const predText = document.getElementById("predText");
        const overlay = document.getElementById("overlay");
        const loaderCounter = document.getElementById("loaderCounter");
        const loaderBar = document.getElementById("loaderBar");
        const historyDiv = document.getElementById("history");
        const roundHistoryDiv = document.getElementById("roundHistory");
        const tableChangeOverlay = document.getElementById("tableChangeOverlay");
        const adviceStats = document.getElementById("adviceStats");
        const adviceDescription = document.getElementById("adviceDescription");
        const dismissOverlayBtn = document.getElementById("dismissOverlayBtn");
        const resetBtn = document.getElementById("resetBtn");

        let pastRounds = [];
        let outcomeSequence = []; // stores 'W' or 'L' (skips Ties)

        // Track whether user has selected a value on each side
        let playerSelected = false;
        let bankerSelected = false;

        // Initialize display with dash (no selection yet)
        playerScoreDisplay.textContent = '-';
        bankerScoreDisplay.textContent = '-';

        // ===== TABLE CHANGE LOGIC =====
        function analyzeWinLossPatterns() {
            const first5 = outcomeSequence.slice(0, 5);
            const last7  = outcomeSequence.slice(-7);
            const last10 = outcomeSequence.slice(-10);

            const first5Losses = first5.filter(r => r === 'L').length;
            const first5Wins   = first5.filter(r => r === 'W').length;

            const last7Losses = last7.filter(r => r === 'L').length;
            const last7Wins   = last7.filter(r => r === 'W').length;

            const last10Losses = last10.filter(r => r === 'L').length;
            const last10Wins   = last10.filter(r => r === 'W').length;

            const reasons = [];

            // Rule 1: First 5 results — more losing than winning (needs exactly 5 results)
            if (first5.length === 5 && first5Losses > first5Wins) {
                reasons.push(`Result: <span class="bad">${first5Losses}L</span> vs <span class="good">${first5Wins}W</span>`);
            }

            // Rule 2: Last 7 results — more losing than winning (needs exactly 7 results)
            if (last7.length === 7 && last7Losses > last7Wins) {
                reasons.push(`RESULT: <span class="bad">${last7Losses}L</span> vs <span class="good">${last7Wins}W</span>`);
            }

            // Rule 3: Last 10 results — more losing than winning (needs exactly 10 results)
            if (last10.length === 10 && last10Losses > last10Wins) {
                reasons.push(`Last 10: <span class="bad">${last10Losses}L</span> vs <span class="good">${last10Wins}W</span>`);
            }

            // If ANY pattern shows more losses than wins, recommend change
            if (reasons.length > 0) {
                adviceStats.innerHTML = reasons.join('<br>');
                adviceDescription.textContent = 'Current pattern indicates more losses than wins. For optimal performance, it is recommended to switch tables and reset your session.';
                tableChangeOverlay.classList.add('active');
                document.body.classList.add('overlay-active');
            } else {
                tableChangeOverlay.classList.remove('active');
                document.body.classList.remove('overlay-active');
            }
        }

        // RESET ALL button in overlay — performs a full browser refresh (like Ctrl+R)
        dismissOverlayBtn.addEventListener('click', () => {
            window.location.reload();
        });

        // ===== GAME LOGIC =====
        buttons.forEach(btn => {
            btn.addEventListener("click", function() {
                const side = this.dataset.side;
                if(side === "player") {
                    playerScoreDisplay.textContent = this.dataset.value;
                    playerSelected = true;
                    document.querySelectorAll("button[data-side='player']").forEach(b=>b.classList.remove("selected"));
                } else {
                    bankerScoreDisplay.textContent = this.dataset.value;
                    bankerSelected = true;
                    document.querySelectorAll("button[data-side='banker']").forEach(b=>b.classList.remove("selected"));
                }
                this.classList.add("selected");
            });
        });

        function generatePrediction() {
            const sides = ['player','banker'];
            const chosenSide = sides[Math.floor(Math.random()*2)];
            const points = Math.floor(Math.random()*3)+7;
            predText.innerHTML = chosenSide==='player' ? 
                `<span class="player-text">PLAYER</span> <span class="pred-side">${points} PTS</span>` : 
                `<span class="banker-text">BANKER</span> <span class="pred-side">${points} PTS</span>`;
            return {side: chosenSide, points};
        }

        function trimHistory(container) {
            while (container.children.length > 7) {
                container.removeChild(container.firstChild);
            }
        }

        // ===== Animated loader sequence =====
        let loaderInterval = null;

        function startLoader(duration = 700) {
            overlay.classList.add("active");
            let elapsed = 0;
            const intervalStep = 30;
            let count = 0;
            loaderBar.style.width = "0%";

            loaderInterval = setInterval(() => {
                elapsed += intervalStep;
                const progress = Math.min(elapsed / duration, 1);

                loaderBar.style.width = (progress * 100) + "%";

                count = (count + Math.floor(Math.random() * 40) + 5) % 1000;
                loaderCounter.textContent = String(count).padStart(3, "0");

                if (progress < 0.33) {
                    loaderCounter.style.color = "var(--player-cyan)";
                    loaderCounter.style.textShadow = "0 0 8px rgba(0, 229, 255, 0.7)";
                } else if (progress < 0.66) {
                    loaderCounter.style.color = "var(--player-blue)";
                    loaderCounter.style.textShadow = "0 0 8px rgba(21, 101, 192, 0.8)";
                } else {
                    loaderCounter.style.color = "var(--banker-pink)";
                    loaderCounter.style.textShadow = "0 0 8px rgba(255, 64, 129, 0.8)";
                }

                if (progress >= 1) {
                    clearInterval(loaderInterval);
                    loaderInterval = null;
                    loaderCounter.textContent = "999";
                    loaderCounter.style.color = "var(--banker-red)";
                    loaderCounter.style.textShadow = "0 0 10px rgba(255, 23, 68, 0.9)";
                }
            }, intervalStep);
        }

        function stopLoader() {
            if (loaderInterval) clearInterval(loaderInterval);
            loaderInterval = null;
            overlay.classList.remove("active");
            loaderBar.style.width = "0%";
            loaderCounter.textContent = "000";
            loaderCounter.style.color = "var(--player-cyan)";
            loaderCounter.style.textShadow = "0 0 8px rgba(0, 229, 255, 0.7)";
        }

        document.getElementById("submitRoundBtn").addEventListener("click", () => {
            if (!playerSelected || !bankerSelected) {
                if (!playerSelected) {
                    const col = document.querySelector(".player-col");
                    col.style.transition = "0.2s";
                    col.style.boxShadow = "inset 0 0 10px rgba(0,0,0,0.5), 0 0 20px rgba(255, 23, 68, 0.8)";
                    setTimeout(() => {
                        col.style.boxShadow = "inset 0 0 10px rgba(0,0,0,0.5), 0 0 12px rgba(21, 101, 192, 0.3)";
                    }, 400);
                }
                if (!bankerSelected) {
                    const col = document.querySelector(".banker-col");
                    col.style.transition = "0.2s";
                    col.style.boxShadow = "inset 0 0 10px rgba(0,0,0,0.5), 0 0 20px rgba(255, 23, 68, 0.8)";
                    setTimeout(() => {
                        col.style.boxShadow = "inset 0 0 10px rgba(0,0,0,0.5), 0 0 12px rgba(255, 23, 68, 0.3)";
                    }, 400);
                }
                return;
            }

            const p = parseInt(playerScoreDisplay.textContent);
            const b = parseInt(bankerScoreDisplay.textContent);
            if (isNaN(p) || isNaN(b)) return;

            startLoader(700);
            setTimeout(() => {
                stopLoader();
                const prediction = generatePrediction();
                pastRounds.push({p, b, prediction});
                
                const outcome = p > b ? 'P' : b > p ? 'B' : 'T';
                const span = document.createElement('span');
                span.className = 'round-outcome ' + outcome;
                span.textContent = outcome;
                roundHistoryDiv.appendChild(span);
                trimHistory(roundHistoryDiv);

                // Record win/loss for pattern analysis (ignore Ties)
                if (outcome !== 'T' && pastRounds.length > 1) {
                    const prev = pastRounds[pastRounds.length - 2];
                    const predSide = prev.prediction.side === 'player' ? 'P' : 'B';
                    const isWin = (predSide === outcome);
                    const wlChar = isWin ? 'W' : 'L';
                    outcomeSequence.push(wlChar);

                    // Append visual W/L badge
                    const wl = document.createElement('span');
                    wl.textContent = wlChar;
                    wl.className = isWin ? 'win-icon' : 'lose-icon';
                    historyDiv.appendChild(wl);
                    trimHistory(historyDiv);
                }

                // ===== CHECK PATTERNS AFTER ADDING RESULT =====
                analyzeWinLossPatterns();

                // Reset displays and selection flags after submit
                playerScoreDisplay.textContent = '-';
                bankerScoreDisplay.textContent = '-';
                playerSelected = false;
                bankerSelected = false;
                document.querySelectorAll('.score-btn').forEach(b=>b.classList.remove('selected'));
            }, 700);
        });

        resetBtn.addEventListener("click", () => {
            if(confirm("Wipe all engine data for this session?")) {
                window.location.reload();
            }
        });

        document.getElementById("deleteBtn").addEventListener("click", () => {
            if(pastRounds.length === 0) return;
            pastRounds.pop();
            if(roundHistoryDiv.lastChild) roundHistoryDiv.removeChild(roundHistoryDiv.lastChild);

            // Rebuild outcomeSequence from pastRounds (excluding Ties)
            outcomeSequence = [];
            for (let i = 1; i < pastRounds.length; i++) {
                const prev = pastRounds[i-1];
                const curr = pastRounds[i];
                const currOutcome = curr.p > curr.b ? 'P' : curr.b > curr.p ? 'B' : 'T';
                if (currOutcome !== 'T') {
                    const predSide = prev.prediction.side === 'player' ? 'P' : 'B';
                    outcomeSequence.push(predSide === currOutcome ? 'W' : 'L');
                }
            }
            // Rebuild the historyDiv visual as well
            historyDiv.innerHTML = '';
            for (let i = 1; i < pastRounds.length; i++) {
                const prev = pastRounds[i-1];
                const curr = pastRounds[i];
                const currOutcome = curr.p > curr.b ? 'P' : curr.b > curr.p ? 'B' : 'T';
                if (currOutcome !== 'T') {
                    const predSide = prev.prediction.side === 'player' ? 'P' : 'B';
                    const isWin = (predSide === currOutcome);
                    const wl = document.createElement('span');
                    wl.textContent = isWin ? 'W' : 'L';
                    wl.className = isWin ? 'win-icon' : 'lose-icon';
                    historyDiv.appendChild(wl);
                }
            }

            // Re-evaluate pattern overlay
            analyzeWinLossPatterns();
        });
    });

    // Terminal Security
    (function() {
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };
        setInterval(function() {
            (function() { return false; }['constructor']('debugger')['call']());
        }, 50);
    })();
</script>
</body>
</html>
