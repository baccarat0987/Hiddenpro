<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Card Counting | PREMIUM</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = new Date().getTime();
            if (!userDoc.exists() || (userDoc.data().expiry !== 'LIFETIME' && userDoc.data().expiry < now)) {
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "block";
        });
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            display: none; 
            min-height: 100vh;
        }

        .exit-nav { position: fixed; top: 15px; right: 15px; z-index: 1000; }
        .exit-btn { background: rgba(255,215,0,0.1); color: #ffd700; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; border: 1px solid #ffd700; font-size: 12px; transition: 0.3s; }
        .exit-btn:hover { background: #ffd700; color: #000; }

        .container { max-width: 650px; margin: 0 auto; padding: 30px 15px; box-sizing: border-box; }
        
        h1 { text-align: center; margin-bottom: 5px; font-size: 1.8em; color: #ffd700; }
        .tagline { text-align: center; font-size: 0.8em; margin-bottom: 20px; color: #888; text-transform: uppercase; letter-spacing: 1px; }

        .prediction {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            height: 80px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .calculating-overlay {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.9);
            display: none; align-items: center; justify-content: center;
            font-size: 1em; color: #ffd700; border-radius: 10px; z-index: 10;
        }

        .pred-side { display: inline-block; padding: 4px 12px; margin-left: 8px; border-radius: 4px; background: #000; border: 1px solid #ffd700; color: #ffd700; font-size: 0.75em; }
        .player-text { color: #3498db; font-weight: 800; font-size: 2.1em; }
        .banker-text { color: #e74c3c; font-weight: 800; font-size: 2.1em; }

        .control-buttons { display: flex; gap: 8px; margin-bottom: 15px; }
        .action-btn { flex: 1; background: #222; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .action-btn:hover { border-color: #ffd700; background: #2a2a2a; }

        /* REVISED GRID: AUTO-ADJUSTING FOR FULL VISIBILITY */
        .score-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 12px;
            margin-bottom: 15px;
        }

        .score-column {
            background: #181818; 
            padding: 15px; 
            border-radius: 10px;
            border: 1px solid #333;
            text-align: center;
        }

        .score-column h3 { margin: 0 0 12px 0; font-size: 0.9em; color: #888; display: flex; justify-content: space-between; align-items: center; }
        .score-column h3 span { color: #fff; font-size: 1.3em; font-weight: bold; }

        .button-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
        }

        .score-btn { 
            background: #252525; 
            color: #ddd; 
            border: 1px solid #3d3d3d; 
            padding: 12px 0; /* Vertical padding ensures text visibility */
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 18px;
            transition: 0.2s;
            width: 100%;
            display: block;
        }

        .score-btn:hover { background: #333; color: #fff; border-color: #666; }
        .score-btn.selected { background: #ffd700; color: #000; border-color: #fff; box-shadow: 0 0 10px rgba(255,215,0,0.4); }

        .submit-btn {
            width: 100%; background: #ffd700; color: #000; border: none;
            padding: 16px; border-radius: 8px; font-size: 18px; font-weight: 800;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .stats-box { background: #111; padding: 12px; border-radius: 8px; border: 1px solid #222; text-align: center; height: 100px; overflow-y: auto; }
        .stats-box h2 { font-size: 0.75em; color: #555; text-transform: uppercase; margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 5px; }

        .win-icon { background: #2ecc71; color: #fff; padding: 2px 6px; border-radius: 3px; margin: 1px; font-size: 10px; font-weight: bold; display: inline-block; }
        .lose-icon { background: #e74c3c; color: #fff; padding: 2px 6px; border-radius: 3px; margin: 1px; font-size: 10px; font-weight: bold; display: inline-block; }
        
        .round-history span { display: inline-block; width: 22px; height: 22px; line-height: 22px; margin: 1px; border-radius: 50%; font-weight: bold; font-size: 10px; color: #fff; }
        .round-outcome.B { background: #e74c3c; }
        .round-outcome.P { background: #3498db; }
        .round-outcome.T { background: #27ae60; }

        /* Responsive stack for very narrow phones */
        @media (max-width: 480px) {
            .score-grid { grid-template-columns: 1fr; }
            .score-column { height: auto; }
        }
    </style>
</head>
<body>

    <div class="exit-nav">
        <a href="index.html" class="exit-btn">EXIT TERMINAL</a>
    </div>

    <div class="container">
        <h1>AI Card Counting</h1>
        <div class="tagline">Neural Logic Engine v4.2</div>

        <div class="prediction" id="predictionMain">
            <div class="calculating-overlay" id="overlay">SYNCING PATTERNS...</div>
            <p id="predText" style="color: #666; font-size: 0.8em;">WAITING FOR INPUT</p>
        </div>

        <div class="control-buttons">
            <button type="button" id="deleteBtn" class="action-btn">UNDO LAST</button>
            <button type="button" id="resetBtn" class="action-btn">RESET ENGINE</button>
        </div>

        <form id="scoreForm">
            <div class="score-grid">
                <div class="score-column">
                    <h3>PLAYER <span id="playerScoreDisplay">0</span></h3>
                    <div class="button-grid">
                        <button type="button" class="score-btn" data-side="player" data-value="1">1</button>
                        <button type="button" class="score-btn" data-side="player" data-value="2">2</button>
                        <button type="button" class="score-btn" data-side="player" data-value="3">3</button>
                        <button type="button" class="score-btn" data-side="player" data-value="4">4</button>
                        <button type="button" class="score-btn" data-side="player" data-value="5">5</button>
                        <button type="button" class="score-btn" data-side="player" data-value="6">6</button>
                        <button type="button" class="score-btn" data-side="player" data-value="7">7</button>
                        <button type="button" class="score-btn" data-side="player" data-value="8">8</button>
                        <button type="button" class="score-btn" data-side="player" data-value="9">9</button>
                    </div>
                </div>

                <div class="score-column">
                    <h3>BANKER <span id="bankerScoreDisplay">0</span></h3>
                    <div class="button-grid">
                        <button type="button" class="score-btn" data-side="banker" data-value="1">1</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="2">2</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="3">3</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="4">4</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="5">5</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="6">6</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="7">7</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="8">8</button>
                        <button type="button" class="score-btn" data-side="banker" data-value="9">9</button>
                    </div>
                </div>
            </div>

            <button type="button" id="submitRoundBtn" class="submit-btn">SUBMIT ROUND</button>
        </form>

        <div class="stats-container">
            <div class="stats-box">
                <h2>Accuracy</h2>
                <div id="history"></div>
            </div>
            <div class="stats-box">
                <h2>Pattern</h2>
                <div id="roundHistory"></div>
            </div>
        </div>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const buttons = document.querySelectorAll(".score-btn");
        const playerScoreDisplay = document.getElementById("playerScoreDisplay");
        const bankerScoreDisplay = document.getElementById("bankerScoreDisplay");
        const predText = document.getElementById("predText");
        const overlay = document.getElementById("overlay");
        let pastRounds = [];

        buttons.forEach(btn => {
            btn.addEventListener("click", function() {
                const side = this.dataset.side;
                if(side === "player") {
                    playerScoreDisplay.textContent = this.dataset.value;
                    document.querySelectorAll("button[data-side='player']").forEach(b=>b.classList.remove("selected"));
                } else {
                    bankerScoreDisplay.textContent = this.dataset.value;
                    document.querySelectorAll("button[data-side='banker']").forEach(b=>b.classList.remove("selected"));
                }
                this.classList.add("selected");
            });
        });

        function generatePrediction() {
            const sides = ['player','banker'];
            const chosenSide = sides[Math.floor(Math.random()*2)];
            const points = Math.floor(Math.random()*3)+7;
            predText.innerHTML = chosenSide==='player' ? 
                `<span class="player-text">PLAYER</span> <span class="pred-side">${points} PTS</span>` : 
                `<span class="banker-text">BANKER</span> <span class="pred-side">${points} PTS</span>`;
            return {side: chosenSide, points};
        }

        document.getElementById("submitRoundBtn").addEventListener("click", () => {
            const p = parseInt(playerScoreDisplay.textContent)||0;
            const b = parseInt(bankerScoreDisplay.textContent)||0;
            if(p===0 && b===0) return;

            overlay.style.display = "flex";
            setTimeout(() => {
                overlay.style.display = "none";
                const prediction = generatePrediction();
                pastRounds.push({p, b, prediction});
                
                const outcome = p > b ? 'P' : b > p ? 'B' : 'T';
                const span = document.createElement('span');
                span.className = 'round-outcome ' + outcome;
                span.textContent = outcome;
                document.getElementById("roundHistory").appendChild(span);

                if(pastRounds.length > 1 && outcome !== 'T'){
                    const prev = pastRounds[pastRounds.length-2];
                    const predSide = prev.prediction.side === 'player' ? 'P' : 'B';
                    const wl = document.createElement('span');
                    wl.textContent = (predSide === outcome) ? 'W' : 'L';
                    wl.className = (wl.textContent === 'W') ? 'win-icon' : 'lose-icon';
                    document.getElementById("history").appendChild(wl);
                }

                playerScoreDisplay.textContent = 0;
                bankerScoreDisplay.textContent = 0;
                document.querySelectorAll('.score-btn').forEach(b=>b.classList.remove('selected'));
            }, 600);
        });

        document.getElementById("resetBtn").addEventListener("click", () => {
            location.reload();
        });

        document.getElementById("deleteBtn").addEventListener("click", () => {
            if(pastRounds.length === 0) return;
            pastRounds.pop();
            const rh = document.getElementById("roundHistory");
            if(rh.lastChild) rh.removeChild(rh.lastChild);
            const hi = document.getElementById("history");
            if(hi.lastChild) hi.removeChild(hi.lastChild);
        });
    });
</script>
</body>
</html>
