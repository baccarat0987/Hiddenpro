<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Google AI Baccarat</title>
    
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = new Date().getTime();
            if (!userDoc.exists() || (userDoc.data().expiry !== 'LIFETIME' && userDoc.data().expiry < now)) {
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color:#eee;
            font-size:17px;
            background: #0d0d0d url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1400&q=80') no-repeat center center fixed;
            background-size: cover;
            display: none; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .exit-nav { 
            position: fixed; 
            top: 15px; 
            right: 15px; 
            z-index: 1000; 
        }
        .exit-btn { 
            background: rgba(0, 0, 0, 0.6); 
            color: #fff; 
            padding: 8px 15px; 
            border-radius: 5px; 
            text-decoration: none; 
            font-weight: bold;

            font-size: 12px;

            border-radius: 16px;

            text-align: center;

            margin: 20px auto;
        }

        .header h1 {
            font-size: clamp(22px, 5vw, 28px);
            font-weight: 800;
            background: linear-gradient(90deg, #4285F4, #34A853, #FBBC05, #DB4437);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;

            text-transform: uppercase;

        .sequence { 
            margin: 15px 0; 
            min-height: 40px; 
            display: flex;

            flex-wrap: wrap; 
            gap: 3px;
        }
        .sequence span {
            display:inline-flex;
            width:30px;

            justify-content:center;

            flex-shrink: 0;
        }
        .P { background:#4285F4; color:#fff; box-shadow: 0 4px 10px rgba(66, 133, 244, 0.4); }
        .B { background:#DB4437; color:#fff; box-shadow: 0 4px 10px rgba(219, 68, 55, 0.4); }

        .results { 
            margin: 10px 0; 
            min-height: 25px; 
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 3px;
        }
        .W, .L { 
            display: inline-flex;
            font-size: 10px; 
            font-weight: bold; 
            padding: 2px 6px; 
            border-radius: 4px; 
            text-transform: uppercase;
            align-items: center;
            justify-content: center;
        }
        .W { background: #34A853; color: #fff; }
        .L { background: #444; color: #888; }
        .SK { 
            display: inline-flex;
            font-size: 8px; 
            font-weight: bold; 
            padding: 2px 4px; 
            border-radius: 4px; 
            text-transform: uppercase;
            align-items: center;
            justify-content: center;
            background: #555;
            color: #999;
            opacity: 0.5;
        }

        .prediction {
            margin: 20px 0;
            padding: 20px 15px;
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            font-size: clamp(20px, 4vw, 26px);
            font-weight: 900;
            border: 1px solid rgba(255,255,255,0.08);
            min-height: 35px;
            word-wrap: break-word;
        }
        .prediction .player { color:#4285F4; text-shadow: 0 0 15px rgba(66, 133, 244, 0.6); }
        .prediction .banker { color:#DB4437; text-shadow: 0 0 15px rgba(219, 68, 55, 0.6); }
        .confidence { font-size:14px; color:#34A853; margin-left:10px; font-weight: bold; opacity: 0.9; }

        .buttons { 
            margin: 20px 0; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
        }
        .buttons button {
            background:#1e1e1e;
            color:#fff;
            border:1px solid #333;
            border-radius:10px;
            padding: 18px 10px;
            cursor:pointer;
            font-weight:900;
            font-size: clamp(14px, 3vw, 18px);
            transition: 0.2s;
            text-transform: uppercase;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .buttons button:active { transform: scale(0.95); }
        .buttons button:disabled { opacity: 0.5; cursor: not-allowed; }
        .util-btns { 
            grid-column: span 2; 
            display: flex; 
            gap: 10px; 
            margin-top: 5px; 
        }
        .util-btns button { 
            flex: 1; 
            padding: 14px 10px; 
            font-size: clamp(10px, 2vw, 12px); 
            background: #141414; 
            color: #666; 
            font-weight: bold; 
        }

        /* REMOVED: .footer - Step 1 complete */

        /* REMOVED: .logic-badge - Step 1 complete */
        
        .stats-mini {
            margin-top: 10px;
            font-size: clamp(9px, 2vw, 11px);
            color: #7e8a9c;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .stats-mini span {
            background: rgba(255,255,255,0.05);
            padding: 2px 10px;
            border-radius: 12px;
        }

        /* ========== RESPONSIVE FOR SPLIT-SCREEN ========== */
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
                margin: 10px auto;
                border-radius: 12px;
            }
            .sequence span {
                width: 28px;
                height: 28px;
                font-size: 11px;
            }
            .buttons button {
                padding: 15px 8px;
            }
            .util-btns button {
                padding: 12px 8px;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 15px 10px;
            }
            .sequence span {
                width: 24px;
                height: 24px;
                font-size: 10px;

                padding: 15px 10px;

        }

        @media (orientation: landscape) and (max-height: 500px) {
            .container {
                padding: 15px 20px;
                max-width: 90%;
            }
            .header h1 {
                font-size: 20px;

            }
            .prediction {
                padding: 12px 10px;

                margin: 10px 0;
            }
            .buttons button {
                padding: 12px 8px;
                font-size: 14px;
            }
            .sequence {
                min-height: 30px;

            }
            .sequence span {

            }
        }

        @media (max-width: 768px) and (max-height: 500px) {
            body {
                align-items: flex-start;
                padding: 5px;
            }
            .container {
                padding: 12px 15px;

            }

                min-height: 25px;

            }

            }

                padding: 10px 6px;

            }
            .util-btns {

            }
            .util-btns button {
                padding: 8px 6px;

            }
            .results {
                min-height: 18px;
                margin: 3px 0;
            }
            .exit-nav {
                top: 5px;
                right: 5px;
            }
            .exit-btn {
                padding: 4px 10px;
                font-size: 9px;
            }
            .stats-mini {
                font-size: 8px;
                gap: 8px;
                margin-top: 5px;
            }

            }
        }

        @media (min-width: 769px) and (max-width: 1024px) and (max-height: 600px) {
            .container {
                padding: 20px 25px;
                max-width: 450px;
            }
            .header h1 {
                font-size: 22px;
            }
            .prediction {
                font-size: 22px;
                padding: 15px;
            }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
    </style>
</head>
<body oncontextmenu="return false;" class="no-select">

    <div class="exit-nav">
        <a href="index.html" class="exit-btn">EXIT TERMINAL</a>
    </div>

    <div class="container">
        <div class="header"><h1>Google AI Baccarat</h1></div>
        
        <div class="sequence" id="historyBox">WAITING FOR INPUT...</div>
        <div class="results" id="resultsBox"></div>
        
        <div class="prediction" id="predictionBox">INITIALIZING NEURAL NET...</div>
        
        <!-- REMOVED: logic-badge -->
        
        <div class="buttons">
            <button onclick="recordResult('P')" style="border-bottom: 5px solid #4285F4;" id="playerBtn">PLAYER</button>
            <button onclick="recordResult('B')" style="border-bottom: 5px solid #DB4437;" id="bankerBtn">BANKER</button>
            <div class="util-btns">
                <button onclick="undo()">UNDO LAST</button>
                <button onclick="resetAll()">RESET ENGINE</button>
            </div>
        </div>
        
        <!-- REMOVED: .footer - Step 1 complete -->
    </div>

<script>
    // ========== STATE VARIABLES ==========
    let sequence = JSON.parse(localStorage.getItem('baccarat_sequence')) || [];
    let results = JSON.parse(localStorage.getItem('baccarat_results')) || [];
    let lastPrediction = null;
    let detailedHistory = JSON.parse(localStorage.getItem('baccarat_detailed')) || [];
    let wins = 0;
    let losses = 0;
    let skips = 0;
    let playerCount = 0;
    let bankerCount = 0;
    const MIN_HANDS = 10;

    // ========== DEEPSEEK PRO PREDICTION LOGIC ==========
    function oppositeSide(side) {
        return side === 'P' ? 'B' : 'P';
    }

    // LOGIC 1: STREAK DETECTION
    function getCurrentStreak() {
        if (sequence.length === 0) return { side: null, count: 0 };
        let streak = 1;
        const lastSide = sequence[sequence.length - 1];
        for (let i = sequence.length - 2; i >= 0; i--) {
            if (sequence[i] === lastSide) streak++;
            else break;
        }
        return { side: lastSide, count: streak };
    }

    // LOGIC 2: LAST-3 PATTERN DETECTION
    function analyzeLast3Pattern() {
        if (sequence.length < 3) return null;
        
        const last3 = sequence.slice(-3);
        let occurrences = 0;
        let playerFollows = 0;
        let bankerFollows = 0;
        
        for (let i = 0; i <= sequence.length - 4; i++) {
            const first = sequence[i];
            const second = sequence[i+1];
            const third = sequence[i+2];
            const next = sequence[i+3];
            
            if (first === last3[0] && second === last3[1] && third === last3[2]) {
                occurrences++;
                if (next === 'P') playerFollows++;
                else bankerFollows++;
            }
        }
        
        if (occurrences === 0 && sequence.length >= 2) {
            const last2 = sequence.slice(-2);
            for (let i = 0; i <= sequence.length - 3; i++) {
                const first = sequence[i];
                const second = sequence[i+1];
                const next = sequence[i+2];
                if (first === last2[0] && second === last2[1]) {
                    occurrences++;
                    if (next === 'P') playerFollows++;
                    else bankerFollows++;
                }
            }
        }
        
        if (occurrences === 0) return null;
        
        const prediction = playerFollows > bankerFollows ? 'P' : 'B';
        const matches = prediction === 'P' ? playerFollows : bankerFollows;
        const rawConfidence = (matches / occurrences) * 100;
        
        return {
            prediction: prediction,
            confidence: rawConfidence,
            occurrences: occurrences,
            matches: matches
        };
    }

    // LOGIC 3: ZIGZAG PATTERN DETECTION
    function isZigzagPattern() {
        if (sequence.length < 4) return false;
        let alternating = true;
        for (let i = sequence.length - 3; i < sequence.length - 1; i++) {
            if (sequence[i] === sequence[i + 1]) {
                alternating = false;
                break;
            }
        }
        return alternating;
    }

    // MAIN ENHANCED PREDICTION
    function getEnhancedPredictionAndConfidence() {
        if (sequence.length < 2) return { prediction: null, confidence: 0, occurrences: 0 };
        
        let scores = { P: 0, B: 0 };
        let totalWeight = 0;
        
        // LOGIC 1: Streak Detection (30% weight)
        const streak = getCurrentStreak();
        if (streak.count >= 3) {
            const streakBonus = Math.min(40, (streak.count - 2) * 15);
            scores[streak.side] += streakBonus;
            totalWeight += 30;
        } else if (streak.count === 2) {
            const streakBonus = 10;
            scores[streak.side] += streakBonus;
            totalWeight += 20;
        }
        
        // LOGIC 2: Last-3 Pattern Analysis (50% weight)
        const patternAnalysis = analyzeLast3Pattern();
        if (patternAnalysis && patternAnalysis.occurrences > 0) {
            const patternWeight = 50;
            const patternScore = (patternAnalysis.confidence / 100) * patternWeight;
            scores[patternAnalysis.prediction] += patternScore;
            totalWeight += patternWeight;
        }
        
        // LOGIC 3: Zigzag Detection (20% weight)
        if (isZigzagPattern() && sequence.length >= 4) {
            const lastResult = sequence[sequence.length - 1];
            const zigzagPrediction = oppositeSide(lastResult);
            const zigzagWeight = 20;
            scores[zigzagPrediction] += zigzagWeight;
            totalWeight += zigzagWeight;
        }
        
        // Fallback: opposite of last result
        if (totalWeight === 0 && sequence.length >= 2) {
            const lastResult = sequence[sequence.length - 1];
            const fallbackPrediction = oppositeSide(lastResult);
            scores[fallbackPrediction] = 55;
            totalWeight = 100;
        }
        
        let prediction = scores.P > scores.B ? 'P' : 'B';
        let maxScore = Math.max(scores.P, scores.B);
        let confidence = totalWeight > 0 ? (maxScore / totalWeight) * 100 : 50;
        
        let confidenceBonus = 0;
        if (sequence.length > 50) confidenceBonus = 10;
        else if (sequence.length > 30) confidenceBonus = 7;
        else if (sequence.length > 20) confidenceBonus = 5;
        else if (sequence.length > 10) confidenceBonus = 2;
        
        let finalConfidence = Math.min(96, Math.max(40, confidence + confidenceBonus));
        
        let totalOccurrences = 0;
        if (patternAnalysis) totalOccurrences = patternAnalysis.occurrences;
        if (streak.count >= 3) totalOccurrences += streak.count;
        
        return {
            prediction: prediction,
            confidence: Math.round(finalConfidence * 10) / 10,
            occurrences: totalOccurrences || 1
        };
    }

    // DYNAMIC SKIP THRESHOLD
    function getDynamicSkipThreshold() {
        let baseThreshold = 60;
        
        const recentResults = detailedHistory.slice(-5).filter(h => !h.wasSkip);
        const recentLosses = recentResults.filter(r => r.type === 'loss').length;
        const recentWins = recentResults.filter(r => r.type === 'win').length;
        
        if (recentLosses >= 3) {
            baseThreshold = 52;
        } else if (recentWins >= 3 && recentResults.length >= 3) {
            baseThreshold = 68;
        } else if (recentLosses >= 2) {
            baseThreshold = 56;
        } else if (recentWins >= 2) {
            baseThreshold = 64;
        }
        
        const totalDecisions = wins + losses;
        if (totalDecisions > 10) {
            const winRate = wins / totalDecisions;
            if (winRate < 0.45) {
                baseThreshold = Math.max(50, baseThreshold - 5);
            } else if (winRate > 0.55) {
                baseThreshold = Math.min(75, baseThreshold + 5);
            }
        }
        
        return baseThreshold;
    }

    // SKIP CONDITION
    function shouldSkipPrediction(confidence, occurrences) {
        const dynamicThreshold = getDynamicSkipThreshold();
        let adjustedThreshold = dynamicThreshold;
        if (occurrences >= 5) {
            adjustedThreshold = Math.max(50, dynamicThreshold - 8);
        }
        return confidence < adjustedThreshold || occurrences < 1;
    }

    // ========== MAIN PREDICTION FUNCTION ==========
    function finalPrediction() {
        if (sequence.length < MIN_HANDS) {
            return null;
        }
        
        const result = getEnhancedPredictionAndConfidence();
        if (!result || !result.prediction) {
            return null;
        }
        
        const skip = shouldSkipPrediction(result.confidence, result.occurrences);
        
        if (skip) {
            return {
                pred: null,
                confidence: result.confidence,
                skip: true
            };
        }
        
        return {
            pred: result.prediction,
            confidence: result.confidence,
            skip: false
        };
    }

    // ========== UI FUNCTIONS ==========
    function updateHistory() {
        const box = document.getElementById('historyBox');
        const rBox = document.getElementById('resultsBox');
        if(sequence.length===0){box.innerHTML="READY FOR DATA"; rBox.innerHTML=""; return;}
        
        box.innerHTML='';
        sequence.slice(-10).forEach(r=>{
            const span=document.createElement('span');
            span.className=r;
            span.textContent=r;
            box.appendChild(span);
        });

        rBox.innerHTML='';
        results.slice(-10).forEach(wl=>{
            if(wl!==''){
                const span = document.createElement('span');
                span.className = wl;
                span.textContent = wl;
                rBox.appendChild(span);
            } else {
                // Show SKIP indicators
                const span = document.createElement('span');
                span.className = 'SK';
                span.textContent = 'SK';
                rBox.appendChild(span);
            }
        });
    }

    function updatePredictionBox() {
        const box = document.getElementById('predictionBox');
        if(sequence.length < MIN_HANDS){
            box.innerHTML=`<span style="font-size: clamp(11px, 2.5vw, 13px); color: #444; letter-spacing:1px;">SYNCING: ${MIN_HANDS-sequence.length} MORE DATA REQUIRED</span>`;
            lastPrediction = null;
            return;
        }

        const result = finalPrediction();
        if(result && result.pred){
            const text = result.pred === 'P' ? 'PLAYER' : 'BANKER';
            const cls = result.pred === 'P' ? 'player' : 'banker';
            box.innerHTML=`NEXT: <span class="${cls}">${text}</span> <span class="confidence">${result.confidence}%</span>`;
            lastPrediction = result.pred;
        } else if (result && result.skip) {
            box.innerHTML=`<span style="font-size: clamp(14px, 3vw, 16px); color: #FF6B35;">⚠️ SKIP (${result.confidence}%)</span>`;
            lastPrediction = null;
        } else {
            box.innerHTML="<span style='font-size: clamp(14px, 3vw, 16px); color:#555'>ANALYZING TRENDS...</span>";
            lastPrediction = null;
        }
    }

    function recordResult(r){
        // Check if this was a prediction (not skip)
        if (lastPrediction) {
            const wasWin = (lastPrediction === r);
            results.push(wasWin ? 'W' : 'L');
            if (wasWin) {
                wins++;
                detailedHistory.push({ type: 'win', wasSkip: false });
            } else {
                losses++;
                detailedHistory.push({ type: 'loss', wasSkip: false });
            }
        } else {
            // This is a SKIP - NOT counted in W/L
            results.push(''); // Empty indicates SKIP
            skips++;
            detailedHistory.push({ type: 'skip', wasSkip: true });
        }
        
        sequence.push(r);
        if (r === 'P') playerCount++;
        else bankerCount++;
        
        saveAndUpdate();
    }

    function undo(){
        if(sequence.length===0) return;
        const lastResult = sequence.pop();
        const lastResultData = results.pop();
        const lastHistory = detailedHistory.pop();
        
        if (lastResult === 'P') playerCount--;
        else bankerCount--;
        
        if (lastResultData === 'W') wins--;
        else if (lastResultData === 'L') losses--;
        else if (lastResultData === '') skips--;
        
        saveAndUpdate();
    }

    function resetAll(){
        if(confirm("Wipe all engine data for this shoe?")){
            sequence=[]; 
            results=[]; 
            lastPrediction=null;
            detailedHistory = [];
            wins = 0;
            losses = 0;
            skips = 0;
            playerCount = 0;
            bankerCount = 0;
            saveAndUpdate();
        }
    }

    function saveAndUpdate(){
        localStorage.setItem('baccarat_sequence', JSON.stringify(sequence));
        localStorage.setItem('baccarat_results', JSON.stringify(results));
        localStorage.setItem('baccarat_detailed', JSON.stringify(detailedHistory));
        updateHistory();
        updatePredictionBox();
    }

    // ========== PROTECTION ==========
    document.onkeydown = function(e) {
        if(event.keyCode == 123) return false;
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
    }

    // ========== INITIALIZE ==========
    results.forEach(r => {
        if (r === 'W') wins++;
        else if (r === 'L') losses++;
        else if (r === '') skips++;
    });
    sequence.forEach(r => {
        if (r === 'P') playerCount++;
        else if (r === 'B') bankerCount++;
    });
    
    updateHistory();
    updatePredictionBox();
</script>
</body>
