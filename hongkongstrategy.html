<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baccarat Hongkong Strategy</title>
    
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const REQUIRED_ENGINE_ID = "engine_13"; 

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && 
                           (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                           userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) {
                alert("Access denied: you don't have permission for Hongkong Strategy Engine.");
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>
    
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) {
                return false;
            }
        };
    </script>
    
    <style>
        :root {
            --bg: #030407; --card: #0a0c14; --card-header: #111422; --accent: #38bdf8; 
            --banker: #ff4757; --player: #2e86de; --border: #1f2538; --text-main: #f8fafc;
            --text-dim: #475569; --glow-banker: rgba(255, 71, 87, 0.15);
            --glow-player: rgba(46, 134, 222, 0.15); --glow-accent: rgba(56, 189, 248, 0.15);
        }
        body { background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; display: none; flex-direction: column; align-items: center; margin: 0; padding: 100px 20px; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 500px; background: var(--card); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 24px; overflow: hidden; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8); }
        .header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, var(--card-header) 0%, rgba(17, 20, 34, 0.6) 100%); }
        .brand-icon { width: 14px; height: 14px; border: 2px solid var(--accent); transform: rotate(45deg); display: inline-block; box-shadow: 0 0 15px var(--accent); }
        .brand-title { font-weight: 900; letter-spacing: 2px; font-size: 1.15rem; }
        .brand-subtitle { color: var(--accent); font-size: 0.65rem; font-weight: 600; letter-spacing: 3px; }
        .config-panel { background: #07090f; border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
        .config-label { font-size: 0.72rem; color: #94a3b8; letter-spacing: 1px; font-weight: 700; text-transform: uppercase; }
        .basebet-input { background: transparent; border: none; color: #ffffff; font-weight: 800; font-size: 0.95rem; width: 70px; }
        .prediction-box { padding: 30px 24px; text-align: center; border-bottom: 1px solid var(--border); }
        .bet-label { font-size: 0.72rem; color: #475569; letter-spacing: 4px; text-transform: uppercase; font-weight: 800; }
        #bet-signal { font-size: 3.5rem; font-weight: 950; margin: 2px 0; letter-spacing: 4px; }
        #bet-recommendation-amount { font-size: 1.3rem; font-weight: 800; color: #e2e8f0; }
        .excel-container { max-height: 190px; overflow-y: auto; padding: 16px; background: #040508; }
        table { width: 100%; border-collapse: separate; border-spacing: 3px; table-layout: fixed; }
        td { border: 1px solid rgba(255, 255, 255, 0.02); background: rgba(255, 255, 255, 0.01); height: 44px; text-align: center; font-weight: 800; border-radius: 6px; }
        .controls { padding: 24px 24px 12px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .btn { padding: 18px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; }
        .btn-b { background: #ff4757; color: white; }
        .btn-p { background: #2e86de; color: white; }
        .btn-secondary { background: #161b26; color: #94a3b8; }
        .footer-tools { display: flex; gap: 12px; padding: 0 24px 24px 24px; }
        #mode-badge { font-size: 0.65rem; background: rgba(30, 41, 59, 0.5); color: #94a3b8; padding: 6px 14px; border-radius: 20px; font-weight: 800; }
        .system-lock-overlay { position: absolute; top: 77px; left: 0; width: 100%; height: calc(100% - 77px); background: rgba(3, 4, 7, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .btn-lock-reset { background: #38bdf8; color: #030407; padding: 18px 44px; font-weight: 900; border-radius: 12px; border: none; cursor: pointer; }
        .profit-callout-block { display: block; margin-top: 14px; font-size: 1.40rem; color: var(--accent); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="brand-logo-area">
                <span class="brand-icon"></span>
                <div>
                    <span class="brand-title">BACCARAT</span>
                    <span class="brand-subtitle">PAROLI STRATEGY</span>
                </div>
            </div>
            <span id="mode-badge">INITIALIZING</span>
        </div>

        <div class="config-panel">
            <span class="config-label">Set Your Base Bet:</span>
            <div class="basebet-input-wrapper">
                <span class="currency-symbol">$</span>
                <input type="number" id="base-bet-field" class="basebet-input" value="25" min="1" onchange="updateLogic()">
            </div>
        </div>

        <div class="system-lock-overlay" id="lock-screen">
            <div class="lock-title" id="lock-main-msg">TARGET ACHIEVED</div>
            <div class="lock-desc" id="lock-sub-desc">Profit target of 4x reached.</div>
            <button class="btn btn-lock-reset" onclick="appSoftReset()">START NEW FRESH</button>
        </div>

        <div id="app-workspace">
            <div class="prediction-box" id="predict-box-bg">
                <div class="bet-label">PLACE BET ON</div>
                <div id="bet-signal">WAIT</div>
                <div id="bet-recommendation-amount">---</div>
            </div>

            <div class="excel-container">
                <table id="excel-table"><tbody id="table-body"></tbody></table>
            </div>

            <div class="controls">
                <button class="btn btn-p" onclick="addEntry('P')">PLAYER</button>
                <button class="btn btn-b" onclick="addEntry('B')">BANKER</button>
            </div>

            <div class="footer-tools">
                <button class="btn btn-secondary" onclick="undo()">UNDO</button>
                <button class="btn btn-secondary" onclick="appSoftReset()">RESET</button>
            </div>
        </div>
    </div>

    <script>
        let history = [];
        const ROW_SIZE = 5;
        let currentRowModeIsDirect = true; 
        
        // Paroli State
        let paroliStep = 0; // 0 = 1x, 1 = 2x, 2 = 4x
        const paroliMultipliers = [1, 2, 4];

        function getBaseBetValue() {
            const value = parseFloat(document.getElementById('base-bet-field').value);
            return isNaN(value) || value <= 0 ? 10 : value;
        }
        
        function getCurrentBetValue() {
            return getBaseBetValue() * paroliMultipliers[paroliStep];
        }
        
        function handleWinLogic() {
            paroliStep = (paroliStep + 1) % 3;
        }
        
        function handleLossLogic() {
            paroliStep = 0;
        }
        
        function appSoftReset() {
            history = [];
            currentRowModeIsDirect = true;
            paroliStep = 0;
            document.getElementById('lock-screen').style.display = "none";
            renderTable();
            updateLogic();
        }

        function addEntry(val) {
            history.push(val);
            renderTable();
            updateLogic();
        }

        function undo() {
            history.pop();
            paroliStep = 0;
            renderTable();
            updateLogic();
        }

        function renderTable() {
            const body = document.getElementById('table-body');
            body.innerHTML = '';
            const rowCount = Math.ceil((history.length + 1) / ROW_SIZE);
            let runningProfitBalance = 0;
            let dynamicEngineIsDirect = true;
            const baseBet = getBaseBetValue();

            for (let i = 0; i < rowCount; i++) {
                let tr = document.createElement('tr');
                for (let j = 0; j < ROW_SIZE; j++) {
                    let td = document.createElement('td');
                    const index = i * ROW_SIZE + j;
                    if (history[index]) {
                        const val = history[index];
                        td.innerHTML = `<span class="${val === 'B' ? 'b-text' : 'p-text'}">${val}</span>`;
                        if (i > 0) {
                            const isMatch = (val === history[j]);
                            if ((dynamicEngineIsDirect && isMatch) || (!dynamicEngineIsDirect && !isMatch)) {
                                td.innerHTML += ' ✓';
                                runningProfitBalance += (val === 'B' ? (getCurrentBetValue() * 0.95) : getCurrentBetValue());
                                handleWinLogic();
                                dynamicEngineIsDirect = true;
                            } else {
                                td.innerHTML += ' X';
                                runningProfitBalance -= getCurrentBetValue();
                                handleLossLogic();
                                dynamicEngineIsDirect = false;
                            }
                        }
                    }
                    tr.appendChild(td);
                }
                body.appendChild(tr);
            }
            evaluateSystemThresholds(0, runningProfitBalance);
        }

        function evaluateSystemThresholds(totalCheckmarks, finalProfit) {
            const targetProfit = getBaseBetValue() * 4;
            if (finalProfit >= targetProfit) {
                document.getElementById('lock-screen').style.display = "flex";
                document.getElementById('lock-sub-desc').innerHTML = `Profit target of 4x base bet reached. <span class="profit-callout-block">TOTAL PROFIT: +$${finalProfit.toFixed(2)}</span>`;
            }
        }

        function updateLogic() {
            const signal = document.getElementById('bet-signal');
            const betAmountLabel = document.getElementById('bet-recommendation-amount');
            if (history.length < ROW_SIZE) {
                signal.innerText = "WAIT";
                return;
            }
            const colIndex = history.length % ROW_SIZE;
            const masterRef = history[colIndex];
            const prediction = currentRowModeIsDirect ? masterRef : (masterRef === 'B' ? 'P' : 'B');
            signal.innerText = prediction;
            betAmountLabel.innerText = `BET: $${getCurrentBetValue().toFixed(2)}`;
        }
    </script>
</body>
</html>
