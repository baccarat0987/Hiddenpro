    <!-- Firebase Authentication & Permission Check (untouched structure) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const REQUIRED_ENGINE_ID = "engine_13"; 

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && 
                           (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                           userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) {
                alert("Access denied: you don't have permission for Hongkong Strategy Engine.");
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>
    
    <!-- Right-click + shortcut blocker (untouched) -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) {
                return false;
            }
        };
    </script>

        .lock-status { font-size: 0.75rem; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 8px; }
        .lock-title { font-size: 2.4rem; font-weight: 950; letter-spacing: 1px; margin: 12px 0; line-height: 1.1; }

        .profit-callout-block { display: block; margin-top: 14px; font-size: 1.5rem; font-weight: 900; color: #10b981; text-shadow: 0 0 12px #10b981; background: rgba(16,185,129,0.1); padding: 10px 0; border-radius: 40px; letter-spacing: 1px; }

        .btn-lock-reset { background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #030407; padding: 18px 44px; font-size: 0.95rem; font-weight: 900; border-radius: 40px; border: none; letter-spacing: 1.5px; cursor: pointer; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4); transition: all 0.2s; }

<body>
    <div class="exit-nav">
        <a href="index.html" class="exit-btn">← EXIT TERMINAL</a>
    </div>

    <div class="container">
        <div class="header">
            <div class="brand-logo-area">
                <span class="brand-icon"></span>
                <div>
                    <span class="brand-title">BACCARAT</span>
                    <span class="brand-subtitle">PAROLI · 4X PROFIT</span>
                </div>
            </div>
            <span id="mode-badge">PAROLI ACTIVE</span>
        </div>

        <div class="config-panel">
            <span class="config-label">Base Bet (any amount):</span>
            <div class="basebet-input-wrapper">
                <span class="currency-symbol">$</span>
                <input type="number" id="base-bet-field" class="basebet-input" value="25" min="1" step="1" onchange="resetFullState()">
            </div>
        </div>

        <div class="system-lock-overlay" id="lock-screen">
            <div class="lock-status" id="lock-status-label">PROFIT TARGET REACHED</div>
            <div class="lock-title" id="lock-main-msg">CHANGE TABLE ✓</div>
            <div class="lock-desc" id="lock-sub-desc">You've reached 4x base bet profit. Secure winnings.</div>
            <button class="btn btn-lock-reset" onclick="resetFullState()">START NEW SESSION →</button>
        </div>

        <div id="app-workspace">
            <div class="prediction-box" id="predict-box-bg">
                <div class="bet-action-wrapper">
                    <div class="bet-label">PLACE BET ON</div>
                    <div id="bet-signal">WAIT</div>
                    <div id="bet-recommendation-amount">---</div>
                </div>
                <div id="instruction">Input first 5 hands for reference</div>
            </div>

            <div class="excel-container">
                <table id="excel-table">
                    <tbody id="table-body"></tbody>
                </table>
            </div>

            <div class="controls">
                <button class="btn btn-p" onclick="addOutcome('P')">PLAYER</button>
                <button class="btn btn-b" onclick="addOutcome('B')">BANKER</button>
            </div>

            <div class="footer-tools">
                <button class="btn btn-secondary" onclick="undoLast()">UNDO</button>
                <button class="btn btn-secondary" onclick="resetFullState()">RESET</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // PAROLI (POSITIVE PROGRESSION) STRATEGY
        // - Start with base bet amount
        // - After a win: double the bet for next round (max 3 consecutive wins recommended, but flexible)
        // - After a loss: reset to base bet
        // - Lock screen triggers when total net profit >= 4x BASE_BET (any basebet amount works)
        // ============================================================
        
        let history = [];           // 'B' / 'P'
        const ROW_SIZE = 5;
        let currentDirectionIsDirect = true;   // true = match ref, false = opposite
        
        // Paroli state
        let currentBetMultiplier = 1;    // 1 = baseBet, 2 = double, 4 = quadruple etc.
        let currentStreakWins = 0;
        let totalNetProfit = 0;           // accumulated profit/loss in current session
        
        // Reference row values (first row)
        let referenceRow = [];     // stores first 5 reference symbols
        
        function getBaseBet() {
            let val = parseFloat(document.getElementById('base-bet-field').value);
            return (isNaN(val) || val <= 0) ? 25 : val;
        }
        
        function getCurrentBetAmount() {
            return getBaseBet() * currentBetMultiplier;
        }
        
        // Reset everything (soft + profit, paroli state)
        function resetFullState() {
            history = [];
            referenceRow = [];
            currentDirectionIsDirect = true;
            currentBetMultiplier = 1;
            currentStreakWins = 0;
            totalNetProfit = 0;
            document.getElementById('lock-screen').style.display = "none";
            renderTable();
            updateUI();
        }
        
        // Called when a bet is resolved: outcome = 'W' or 'L', predicted bet side (just for commission)
        function applyParoliAndProfit(outcomeWasWin, betOnSide, betAmount) {
            if (outcomeWasWin) {
                let netWin = betAmount;
                // Banker commission 5%
                if (betOnSide === 'B') {
                    netWin = betAmount * 0.95;
                }
                totalNetProfit += netWin;
                // Paroli progression: double after win (but we cap at reasonable step, max x4)
                if (currentBetMultiplier < 8) {  // safe cap: baseBet*8 max
                    currentBetMultiplier = currentBetMultiplier * 2;
                }
                currentStreakWins++;
            } else {
                // loss
                totalNetProfit -= betAmount;
                // reset paroli to base
                currentBetMultiplier = 1;
                currentStreakWins = 0;
            }
        }
        
        // Check if profit target met: net profit >= 4 * baseBet (works for any amount)
        function isProfitTargetMet() {
            const target = getBaseBet() * 4;
            return totalNetProfit >= target;
        }
        
        function addOutcome(selectedSymbol) {
            if (document.getElementById('lock-screen').style.display === 'flex') return;
            
            history.push(selectedSymbol);
            
            // Build reference row from first 5 entries if we have them
            if (history.length >= ROW_SIZE && referenceRow.length === 0) {
                referenceRow = history.slice(0, ROW_SIZE);
            }
            
            // Process betting logic: evaluate the last entry that was just added
            // Important: we need to know what was the predicted bet for that last position (if any)
            if (history.length > ROW_SIZE) {
                const totalEntries = history.length;
                const colIdx = (totalEntries - 1) % ROW_SIZE;
                // we only evaluate predictions if the position is not a row starter (col != 0)
                if (colIdx !== 0 && referenceRow.length === ROW_SIZE) {
                    const masterValue = referenceRow[colIdx];
                    let predictedSide = "";
                    if (currentDirectionIsDirect) {
                        predictedSide = masterValue;
                    } else {
                        predictedSide = (masterValue === 'B') ? 'P' : 'B';
                    }
                    
                    const actualOutcome = selectedSymbol;
                    const isWin = (predictedSide === actualOutcome);
                    const betAmountUsed = getCurrentBetAmount();
                    
                    if (isWin) {
                        // WIN: apply paroli & profit
                        applyParoliAndProfit(true, predictedSide, betAmountUsed);
                        // after win, direction remains same for next (direct/opposite stays as current logic)
                        // but we keep currentDirectionIsDirect unchanged (system continues)
                    } else {
                        // LOSS: reset paroli and record loss
                        applyParoliAndProfit(false, predictedSide, betAmountUsed);
                        // Flip direction after a loss: important for the Hongkong pattern logic
                        currentDirectionIsDirect = !currentDirectionIsDirect;
                    }
                }
            }
            
            renderTable();
            updateUI();
            
            // After rendering, check profit target
            if (isProfitTargetMet()) {
                const base = getBaseBet();
                const profitVal = totalNetProfit.toFixed(2);
                triggerLockScreen(profitVal, base);
            }
        }
        
        function triggerLockScreen(profitFormatted, baseBetAmount) {
            const lockDiv = document.getElementById('lock-screen');
            const statusSpan = document.getElementById('lock-status-label');
            const mainMsg = document.getElementById('lock-main-msg');
            const descSpan = document.getElementById('lock-sub-desc');
            statusSpan.innerText = "✓ TARGET COMPLETE ✓";
            mainMsg.innerText = "CHANGE TABLE";
            descSpan.innerHTML = `You reached 4x your base bet ($${baseBetAmount} → +$${profitFormatted} profit).<br><span class="profit-callout-block">TOTAL PROFIT: +$${profitFormatted}</span><br>Secure gains and start fresh.`;
            lockDiv.style.display = "flex";
        }
        
        function undoLast() {
            if (history.length === 0) return;
            if (document.getElementById('lock-screen').style.display === 'flex') return;
            // Undo is simplified: reset full session to avoid broken paroli state
            // But to keep UX smooth: we alert and reset
            if (confirm("Undo will reset the entire session to avoid betting errors. Continue?")) {
                resetFullState();
            }
        }
        
        function renderTable() {
            const body = document.getElementById('table-body');
            body.innerHTML = '';
            if (!history.length && referenceRow.length === 0) {
                // show empty placeholders
                for (let i = 0; i < 2; i++) {
                    const tr = document.createElement('tr');
                    for (let j = 0; j < ROW_SIZE; j++) {
                        const td = document.createElement('td');
                        if (i === 0) td.className = 'ref-cell';
                        td.innerHTML = '—';
                        tr.appendChild(td);
                    }
                    body.appendChild(tr);
                }
                return;
            }
            
            const totalCells = Math.max(history.length, ROW_SIZE);
            const rowCount = Math.ceil(totalCells / ROW_SIZE);
            const maxVisible = 6;
            const startRow = Math.max(0, rowCount - maxVisible);
            
            // Recalculate visual with dynamic win/loss icons based on predictions
            // We'll rebuild full fresh table
            for (let i = startRow; i < rowCount; i++) {
                const tr = document.createElement('tr');
                if (i === rowCount-1 && history.length > ROW_SIZE) tr.className = 'new-row-anim';
                for (let j = 0; j < ROW_SIZE; j++) {
                    const idx = i * ROW_SIZE + j;
                    const td = document.createElement('td');
                    let cellContent = '';
                    let hasWinLoss = false;
                    let isWinFlag = false;
                    
                    if (idx < history.length) {
                        const symbol = history[idx];
                        cellContent = `<span class="${symbol === 'B' ? 'b-text' : 'p-text'}">${symbol}</span>`;
                        // add win/loss icon if this cell was a predicted outcome (idx >= ROW_SIZE and not starter)
                        if (idx >= ROW_SIZE && referenceRow.length === ROW_SIZE) {
                            const colPos = idx % ROW_SIZE;
                            if (colPos !== 0) {
                                // Determine what was predicted at that historical moment
                                // To avoid complex state, we reconstruct prediction based on direction at that time? 
                                // For simplicity we can re-evaluate using saved direction but easier: we recalc using rule engine
                                // We'll recompute prediction based on saved 'currentDirectionIsDirect' but direction changes over time. 
                                // Better: show only outcome, but win/loss shown dynamically in recent updates? for UX we show only outcome marks not necessary but nice.
                                // We simplify: win/loss shown only for last few bets to keep consistency; but for table we display just outcome and a simple indicator.
                                // Since this is a strategy display, we show generic marks for wins/losses based on real results.
                                // We'll compute by re-simulating lightweight for each cell? might be heavy, but okay. We'll generate small indicator.
                                // However to avoid complexity and respect "small changes", we display just outcome; profit panel shows details.
                            }
                        }
                        // Add tiny win/loss markers for the last 2 rows' predictions to give feedback
                        if (idx === history.length-1 && idx >= ROW_SIZE) {
                            // last added cell: show marker if known
                            const lastCol = idx % ROW_SIZE;
                            if (lastCol !== 0 && referenceRow.length === ROW_SIZE) {
                                const refVal = referenceRow[lastCol];
                                let predictedAtThatTime = "";
                                // we need direction used for that specific bet, we use currentDirectionIsDirect? not exact but approximate for marker
                                // We'll just not overcomplicate: user can see net profit
                            }
                        }
                    } else {
                        if (i === 0 && referenceRow.length > j) {
                            cellContent = `<span style="color:#38bdf8;">${referenceRow[j]}</span>`;
                            td.className = 'ref-cell';
                        } else {
                            cellContent = '—';
                        }
                    }
                    td.innerHTML = cellContent;
                    tr.appendChild(td);
                }
                body.appendChild(tr);
            }
        }
        
        function updateUI() {
            const signalDiv = document.getElementById('bet-signal');
            const instrDiv = document.getElementById('instruction');
            const badgeSpan = document.getElementById('mode-badge');
            const betAmountSpan = document.getElementById('bet-recommendation-amount');
            const boxBg = document.getElementById('predict-box-bg');
            
            if (history.length < ROW_SIZE) {
                signalDiv.innerText = "WAIT";
                signalDiv.style.color = "#94a3b8";
                betAmountSpan.innerText = "";
                instrDiv.innerText = `NEED ${ROW_SIZE - history.length} MORE REFERENCE HANDS`;
                badgeSpan.innerText = "ANALYZING";
                return;
            }
            
            // ensure reference row captured
            if (referenceRow.length === 0 && history.length >= ROW_SIZE) {
                referenceRow = history.slice(0, ROW_SIZE);
            }
            
            const currentPos = history.length;
            const colIndex = currentPos % ROW_SIZE;
            
            if (colIndex === 0) {
                signalDiv.innerText = "OBSERVE";
                signalDiv.style.color = "var(--accent)";
                betAmountSpan.innerText = "NO BET";
                instrDiv.innerText = "New row starter — waiting for pattern alignment";
                badgeSpan.innerText = "SCAN TREND";
                return;
            }
            
            if (referenceRow.length === ROW_SIZE) {
                const masterVal = referenceRow[colIndex];
                let prediction = "";
                if (currentDirectionIsDirect) {
                    prediction = masterVal;
                    badgeSpan.innerText = "PAROLI • MATCH MODE";
                    instrDiv.innerText = "Positive progression active • double on win";
                } else {
                    prediction = (masterVal === 'B') ? 'P' : 'B';
                    badgeSpan.innerText = "PAROLI • OPPOSITE";
                    instrDiv.innerText = "Recovery pattern • reset to base after loss";
                }
                
                const currentBetValue = getCurrentBetAmount();
                betAmountSpan.innerText = `BET: $${currentBetValue.toFixed(2)}`;
                
                if (prediction === 'B') {
                    signalDiv.innerText = "BANKER";
                    signalDiv.style.color = "var(--banker)";
                    boxBg.style.background = "linear-gradient(180deg, #1c0a0e 0%, #030406 100%)";
                    boxBg.style.boxShadow = "inset 0 0 25px rgba(255,71,87,0.1)";
                } else {
                    signalDiv.innerText = "PLAYER";
                    signalDiv.style.color = "var(--player)";
                    boxBg.style.background = "linear-gradient(180deg, #0a1222 0%, #030406 100%)";
                    boxBg.style.boxShadow = "inset 0 0 25px rgba(46,134,222,0.1)";
                }
                // display profit status
                const targetRequired = getBaseBet() * 4;
                instrDiv.innerHTML = `💰 Session P&L: $${totalNetProfit.toFixed(2)}  |  Target: $${targetRequired.toFixed(2)} (4x Base)`;
            } else {
                signalDiv.innerText = "ERROR";
                betAmountSpan.innerText = "---";
            }
        }
        
        // initial empty state
        resetFullState();
    </script>
</body>
</html>
