<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baccarat Hongkong Strategy</title>
    
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const REQUIRED_ENGINE_ID = "engine_13"; 

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && (userData.expiry === 'LIFETIME' || userData.expiry > now) && userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) { alert("Access denied."); window.location.href = "index.html"; return; }
            document.body.style.display = "flex";
        });
    </script>
    
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) return false;
        };
    </script>
    
    <style>
        :root { --bg: #030407; --card: #0a0c14; --card-header: #111422; --accent: #38bdf8; --banker: #ff4757; --player: #2e86de; --border: #1f2538; --text-main: #f8fafc; --text-dim: #475569; }
        body { background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; display: none; flex-direction: column; align-items: center; margin: 0; padding: 100px 20px; background-image: radial-gradient(circle at 50% 0%, #111524 0%, #030407 70%); min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 500px; background: var(--card); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 24px; overflow: hidden; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8); position: relative; backdrop-filter: blur(20px); }
        .header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, var(--card-header) 0%, rgba(17, 20, 34, 0.6) 100%); }
        .brand-icon { width: 14px; height: 14px; border: 2px solid var(--accent); transform: rotate(45deg); display: inline-block; box-shadow: 0 0 15px var(--accent); }
        .brand-title { font-weight: 900; letter-spacing: 2px; font-size: 1.15rem; color: #ffffff; }
        .brand-subtitle { color: var(--accent); font-size: 0.65rem; display: block; font-weight: 600; letter-spacing: 3px; }
        .config-panel { background: #07090f; border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
        .basebet-input { background: transparent; border: none; color: #ffffff; font-weight: 800; font-size: 0.95rem; width: 70px; outline: none; }
        .prediction-box { padding: 30px 24px; text-align: center; border-bottom: 1px solid var(--border); }
        #bet-signal { font-size: 3.5rem; font-weight: 950; letter-spacing: 4px; }
        .excel-container { max-height: 190px; overflow-y: auto; padding: 16px; background: #040508; }
        table { width: 100%; border-collapse: separate; border-spacing: 3px; }
        td { border: 1px solid rgba(255, 255, 255, 0.02); height: 44px; text-align: center; font-weight: 800; border-radius: 6px; }
        .btn { padding: 18px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; }
        .btn-b { background: #ff4757; color: white; }
        .btn-p { background: #2e86de; color: white; }
        .controls { padding: 24px 24px 12px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .system-lock-overlay { position: absolute; top: 77px; left: 0; width: 100%; height: calc(100% - 77px); background: rgba(3, 4, 7, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .btn-lock-reset { background: #38bdf8; color: #030407; padding: 18px 44px; font-weight: 900; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div style="display:flex; align-items:center; gap:12px;">
                <span class="brand-icon"></span>
                <div>
                    <span class="brand-title">BACCARAT</span>
                    <span class="brand-subtitle">PAROLI ENGINE</span>
                </div>
            </div>
        </div>

        <div class="config-panel">
            <span style="font-size:0.7rem; color:#94a3b8;">BASE BET:</span>
            <input type="number" id="base-bet-field" class="basebet-input" value="10" onchange="updateUI()">
        </div>

        <div class="system-lock-overlay" id="lock-screen">
            <div id="lock-main-msg" style="font-size:2rem; font-weight:900;">TARGET REACHED</div>
            <button class="btn-lock-reset" onclick="appReset()">NEW SESSION</button>
        </div>

        <div id="app-workspace">
            <div class="prediction-box">
                <div id="bet-signal">WAIT</div>
                <div id="bet-recommendation-amount">---</div>
            </div>
            <div class="excel-container"><table id="excel-table"><tbody id="table-body"></tbody></table></div>
            <div class="controls">
                <button class="btn btn-p" onclick="addEntry('P')">PLAYER</button>
                <button class="btn btn-b" onclick="addEntry('B')">BANKER</button>
            </div>
        </div>
    </div>

    <script>
        let history = [];
        let paroliStage = 0; // 0=1x, 1=2x, 2=4x
        let sessionProfit = 0;

        function addEntry(val) {
            history.push(val);
            processGameLogic(val);
            renderTable();
            updateUI();
        }

        function processGameLogic(lastVal) {
            if (history.length < 5) return;
            
            const base = parseFloat(document.getElementById('base-bet-field').value);
            const multipliers = [1, 2, 4];
            const currentBet = base * multipliers[paroliStage];
            
            // Hongkong Logic (Determines Prediction)
            const prediction = (history[0] === history[history.length-1]) ? history[0] : (history[0] === 'B' ? 'P' : 'B');
            
            // Paroli Betting Logic
            if (lastVal === prediction) {
                sessionProfit += (lastVal === 'B' ? currentBet * 0.95 : currentBet);
                paroliStage = (paroliStage + 1) % 3; // Cycle: 0 -> 1 -> 2 -> 0
            } else {
                sessionProfit -= currentBet;
                paroliStage = 0; // Reset on loss
            }
        }

        function renderTable() {
            const body = document.getElementById('table-body');
            body.innerHTML = '';
            let tr = document.createElement('tr');
            history.slice(-5).forEach(val => {
                let td = document.createElement('td');
                td.innerHTML = val;
                tr.appendChild(td);
            });
            body.appendChild(tr);
        }

        function updateUI() {
            const base = parseFloat(document.getElementById('base-bet-field').value);
            const multipliers = [1, 2, 4];
            document.getElementById('bet-recommendation-amount').innerText = `BET: $${base * multipliers[paroliStage]}`;
            
            // Re-calc prediction for display
            const prediction = (history.length < 5) ? "WAIT" : ((history[0] === history[history.length-1]) ? history[0] : (history[0] === 'B' ? 'P' : 'B'));
            document.getElementById('bet-signal').innerText = prediction;
            
            if (sessionProfit >= (base * 4)) {
                document.getElementById('lock-screen').style.display = "flex";
            }
        }

        function appReset() {
            history = [];
            paroliStage = 0;
            sessionProfit = 0;
            document.getElementById('lock-screen').style.display = "none";
            renderTable();
            updateUI();
        }
    </script>
</body>
</html>
