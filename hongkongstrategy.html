<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Baccarat Hongkong Strategy - Paroli Edition</title>
    
    <!-- Clean URL script -->
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <!-- Firebase Authentication & Permission Check -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const REQUIRED_ENGINE_ID = "engine_13"; 

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && 
                           (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                           userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) {
                alert("Access denied: you don't have permission for Hongkong Strategy Engine.");
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>
    
    <!-- Right-click and shortcut blocker -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) {
                return false;
            }
        };
    </script>
    
    <style>

        .system-lock-overlay { position: absolute; top: 77px; left: 0; width: 100%; height: calc(100% - 77px); background: rgba(3, 4, 7, 0.95); backdrop-filter: blur(16px); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box; z-index: 100; text-align: center; animation: overlayFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .lock-status { font-size: 0.75rem; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 8px; }
        .lock-title { font-size: 2.4rem; font-weight: 950; letter-spacing: 1px; margin: 12px 0; line-height: 1.1; }
        .lock-desc { font-size: 0.88rem; color: #64748b; max-width: 380px; line-height: 1.6; margin-bottom: 35px; }

        .profit-callout-block { display: block; margin-top: 14px; font-size: 1.40rem; font-weight: 900; letter-spacing: 1px; color: var(--profit-gold); text-transform: uppercase; text-shadow: 0 0 15px rgba(251,191,36,0.4); }

        .btn-lock-reset { background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #030407; padding: 18px 44px; font-size: 0.95rem; font-weight: 900; border-radius: 12px; border: none; letter-spacing: 1.5px; cursor: pointer; box-shadow: 0 10px 30px rgba(56, 189, 248, 0.35), 0 1px 0 rgba(255,255,255,0.3) inset; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .btn-lock-reset:hover { transform: scale(1.03) translateY(-2px); box-shadow: 0 15px 35px rgba(56, 189, 248, 0.5); }
        .btn-lock-reset:active { transform: scale(0.98); }

        .excel-container::-webkit-scrollbar { width: 5px; }

        .exit-nav {
            position: fixed;

        }

            background: rgba(0, 0, 0, 0.7);

        @keyframes fadeInContainer { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes overlayFadeIn { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 12px var(--accent); opacity: 0.8; } 50% { box-shadow: 0 0 20px var(--accent); opacity: 1; } }
        @keyframes slideInRow { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

<body>

    <div class="exit-nav">
        <a href="index.html" class="exit-btn">← EXIT TERMINAL</a>
    </div>

    <div class="container">
        <div class="header">
            <div class="brand-logo-area">
                <span class="brand-icon"></span>
                <div>
                    <span class="brand-title">BACCARAT</span>
                    <span class="brand-subtitle">PAROLI EVOLUTION</span>
                </div>
            </div>
            <span id="mode-badge">INITIALIZING</span>
        </div>

        <div class="config-panel">
            <span class="config-label">Set Your Base Bet:</span>
            <div class="basebet-input-wrapper">
                <span class="currency-symbol">$</span>
                <input type="number" id="base-bet-field" class="basebet-input" value="10" min="1" step="1" onchange="resetFullSystem()">
            </div>
        </div>

        <div class="system-lock-overlay" id="lock-screen">
            <div class="lock-status" id="lock-status-label">CHANGE TABLE REQUIRED</div>
            <div class="lock-title" id="lock-main-msg">TARGET ACHIEVED</div>
            <div class="lock-desc" id="lock-sub-desc">4x profit target has been activated based on base bet progression.</div>
            <button class="btn btn-lock-reset" onclick="resetFullSystem()">START NEW SESSION</button>
        </div>

        <div id="app-workspace">
            <div class="prediction-box" id="predict-box-bg">
                <div class="bet-action-wrapper">
                    <div class="bet-label">PLACE BET ON</div>
                    <div id="bet-signal">WAIT</div>
                    <div id="bet-recommendation-amount">---</div>
                    <div id="paroli-streak-indicator" class="paroli-streak" style="display: none;"></div>
                </div>
                <div id="instruction">INPUT FIRST 5 HANDS FOR REFERENCE</div>
            </div>

            <div class="excel-container">
                <table id="excel-table">
                    <tbody id="table-body"></tbody>
                </table>
            </div>

            <div class="controls">
                <button class="btn btn-p" onclick="addHand('P')">PLAYER</button>
                <button class="btn btn-b" onclick="addHand('B')">BANKER</button>
            </div>

            <div class="footer-tools">
                <button class="btn btn-secondary" onclick="undoLastHand()">UNDO</button>
                <button class="btn btn-secondary" onclick="resetFullSystem()">RESET</button>
            </div>
        </div>
    </div>

    <script>
        // ===============================================================
        // PAROLI PROGRESSION SYSTEM (3-step positive progression)
        // 1x -> 2x -> 4x base bet on consecutive wins. Reset on loss.
        // 4x profit condition: net session profit >= (baseBet * 4)
        // Automatic "Change Table" recommendation + lock screen when target is hit.
        // Preserves original 5-cell reference row logic, same UI and buttons.
        // ===============================================================
        
        let history = [];           // Stores 'B' or 'P'
        const ROW_SIZE = 5;        // Reference row size = 5
        let isDirectMode = true;   // Compare to reference cell for pattern (true = match reference, false = opposite)
        let sessionNetProfit = 0;   // Tracks running profit based on wins/losses using Paroli bets
        
        // Paroli state for current active streak (per prediction)
        let currentParoliStep = 0;   // 0 = no active streak or reset; 1 = base bet, 2 = double, 3 = quadruple (max)
        let currentPredictionSide = null; // 'B' or 'P' of the active streak
        
        function getBaseBetValue() {
            const val = parseFloat(document.getElementById('base-bet-field').value);
            return (isNaN(val) || val <= 0) ? 10 : val;
        }
        
        // Determine bet amount based on Paroli step (1x, 2x, 4x)
        function getCurrentParoliBet() {
            const base = getBaseBetValue();
            if (currentParoliStep === 0) return base;
            if (currentParoliStep === 1) return base;
            if (currentParoliStep === 2) return base * 2;
            if (currentParoliStep === 3) return base * 4;
            return base;
        }
        
        // Reset Paroli streak after a loss or after target achieved
        function resetParoliStreak() {
            currentParoliStep = 0;
            currentPredictionSide = null;
            updateParoliUI();
        }
        
        // Advance Paroli step on win (max step 3 = 4x base)
        function advanceParoliOnWin(winningSide) {
            if (currentParoliStep === 0) {
                currentParoliStep = 1;
                currentPredictionSide = winningSide;
            } else if (currentPredictionSide === winningSide && currentParoliStep < 3) {
                currentParoliStep++;
            } else if (currentPredictionSide !== winningSide) {
                currentParoliStep = 1;
                currentPredictionSide = winningSide;
            }
            updateParoliUI();
        }
        
        function updateParoliUI() {
            const streakDiv = document.getElementById('paroli-streak-indicator');
            if (currentParoliStep > 0) {
                let mult = currentParoliStep === 1 ? "1x" : (currentParoliStep === 2 ? "2x" : "4x");
                streakDiv.style.display = "inline-block";
                streakDiv.innerText = `⚡ PAROLI ACTIVE: ${mult} ⚡`;
            } else {
                streakDiv.style.display = "none";
            }
        }
        
        // Process bet outcome and update profit & Paroli
        function processBetOutcome(sideBetOn, isWin, betAmount) {
            if (isWin) {
                let winAmount = betAmount;
                if (sideBetOn === 'B') winAmount = betAmount * 0.95;
                sessionNetProfit += winAmount;
                advanceParoliOnWin(sideBetOn);
            } else {
                sessionNetProfit -= betAmount;
                resetParoliStreak();
            }
        }
        
        // Check if 4x base bet profit target is reached
        function check4xProfitTarget() {
            const base = getBaseBetValue();
            const targetProfit = base * 4;
            if (sessionNetProfit >= targetProfit && history.length >= ROW_SIZE) {
                const profitFormatted = sessionNetProfit.toFixed(2);
                triggerChangeTable(`🎯 4X PROFIT TARGET ACHIEVED! +$${profitFormatted} based on $${base} base bet.`, profitFormatted);
                return true;
            }
            return false;
        }
        
        function triggerChangeTable(descDetail, profitValue) {
            const lockScreen = document.getElementById('lock-screen');
            const statusLabel = document.getElementById('lock-status-label');
            const mainMsg = document.getElementById('lock-main-msg');
            const subDesc = document.getElementById('lock-sub-desc');
            statusLabel.innerText = "CHANGE TABLE";
            statusLabel.style.color = "#FBBF24";
            mainMsg.innerText = "CHANGE TABLE";
            subDesc.innerHTML = `Automatic recommendation: 4x profit target achieved.<br><span class="profit-callout-block">NET PROFIT: $${profitValue}</span><br><br>Please change table for a new fresh shoe.`;
            lockScreen.style.display = "flex";
        }
        
        function resetFullSystem() {
            history = [];
            isDirectMode = true;
            sessionNetProfit = 0;
            resetParoliStreak();
            document.getElementById('lock-screen').style.display = "none";
            renderHistoryTable();
            updatePredictionAndUI();
        }
        
        function addHand(result) {
            if (document.getElementById('lock-screen').style.display === "flex") return;
            
            const isReferencePhase = (history.length < ROW_SIZE);
            
            if (!isReferencePhase) {
                const currentPos = history.length;
                const colIndex = currentPos % ROW_SIZE;
                const masterRef = history[colIndex];
                let predictedSide = isDirectMode ? masterRef : (masterRef === 'B' ? 'P' : 'B');
                let betAmount = getCurrentParoliBet();
                let isWin = (predictedSide === result);
                processBetOutcome(predictedSide, isWin, betAmount);
            }
            
            history.push(result);
            
            if (history.length === ROW_SIZE) {
                resetParoliStreak();
            }
            
            renderHistoryTable();
            updatePredictionAndUI();
            check4xProfitTarget();
        }
        
        function undoLastHand() {
            if (history.length === 0) return;
            if (document.getElementById('lock-screen').style.display === "flex") return;
            
            history.pop();
            // Full reconstruction of state from remaining history
            reconstructSessionFromHistory();
            renderHistoryTable();
            updatePredictionAndUI();
            check4xProfitTarget();
        }
        
        function reconstructSessionFromHistory() {
            resetParoliStreak();
            sessionNetProfit = 0;
            let tempDirectMode = true;
            
            for (let i = 0; i < history.length; i++) {
                if (i < ROW_SIZE) continue;
                const colIdx = i % ROW_SIZE;
                const masterRef = history[colIdx];
                const predicted = tempDirectMode ? masterRef : (masterRef === 'B' ? 'P' : 'B');
                const actualResult = history[i];
                const betSize = (() => {
                    const base = getBaseBetValue();
                    if (currentParoliStep === 0) return base;
                    if (currentParoliStep === 1) return base;
                    if (currentParoliStep === 2) return base * 2;
                    return base * 4;
                })();
                const isWin = (predicted === actualResult);
                if (isWin) {
                    let winAmount = betSize;
                    if (predicted === 'B') winAmount = betSize * 0.95;
                    sessionNetProfit += winAmount;
                    if (currentParoliStep === 0) { currentParoliStep = 1; currentPredictionSide = predicted; }
                    else if (currentPredictionSide === predicted && currentParoliStep < 3) currentParoliStep++;
                    else if (currentPredictionSide !== predicted) { currentParoliStep = 1; currentPredictionSide = predicted; }
                } else {
                    sessionNetProfit -= betSize;
                    currentParoliStep = 0;
                    currentPredictionSide = null;
                }
                tempDirectMode = isWin ? true : false;
            }
            isDirectMode = tempDirectMode;
            updateParoliUI();
        }
        
        function renderHistoryTable() {
            const body = document.getElementById('table-body');
            body.innerHTML = '';
            const rowsNeeded = Math.ceil((history.length + 1) / ROW_SIZE);
            
            // Recompute direction for each cell for win/loss markers
            let tempDir = true;
            const winLossMap = new Map();
            for (let i = ROW_SIZE; i < history.length; i++) {
                const colIdx = i % ROW_SIZE;
                const masterRef = history[colIdx];
                const pred = tempDir ? masterRef : (masterRef === 'B' ? 'P' : 'B');
                const actual = history[i];
                const isWin = (pred === actual);
                winLossMap.set(i, isWin);
                tempDir = isWin ? true : false;
            }
            
            for (let r = 0; r < rowsNeeded; r++) {
                const tr = document.createElement('tr');
                if (r === rowsNeeded-1 && history.length > 0) tr.className = "new-row-anim";
                for (let c = 0; c < ROW_SIZE; c++) {
                    const idx = r * ROW_SIZE + c;
                    const td = document.createElement('td');
                    if (r === 0) td.classList.add('ref-cell');
                    if (history[idx]) {
                        const val = history[idx];
                        td.innerHTML = `<span class="${val === 'B' ? 'b-text' : 'p-text'}">${val}</span>`;
                        if (idx >= ROW_SIZE && winLossMap.has(idx)) {
                            const outcomeWin = winLossMap.get(idx);
                            if (outcomeWin) td.innerHTML += ' <span class="win-icon">✓</span>';
                            else td.innerHTML += ' <span class="loss-icon">X</span>';
                        }
                    }
                    tr.appendChild(td);
                }
                body.appendChild(tr);
            }
        }
        
        function updatePredictionAndUI() {
            const signalDiv = document.getElementById('bet-signal');
            const instrDiv = document.getElementById('instruction');
            const badge = document.getElementById('mode-badge');
            const betAmountSpan = document.getElementById('bet-recommendation-amount');
            const boxBg = document.getElementById('predict-box-bg');
            
            if (history.length < ROW_SIZE) {
                signalDiv.innerText = "WAIT";
                signalDiv.style.color = "white";
                betAmountSpan.innerText = "";
                instrDiv.innerText = `NEED ${ROW_SIZE - history.length} MORE HANDS FOR REFERENCE`;
                badge.innerText = "BUILDING REFERENCE";
                return;
            }
            const currentIndex = history.length;
            const colPos = currentIndex % ROW_SIZE;
            const masterRefCell = history[colPos];
            if (colPos === 0) {
                signalDiv.innerText = "SKIP HAND";
                signalDiv.style.color = "var(--accent)";
                betAmountSpan.innerText = "NO BET (ROW STARTER)";
                instrDiv.innerText = "Observing new row starter";
                badge.innerText = "ROW RESET";
                return;
            }
            
            let prediction = isDirectMode ? masterRefCell : (masterRefCell === 'B' ? 'P' : 'B');
            const betValue = getCurrentParoliBet();
            betAmountSpan.innerText = `BET: $${betValue.toFixed(2)}`;
            
            if (prediction === 'B') {
                signalDiv.innerText = 'BANKER';
                signalDiv.style.color = 'var(--banker)';
                boxBg.style.background = "linear-gradient(180deg, #1f0b0f 0%, #070203 100%)";
                boxBg.style.boxShadow = "inset 0 0 30px rgba(255, 71, 87, 0.08), inset 0 -20px 30px rgba(0, 0, 0, 0.4)";
            } else {
                signalDiv.innerText = 'PLAYER';
                signalDiv.style.color = 'var(--player)';
                boxBg.style.background = "linear-gradient(180deg, #091322 0%, #020407 100%)";
                boxBg.style.boxShadow = "inset 0 0 30px rgba(46, 134, 222, 0.08), inset 0 -20px 30px rgba(0, 0, 0, 0.4)";
            }
            instrDiv.innerText = isDirectMode ? "MATCH REFERENCE | PAROLI ACTIVE" : "OPPOSITE MODE | AFTER LOSS";
            badge.innerText = isDirectMode ? "PAROLI: MATCH MODE" : "PAROLI: COUNTER MODE";
        }
        
        // Global function for base bet change
        window.resetFullSystem = resetFullSystem;
        
        resetFullSystem();
    </script>
</body>
</html>
