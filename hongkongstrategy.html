<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baccarat Hongkong Strategy</title>
    
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const REQUIRED_ENGINE_ID = "engine_13"; 

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && (userData.expiry === 'LIFETIME' || userData.expiry > now) && userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) { alert("Access denied."); window.location.href = "index.html"; return; }
            document.body.style.display = "flex";
        });
    </script>
    
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) return false;
        };
    </script>
    
    <style>
        :root { --bg: #030407; --card: #0a0c14; --card-header: #111422; --accent: #38bdf8; --banker: #ff4757; --player: #2e86de; --border: #1f2538; --text-main: #f8fafc; --text-dim: #475569; --glow-banker: rgba(255, 71, 87, 0.15); --glow-player: rgba(46, 134, 222, 0.15); --glow-accent: rgba(56, 189, 248, 0.15); }
        body { background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; display: none; flex-direction: column; align-items: center; margin: 0; padding: 100px 20px; background-image: radial-gradient(circle at 50% 0%, #111524 0%, #030407 70%); min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 500px; background: var(--card); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 24px; overflow: hidden; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px); }
        .header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, var(--card-header) 0%, rgba(17, 20, 34, 0.6) 100%); }
        .brand-title { font-weight: 900; letter-spacing: 2px; font-size: 1.15rem; color: #ffffff; }
        .brand-subtitle { color: var(--accent); font-size: 0.65rem; display: block; font-weight: 600; letter-spacing: 3px; }
        .config-panel { background: #07090f; border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
        .basebet-input { background: transparent; border: none; color: #ffffff; font-weight: 800; font-size: 0.95rem; width: 70px; outline: none; }
        .prediction-box { padding: 30px 24px; text-align: center; background: linear-gradient(180deg, #090b11 0%, #030406 100%); border-bottom: 1px solid var(--border); }
        #bet-signal { font-size: 3.5rem; font-weight: 950; margin: 2px 0; letter-spacing: 4px; }
        .excel-container { max-height: 190px; overflow-y: auto; padding: 16px; background: #040508; }
        table { width: 100%; border-collapse: separate; border-spacing: 3px; table-layout: fixed; }
        td { border: 1px solid rgba(255, 255, 255, 0.02); background: rgba(255, 255, 255, 0.01); height: 44px; text-align: center; font-weight: 800; border-radius: 6px; }
        .controls { padding: 24px 24px 12px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .btn { padding: 18px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; }
        .btn-b { background: #ff4757; color: white; }
        .btn-p { background: #2e86de; color: white; }
        .system-lock-overlay { position: absolute; top: 77px; left: 0; width: 100%; height: calc(100% - 77px); background: rgba(3, 4, 7, 0.98); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .profit-callout-block { display: block; font-size: 1.4rem; color: var(--accent); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="brand-logo-area">
                <span class="brand-title">BACCARAT</span>
                <span class="brand-subtitle">PAROLI ENGINE</span>
            </div>
            <span id="mode-badge">INITIALIZING</span>
        </div>

        <div class="config-panel">
            <span>BASE BET:</span>
            <input type="number" id="base-bet-field" class="basebet-input" value="10" onchange="updateLogic()">
        </div>

        <div class="system-lock-overlay" id="lock-screen">
            <div class="lock-title" id="lock-main-msg">PROFIT GOAL MET</div>
            <button class="btn" onclick="appSoftReset()">START NEW FRESH</button>
        </div>

        <div id="app-workspace">
            <div class="prediction-box" id="predict-box-bg">
                <div id="bet-signal">WAIT</div>
                <div id="bet-recommendation-amount">---</div>
            </div>
            <div class="excel-container"><table id="excel-table"><tbody id="table-body"></tbody></table></div>
            <div class="controls">
                <button class="btn btn-p" onclick="addEntry('P')">PLAYER</button>
                <button class="btn btn-b" onclick="addEntry('B')">BANKER</button>
            </div>
            <div class="footer-tools" style="padding: 0 24px 24px 24px;">
                <button class="btn" onclick="undo()" style="width: 100%; background: #161b26; color: #fff;">UNDO / RESET</button>
            </div>
        </div>
    </div>

    <script>
        let history = [];
        let paroliStage = 1; 
        let currentRowModeIsDirect = true;

        function getBaseBetValue() {
            const val = parseFloat(document.getElementById('base-bet-field').value);
            return isNaN(val) || val <= 0 ? 10 : val;
        }

        function getCurrentBetValue() {
            return getBaseBetValue() * Math.pow(2, paroliStage - 1);
        }

        function appSoftReset() {
            history = [];
            paroliStage = 1;
            currentRowModeIsDirect = true;
            document.getElementById('lock-screen').style.display = "none";
            renderTable();
            updateLogic();
        }

        function addEntry(val) { history.push(val); renderTable(); updateLogic(); }

        function undo() { history.pop(); paroliStage = 1; renderTable(); updateLogic(); }

        function renderTable() {
            const body = document.getElementById('table-body');
            body.innerHTML = '';
            let runningProfit = 0;
            let dynamicEngineIsDirect = true;
            
            history.forEach((val, index) => {
                let tr = document.createElement('tr');
                let td = document.createElement('td');
                td.innerText = val;
                
                if (index > 0) {
                    let masterRef = history[index % 5 === 0 ? 0 : index % 5];
                    let isDirect = (history[0] === history[1]); // Simplified engine logic
                    let bet = getCurrentBetValue();
                    
                    if ((val === (isDirect ? masterRef : (masterRef === 'B' ? 'P' : 'B')))) {
                        runningProfit += (val === 'B' ? (bet * 0.95) : bet);
                        paroliStage = (paroliStage >= 4) ? 1 : paroliStage + 1;
                    } else {
                        runningProfit -= bet;
                        paroliStage = 1;
                    }
                }
                tr.appendChild(td);
                body.appendChild(tr);
            });
            evaluateSystemThresholds(runningProfit);
        }

        function evaluateSystemThresholds(finalProfit) {
            if (finalProfit >= (getBaseBetValue() * 4)) {
                document.getElementById('lock-screen').style.display = "flex";
            }
        }

        function updateLogic() {
            const signal = document.getElementById('bet-signal');
            const amt = document.getElementById('bet-recommendation-amount');
            if(history.length < 5) { signal.innerText = "WAIT"; return; }
            signal.innerText = "BET";
            amt.innerText = `NEXT BET: $${getCurrentBetValue().toFixed(2)}`;
        }

        renderTable();
        updateLogic();
    </script>
</body>
</html>
