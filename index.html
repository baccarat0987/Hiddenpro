<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>HIDDEN PRO </title>
    
    <script>
        // Clean URL Extension - removes .html from URL bar without refresh
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05020c;
            font-family: 'Inter', sans-serif;
            color: #eef3ff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 15% 30%, rgba(0, 180, 210, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 70%, rgba(100, 40, 180, 0.12) 0%, transparent 55%),
                repeating-linear-gradient(115deg, transparent 0px, transparent 40px, rgba(0, 200, 220, 0.02) 40px, rgba(0, 200, 220, 0.02) 80px);
            z-index: -2;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" opacity="0.04"><path fill="none" stroke="#00ccdd" stroke-width="0.6" d="M400,100 L400,700 M100,400 L700,400 M200,152 L600,648 M152,200 L648,600 M250,117 L550,683 M117,250 L683,550" /><circle cx="400" cy="400" r="280" fill="none" stroke="#00ccdd" stroke-width="0.5" stroke-dasharray="4 8"/><circle cx="400" cy="400" r="210" fill="none" stroke="#aa80ff" stroke-width="0.5" stroke-dasharray="2 12"/><path d="M400,120 L400,680 M120,400 L680,400" stroke="#44aaff" stroke-width="0.4"/><path d="M310,180 L490,620 M180,310 L620,490" stroke="#44aaff" stroke-width="0.3"/></svg>') repeat;
            background-size: 380px;
            pointer-events: none;
            z-index: -1;
            mix-blend-mode: overlay;
        }

        .top-bar {
            width: 100%;
            padding: 18px 40px;
            background: rgba(3, 2, 12, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 200, 210, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 18px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .ai-logo {
            width: 54px;
            height: 54px;
            background: radial-gradient(ellipse at 40% 45%, #2a2a6a, #0a0a2a);
            border-radius: 30% 70% 45% 55% / 65% 35% 65% 35%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 16px rgba(0, 200, 255, 0.4);
            animation: aiLogoMotion 2s infinite alternate ease-in-out;
            cursor: pointer;
        }
        @keyframes aiLogoMotion {
            0% { border-radius: 30% 70% 45% 55% / 65% 35% 65% 35%; transform: rotate(0deg) scale(1); background: radial-gradient(ellipse at 40% 45%, #3a3a8a, #0a0a2a); box-shadow: 0 0 12px #1ac8dd; }
            25% { border-radius: 55% 45% 70% 30% / 45% 60% 40% 55%; transform: rotate(2deg) scale(1.04); background: radial-gradient(ellipse at 60% 55%, #5a5ac0, #151540); box-shadow: 0 0 22px #6a4aff; }
            50% { border-radius: 45% 55% 35% 65% / 55% 40% 60% 45%; transform: rotate(-2deg) scale(0.98); background: radial-gradient(ellipse at 30% 60%, #4e4ea0, #0c0c2c); box-shadow: 0 0 18px #ff66aa; }
            75% { border-radius: 62% 38% 52% 48% / 48% 52% 48% 52%; transform: rotate(3deg) scale(1.02); background: radial-gradient(ellipse at 70% 30%, #6a6ac0, #0f0f30); box-shadow: 0 0 20px #d4af37; }
            100% { border-radius: 35% 65% 55% 45% / 60% 40% 60% 40%; transform: rotate(0deg) scale(1); background: radial-gradient(ellipse at 40% 45%, #3a3a8a, #0a0a2a); box-shadow: 0 0 12px #1ac8dd; }
        }
        .ai-logo::before {
            content: "◈";
            font-size: 30px;
            font-weight: 400;
            color: #bae6ff;
            text-shadow: 0 0 8px cyan;
            animation: iconPulse 1.5s infinite;
        }
        @keyframes iconPulse {
            0%, 100% { opacity: 0.7; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.1); text-shadow: 0 0 12px white; }
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            background: linear-gradient(135deg, #ffffff, #88ddff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .status-text {
            font-size: 9px;
            letter-spacing: 2px;
            font-weight: 500;
            color: #88ddff;
            background: rgba(0, 200, 210, 0.12);
            padding: 3px 12px;
            border-radius: 50px;
            border-left: 2px solid #1ac8dd;
        }

        .online-counter {
            font-size: 12px;
            font-family: 'Inter', monospace;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 22px;
            border-radius: 80px;
            border: 1px solid rgba(0, 200, 210, 0.5);
            display: inline-flex;
            align-items: center;
            gap: 14px;
            backdrop-filter: blur(8px);
            font-weight: 500;
        }
        .online-counter span:first-child {
            color: #b4f0ff;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1.2px;
        }
        .online-digit {
            font-weight: 800;
            background: #111725;
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 14px;
            color: #eef5ff;
        }
        .breathing-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #2effb0;
            border-radius: 50%;
            box-shadow: 0 0 12px #2effb0, inset 0 0 3px white;
            animation: breatheElite 1.6s infinite ease;
            margin-right: 8px;
        }
        @keyframes breatheElite {
            0% { opacity: 0.5; transform: scale(0.7); box-shadow: 0 0 0px #2effb0; }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 18px #2effb0; }
            100% { opacity: 0.5; transform: scale(0.7); box-shadow: 0 0 0px #2effb0; }
        }

        #topAuthBtn {
            background: rgba(10, 15, 35, 0.85);
            border: 1px solid #1ac8dd;
            border-radius: 60px;
            padding: 8px 26px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.25s;
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 12px;
            color: #eef5ff;
        }
        #topAuthBtn:hover {
            background: #1ac8dd;
            border-color: #fff;
            color: #03020c;
            transform: translateY(-2px);
        }
        #topAuthBtn.logged-in { background: #0f6b58; border-color: #a0ffd0; }
        #premiumBadge { display: none; background: #6a4aff; padding: 2px 10px; border-radius: 50px; font-size: 9px; font-weight: 800; color: #fff; }

        /* ========= MODIFIED GRID: ALWAYS 4 COLUMNS + AUTO RESIZE ON MOBILE ========= */
        .main-content {
            padding: 56px 48px;
            display: grid;
            /* FORCE 4 COLUMNS ACROSS ALL DEVICES */
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 40px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        /* Cards: ensure content shrinks gracefully */
        .sw-card {
            background: rgba(6, 8, 22, 0.65);
            backdrop-filter: blur(18px);
            border-radius: 48px;
            transition: all 0.5s cubic-bezier(0.2, 0.95, 0.4, 1.1);
            border: 1px solid rgba(0, 200, 210, 0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 30px 45px -25px rgba(0,0,0,0.8);
            cursor: pointer;
            min-width: 0;       /* essential for column shrink */
        }

        .sw-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 48px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(0, 210, 220, 0.5), rgba(100, 70, 255, 0.4));
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .sw-card:hover::before { opacity: 1; }

        .sw-card.card-breathing {
            animation: cardShadowBreathing 1.6s ease-in-out infinite alternate;
            will-change: box-shadow, border-color;
        }

        @keyframes cardShadowBreathing {
            0% {
                box-shadow: 0 30px 45px -25px rgba(0,0,0,0.8), 0 0 0px rgba(0, 200, 255, 0);
                border-color: rgba(0, 200, 210, 0.25);
            }
            100% {
                box-shadow: 0 40px 65px -20px rgba(0, 200, 255, 0.5), 0 0 32px 8px rgba(0, 200, 255, 0.4);
                border-color: rgba(0, 200, 210, 0.8);
            }
        }

        .engine-trigger.pulse-breathing {
            animation: buttonBreathing 10s ease-in-out forwards;
        }
        @keyframes buttonBreathing {
            0% { transform: scale(1); box-shadow: 0 0 0px #1ac8dd; background: rgba(0, 0, 0, 0.65); border-color: #2ad8ee; }
            10% { transform: scale(1.05); box-shadow: 0 0 30px #ff0066, 0 0 15px #ffcc00; background: rgba(255, 0, 102, 0.2); border-color: #ffffff; }
            30% { transform: scale(1.02); box-shadow: 0 0 20px #ffcc00; }
            50% { transform: scale(1.04); box-shadow: 0 0 28px #00ffcc; background: rgba(0, 255, 204, 0.15); }
            70% { transform: scale(1); box-shadow: 0 0 12px #ff0066; }
            80% { transform: scale(1.02); box-shadow: 0 0 22px #ff0066; }
            100% { transform: scale(1); box-shadow: 0 0 0px #1ac8dd; background: rgba(0, 0, 0, 0.65); border-color: #2ad8ee; }
        }

        .card-inner {
            padding: 36px 32px 38px;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
            background: rgba(6, 8, 22, 0.4);
            border-radius: 46px;
            backdrop-filter: blur(4px);
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .new-badge-corner {
            position: absolute;
            top: 20px;
            right: 24px;
            background: linear-gradient(145deg, #ff416c, #cc0044);
            font-size: 10px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 80px;
            color: #ffffff;
            box-shadow: 0 0 14px #ff3366;
            animation: glowSweep 2.2s infinite ease;
            z-index: 10;
            letter-spacing: 1px;
        }
        @keyframes glowSweep {
            0% { box-shadow: 0 0 0px #ff3366; }
            30% { box-shadow: 0 0 20px #ff6699; background: linear-gradient(145deg, #ff5e8e, #e6004d); }
            70% { box-shadow: 0 0 20px #ff6699; }
            100% { box-shadow: 0 0 0px #ff3366; background: linear-gradient(145deg, #ff416c, #cc0044); }
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding-right: 10px;
        }
        .sw-card h2 {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 30%, #b8e5ff 80%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
            animation: glassShimmerStrong 3s infinite ease;
            line-height: 1.2;
        }
        @keyframes glassShimmerStrong {
            0% { background-position: 0% 50%; filter: drop-shadow(0 0 1px rgba(255,255,255,0.2)); }
            50% { background-position: 100% 50%; filter: drop-shadow(0 0 8px rgba(0,200,220,0.6)); text-shadow: 0 0 8px rgba(0,200,220,0.5);}
            100% { background-position: 0% 50%; filter: drop-shadow(0 0 1px rgba(255,255,255,0.2)); }
        }

        .accent {
            height: 3px;
            background: linear-gradient(90deg, #1ac8dd, #6a4aff);
            margin-bottom: 28px;
            border-radius: 4px;
            transition: width 0.4s ease;
        }
        .sw-card.type-a .accent { width: 80px; }
        .sw-card.type-b .accent { width: 100%; height: 2px; background: #1ac8dd; margin-bottom: 24px; }
        .sw-card.type-c .accent { margin-left: auto; width: 65px; background: #6a4aff; }
        .sw-card.type-d .accent { width: 110px; background: linear-gradient(90deg, #6a4aff, #1ac8dd); }
        .sw-card.type-e .accent { height: 4px; width: 60px; background: #1ac8dd; }

        .desc-text {
            font-size: 0.88rem;
            line-height: 1.6;
            color: #dfe8ff;
            margin-bottom: 36px;
            font-weight: 300;
            min-height: 85px;
        }

        .sw-card button {
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid #2ad8ee;
            border-radius: 100px;
            color: #f0fcff;
            padding: 15px 12px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            width: 100%;
            margin-top: auto;
            font-family: 'Inter', sans-serif;
            position: relative;
            z-index: 2;
        }
        .sw-card button:hover {
            background: linear-gradient(115deg, #1a98b0, #6a4aff);
            border-color: #ffffff;
            box-shadow: 0 0 24px #1ac8dd;
            transform: scale(1.01);
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(1, 2, 10, 0.98);
            backdrop-filter: blur(36px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .loading-ring {
            position: relative;
            width: 140px;
            height: 140px;
        }
        .loading-ring svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .loading-ring circle {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
        }
        .loading-ring circle.bg {
            stroke: rgba(0, 200, 210, 0.15);
        }
        .loading-ring circle.progress {
            stroke: url(#grad);
            stroke-dasharray: 380;
            stroke-dashoffset: 380;
            filter: drop-shadow(0 0 6px #1ac8dd);
            transition: stroke-dashoffset 0.05s linear;
        }
        .loading-percent {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #88ddff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-family: 'Playfair Display', serif;
        }
        .loading-text-main {
            font-size: 20px;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 500;
            background: linear-gradient(135deg, #fff, #88ddff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 30px;
            animation: glitchText 0.5s infinite alternate;
        }
        .loading-sub {
            font-size: 11px;
            color: #8a9bc0;
            margin-top: 14px;
            letter-spacing: 2px;
        }
        @keyframes glitchText {
            0% { text-shadow: -1px 0 #1ac8dd, 1px 0 #6a4aff; opacity: 0.8; letter-spacing: 5px; }
            100% { text-shadow: 1px 0 #1ac8dd, -1px 0 #6a4aff; opacity: 1; letter-spacing: 7px; }
        }

        .footer {
            width: 100%;
            background: rgba(3, 2, 12, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 200, 210, 0.3);
            padding: 28px 40px 32px;
            margin-top: 40px;
            text-align: center;
        }
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .payment-methods {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .payment-icon {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 22px;
            border-radius: 60px;
            border: 1px solid rgba(0, 200, 210, 0.3);
            transition: 0.2s;
        }
        .payment-icon:hover {
            border-color: #1ac8dd;
            background: rgba(0, 200, 210, 0.1);
            transform: translateY(-2px);
        }
        .fa-paypal { color: #1a9fd4; }
        .fa-bitcoin { color: #f7931a; }
        .payment-icon span { font-size: 14px; font-weight: 500; color: #eef3ff; }
        .footer-copy { font-size: 11px; color: #8a9bc0; }

        /* ====== RESPONSIVE: MAINTAIN 4 COLUMNS ON ALL DEVICES, AUTO-RESIZE CONTENT ====== */
        @media (max-width: 1000px) {
            .main-content { gap: 28px; padding: 44px 32px; }
            .card-inner { padding: 28px 22px 32px; }
            .sw-card h2 { font-size: 1.7rem; }
            .desc-text { font-size: 0.8rem; min-height: 70px; }
        }

        @media (max-width: 780px) {
            .main-content { gap: 20px; padding: 32px 20px; }
            .card-inner { padding: 22px 18px 26px; }
            .sw-card h2 { font-size: 1.4rem; }
            .desc-text { font-size: 0.72rem; margin-bottom: 24px; min-height: auto; }
            .sw-card button { font-size: 0.7rem; padding: 12px 8px; letter-spacing: 1.5px; }
            .new-badge-corner { font-size: 8px; padding: 4px 10px; top: 12px; right: 14px; }
            .accent { margin-bottom: 18px; }
        }

        /* Mobile phones: still 4 columns, all elements shrink & wrap */
        @media (max-width: 600px) {
            .main-content { gap: 14px; padding: 24px 12px; }
            .card-inner { padding: 16px 12px 20px; }
            .sw-card h2 { font-size: 1.1rem; letter-spacing: -0.2px; }
            .desc-text { font-size: 0.62rem; line-height: 1.4; margin-bottom: 18px; }
            .sw-card button { font-size: 0.55rem; padding: 10px 4px; letter-spacing: 0.8px; }
            .new-badge-corner { font-size: 6px; padding: 2px 6px; top: 8px; right: 8px; }
            .title-row { margin-bottom: 8px; gap: 6px; }
            .accent { margin-bottom: 12px; }
            .sw-card.type-a .accent, .sw-card.type-c .accent, .sw-card.type-d .accent, .sw-card.type-e .accent { width: 45px; }
        }

        @media (max-width: 480px) {
            .main-content { gap: 10px; padding: 16px 8px; }
            .card-inner { padding: 12px 8px 16px; }
            .sw-card h2 { font-size: 0.9rem; }
            .desc-text { font-size: 0.55rem; line-height: 1.35; margin-bottom: 14px; }
            .sw-card button { font-size: 0.45rem; padding: 8px 3px; letter-spacing: 0.5px; }
            .new-badge-corner { font-size: 5px; padding: 2px 5px; top: 5px; right: 6px; }
            .top-bar { padding: 12px 16px; }
        }

        /* Additional safe adjustments: disable old breakpoint that changed column count */
        /* (original media that forced 1fr is effectively overridden) */
        @media (max-width: 820px) {
            .main-content { padding: 40px 24px; gap: 24px; } /* keep 4 cols */
        }

        ::-webkit-scrollbar { width: 5px; background: #0b0e1a; }
        ::-webkit-scrollbar-thumb { background: #1ac8dd; border-radius: 12px; }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(1, 2, 10, 0.97);
            backdrop-filter: blur(44px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            overflow-y: auto;
            padding: 30px;
        }
        .overlay-content {
            max-width: 1100px;
            width: 100%;
            text-align: center;
        }
        .card-wrap {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin: 48px 0;
        }
        .p-card {
            background: rgba(8, 12, 28, 0.9);
            border-radius: 48px;
            padding: 28px 22px;
            width: 220px;
            cursor: pointer;
            border: 1px solid #1ac8dd;
            transition: 0.25s;
        }
        .p-card:hover {
            transform: translateY(-10px);
            border-color: #88ddff;
            background: #12192f;
        }
        .price {
            font-size: 36px;
            font-weight: 800;
            margin: 14px 0;
            color: #eef5ff;
        }
        .btn-buy {
            background: #1ac8dd;
            border-radius: 80px;
            padding: 12px;
            font-weight: 700;
            color: #03020c;
            margin-top: 12px;
        }
        .software-grid-mini {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin: 30px 0;
            font-size: 10px;
        }
        .software-grid-mini span {
            background: rgba(0,200,210,0.2);
            padding: 5px 18px;
            border-radius: 60px;
            color: #b4f0ff;
        }
        .close-btn {
            background: none;
            border: 1px solid #1ac8dd;
            padding: 12px 44px;
            border-radius: 80px;
            color: #eef5ff;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-btn:hover {
            background: #1ac8dd;

<body>

<div id="loadingOverlay" class="loading-overlay">

            <div class="payment-icon"><i class="fab fa-bitcoin"></i><span>Bitcoin</span></div>

</footer>

<div id="overlay">

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
        authDomain: "my-software-portal.firebaseapp.com",
        projectId: "my-software-portal",
        storageBucket: "my-software-portal.firebasestorage.app",
        messagingSenderId: "1072405993700",
        appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const softwareCatalog = [
        { name: "Baccarat GPT Ultra", file: "baccaratgpt-ultra.html", desc: "Neural sovereign engine + real-time drift & quantum edge analysis.", engineId: "engine_1" },
        { name: "Viper Roulette", file: "viper-roulette.html", desc: "High-frequency pattern recognition + dealer signature intelligence.", engineId: "engine_2" },
        { name: "AI Baccarat Trend", file: "baccarat-trend.html", desc: "Deep learning trained on 12M shoes, predictive drift. Royal edition.", engineId: "engine_3" },
        { name: "Baccarat Analysis", file: "baccarat-analysis.html", desc: "Statistical matrix: Banker/Player/Tie probability modeling.", engineId: "engine_4" },
        { name: "Baccarat Pro Series", file: "baccarat-predictor-series.html", desc: "7‑step realtime calculation engine with anomaly detection.", engineId: "engine_5" },
        { name: "Baccarat PRO", file: "baccarat-pro.html", desc: "Neutral Engine logic — secret sequence advantage. Elite only.", engineId: "engine_6" },
        { name: "Roulette PRO", file: "roulette-pro.html", desc: "Sector tracking, neighbor betting optimization + visual bias.", engineId: "engine_7" },
        { name: "AI Card Counting", file: "card-counting.html", desc: "Digital counting system for baccarat variants. Imperial tech.", engineId: "engine_8" },
        { name: "Gemini Ultra", file: "gemini-ultra.html", desc: "AI-integrated terminal cross‑referencing casino datasets.", engineId: "engine_9" },
        { name: "Google AI", file: "google-ai.html", desc: "Massive data mining for pattern loopholes.", engineId: "engine_10" },
        { name: "VisionWave Baccarat", file: "visionwave.html", desc: "Visual shoe sequence analyzer & edge detection.", engineId: "engine_11" },
        { name: "Baccarat Neutral Engine", file: "Baccarat-engine.html", desc: "Hybrid trend + match pattern recognition engine.", engineId: "engine_12" }
    ];

    const overlayEl = document.getElementById('overlay');
    const overlayContent = document.getElementById('overlayContent');
    const statusMsg = document.getElementById('statusMsg');
    const topAuthBtn = document.getElementById('topAuthBtn');
    const authBtnText = document.getElementById('authBtnText');
    const premiumBadge = document.getElementById('premiumBadge');
    const softwareContainer = document.getElementById('softwareList');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingPercentSpan = document.getElementById('loadingPercent');
    const progressCircle = document.querySelector('.loading-ring .progress');
    const onlineSpan = document.getElementById('onlineNumber');
    const STORAGE_KEY = 'hiddenpro_live_final2';
    const MIN_ONLINE = 165, MAX_ONLINE = 300;
    let currentOnline = parseInt(localStorage.getItem(STORAGE_KEY));
    if (isNaN(currentOnline) || currentOnline < MIN_ONLINE || currentOnline > MAX_ONLINE) {
        currentOnline = Math.floor(Math.random() * (MAX_ONLINE - MIN_ONLINE + 1)) + MIN_ONLINE;
        localStorage.setItem(STORAGE_KEY, currentOnline);
    }
    onlineSpan.innerText = currentOnline;
    function updateFakeOnline() {
        let delta = 0; const r = Math.random();
        if (r < 0.35) delta = -1; else if (r < 0.7) delta = 1; else if (r < 0.85) delta = 2; else if (r < 0.95) delta = -2;
        let newVal = currentOnline + delta;
        if (newVal < MIN_ONLINE) newVal = MIN_ONLINE + Math.floor(Math.random() * 5);
        if (newVal > MAX_ONLINE) newVal = MAX_ONLINE - Math.floor(Math.random() * 5);
        if (Math.abs(newVal - currentOnline) > 3) newVal = currentOnline + (newVal > currentOnline ? 1 : -1);
        newVal = Math.min(MAX_ONLINE, Math.max(MIN_ONLINE, newVal));
        if (newVal !== currentOnline) { currentOnline = newVal; onlineSpan.innerText = currentOnline; localStorage.setItem(STORAGE_KEY, currentOnline); }
    }
    setInterval(updateFakeOnline, 11000 + Math.random() * 9000);

    const layoutTypes = ['type-a', 'type-b', 'type-c', 'type-d', 'type-e'];
    softwareCatalog.forEach((sw, idx) => {
        const card = document.createElement('div');
        const variant = layoutTypes[idx % layoutTypes.length];
        card.classList.add('sw-card', variant);
        const isNew = (sw.name === "Baccarat GPT Ultra");
        const newBadgeHtml = isNew ? '<div class="new-badge-corner">NEW</div>' : '';
        card.innerHTML = `<div class="card-inner">${newBadgeHtml}<div class="accent"></div><div class="title-row"><h2>${sw.name}</h2></div><p class="desc-text">${sw.desc}</p><button data-engine-id="${sw.engineId}" data-file="${sw.file}" class="engine-trigger">START ENGINE</button></div>`;
        softwareContainer.appendChild(card);
    });

    let currentUserAllowedSet = new Set();
    let currentUserEmail = null;
    let isPremiumActive = false;
    let currentExpiryTimestamp = null;
    let expiryCheckInterval = null;
    let isCheckingLicense = false;

    function showLuxuryLoadingAndRedirect(redirectUrl) {
        return new Promise((resolve) => {
            loadingOverlay.classList.add('active');
            const duration = 5000;
            const startTime = performance.now();
            const radius = 60;
            const circumference = 2 * Math.PI * radius;
            progressCircle.style.strokeDasharray = circumference;
            let animFrame = null;
            function updateProgress(now) {
                const elapsed = now - startTime;
                const percent = Math.min(100, (elapsed / duration) * 100);
                const offset = circumference - (percent / 100) * circumference;
                progressCircle.style.strokeDashoffset = offset;
                loadingPercentSpan.textContent = `${Math.floor(percent)}%`;
                if (elapsed < duration) animFrame = requestAnimationFrame(updateProgress);
                else { if (animFrame) cancelAnimationFrame(animFrame); resolve(); }
            }
            animFrame = requestAnimationFrame(updateProgress);
        }).then(() => { window.location.href = redirectUrl; });
    }

    function showContactAdminAlert(softwareName) {
        alert(`⛔ Contact admin: you don't have permission for ${softwareName}.`);
        statusMsg.textContent = "ACCESS DENIED · CONTACT ADMIN";
        setTimeout(() => { if (currentUserEmail && isPremiumActive) statusMsg.textContent = `PREMIUM: ${currentUserEmail}`; else statusMsg.textContent = "LOGGED IN · FREE TIER"; }, 2000);
    }

    async function engineClickHandler(e) {
        e.stopPropagation();
        const btn = e.currentTarget;
        const engineId = btn.getAttribute('data-engine-id');
        const targetFile = btn.getAttribute('data-file');
        const softwareName = softwareCatalog.find(s => s.engineId === engineId)?.name || "this engine";
        if (!auth.currentUser) {
            alert("🔐 Please login with Gmail first to access this engine.");
            await toggleAuth();
            return;
        }
        if (!isPremiumActive) {
            openPricing();
            return;
        }
        if (!currentUserAllowedSet.has(engineId)) {
            showContactAdminAlert(softwareName);
            return;
        }
        await showLuxuryLoadingAndRedirect(targetFile);
    }

    function updateButtonsByPermission() {
        document.querySelectorAll('.engine-trigger').forEach(btn => {
            const engineId = btn.getAttribute('data-engine-id');
            const isAllowed = currentUserAllowedSet.has(engineId);
            if (!isAllowed && auth.currentUser && isPremiumActive) {
                btn.style.opacity = '0.7';
            } else {
                btn.style.opacity = '1';
            }
            btn.disabled = false;
            btn.style.cursor = 'pointer';
        });
    }

    async function checkExpiryAndLogout() {
        if (!auth.currentUser) return;
        if (!currentExpiryTimestamp || currentExpiryTimestamp === 'LIFETIME') return;
        const now = Date.now();
        if (now >= currentExpiryTimestamp) {
            await signOut(auth);
            alert("Your premium subscription has expired. You have been logged out.");
            currentUserAllowedSet.clear();
            isPremiumActive = false;
            currentUserEmail = null;
            currentExpiryTimestamp = null;
            updateButtonsByPermission();
            statusMsg.textContent = "CORE: OFFLINE (EXPIRED)";
            premiumBadge.style.display = "none";
            authBtnText.textContent = "GMAIL LOGIN";
            topAuthBtn.classList.remove('logged-in');
            if (expiryCheckInterval) clearInterval(expiryCheckInterval);
            expiryCheckInterval = null;
        }
    }

    async function fetchAndSetUserData(userEmail) {
        if (isCheckingLicense) return;
        isCheckingLicense = true;
        try {
            const userDocRef = doc(db, "users", userEmail);
            const userSnap = await getDoc(userDocRef);
            if (userSnap.exists()) {
                const userData = userSnap.data();
                const expiry = userData.expiry;
                const allowed = userData.allowedSoftware || [];
                currentUserAllowedSet = new Set(allowed);
                if (expiry === 'LIFETIME') {
                    isPremiumActive = true;
                    currentExpiryTimestamp = 'LIFETIME';
                    premiumBadge.style.display = "inline-block";
                    statusMsg.textContent = `PREMIUM (LIFETIME) · ${userEmail}`;
                } else if (typeof expiry === 'number') {
                    currentExpiryTimestamp = expiry;
                    if (Date.now() < expiry) {
                        isPremiumActive = true;
                        premiumBadge.style.display = "inline-block";
                        statusMsg.textContent = `PREMIUM ACTIVE · ${userEmail}`;
                    } else {
                        isPremiumActive = false;
                        currentExpiryTimestamp = null;
                        premiumBadge.style.display = "none";
                        statusMsg.textContent = `FREE TIER · ${userEmail} (premium expired)`;
                    }
                } else {
                    isPremiumActive = false;
                    currentExpiryTimestamp = null;
                    premiumBadge.style.display = "none";
                    statusMsg.textContent = `FREE TIER · ${userEmail}`;
                }
            } else {
                isPremiumActive = false;
                currentUserAllowedSet.clear();
                currentExpiryTimestamp = null;
                premiumBadge.style.display = "none";
                statusMsg.textContent = `FREE TIER · ${userEmail} (no license)`;
            }
            updateButtonsByPermission();
            if (expiryCheckInterval) clearInterval(expiryCheckInterval);
            if (isPremiumActive && currentExpiryTimestamp !== 'LIFETIME' && currentExpiryTimestamp) {
                expiryCheckInterval = setInterval(checkExpiryAndLogout, 30000);
            }
        } catch (err) {
            console.error("Error fetching user data:", err);
            statusMsg.textContent = `⚠️ ERROR: ${err.message}`;
        } finally {
            isCheckingLicense = false;
        }
    }

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUserEmail = user.email.toLowerCase();
            statusMsg.textContent = `WELCOME: ${currentUserEmail}`;
            authBtnText.textContent = "LOGOUT";
            topAuthBtn.classList.add('logged-in');
            await fetchAndSetUserData(currentUserEmail);
        } else {
            if (expiryCheckInterval) clearInterval(expiryCheckInterval);
            expiryCheckInterval = null;
            currentUserEmail = null;
            isPremiumActive = false;
            currentUserAllowedSet.clear();
            currentExpiryTimestamp = null;
            statusMsg.textContent = "CORE: OFFLINE";
            authBtnText.textContent = "GMAIL LOGIN";
            topAuthBtn.classList.remove('logged-in');
            premiumBadge.style.display = "none";
            updateButtonsByPermission();
        }
        attachEngineListeners();
        attachCardEvents();
    });

    function attachEngineListeners() {
        document.querySelectorAll('.engine-trigger').forEach(btn => {
            btn.removeEventListener('click', engineClickHandler);
            btn.addEventListener('click', engineClickHandler);
        });
    }

    let activeCard = null, activeButton = null, breathingTimeout = null;
    function stopAllBreathing() {
        if (activeCard) { activeCard.classList.remove('card-breathing'); if (activeButton) activeButton.classList.remove('pulse-breathing'); activeCard = null; activeButton = null; }
        if (breathingTimeout) { clearTimeout(breathingTimeout); breathingTimeout = null; }
    }
    function startBreathingOnCard(card) {
        stopAllBreathing(); activeCard = card; const btn = card.querySelector('.engine-trigger'); if (btn) { activeButton = btn; btn.classList.add('pulse-breathing'); } card.classList.add('card-breathing'); breathingTimeout = setTimeout(() => stopAllBreathing(), 10000);
    }
    function handleCardClick(e) { if (e.target.closest('.engine-trigger')) return; startBreathingOnCard(this); }
    function attachCardEvents() { document.querySelectorAll('.sw-card').forEach(card => { card.removeEventListener('click', handleCardClick); card.addEventListener('click', handleCardClick); }); }
    document.addEventListener('click', function(e) { if (!e.target.closest('.sw-card')) stopAllBreathing(); });

    async function toggleAuth() {
        if (auth.currentUser) await signOut(auth);
        else { try { await signInWithPopup(auth, provider); } catch(err) { console.error(err); } }
    }
    topAuthBtn.addEventListener('click', toggleAuth);

    async function openPricing() {
        const priceDoc = await getDoc(doc(db, "settings", "pricing"));
        const p = priceDoc.exists() ? priceDoc.data() : { p1:300, p3_new:400, p12_new:1600, p_life:5000 };
        overlayEl.style.display = "flex";
        overlayContent.innerHTML = `<h1 style="font-size:2.3rem; font-weight:600; font-family:'Playfair Display'; background:linear-gradient(135deg,#ffffff,#88ddff); -webkit-background-clip:text; background-clip:text; color:transparent;">ETHEREAL ACCESS</h1><div class="software-grid-mini">${softwareCatalog.map(s => `<span>${s.name}</span>`).join('')}</div><div class="card-wrap"><div class="p-card" onclick="buy(${p.p1})"><h3>1 MONTH</h3><div class="price">$${p.p1}</div><div class="btn-buy">UNLOCK</div></div><div class="p-card" onclick="buy(${p.p3_new})"><h3>3 MONTHS</h3><div class="price">$${p.p3_new}</div><div class="btn-buy">UNLOCK</div></div><div class="p-card" onclick="buy(${p.p12_new})"><h3>1 YEAR</h3><div class="price">$${p.p12_new}</div><div class="btn-buy">UNLOCK</div></div><div class="p-card" onclick="buy(${p.p_life})"><h3>LIFETIME</h3><div class="price">$${p.p_life}</div><div class="btn-buy">ETERNAL ACCESS</div></div></div>`;
    }
    window.buy = (amt) => {
        if (!auth.currentUser) { alert("Please login with Gmail first."); toggleAuth(); return; }
        const email = auth.currentUser.email.toLowerCase();
        const encodedEmail = "ZWR6ZWxrZWl0aDBAZ21haWwuY29t";
        const paypalURL = `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=${atob(encodedEmail)}&amount=${amt}&currency_code=USD&item_name=Elite_Terminal_Access&custom=${email}&return=https://hiddenpro.qzz.io`;
        window.location.href = paypalURL;
    };
    window.closeOverlay = () => { overlayEl.style.display = "none"; };

    attachEngineListeners();
    attachCardEvents();
</script>

<script>

        document.addEventListener('contextmenu', e => e.preventDefault());

            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83))) return false;
