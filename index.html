<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Hiddenpro</title>
    
    <script>
        // Clean URL Extension - removes .html from URL bar without refresh
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Playfair+Display:wght@400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --brand-primary: #ff6b35;
            --brand-secondary: #f7c59f;
            --brand-accent: #efefd0;
            --brand-dark: #0d0a1a;
            --brand-glow: #ff6b35;
            --brand-glow-2: #ffb347;
            --brand-deep: #1a0e2e;
            --brand-mid: #2d1b4e;
            --live-green: #00ff88;
            --new-red: #ff2d2d;
            --new-red-dark: #cc0000;
            --guest-gray: #8a8a9a;
            --free-amber: #ffb347;
            --no-access-purple: #b07cff;
        }

        body {
            background: #0d0a1a;
            font-family: 'Inter', sans-serif;
            color: #fff5e6;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* ————— BRANDED ANIMATED BACKGROUND ————— */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 107, 53, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(247, 197, 159, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 179, 71, 0.08) 0%, transparent 55%),
                radial-gradient(circle at 10% 90%, rgba(255, 107, 53, 0.10) 0%, transparent 40%);
            z-index: -3;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" opacity="0.07"><defs><linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%23ff6b35"/><stop offset="100%" stop-color="%23ffb347"/></linearGradient></defs><g stroke="url(%23g1)" fill="none" stroke-width="1.2"><path d="M0,600 Q300,300 600,600 T1200,600"/><path d="M0,700 Q300,400 600,700 T1200,700"/><path d="M0,500 Q300,200 600,500 T1200,500"/><circle cx="600" cy="600" r="450" stroke-dasharray="10 20"/><circle cx="600" cy="600" r="320" stroke-dasharray="6 14"/><circle cx="600" cy="600" r="190" stroke-dasharray="3 9"/></g><g fill="%23ff6b35" opacity="0.5"><circle cx="600" cy="150" r="5"/><circle cx="600" cy="1050" r="5"/><circle cx="150" cy="600" r="5"/><circle cx="1050" cy="600" r="5"/><circle cx="300" cy="300" r="4"/><circle cx="900" cy="900" r="4"/><circle cx="900" cy="300" r="4"/><circle cx="300" cy="900" r="4"/></g><g stroke="%23ffb347" stroke-width="0.8" opacity="0.4"><path d="M600,200 L600,1000 M200,600 L1000,600"/><path d="M350,350 L850,850 M850,350 L350,850"/></g></svg>') repeat;
            background-size: 700px;
            pointer-events: none;
            z-index: -2;
            animation: slowDrift 60s infinite linear;
        }

        @keyframes slowDrift {
            0% { background-position: 0 0; }
            100% { background-position: 700px 700px; }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #ff6b35, transparent);
            opacity: 0;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        .top-bar {
            width: 100%;
            padding: 18px 40px;
            background: rgba(13, 10, 26, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 107, 53, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 18px;
            box-shadow: 0 4px 30px rgba(255, 107, 53, 0.1);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* ————— BRANDED ANIMATED LOGO ————— */
        .ai-logo {
            width: 64px;
            height: 64px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(3deg); }
        }

        .ai-logo .hex-core {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #ff6b35, #ffb347, #ff6b35);
            background-size: 200% 200%;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 20px rgba(255, 107, 53, 0.8),
                0 0 40px rgba(255, 179, 71, 0.4);
            animation: hexGradient 3s ease infinite, hexGlow 2s ease-in-out infinite alternate;
            position: relative;
            z-index: 3;
        }

        .ai-logo .hex-core::before {
            content: "H";
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #0d0a1a;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        @keyframes hexGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes hexGlow {
            0% { 
                box-shadow: 0 0 15px rgba(255, 107, 53, 0.7), 0 0 30px rgba(255, 179, 71, 0.3);
                transform: scale(1) rotate(0deg);
            }
            100% { 
                box-shadow: 0 0 30px rgba(255, 107, 53, 1), 0 0 60px rgba(255, 179, 71, 0.6);
                transform: scale(1.08) rotate(5deg);
            }
        }

        .ai-logo .orbit-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .ai-logo .orbit-ring.or1 {
            width: 58px;
            height: 58px;
            border-top-color: #ff6b35;
            border-right-color: #ffb347;
            animation: orbitSpin 3s infinite linear;
            box-shadow: 0 0 8px rgba(255, 107, 53, 0.5);
        }
        .ai-logo .orbit-ring.or2 {
            width: 70px;
            height: 70px;
            border-bottom-color: #f7c59f;
            border-left-color: #ff6b35;
            animation: orbitSpinReverse 4.5s infinite linear;
            box-shadow: 0 0 8px rgba(247, 197, 159, 0.5);
        }

        @keyframes orbitSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes orbitSpinReverse {
            0% { transform: translate(-50%, -50%) rotate(360deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }

        .ai-logo .dot {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
        }
        .ai-logo .dot.d1 {
            background: #ffb347;
            box-shadow: 0 0 10px #ffb347, 0 0 20px #ffb347;
            animation: dotOrbit1 2.8s infinite linear;
        }
        .ai-logo .dot.d2 {
            background: #f7c59f;
            box-shadow: 0 0 10px #f7c59f, 0 0 20px #f7c59f;
            animation: dotOrbit2 3.6s infinite linear;
        }

        @keyframes dotOrbit1 {
            0% { transform: translate(-50%, -50%) rotate(0deg) translateX(30px) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg) translateX(30px) rotate(-360deg); }
        }
        @keyframes dotOrbit2 {
            0% { transform: translate(-50%, -50%) rotate(180deg) translateX(36px) rotate(-180deg); }
            100% { transform: translate(-50%, -50%) rotate(540deg) translateX(36px) rotate(-540deg); }
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #ff6b35, #ffb347, #f7c59f);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: logoShimmer 3s ease infinite;
            letter-spacing: 1px;
        }

        @keyframes logoShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .status-text {
            font-size: 9px;
            letter-spacing: 2px;
            font-weight: 600;
            color: #ffb347;
            background: rgba(255, 107, 53, 0.15);
            padding: 3px 12px;
            border-radius: 50px;
            border-left: 2px solid #ff6b35;
            animation: statusPulse 2s ease-in-out infinite alternate;
        }

        @keyframes statusPulse {
            0% { box-shadow: 0 0 0px rgba(255, 107, 53, 0); }
            100% { box-shadow: 0 0 12px rgba(255, 107, 53, 0.4); }
        }

        .online-counter {
            font-size: 12px;
            font-family: 'Orbitron', monospace;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 22px;
            border-radius: 80px;
            border: 1px solid rgba(255, 107, 53, 0.5);
            display: inline-flex;
            align-items: center;
            gap: 14px;
            backdrop-filter: blur(8px);
            font-weight: 600;
            box-shadow: 0 0 15px rgba(255, 107, 53, 0.15);
        }
        .online-counter span:first-child {
            color: #f7c59f;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1.2px;
        }
        /* ————— ONLINE NUMBER — NOW WHITE ————— */
        .online-digit {
            font-weight: 900;
            background: #1a0e2e;
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 14px;
            color: #ffffff;
            animation: digitGlowWhite 2s ease-in-out infinite alternate;
        }

        @keyframes digitGlowWhite {
            0% { text-shadow: 0 0 4px rgba(255, 255, 255, 0.5); }
            100% { text-shadow: 0 0 12px rgba(255, 255, 255, 0.9), 0 0 20px rgba(255, 255, 255, 0.6); }
        }

        /* ————— BLINKING GREEN LIVE DOT ————— */
        .breathing-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ff88, inset 0 0 3px white;
            animation: blinkGreen 1s infinite ease-in-out;
            margin-right: 8px;
        }
        @keyframes blinkGreen {
            0%, 100% { 
                opacity: 1; 
                transform: scale(1); 
                box-shadow: 0 0 16px #00ff88, 0 0 32px #00ff88, inset 0 0 4px white;
                background-color: #00ff88;
            }
            50% { 
                opacity: 0.3; 
                transform: scale(0.7); 
                box-shadow: 0 0 4px #00ff88;
                background-color: #00cc66;
            }
        }

        #topAuthBtn {
            background: rgba(13, 10, 26, 0.85);
            border: 1px solid #ff6b35;
            border-radius: 60px;
            padding: 8px 26px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff5e6;
            position: relative;
            overflow: hidden;
        }
        #topAuthBtn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 179, 71, 0.3), transparent);
            transition: left 0.5s;
        }
        #topAuthBtn:hover::before {
            left: 100%;
        }
        #topAuthBtn:hover {
            background: linear-gradient(135deg, #ff6b35, #ffb347);
            border-color: #fff;
            color: #0d0a1a;
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 107, 53, 0.6);
        }
        #topAuthBtn.logged-in { background: #2d1b4e; border-color: #ffb347; }
        #premiumBadge { display: none; background: #ff6b35; padding: 2px 10px; border-radius: 50px; font-size: 9px; font-weight: 800; color: #0d0a1a; }

        /* ========= MAIN GRID ========= */
        .main-content {
            padding: 56px 48px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        /* ————— CARD CONTAINER ————— */
        .sw-card {
            position: relative;
            background: transparent;
            cursor: pointer;
            min-width: 0;
            animation: cardEntrance 0.8s ease backwards;
            transition: transform 0.4s cubic-bezier(0.2, 0.95, 0.4, 1.1), opacity 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .sw-card:nth-child(1) { animation-delay: 0.1s; }
        .sw-card:nth-child(2) { animation-delay: 0.2s; }
        .sw-card:nth-child(3) { animation-delay: 0.3s; }
        .sw-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .sw-card .card-shell {
            position: relative;
            background: linear-gradient(160deg, rgba(45, 27, 78, 0.75) 0%, rgba(26, 14, 46, 0.9) 100%);
            backdrop-filter: blur(18px);
            clip-path: polygon(
                0 28px,
                28px 0,
                100% 0,
                100% calc(100% - 28px),
                calc(100% - 28px) 100%,
                0 100%
            );
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.9);
        }

        .sw-card .border-trace {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            clip-path: polygon(
                0 28px,
                28px 0,
                100% 0,
                100% calc(100% - 28px),
                calc(100% - 28px) 100%,
                0 100%
            );
        }
        .sw-card .border-trace::before {
            content: '';
            position: absolute;
            inset: 0;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.8), rgba(255, 179, 71, 0.6), transparent 40%, transparent 60%, rgba(255, 179, 71, 0.6), rgba(255, 107, 53, 0.8));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .sw-card:hover .border-trace::before { opacity: 1; }

        .sw-card .card-header {
            position: relative;
            padding: 18px 26px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 107, 53, 0.2);
            background: linear-gradient(90deg, rgba(255, 107, 53, 0.10), transparent);
        }
        .sw-card .card-header .header-label {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sw-card .card-header .header-label .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffb347;
            box-shadow: 0 0 8px #ffb347;
            animation: dotBlink 1.8s infinite ease-in-out;
        }
        @keyframes dotBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }
        .sw-card .card-header .header-label .sys-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #ffb347;
            text-transform: uppercase;
        }

        /* ————— STATUS BADGE — 4 DISTINCT COLORS ————— */
        .sw-card .card-header .engine-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 4px 10px;
            border-radius: 4px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .engine-badge.badge-guest {
            color: #b0b0c0;
            background: rgba(138, 138, 154, 0.15);
            border: 1px solid rgba(138, 138, 154, 0.45);
            box-shadow: 0 0 8px rgba(138, 138, 154, 0.2);
        }
        .engine-badge.badge-free {
            color: #ffb347;
            background: rgba(255, 179, 71, 0.15);
            border: 1px solid rgba(255, 179, 71, 0.5);
            box-shadow: 0 0 10px rgba(255, 179, 71, 0.3);
            animation: freePulse 2.2s ease-in-out infinite alternate;
        }
        @keyframes freePulse {
            0% { box-shadow: 0 0 6px rgba(255, 179, 71, 0.25); }
            100% { box-shadow: 0 0 16px rgba(255, 179, 71, 0.55); }
        }
        .engine-badge.badge-noaccess {
            color: #c8a8ff;
            background: rgba(176, 124, 255, 0.15);
            border: 1px solid rgba(176, 124, 255, 0.5);
            box-shadow: 0 0 10px rgba(176, 124, 255, 0.35);
            animation: noAccessPulse 2.2s ease-in-out infinite alternate;
        }
        @keyframes noAccessPulse {
            0% { box-shadow: 0 0 6px rgba(176, 124, 255, 0.25); }
            100% { box-shadow: 0 0 16px rgba(176, 124, 255, 0.55); }
        }
        .engine-badge.badge-online {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.12);
            border: 1px solid rgba(0, 255, 136, 0.45);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.25);
            animation: onlinePulse 2s ease-in-out infinite alternate;
        }
        @keyframes onlinePulse {
            0% { box-shadow: 0 0 6px rgba(0, 255, 136, 0.2); border-color: rgba(0, 255, 136, 0.35); }
            100% { box-shadow: 0 0 14px rgba(0, 255, 136, 0.5); border-color: rgba(0, 255, 136, 0.7); }
        }

        .sw-card .card-body {
            padding: 22px 26px 26px;
            display: flex;
            flex-direction: column;
            flex: 1;
            position: relative;
        }

        /* ————— NEW BADGE — RED ————— */
        .new-badge-corner {
            position: absolute;
            top: -8px;
            right: -8px;
            background: linear-gradient(145deg, #ff2d2d, #cc0000);
            font-size: 9px;
            font-weight: 900;
            padding: 5px 12px;
            color: #ffffff;
            box-shadow: 0 0 14px #ff2d2d;
            animation: glowSweepRed 2.2s infinite ease;
            z-index: 10;
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
            clip-path: polygon(0 0, 100% 0, 100% 75%, 85% 100%, 0 100%);
            padding-right: 18px;
        }
        @keyframes glowSweepRed {
            0% { box-shadow: 0 0 0px #ff2d2d; transform: scale(1); }
            30% { box-shadow: 0 0 20px #ff6666; background: linear-gradient(145deg, #ff4444, #990000); transform: scale(1.08); }
            70% { box-shadow: 0 0 20px #ff6666; }
            100% { box-shadow: 0 0 0px #ff2d2d; background: linear-gradient(145deg, #ff2d2d, #cc0000); transform: scale(1); }
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 8px;
        }
        .sw-card h2 {
            font-size: 1.55rem;
            font-weight: 700;
            font-family: 'Orbitron', 'Playfair Display', serif;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 20%, #ffb347 60%, #ff6b35 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
            animation: titleShimmer 4s infinite ease;
            line-height: 1.2;
        }
        @keyframes titleShimmer {
            0% { background-position: 0% 50%; filter: drop-shadow(0 0 2px rgba(255, 107, 53, 0.3)); }
            50% { background-position: 100% 50%; filter: drop-shadow(0 0 10px rgba(255, 179, 71, 0.7)); }
            100% { background-position: 0% 50%; filter: drop-shadow(0 0 2px rgba(255, 107, 53, 0.3)); }
        }

        .accent {
            height: 2px;
            background: linear-gradient(90deg, #ff6b35, #ffb347);
            margin-bottom: 18px;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        .accent::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
            animation: accentShine 3s infinite;
        }
        @keyframes accentShine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .desc-text {
            font-size: 0.85rem;
            line-height: 1.55;
            color: #f7e6d5;
            margin-bottom: 26px;
            font-weight: 300;
            flex: 1;
        }

        .sw-card button {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #ff6b35;
            border-radius: 8px;
            color: #fff5e6;
            padding: 14px 12px;

                <div class="card-header">
                    <div class="header-label">
                        <span class="status-dot"></span>
                        <span class="sys-tag">SYSTEM ACTIVE</span>
                    </div>
                    <span class="engine-badge badge-guest">🔒 LOCKED</span>
                </div>
                <div class="card-body">
                    <div class="title-row"><h2>${sw.name}</h2></div>
                    <div class="accent"></div>
                    <p class="desc-text">${sw.desc}</p>
                    <button data-engine-id="${sw.engineId}" data-file="${sw.file}" class="engine-trigger">🔐 LOGIN TO ACCESS</button>
                </div>
            </div>
        `;
        softwareContainer.appendChild(card);
    });

    let currentUserAllowedSet = new Set();
    let currentUserEmail = null;
    let isPremiumActive = false;
    let currentExpiryTimestamp = null;
    let expiryCheckInterval = null;
    let isCheckingLicense = false;

    function showLuxuryLoadingAndRedirect(redirectUrl) {
        return new Promise((resolve) => {
            loadingOverlay.classList.add('active');
            const duration = 5000;
            const startTime = performance.now();
            const radius = 60;
            const circumference = 2 * Math.PI * radius;
            progressCircle.style.strokeDasharray = circumference;
            let animFrame = null;
            function updateProgress(now) {
                const elapsed = now - startTime;
                const percent = Math.min(100, (elapsed / duration) * 100);
                const offset = circumference - (percent / 100) * circumference;
                progressCircle.style.strokeDashoffset = offset;
                loadingPercentSpan.textContent = `${Math.floor(percent)}%`;
                if (elapsed < duration) animFrame = requestAnimationFrame(updateProgress);
                else { if (animFrame) cancelAnimationFrame(animFrame); resolve(); }
            }
            animFrame = requestAnimationFrame(updateProgress);
        }).then(() => { window.location.href = redirectUrl; });
    }

    function showContactAdminAlert(softwareName) {
        alert(`📩 Contact admin: you need a license for ${softwareName}.\n\nPlease reach out to the admin to request access to this engine.`);
        statusMsg.textContent = "ACCESS DENIED · REQUEST LICENSE";
        setTimeout(() => { 
            if (currentUserEmail && isPremiumActive) statusMsg.textContent = `PREMIUM: ${currentUserEmail}`; 
            else if (currentUserEmail) statusMsg.textContent = `FREE TIER · ${currentUserEmail}`;
            else statusMsg.textContent = "CORE: OFFLINE"; 
        }, 2500);
    }

    function updateCardStates() {
        document.querySelectorAll('.sw-card').forEach(card => {
            const btn = card.querySelector('.engine-trigger');
            const engineId = btn.getAttribute('data-engine-id');
            const badge = card.querySelector('.engine-badge');

            badge.classList.remove('badge-guest', 'badge-free', 'badge-noaccess', 'badge-online');

            if (!auth.currentUser) {
                card.dataset.state = 'guest';
                badge.textContent = '🔒 LOCKED';
                badge.classList.add('badge-guest');
                btn.textContent = '🔐 LOGIN TO ACCESS';
            } else if (!isPremiumActive) {
                card.dataset.state = 'free';
                badge.textContent = '⚠️ FREE TIER';
                badge.classList.add('badge-free');
                btn.textContent = '⚡ GO PREMIUM';
            } else if (!currentUserAllowedSet.has(engineId)) {
                card.dataset.state = 'no-access';
                badge.textContent = '🚫 NO LICENSE';
                badge.classList.add('badge-noaccess');
                btn.textContent = '📩 REQUEST ACCESS';
            } else {
                card.dataset.state = 'premium';
                badge.textContent = '✅ ONLINE';
                badge.classList.add('badge-online');
                btn.textContent = '▶ START ENGINE';
            }
        });
    }

    async function engineClickHandler(e) {
        e.stopPropagation();
        const btn = e.currentTarget;
        const engineId = btn.getAttribute('data-engine-id');
        const targetFile = btn.getAttribute('data-file');
        const softwareName = softwareCatalog.find(s => s.engineId === engineId)?.name || "this engine";

        if (!auth.currentUser) {
            await toggleAuth();
            return;
        }

        if (!isPremiumActive) {
            openPricing();
            return;
        }

        if (!currentUserAllowedSet.has(engineId)) {
            showContactAdminAlert(softwareName);
            return;
        }

        await showLuxuryLoadingAndRedirect(targetFile);
    }

    function updateButtonsByPermission() {
        updateCardStates();
    }

    async function checkExpiryAndLogout() {
        if (!auth.currentUser) return;
        if (!currentExpiryTimestamp || currentExpiryTimestamp === 'LIFETIME') return;
        const now = Date.now();
        if (now >= currentExpiryTimestamp) {
            await signOut(auth);
            alert("Your premium subscription has expired. You have been logged out.");
            currentUserAllowedSet.clear();
            isPremiumActive = false;
            currentUserEmail = null;
            currentExpiryTimestamp = null;
            updateCardStates();
            statusMsg.textContent = "CORE: OFFLINE (EXPIRED)";
            premiumBadge.style.display = "none";
            authBtnText.textContent = "GMAIL LOGIN";
            topAuthBtn.classList.remove('logged-in');
            if (expiryCheckInterval) clearInterval(expiryCheckInterval);
            expiryCheckInterval = null;
        }
    }

    async function fetchAndSetUserData(userEmail) {
        if (isCheckingLicense) return;
        isCheckingLicense = true;
        try {
            const userDocRef = doc(db, "users", userEmail);
            const userSnap = await getDoc(userDocRef);
            if (userSnap.exists()) {
                const userData = userSnap.data();
                const expiry = userData.expiry;
                const allowed = userData.allowedSoftware || [];
                currentUserAllowedSet = new Set(allowed);
                if (expiry === 'LIFETIME') {
                    isPremiumActive = true;
                    currentExpiryTimestamp = 'LIFETIME';
                    premiumBadge.style.display = "inline-block";
                    statusMsg.textContent = `PREMIUM (LIFETIME) · ${userEmail}`;
                } else if (typeof expiry === 'number') {
                    currentExpiryTimestamp = expiry;
                    if (Date.now() < expiry) {
                        isPremiumActive = true;
                        premiumBadge.style.display = "inline-block";
                        statusMsg.textContent = `PREMIUM ACTIVE · ${userEmail}`;
                    } else {
                        isPremiumActive = false;
                        currentExpiryTimestamp = null;
                        premiumBadge.style.display = "none";
                        statusMsg.textContent = `FREE TIER · ${userEmail} (premium expired)`;
                    }
                } else {
                    isPremiumActive = false;
                    currentExpiryTimestamp = null;
                    premiumBadge.style.display = "none";
                    statusMsg.textContent = `FREE TIER · ${userEmail}`;
                }
            } else {
                isPremiumActive = false;
                currentUserAllowedSet.clear();
                currentExpiryTimestamp = null;
                premiumBadge.style.display = "none";
                statusMsg.textContent = `FREE TIER · ${userEmail} (no license)`;
            }
            updateCardStates();
            if (expiryCheckInterval) clearInterval(expiryCheckInterval);
            if (isPremiumActive && currentExpiryTimestamp !== 'LIFETIME' && currentExpiryTimestamp) {
                expiryCheckInterval = setInterval(checkExpiryAndLogout, 30000);
            }
        } catch (err) {
            console.error("Error fetching user data:", err);
            statusMsg.textContent = `⚠️ ERROR: ${err.message}`;
        } finally {
            isCheckingLicense = false;
        }
    }

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUserEmail = user.email.toLowerCase();
            statusMsg.textContent = `WELCOME: ${currentUserEmail}`;
            authBtnText.textContent = "LOGOUT";
            topAuthBtn.classList.add('logged-in');
            await fetchAndSetUserData(currentUserEmail);
        } else {
            if (expiryCheckInterval) clearInterval(expiryCheckInterval);
            expiryCheckInterval = null;
            currentUserEmail = null;
            isPremiumActive = false;
            currentUserAllowedSet.clear();
            currentExpiryTimestamp = null;
            statusMsg.textContent = "CORE: OFFLINE";
            authBtnText.textContent = "GMAIL LOGIN";
            topAuthBtn.classList.remove('logged-in');
            premiumBadge.style.display = "none";
            updateCardStates();
        }
        attachEngineListeners();
        attachCardEvents();
    });

    function attachEngineListeners() {
        document.querySelectorAll('.engine-trigger').forEach(btn => {
            btn.removeEventListener('click', engineClickHandler);
            btn.addEventListener('click', engineClickHandler);
        });
    }

    let activeCard = null, activeButton = null, breathingTimeout = null;
    function stopAllBreathing() {
        if (activeCard) { activeCard.classList.remove('card-breathing'); if (activeButton) activeButton.classList.remove('pulse-breathing'); activeCard = null; activeButton = null; }
        if (breathingTimeout) { clearTimeout(breathingTimeout); breathingTimeout = null; }
    }
    function startBreathingOnCard(card) {
        stopAllBreathing(); activeCard = card; const btn = card.querySelector('.engine-trigger'); if (btn) { activeButton = btn; btn.classList.add('pulse-breathing'); } card.classList.add('card-breathing'); breathingTimeout = setTimeout(() => stopAllBreathing(), 10000);
    }
    function handleCardClick(e) { if (e.target.closest('.engine-trigger')) return; startBreathingOnCard(this); }
    function attachCardEvents() { document.querySelectorAll('.sw-card').forEach(card => { card.removeEventListener('click', handleCardClick); card.addEventListener('click', handleCardClick); }); }
    document.addEventListener('click', function(e) { if (!e.target.closest('.sw-card')) stopAllBreathing(); });

    async function toggleAuth() {
        if (auth.currentUser) await signOut(auth);
        else { try { await signInWithPopup(auth, provider); } catch(err) { console.error(err); } }
    }
    topAuthBtn.addEventListener('click', toggleAuth);

    async function openPricing() {
        const priceDoc = await getDoc(doc(db, "settings", "pricing"));
        const p = priceDoc.exists() ? priceDoc.data() : { p1:300, p3_new:400, p12_new:1600, p_life:5000 };
        overlayEl.style.display = "flex";
        overlayContent.innerHTML = `<h1 style="font-size:2.3rem; font-weight:700; font-family:'Orbitron','Playfair Display'; background:linear-gradient(135deg,#ffffff,#ffb347,#ff6b35); -webkit-background-clip:text; background-clip:text; color:transparent;">ETHEREAL ACCESS</h1><div class="software-grid-mini">${softwareCatalog.map(s => `<span>${s.name}</span>`).join('')}</div><div class="card-wrap"><div class="p-card" onclick="buy(${p.p1})"><h3>1 MONTH</h3><div class="price">$${p.p1}</div><div class="btn-buy">UNLOCK</div></div><div class="p-card" onclick="buy(${p.p3_new})"><h3>3 MONTHS</h3><div class="price">$${p.p3_new}</div><div class="btn-buy">UNLOCK</div></div><div class="p-card" onclick="buy(${p.p12_new})"><h3>1 YEAR</h3><div class="price">$${p.p12_new}</div><div class="btn-buy">UNLOCK</div></div><div class="p-card" onclick="buy(${p.p_life})"><h3>LIFETIME</h3><div class="price">$${p.p_life}</div><div class="btn-buy">ETERNAL ACCESS</div></div></div>`;
    }
    window.buy = (amt) => {
        if (!auth.currentUser) { alert("Please login with Gmail first."); toggleAuth(); return; }
        const email = auth.currentUser.email.toLowerCase();
        const encodedEmail = "ZWR6ZWxrZWl0aDBAZ21haWwuY29t";
        const paypalURL = `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=${atob(encodedEmail)}&amount=${amt}&currency_code=USD&item_name=Elite_Terminal_Access&custom=${email}&return=https://hiddenpro.qzz.io`;
        window.location.href = paypalURL;
    };
    window.closeOverlay = () => { overlayEl.style.display = "none"; };

    attachEngineListeners();
    attachCardEvents();
</script>

<script>
    (function() {
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83))) return false;
        };
    })();
</script>
