<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIDDEN PRO | ELITE TERMINAL</title>
    <style>
        :root { --neon:#00ffff; --panel-bg: rgba(6,11,25,0.9); --discount: #ff4444; }
        * { box-sizing: border-box; margin:0; padding:0; }
        body { font-family:'Segoe UI',sans-serif; color:#fff; min-height:100vh; background:#000; display:flex; flex-direction:column; overflow-x:hidden; }
        body::before { content:""; position:fixed; inset:0; background: radial-gradient(circle at 20% 30%, #001f3f 0%, #000 70%); z-index:-1; }

        /* Top Bar */
        .top-bar { width:100%; padding:15px 30px; background:rgba(0,0,0,0.8); backdrop-filter:blur(25px); border-bottom:1px solid rgba(0,255,255,0.2); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100;}
        .logo-section { display:flex; flex-direction:column; }
        .logo { font-size:26px; letter-spacing:10px; font-weight:900; color:#fff; }
        .status-text { font-size:11px; color:var(--neon); letter-spacing:3px; font-weight:600; }

        #topAuthBtn { background:#fff; color:#000; border:none; padding:10px 16px; border-radius:8px; font-weight:800; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:13px; transition:.3s;}
        #topAuthBtn.logged-in { background: var(--discount); color: #fff; }
        #topAuthBtn:hover { transform:translateY(-2px); box-shadow: 0 0 15px var(--neon); }

        /* Main Grid */
        .main-content { padding:40px; display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:25px; max-width:1400px; margin:0 auto;}
        .sw-card { background:var(--panel-bg); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:25px; display:flex; flex-direction:column; justify-content:space-between; transition:.3s; position:relative; overflow:hidden;}
        .sw-card::after { content:''; position:absolute; top:0; left:0; width:100%; height:2px; background:var(--neon); opacity:0; transition:.3s;}
        .sw-card:hover::after { opacity:1; }
        .sw-card:hover { border-color:var(--neon); transform:translateY(-5px); background:rgba(10,20,40,0.95);}
        .sw-card h2 { font-size:18px; margin-bottom:10px; color:var(--neon); letter-spacing:1px;}
        .sw-card p { font-size:13px; color:#aaa; line-height:1.5; margin-bottom:20px; min-height:60px;}
        .sw-card button { background:transparent; border:1px solid var(--neon); color:var(--neon); padding:12px; border-radius:6px; font-weight:bold; cursor:pointer; transition:.2s; text-transform:uppercase; letter-spacing:1px; width: 100%;}
        .sw-card button:hover { background:var(--neon); color:#000;}

        /* Pricing Overlay */
        #overlay { position:fixed; inset:0; background:rgba(0,0,0,0.95); display:none; flex-direction:column; align-items:center; z-index:200; backdrop-filter:blur(20px); overflow-y:auto; padding:40px 20px;}
        .overlay-content { text-align:center; max-width:1100px; width:100%; }
        .card-wrap { display:flex; gap:20px; margin:30px 0; flex-wrap:wrap; justify-content:center;}

        .p-card { background:rgba(255,255,255,0.03); border:1px solid #333; border-radius:24px; padding:30px; width:240px; transition:.3s; position:relative; cursor:pointer;}
        .p-card:hover { border-color:var(--neon); background:rgba(0,255,255,0.05); transform:scale(1.05);}
        .p-card h3 { font-size:12px; letter-spacing:3px; color:#888; margin-bottom:15px; }
        .p-card .price { font-size:36px; font-weight:900; margin-bottom:5px; color:#fff; }
        .p-card .btn-buy { background:var(--neon); color:#000; padding:12px; border-radius:8px; font-weight:900; font-size:14px; margin-top:15px; text-align: center;}

        .software-grid-mini { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin:20px 0; font-size:12px; color:#666;}
        .close-btn { margin-top:30px; background:none; border:1px solid #444; color:#888; padding:10px 30px; cursor:pointer; border-radius:50px; transition:.3s; }
        .close-btn:hover { border-color:#fff; color:#fff; }
    </style>
</head>
<body>

<nav class="top-bar">
    <div class="logo-section">
        <span class="logo">HIDDEN PRO</span>
        <span class="status-text" id="statusMsg">SYSTEM STATUS: OFFLINE</span>
    </div>
    <button id="topAuthBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16">
        <span id="authBtnText">GMAIL LOGIN</span>
    </button>
</nav>

<main class="main-content" id="softwareList"></main>

<div id="overlay">
    <div class="overlay-content" id="overlayContent"></div>
    <button class="close-btn" onclick="closeOverlay()">EXIT TERMINAL</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
    authDomain: "my-software-portal.firebaseapp.com",
    projectId: "my-software-portal",
    storageBucket: "my-software-portal.firebasestorage.app",
    messagingSenderId: "1072405993700",
    appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const overlay = document.getElementById('overlay');
const overlayContent = document.getElementById('overlayContent');
const statusMsg = document.getElementById('statusMsg');
const topAuthBtn = document.getElementById('topAuthBtn');
const authBtnText = document.getElementById('authBtnText');
const softwareContainer = document.getElementById('softwareList');

// LIST OF SOFTWARE AND THEIR CORRESPONDING FILES
const softwareList = [
    {name:"Viper Roulette", file:"viper-roulette.html", desc:"Advanced table tracking with high-velocity pattern recognition."},
    {name:"AI Baccarat Trend", file:"baccarat-trend.html", desc:"Neural network trained on millions of shoes to detect trend shifts."},
    {name:"Baccarat Analysis", file:"baccarat-analysis.html", desc:"Deep statistical breakdown of Banker/Player/Tie probabilities."},
    {name:"Baccarat Predictor", file:"baccarat-predictor.html", desc:"Real-time calculation engine for next-hand high-confidence bets."},
    {name:"Baccarat PRO", file:"baccarat-pro.html", desc:"The elite version featuring secret sequence 'Neutral Engine' logic."},
    {name:"Roulette PRO", file:"roulette-pro.html", desc:"Precision sector tracking and neighbor betting optimization."},
    {name:"Card Counting", file:"card-counting.html", desc:"A digital counter for blackjack variants to keep the edge on your side."},
    {name:"Gemini Ultra", file:"gemini-ultra.html", desc:"AI-integrated terminal for complex casino data interpretation."},
    {name:"Google AI", file:"google-ai.html", desc:"Utilizing massive datasets for pattern loophole identification."},
    {name:"VisionWave Baccarat", file:"visionwave.html", desc:"Visual pattern analysis software for rapid shoe sequences."},
    {name:"Baccarat Neutral Engine", file:"Baccarat-engine.html", desc:"Visual pattern analysis software for rapid shoe sequences."}
];

// Build the UI
softwareList.forEach(s => {
    const card = document.createElement('div');
    card.classList.add('sw-card');
    card.innerHTML = `
        <div>
            <h2>${s.name}</h2>
            <p>${s.desc}</p>
        </div>
        <button onclick="handleEngineClick('${s.name}')">Start Engine</button>`;
    softwareContainer.appendChild(card);
});

// Auth Logic
async function toggleAuth() {
    if (auth.currentUser) { await signOut(auth); } 
    else { try { await signInWithPopup(auth, provider); } catch(err) { console.error(err); } }
}

onAuthStateChanged(auth, user => {
    if(user) {
        statusMsg.textContent = "ENCRYPTED: " + user.email.toUpperCase();
        authBtnText.textContent = "LOGOUT";
        topAuthBtn.classList.add('logged-in');
    } else {
        statusMsg.textContent = "SYSTEM STATUS: OFFLINE";
        authBtnText.textContent = "GMAIL LOGIN";
        topAuthBtn.classList.remove('logged-in');
    }
});

// ✅ ACCESS AND REDIRECT LOGIC
window.handleEngineClick = async (engineName) => {
    if(!auth.currentUser) { await toggleAuth(); return; }

    const userEmail = auth.currentUser.email.toLowerCase();
    statusMsg.textContent = "VERIFYING ACCESS...";
    
    const userDoc = await getDoc(doc(db, "users", userEmail));
    
    if (userDoc.exists()) {
        const userData = userDoc.data();
        const now = new Date().getTime();

        if (userData.expiry === 'LIFETIME' || userData.expiry > now) {
            const appData = softwareList.find(s => s.name === engineName);
            if (appData) {
                statusMsg.textContent = "ACCESS GRANTED: LAUNCHING...";
                setTimeout(() => { window.location.href = appData.file; }, 1000);
                return;
            }
        }
    }

    // If no access, fetch prices and show payment screen
    statusMsg.textContent = "ACCESS DENIED: PAYMENT REQUIRED";
    openPricing();
};

async function openPricing() {
    const priceDoc = await getDoc(doc(db, "settings", "pricing"));
    const p = priceDoc.exists() ? priceDoc.data() : { p1:300, p3_new:400, p12_new:1600, p_life:5000 };

    overlay.style.display = "flex";
    overlayContent.innerHTML = `
        <h1 style="letter-spacing:10px; margin-bottom:10px; font-size:40px;">ELITE ACCESS</h1>
        <p style="color: var(--neon); margin-bottom:40px;">Choose a subscription to unlock all professional tools.</p>
        <div class="software-grid-mini">
            ${softwareList.map(s => `<span>▣ ${s.name}</span>`).join('')}
        </div>
        <div class="card-wrap">
            <div class="p-card" onclick="buy(${p.p1})"><h3>1 MONTH</h3><div class="price">$${p.p1}</div><div class="btn-buy">PURCHASE</div></div>
            <div class="p-card" onclick="buy(${p.p3_new})"><h3>3 MONTHS</h3><div class="price">$${p.p3_new}</div><div class="btn-buy">PURCHASE</div></div>
            <div class="p-card" onclick="buy(${p.p12_new})"><h3>1 YEAR</h3><div class="price">$${p.p12_new}</div><div class="btn-buy">PURCHASE</div></div>
            <div class="p-card" onclick="buy(${p.p_life})"><h3>LIFETIME</h3><div class="price" style="font-size:28px;">$${p.p_life}</div><div class="btn-buy">PURCHASE</div></div>
        </div>
    `;
}

window.buy = (amt) => {
    const email = auth.currentUser ? auth.currentUser.email : "Guest";
    const paypalURL = `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=edzelkeith0@gmail.com&amount=${amt}&currency_code=USD&item_name=Elite_Terminal_Access&custom=${email}&return=https://hiddenpro.qzz.io`;
    window.location.href = paypalURL;
};

window.closeOverlay = () => { overlay.style.display = "none"; };
topAuthBtn.addEventListener('click', toggleAuth);
</script>
</body>
</html>
