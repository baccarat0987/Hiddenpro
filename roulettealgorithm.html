<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Roulette VIP PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    
    <!-- ========== ADDED 1: CLEAN URL SCRIPT ========== -->
    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <!-- ========== ADDED 2: FIREBASE AUTHENTICATION MODULE ========== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const REQUIRED_ENGINE_ID = "engine_15";

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && 
                           (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                           userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) {
                alert("Access denied: you don't have permission for Roulette VIP PRO (engine_14).");
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>
    
    <!-- ========== ADDED 3: RIGHT-CLICK & SHORTCUT BLOCKER ========== -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) {
                return false;
            }
        };
    </script>
    
    <!-- ========== ADDED 4: EXIT BUTTON STYLES ========== -->

<body>

<!-- ========== ADDED 5: EXIT BUTTON HTML ========== -->
<div class="exit-nav">
    <a href="index.html" class="exit-btn">← EXIT TERMINAL</a>
</div>

<div class="aequitas-app" id="mainAppContainer">
    <div class="title-bar-brand">
        <div class="brand-container">
            <div class="minimal-ai-logo">
                <svg class="minimal-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">

                    <circle cx="20" cy="20" r="10" stroke="rgba(255, 255, 255, 0.5)" stroke-width="0.8" fill="none"/>
                    <path d="M20 8 L23 15 L31 17 L25 23 L27 31 L20 26 L13 31 L15 23 L9 17 L17 15 L20 8Z" 
                          fill="rgba(201, 179, 255, 0.3)" stroke="rgba(255, 255, 255, 0.7)" stroke-width="0.8" stroke-linejoin="round"/>

        <div class="numbers-col">
            <div class="col-header"></div>

                <button class="zero-btn" id="zeroButton">0</button>
            </div>

            <div class="col-header"></div>
            <div class="history-scroll" id="spinHistoryList"></div>

                🔄 RESET

</div>

<script>
    // ==================== GROUPS MAPPING (Each number belongs to 3-5 groups) ====================
    const groupsPerNumber = {
        0: ["0-10-20-30", "3-13-23-33", "6-16-26-36", "2-12-22-32", "5-15-25-35"],
        1: ["0-10-20-30", "3-13-23-33", "6-16-26-36", "1-11-21-31", "4-14-24-34"],
        2: ["4-14-24-34", "1-11-21-31", "7-17-27", "2-12-22-32", "5-15-25-35"],
        3: ["0-10-20-30", "6-16-26-36", "3-13-23-33", "2-12-22-32", "5-15-25-35"],
        4: ["4-14-24-34", "1-11-21-31", "2-12-22-32", "9-19-29", "5-15-25-35"],
        5: ["3-13-23-33", "0-10-20-30", "4-14-24-34", "6-16-26-36", "5-15-25-35"],
        6: ["4-14-24-34", "6-16-26-36", "7-17-27", "3-13-23-33"],
        7: ["9-19-29", "7-17-27", "2-12-22-32", "8-18-28"],
        8: ["0-10-20-30", "1-11-21-31", "8-18-28", "3-13-23-33"],
        9: ["4-14-24-34", "1-11-21-31", "9-19-29", "2-12-22-32", "8-18-28"],
        10: ["4-14-24-34", "8-18-28", "3-13-23-33", "0-10-20-30", "5-15-25-35"],
        11: ["3-13-23-33", "1-11-21-31", "6-16-26-36", "0-10-20-30", "8-18-28"],
        12: ["7-17-27", "8-18-28", "2-12-22-32", "3-13-23-33", "5-15-25-35"],
        13: ["1-11-21-31", "7-17-27", "3-13-23-33", "6-16-26-36"],
        14: ["4-14-24-34", "1-11-21-31", "9-19-29", "0-10-20-30"],
        15: ["4-14-24-34", "9-19-29", "2-12-22-32", "0-10-20-30", "5-15-25-35"],
        16: ["4-14-24-34", "1-11-21-31", "3-13-23-33", "6-16-26-36", "5-15-25-35"],
        17: ["4-14-24-34", "6-16-26-36", "7-17-27", "2-12-22-32", "5-15-25-35"],
        18: ["2-12-22-32", "7-17-27", "9-19-29", "8-18-28"],
        19: ["4-14-24-34", "1-11-21-31", "9-19-29", "2-12-22-32", "5-15-25-35"],
        20: ["4-14-24-34", "1-11-21-31", "0-10-20-30", "3-13-23-33"],
        21: ["4-14-24-34", "1-11-21-31", "9-19-29", "2-12-22-32", "5-15-25-35"],
        22: ["1-11-21-31", "8-18-28", "2-12-22-32", "9-19-29"],
        23: ["0-10-20-30", "3-13-23-33", "8-18-28", "5-15-25-35"],
        24: ["4-14-24-34", "3-13-23-33", "6-16-26-36", "0-10-20-30", "5-15-25-35"],
        25: ["4-14-24-34", "1-11-21-31", "7-17-27", "2-12-22-32", "5-15-25-35"],
        26: ["3-13-23-33", "6-16-26-36", "0-10-20-30", "2-12-22-32", "5-15-25-35"],
        27: ["4-14-24-34", "6-16-26-36", "7-17-27", "3-13-23-33"],
        28: ["9-19-29", "7-17-27", "8-18-28", "2-12-22-32", "5-15-25-35"],
        29: ["8-18-28", "9-19-29", "7-17-27", "2-12-22-32"],
        30: ["6-16-26-36", "1-11-21-31", "0-10-20-30", "8-18-28", "3-13-23-33"],
        31: ["4-14-24-34", "1-11-21-31", "0-10-20-30", "2-12-22-32", "9-19-29"],
        32: ["6-16-26-36", "0-10-20-30", "9-19-29", "2-12-22-32", "5-15-25-35"],
        33: ["0-10-20-30", "1-11-21-31", "3-13-23-33", "6-16-26-36", "4-14-24-34"],
        34: ["4-14-24-34", "7-17-27", "6-16-26-36", "5-15-25-35"],
        35: ["6-16-26-36", "3-13-23-33", "8-18-28", "2-12-22-32", "5-15-25-35"],
        36: ["0-10-20-30", "1-11-21-31", "7-17-27", "3-13-23-33", "6-16-26-36"]
    };

    // ==================== APP STATE ====================
    let spinHistory = [];
    let groupHistory = [];
    let overlayVisible = false;

    // DOM Elements
    const numbersGrid = document.getElementById('numbersGrid');
    const zeroButton = document.getElementById('zeroButton');
    const spinContainer = document.getElementById('spinHistoryList');
    const groupContainer = document.getElementById('groupHistoryList');
    const spinCountSpan = document.getElementById('spinCount');
    const groupCountSpan = document.getElementById('groupCount');
    const mainPredictionSpan = document.getElementById('mainPrediction');
    const alternativesContainer = document.getElementById('alternativesList');
    const clearBtn = document.getElementById('clearAllBtn');
    const predBox = document.getElementById('predBox');
    const appContainer = document.getElementById('mainAppContainer');

    // ==================== ENHANCED PREDICTION LOGIC ====================
    function analiz() {
        if (groupHistory.length === 0) {
            mainPredictionSpan.innerText = "———";
            alternativesContainer.innerHTML = `
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
                <div class="alt-row">———</div>
            `;
            return;
        }
        
        const startIdx = Math.max(0, groupHistory.length - 20);
        const lastGroups = groupHistory.slice(startIdx);
        
        const freqMap = new Map();
        lastGroups.forEach((g, idx) => {
            const weight = 1 + (idx / lastGroups.length) * 2;
            freqMap.set(g, (freqMap.get(g) || 0) + weight);
        });
        
        if (groupHistory.length >= 4) {
            const lastThree = groupHistory.slice(-3).join(',');
            for (let i = 0; i <= groupHistory.length - 4; i++) {
                const pattern = groupHistory.slice(i, i + 3).join(',');
                if (pattern === lastThree && i + 3 < groupHistory.length) {
                    const predictedNext = groupHistory[i + 3];
                    freqMap.set(predictedNext, (freqMap.get(predictedNext) || 0) + 3);
                }
            }
        }
        
        const sorted = Array.from(freqMap.entries()).sort((a, b) => b[1] - a[1]);
        const top5 = sorted.slice(0, 5);
        
        if (top5.length > 0) {
            mainPredictionSpan.innerText = top5[0][0];
        } else {
            mainPredictionSpan.innerText = "———";
        }
        
        alternativesContainer.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            const groupValue = (i < top5.length) ? top5[i][0] : '———';
            const row = document.createElement('div');
            row.className = 'alt-row';
            row.innerText = groupValue;
            alternativesContainer.appendChild(row);
        }
    }

    // ==================== WHEEL OVERLAY ====================
    const wheelNumbers = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
    
    function showWheelOverlay() {
        if (overlayVisible) return;
        if (spinHistory.length < 5) return;
        const mainPredRaw = mainPredictionSpan.innerText;
        if (!mainPredRaw || mainPredRaw === '———') return;
        
        const numbersInGroup = mainPredRaw.split('-').map(Number).filter(n => !isNaN(n) && n >= 0 && n <= 36);
        if (numbersInGroup.length === 0) return;
        
        const centerIndices = [];
        const neighborIndicesSet = new Set();
        numbersInGroup.forEach(num => {
            const idx = wheelNumbers.indexOf(num);
            if (idx !== -1) {
                centerIndices.push(idx);
                for (let offset = -2; offset <= 2; offset++) {
                    if (offset === 0) continue;
                    const neighborIdx = (idx + offset + wheelNumbers.length) % wheelNumbers.length;
                    neighborIndicesSet.add(neighborIdx);
                }
            }
        });
        
        const overlay = document.createElement('div');
        overlay.className = 'wheel-overlay';
        const containerDiv = document.createElement('div');
        containerDiv.className = 'wheel-container';
        const closeBtn = document.createElement('div');
        closeBtn.className = 'close-wheel-btn';
        closeBtn.innerHTML = '✕';
        closeBtn.addEventListener('click', () => { overlay.remove(); overlayVisible = false; });
        const title = document.createElement('div');
        title.className = 'wheel-title';
        title.innerText = `PREDICTION: ${mainPredRaw}  |  +2 NEIGHBORS `;
        const trackDiv = document.createElement('div');
        trackDiv.className = 'track-container';
        
        const numbersDivs = [];
        const redSet = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
        
        function positionNumbers() {
            const rect = trackDiv.getBoundingClientRect();
            const containerWidth = rect.width;
            const containerHeight = rect.height;
            const centerX = containerWidth / 2;
            const centerY = containerHeight / 2;
            const radiusX = containerWidth * 0.42;
            const radiusY = containerHeight * 0.42;
            
            wheelNumbers.forEach((num, i) => {
                const angle = (i / wheelNumbers.length) * 2 * Math.PI + Math.PI;
                const x = centerX + radiusX * Math.cos(angle) - (numbersDivs[i]?.offsetWidth / 2 || 22);
                const y = centerY + radiusY * Math.sin(angle) - (numbersDivs[i]?.offsetHeight / 2 || 22);
                if (numbersDivs[i]) {
                    numbersDivs[i].style.left = `${x}px`;
                    numbersDivs[i].style.top = `${y}px`;
                }
            });
        }
        
        wheelNumbers.forEach((num, i) => {
            const div = document.createElement('div');
            div.classList.add('num');
            div.textContent = num;
            if (num === 0) div.classList.add('green');
            else if (redSet.has(num)) div.classList.add('red');
            else div.classList.add('black');
            trackDiv.appendChild(div);
            numbersDivs.push(div);
        });
        
        centerIndices.forEach(idx => numbersDivs[idx]?.classList.add('center'));
        neighborIndicesSet.forEach(idx => {
            if (!centerIndices.includes(idx)) numbersDivs[idx]?.classList.add('neighbor');
        });
        
        const note = document.createElement('div');
        note.className = 'wheel-note';
        note.innerHTML = '💗 <strong style="color:#FF69B4">PINK</strong> = Main Predicted Numbers &nbsp;&nbsp; 💛 <strong style="color:#FFD966">Yellow</strong> = +2 Neighbors on Wheel';
        
        containerDiv.appendChild(closeBtn);
        containerDiv.appendChild(title);
        containerDiv.appendChild(trackDiv);
        containerDiv.appendChild(note);
        overlay.appendChild(containerDiv);
        document.body.appendChild(overlay);
        overlayVisible = true;
        
        const resizeObserver = new ResizeObserver(() => positionNumbers());
        resizeObserver.observe(trackDiv);
        setTimeout(positionNumbers, 10);
        
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                resizeObserver.disconnect();
                overlay.remove();
                overlayVisible = false;
            }
        });
        closeBtn.addEventListener('click', () => {
            resizeObserver.disconnect();
            overlay.remove();
            overlayVisible = false;
        });
    }

    // ==================== UI REFRESH ====================
    function scrollToTop(container) {
        if (container) container.scrollTop = 0;
    }

    function refreshUI() {
        spinContainer.innerHTML = '';
        [...spinHistory].reverse().forEach(spin => {
            const item = document.createElement('div');
            item.className = 'spin-item';
            item.innerText = spin;
            spinContainer.appendChild(item);
        });
        spinCountSpan.innerText = spinHistory.length;
        scrollToTop(spinContainer);
        
        groupContainer.innerHTML = '';
        groupHistory.forEach(grp => {
            const gItem = document.createElement('div');
            gItem.className = 'group-item';
            gItem.innerText = grp;
            groupContainer.appendChild(gItem);
        });
        groupCountSpan.innerText = groupHistory.length;
        if (groupContainer) groupContainer.scrollTop = groupContainer.scrollHeight;
        
        analiz();
        showWheelOverlay();
    }

    // ==================== ADD SPIN ====================
    function addSpin(number) {
        spinHistory.push(number);
        
        const groups = groupsPerNumber[number];
        if (groups && groups.length) {
            for (let g of groups) {
                groupHistory.push(g);
            }
        } else {
            groupHistory.push(`ERR-${number}`);
        }
        
        refreshUI();
        
        const spinItems = spinContainer.querySelectorAll('.spin-item');
        if (spinItems.length > 0) {
            spinItems[0].classList.add('spin-item-new');
            setTimeout(() => spinItems[0].classList.remove('spin-item-new'), 450);
        }
        
        predBox.classList.add('prediction-flash');
        setTimeout(() => predBox.classList.remove('prediction-flash'), 250);
    }

    // ==================== RESET FUNCTIONS ====================
    function hardResetFullReload() {
        window.location.reload();
    }

    // ==================== BUILD NUMBER PAD ====================
    function buildNumberPad() {
        numbersGrid.innerHTML = '';
        const redNumbers = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
        
        for (let i = 1; i <= 36; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.className = 'num-btn';
            if (redNumbers.has(i)) {
                btn.classList.add('red-num');
            } else {
                btn.classList.add('black-num');
            }
            btn.addEventListener('click', (function(val) { 
                return () => {
                    btn.classList.add('btn-flash');
                    setTimeout(() => btn.classList.remove('btn-flash'), 120);
                    addSpin(val);
                };
            })(i));
            numbersGrid.appendChild(btn);
        }
    }

    // ==================== INTERNAL REFRESH ====================
    function triggerInternalRefresh() {
        if (!appContainer) return;
        appContainer.classList.remove('internal-refresh-active');
        void appContainer.offsetWidth;
        appContainer.classList.add('internal-refresh-active');
        setTimeout(() => {
            if (appContainer) appContainer.classList.remove('internal-refresh-active');
        }, 280);
    }

    function setupInternalRefresh() {
        document.body.addEventListener('click', (e) => {
            const resetBtn = document.getElementById('clearAllBtn');
            if (resetBtn && (e.target === resetBtn || resetBtn.contains(e.target))) {
                return;
            }
            triggerInternalRefresh();
        });
    }

    // ==================== EVENT LISTENERS ====================
    zeroButton.addEventListener('click', () => {
        zeroButton.classList.add('zero-flash');
        setTimeout(() => zeroButton.classList.remove('zero-flash'), 120);
        addSpin(0);
    });

    clearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        hardResetFullReload();
    });

    // ==================== INITIALIZATION ====================
    buildNumberPad();
    
    spinHistory = [];
    groupHistory = [];
    refreshUI();
    mainPredictionSpan.innerText = "———";
    
    setupInternalRefresh();
</script>
