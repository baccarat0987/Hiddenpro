    <!-- Clean URL -->

    <!-- Firebase permission check (same as your Google AI app) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            storageBucket: "my-software-portal.firebasestorage.app",
            messagingSenderId: "1072405993700",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const REQUIRED_ENGINE_ID = "engine_13";   // change if your portal uses a different ID

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = Date.now();
            const userData = userDoc.data();
            const isValid = userDoc.exists() && 
                           (userData.expiry === 'LIFETIME' || userData.expiry > now) &&
                           userData.allowedSoftware?.includes(REQUIRED_ENGINE_ID);
            if (!isValid) {
                alert("Access denied: you don't have permission for Triple X Engine.");
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) {
                return false;
            }
        };

    <script>
        // ======================== ORIGINAL GAME LOGIC (exactly as you wrote) ========================
        // With minor fixes to ensure reset returns to overlay

        let bigRoad = [];           
        let betResults = [];        
        let bankroll = 0.00;
        const COMMISSION = 0.05;
        
        let originalBaseBet = 0;
        let baseBet = 0;
        let currentBet = 0;
        
        let bigEyeRoad = [];
        let smallRoadArr = [];
        let cockroachArr = [];
        let actionLog = []; 

        let initialBankroll = 0;

        const mainAppDiv = document.getElementById('mainApp');
        const overlayDiv = document.getElementById('overlayConfig');
        const overlayBaseInput = document.getElementById('overlayBaseBet');
        const overlayBankPreview = document.getElementById('overlayBankrollPreview');
        const confirmOverlayBtn = document.getElementById('confirmOverlayBtn');
        
        const bigRoadDiv = document.getElementById('bigRoadGrid');
        const playerBtn = document.getElementById('playerBtn');
        const bankerBtn = document.getElementById('bankerBtn');
        const resetBtn = document.getElementById('resetBtn');
        const undoBtn = document.getElementById('undoBtn');
        const walletSpan = document.getElementById('walletDisplay');
        const sessionPLSpan = document.getElementById('sessionPL');
        const historyDiv = document.getElementById('historyDots');
        const recommendSideSpan = document.getElementById('recommendSide');
        const aiHintSpan = document.getElementById('aiHint');
        const statusIconSpan = document.getElementById('statusIcon');
        const martingaleDisplay = document.getElementById('martingaleDisplay');
        const toastRoot = document.getElementById('toastRoot');
        
        function showToast(msg, isError = false) {
            const toastDiv = document.createElement('div');
            toastDiv.className = 'toast-msg';
            toastDiv.style.color = isError ? '#ff88aa' : '#00f3ff';
            toastDiv.innerText = msg;
            toastRoot.innerHTML = '';
            toastRoot.appendChild(toastDiv);
            setTimeout(() => { if(toastRoot.firstChild) toastRoot.innerHTML = ''; }, 2200);
        }
        
        function updateBankrollUI() {
            walletSpan.innerText = `$${bankroll.toFixed(2)}`;
            const pnl = bankroll - initialBankroll;
            sessionPLSpan.innerText = `📊 ${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}`;
            if (currentBet !== baseBet) {
                martingaleDisplay.innerText = `⚡ MART x${(currentBet/baseBet).toFixed(1)}`;
            } else {
                martingaleDisplay.innerText = ``;
            }
        }
        
        function updateHistoryDots() {
            historyDiv.innerHTML = '';
            betResults.slice(-11).forEach(res => {
                const dot = document.createElement('div');
                dot.className = 'dot-history';
                if (res === 'W') { 
                    dot.classList.add('w-dot'); 
                    dot.innerText = 'W'; 
                } else { 
                    dot.classList.add('l-dot'); 
                    dot.innerText = 'L'; 
                }
                historyDiv.appendChild(dot);
            });
        }

        function computeDerivedRoad(offsetCols, startColIndex) {
            if (bigRoad.length < startColIndex + 1) return [];
            const result = [];
            for (let colIdx = startColIndex; colIdx < bigRoad.length; colIdx++) {
                const currentCol = bigRoad[colIdx];
                for (let row = 0; row < currentCol.length; row++) {
                    let symbol = null;
                    const isFirstRowOfColumn = (row === 0);
                    
                    if (isFirstRowOfColumn) {
                        const colAIdx = colIdx - offsetCols;
                        const colBIdx = colIdx - offsetCols - 1;
                        if (colAIdx >= 0 && colBIdx >= 0) {
                            symbol = (bigRoad[colAIdx].length === bigRoad[colBIdx].length) ? 'R' : 'B';
                        } else {
                            symbol = 'B';
                        }
                    } else {
                        const leftColIdx = colIdx - offsetCols;
                        if (leftColIdx >= 0 && (row - 1) < bigRoad[leftColIdx].length) {
                            symbol = (bigRoad[leftColIdx][row - 1] === bigRoad[colIdx][row - 1]) ? 'R' : 'B';
                        } else {
                            symbol = 'B';
                        }
                    }
                    result.push(symbol);
                }
            }
            return result;
        }
        
        function recalcAllRoads() {
            bigEyeRoad = computeDerivedRoad(1, 1);
            smallRoadArr = computeDerivedRoad(2, 2);
            cockroachArr = computeDerivedRoad(3, 3);
            
            function updateTrend(containerId, roadArray) {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = '';
                const lastFew = roadArray.slice(-8);
                if (lastFew.length === 0) {
                    container.innerHTML = '<span style="font-size:9px;">—</span>';
                    return;
                }
                lastFew.forEach(s => {
                    const dot = document.createElement('div');
                    dot.className = s === 'R' ? 'dot-r' : 'dot-b';
                    dot.innerText = s === 'R' ? 'R' : 'B';
                    container.appendChild(dot);
                });
            }
            updateTrend('bigEyeTrend', bigEyeRoad);
            updateTrend('smallRoadTrend', smallRoadArr);
            updateTrend('cockroachTrend', cockroachArr);
        }
        
        function getHeavyPrediction() {
            if (bigEyeRoad.length === 0 || smallRoadArr.length === 0 || cockroachArr.length === 0) {
                return { trigger: false, side: null, reason: "Waiting for data..." };
            }
            const lastBig = bigEyeRoad[bigEyeRoad.length - 1];
            const lastSmall = smallRoadArr[smallRoadArr.length - 1];
            const lastCock = cockroachArr[cockroachArr.length - 1];
            
            if (lastBig === lastSmall && lastSmall === lastCock) {
                const lastCol = bigRoad[bigRoad.length - 1];
                const lastRes = lastCol[lastCol.length - 1];
                const side = (lastRes === 'P') ? 'PLAYER' : 'BANKER';
                return { trigger: true, side: side, reason: `` };
            }
            return { trigger: false, side: null, reason: "" };
        }
        
        function updatePredictionUI() {
            const pred = getHeavyPrediction();
            if (pred.trigger) {
                recommendSideSpan.innerText = `${pred.side}  $${currentBet.toFixed(2)}`;
                recommendSideSpan.style.background = pred.side === 'PLAYER' ? "linear-gradient(135deg, #00a3ff, #fff)" : "linear-gradient(135deg, #ff3366, #fff)";
                recommendSideSpan.style.webkitBackgroundClip = "text";
                aiHintSpan.innerHTML = `<span> ${pred.reason}  </span>`;
            } else {
                recommendSideSpan.innerText = "WAITING";
                recommendSideSpan.style.background = "linear-gradient(135deg, #aaa, #666)";
                recommendSideSpan.style.webkitBackgroundClip = "text";
                aiHintSpan.innerHTML = `<span>📡 ${pred.reason}</span>`;
            }
        }
        
        function addToBigRoad(result) {
            if (bigRoad.length === 0) {
                bigRoad.push([result]);
            } else {
                const lastCol = bigRoad[bigRoad.length - 1];
                if (lastCol[lastCol.length - 1] === result && lastCol.length < 6) {
                    lastCol.push(result);
                } else {
                    bigRoad.push([result]);
                }
            }
            if (bigRoad.length > 10) {
                bigRoad.shift();
            }
            renderBigRoad();
            recalcAllRoads();
            updatePredictionUI();
        }
        
        function renderBigRoad() {
            bigRoadDiv.innerHTML = '';
            
            bigRoad.forEach(col => {
                const colDiv = document.createElement('div');
                colDiv.className = 'bigroad-column';
                col.forEach(res => {
                    const cell = document.createElement('div');
                    cell.className = `road-cell ${res === 'P' ? 'player' : 'banker'}`;
                    cell.innerText = res;
                    colDiv.appendChild(cell);
                });
                for (let i = col.length; i < 6; i++) {
                    const empty = document.createElement('div');
                    empty.className = 'road-cell empty-cell';
                    colDiv.appendChild(empty);
                }
                bigRoadDiv.appendChild(colDiv);
            });

            for (let i = bigRoad.length; i < 10; i++) {
                const colDiv = document.createElement('div');
                colDiv.className = 'bigroad-column';
                for (let j = 0; j < 6; j++) {
                    const empty = document.createElement('div');
                    empty.className = 'road-cell empty-cell';
                    colDiv.appendChild(empty);
                }
                bigRoadDiv.appendChild(colDiv);
            }
        }
        
        function placeBet(selectedSide) {
            const pred = getHeavyPrediction();
            const resultCode = (selectedSide === 'PLAYER') ? 'P' : 'B';
            
            let action = { type: 'NO_BET', result: resultCode, bankrollBefore: bankroll, prevBet: currentBet, prevBase: baseBet, prevOriginalBase: originalBaseBet };
            
            if (pred.trigger) {
                const isWin = selectedSide === pred.side;
                let profit = 0;
                if (isWin) {
                    profit = (selectedSide === 'BANKER') ? currentBet * (1 - COMMISSION) : currentBet;
                    bankroll += profit;
                    betResults.push('W');
                    baseBet = baseBet + originalBaseBet;
                    currentBet = baseBet;
                    showToast(`✅ WIN! Next base: $${baseBet.toFixed(2)} (inc +$${originalBaseBet.toFixed(2)})`);
                } else {
                    profit = -currentBet;
                    bankroll += profit;
                    betResults.push('L'); 
                    currentBet = currentBet * 2;
                    showToast(`❌ LOSS! Martingale next bet: $${currentBet.toFixed(2)}`, true);
                }
                action.type = 'HEAVY_BET';
                action.win = isWin;
            } else {
                showToast(`📌 Recorded ${selectedSide} (no bet)`);
            }
            
            actionLog.push(action);
            addToBigRoad(resultCode);
            updateBankrollUI();
            updateHistoryDots();
            updatePredictionUI();
        }
        
        function undoLast() {
            if (bigRoad.length === 0) return;
            const lastCol = bigRoad[bigRoad.length - 1];
            lastCol.pop();
            if (lastCol.length === 0) bigRoad.pop();
            
            if (actionLog.length > 0) {
                const last = actionLog.pop();
                bankroll = last.bankrollBefore;
                currentBet = last.prevBet;
                baseBet = last.prevBase;
                originalBaseBet = last.prevOriginalBase !== undefined ? last.prevOriginalBase : originalBaseBet;
                if (last.type === 'HEAVY_BET') betResults.pop();
            }
            
            renderBigRoad();
            recalcAllRoads();
            updateBankrollUI();
            updateHistoryDots();
            updatePredictionUI();
            showToast("↩️ Undo last action");
        }
        
        function fullResetToOverlay() {
            mainAppDiv.style.display = 'none';
            overlayDiv.style.display = 'flex';
            bigRoad = [];
            betResults = [];
            actionLog = [];
            bigEyeRoad = [];
            smallRoadArr = [];
            cockroachArr = [];
            bankroll = 0;
            baseBet = 0;
            currentBet = 0;
            originalBaseBet = 0;
            initialBankroll = 0;
            renderBigRoad();
            updateBankrollUI();
            updateHistoryDots();
            updatePredictionUI();
        }
        
        function initGameWithBaseBet(chosenBase) {
            let base = parseFloat(chosenBase);
            if (isNaN(base) || base < 0.01) base = 0.01;
            if (base > 1000) base = 1000;
            
            bigRoad = [];
            betResults = [];
            actionLog = [];
            bigEyeRoad = [];
            smallRoadArr = [];
            cockroachArr = [];
            
            originalBaseBet = base;
            baseBet = base;
            currentBet = base;
            initialBankroll = base * 50;
            bankroll = initialBankroll;
            
            renderBigRoad();
            recalcAllRoads();
            updateBankrollUI();
            updateHistoryDots();
            updatePredictionUI();
            
            mainAppDiv.style.display = 'block';
            overlayDiv.style.display = 'none';
            showToast(`✅ GAME READY | Base $${base.toFixed(2)} | Bankroll $${bankroll.toFixed(2)} | Win increment: +$${base.toFixed(2)}`);
        }
        
        function updateOverlayPreview() {
            let val = parseFloat(overlayBaseInput.value);
            if (isNaN(val) || val < 0.01) val = 0.01;
            const previewBank = val * 50;
            overlayBankPreview.innerText = `START BANKROLL: $${previewBank.toFixed(2)}`;
        }
        
        playerBtn.onclick = () => placeBet('PLAYER');
        bankerBtn.onclick = () => placeBet('BANKER');
        undoBtn.onclick = undoLast;
        resetBtn.onclick = fullResetToOverlay;
        confirmOverlayBtn.onclick = () => {
            let rawBase = parseFloat(overlayBaseInput.value);
            if (isNaN(rawBase) || rawBase < 0.01) rawBase = 0.01;
            initGameWithBaseBet(rawBase);
        };
        overlayBaseInput.addEventListener('input', updateOverlayPreview);
        
        mainAppDiv.style.display = 'none';
        overlayDiv.style.display = 'flex';
        updateOverlayPreview();
        renderBigRoad();
        updateBankrollUI();
        updatePredictionUI();
    </script>
</body>
</html>
