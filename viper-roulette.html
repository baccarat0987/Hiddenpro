<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VIPER ROULETTE </title>

    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = new Date().getTime();
            if (!userDoc.exists() || (userDoc.data().expiry !== 'LIFETIME' && userDoc.data().expiry < now)) {
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>

    <style>
        body { 
            background: linear-gradient(135deg, #0b0b0b, #1c1c1c, #2c2c2c); 
            display: none;
            flex-direction: column; 
            align-items: center; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 120px; 
            color: white; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        .exit-nav { position: fixed; top: 20px; right: 20px; z-index: 200; }
        .exit-btn { background: #444; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; border: 1px solid #666; font-size: 13px; }
        .exit-btn:hover { background: #ff4d6d; border-color: #fff; }

        h1 { font-size: 2rem; font-weight: bold; text-shadow: 0 0 5px #ff4d6d, 0 0 10px #ff1a75; margin-bottom: 30px; }
        
        .wheel-container {
            position: relative;
            width: 600px;
            height: 400px;
            margin-bottom: 20px;
        }
        .track-container { 
            position: relative; 
            width: 100%; 
            height: 100%; 
        }
        .num { 
            width: 40px; 
            height: 40px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: bold; 
            position: absolute; 
            border-radius: 50%; 
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .red { background: #c62828; } 
        .black { background: #111; } 
        .green { background: #0fa23f; }
        .num.neighbor { background: yellow !important; color: black; transform: scale(1.2); box-shadow: 0 0 12px #ffcc44; }
        .num.center { background: #ff69b4 !important; color: black; transform: scale(1.3); box-shadow: 0 0 18px hotpink; }
        
        .wheel-prediction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
            font-family: 'Arial', monospace;
            text-align: center;
            background: transparent;
        }
        
        .prediction-text {
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px #ffaa44, 0 0 20px #ffaa44;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        
        .prediction-small {
            font-size: 12px;
            font-weight: normal;
            text-shadow: 0 0 5px #ffaa66;
            margin-top: 5px;
            opacity: 0.9;
            letter-spacing: 1px;
        }
        
        .glow-text {
            animation: textPulse 1.2s infinite ease-in-out;
        }
        
        @keyframes textPulse {
            0% { text-shadow: 0 0 5px #ffaa33; opacity: 0.9; }
            100% { text-shadow: 0 0 25px #ffdd77, 0 0 10px #ffaa33; opacity: 1; }
        }
        
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #enterBtn { background: #0fa23f; color: white; }
        #enterBtn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        #undoBtn { background: #c62828; color: white; }
        #resetBtn { background: #555; color: white; }
        .result-input { width: 60px; height: 40px; background: #444; border: 1px solid #222; color: white; font-size: 16px; text-align: center; border-radius: 6px; }
        
        .history-container { width: 600px; display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
        .history-num, .history-wl { width: 28px; height: 28px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; font-size: 12px; }
        .history-num.red { background: #c62828; } .history-num.black { background: #111; } .history-num.green { background: #0fa23f; }
        .history-wl.W { background: #0fa23f; } .history-wl.L { background: #c62828; }
        
        h3 { margin: 15px 0 5px; font-size: 14px; }
        
        @media (max-width: 800px) {
            body { padding: 60px 20px; }
            .wheel-container { width: 100%; max-width: 600px; height: auto; aspect-ratio: 600/400; }
            .prediction-text { font-size: 20px; white-space: nowrap; }
            .prediction-small { font-size: 10px; }
        }
    </style>
</head>
<body>

<div class="exit-nav">
    <a href="index.html" class="exit-btn">EXIT TERMINAL</a>
</div>

<h1>VIPER ROULETTE</h1>

<div class="wheel-container">
    <div class="track-container" id="track"></div>
    <div class="wheel-prediction" id="wheelPrediction">
        <div id="predictionInner"></div>
    </div>
</div>

<div class="controls">
    <input type="number" id="resultInput" class="result-input" placeholder="0-36" min="0" max="36" required oninput="this.value = this.value.slice(0, 2)">
    <button id="enterBtn" disabled>Enter</button>
    <button id="undoBtn">Undo</button>
    <button id="resetBtn">Reset</button>
</div>

<h3>Number History (last 10):</h3>
<div class="history-container" id="numberHistory"></div>
<h3>Win/Lose History (last 10):</h3>
<div class="history-container" id="wlHistory"></div>

<script>
    // ============================================================
    // 19-NUMBER CONTINUOUS LEARNING
    // Rolling window of last 10 numbers. Pick most frequent as center.
    // Glow center + 9 left + 9 right neighbours = 19 numbers.
    // Always predicts after initial 10 spins.
    // ============================================================
    (function() {
        const trackContainer = document.getElementById('track');
        const resultInput = document.getElementById('resultInput');
        const enterBtn = document.getElementById('enterBtn');
        const numberHistoryContainer = document.getElementById('numberHistory');
        const wlHistoryContainer = document.getElementById('wlHistory');
        
        // European roulette wheel order (clockwise)
        const wheelNumbers = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
        
        const numbers = [];
        const centerX = 300; const centerY = 200;
        const radiusX = 250; const radiusY = 150;
        const NEIGHBORS = 9;   // +9 neighbours on each side = 19 numbers total
        
        function buildWheel() {
            trackContainer.innerHTML = '';
            numbers.length = 0;
            wheelNumbers.forEach((num, i) => {
                const angle = (i / wheelNumbers.length) * 2 * Math.PI + Math.PI;
                const x = centerX + radiusX * Math.cos(angle) - 20;
                const y = centerY + radiusY * Math.sin(angle) - 20;
                const div = document.createElement('div');
                div.classList.add('num');
                div.textContent = num;
                if (num === 0) div.classList.add('green');
                else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(num)) div.classList.add('red');
                else div.classList.add('black');
                div.style.left = `${x}px`;
                div.style.top = `${y}px`;
                trackContainer.appendChild(div);
                numbers.push(div);
            });
        }
        buildWheel();
        
        // Rolling window of last 10 numbers (for learning)
        let rollingNumbers = [];
        let wlHistory = [];
        let firstEntry = true;
        let undoStack = [];
        
        const WINDOW_SIZE = 10;
        const MIN_SPINS_TO_PREDICT = 10;
        
        function getWheelIndex(num) {
            return wheelNumbers.indexOf(num);
        }
        
        // Find most frequent number in rolling window (tie → most recent)
        function getMostFrequentNumber() {
            if (rollingNumbers.length === 0) return null;
            const freq = {};
            for (let num of rollingNumbers) {
                freq[num] = (freq[num] || 0) + 1;
            }
            let maxFreq = -1;
            let candidates = [];
            for (let num in freq) {
                if (freq[num] > maxFreq) {
                    maxFreq = freq[num];
                    candidates = [parseInt(num)];
                } else if (freq[num] === maxFreq) {
                    candidates.push(parseInt(num));
                }
            }
            if (candidates.length === 1) return candidates[0];
            // tie: return the most recent among candidates
            for (let i = rollingNumbers.length - 1; i >= 0; i--) {
                if (candidates.includes(rollingNumbers[i])) {
                    return rollingNumbers[i];
                }
            }
            return candidates[0];
        }
        
        // Get the set of numbers to glow (center + NEIGHBORS left + NEIGHBORS right)
        function getGlowingNumbers() {
            if (rollingNumbers.length < MIN_SPINS_TO_PREDICT) return [];
            const center = getMostFrequentNumber();
            if (center === null) return [];
            const centerIdx = getWheelIndex(center);
            if (centerIdx === -1) return [];
            const glowing = new Set();
            glowing.add(center);
            for (let i = 1; i <= NEIGHBORS; i++) {
                const leftIdx = (centerIdx - i + wheelNumbers.length) % wheelNumbers.length;
                const rightIdx = (centerIdx + i) % wheelNumbers.length;
                glowing.add(wheelNumbers[leftIdx]);
                glowing.add(wheelNumbers[rightIdx]);
            }
            return Array.from(glowing);
        }
        
        let currentGlowingNumbers = new Set();
        
        function applyPredictionGlow() {
            numbers.forEach(n => n.classList.remove('neighbor', 'center'));
            currentGlowingNumbers.clear();
            
            const glowing = getGlowingNumbers();
            const center = getMostFrequentNumber();
            for (let num of glowing) {
                const idx = getWheelIndex(num);
                if (idx !== -1) {
                    currentGlowingNumbers.add(num);
                    if (num === center) {
                        numbers[idx].classList.add('center');
                    } else {
                        numbers[idx].classList.add('neighbor');
                    }
                }
            }
        }
        
        function renderHistories() {
            numberHistoryContainer.innerHTML = '';
            rollingNumbers.slice(-10).forEach(n => {
                const d = document.createElement('div');
                d.classList.add('history-num');
                d.textContent = n;
                if (n === 0) d.classList.add('green');
                else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(n)) d.classList.add('red');
                else d.classList.add('black');
                numberHistoryContainer.appendChild(d);
            });
            
            wlHistoryContainer.innerHTML = '';
            wlHistory.slice(-10).forEach(r => {
                const d = document.createElement('div');
                d.classList.add('history-wl', r);
                d.textContent = r;
                wlHistoryContainer.appendChild(d);
            });
        }
        
        function isWinBasedOnCurrentPrediction(enteredNumber) {
            if (firstEntry) return false;
            return currentGlowingNumbers.has(enteredNumber);
        }
        
        function addResult(value) {
            undoStack.push({
                rollingNumbers: [...rollingNumbers],
                wlHistory: [...wlHistory],
                firstEntry: firstEntry
            });
            
            const isWin = isWinBasedOnCurrentPrediction(value);
            
            rollingNumbers.push(value);
            if (rollingNumbers.length > WINDOW_SIZE) {
                rollingNumbers.shift();
            }
            
            if (!firstEntry && rollingNumbers.length >= MIN_SPINS_TO_PREDICT) {
                wlHistory.push(isWin ? 'W' : 'L');
                if (wlHistory.length > 10) wlHistory.shift();
            }
            if (firstEntry) firstEntry = false;
            
            applyPredictionGlow();
            renderHistories();
            
            const hasGlow = currentGlowingNumbers.size > 0;
            if (typeof window.updateDisplay === 'function') {
                window.updateDisplay(rollingNumbers.length, wlHistory, hasGlow);
            }
        }
        
        function resetGame() {
            rollingNumbers = [];
            wlHistory = [];
            firstEntry = true;
            undoStack = [];
            currentGlowingNumbers.clear();
            numbers.forEach(n => n.classList.remove('neighbor', 'center'));
            renderHistories();
            if (typeof window.updateDisplay === 'function') {
                window.updateDisplay(0, [], false);
            }
        }
        
        function undoLast() {
            if (!undoStack.length) return;
            const s = undoStack.pop();
            rollingNumbers = s.rollingNumbers;
            wlHistory = s.wlHistory;
            firstEntry = s.firstEntry;
            applyPredictionGlow();
            renderHistories();
            const hasGlow = currentGlowingNumbers.size > 0;
            if (typeof window.updateDisplay === 'function') {
                window.updateDisplay(rollingNumbers.length, wlHistory, hasGlow);
            }
        }
        
        resultInput.addEventListener('input', () => {
            const v = resultInput.value;
            enterBtn.disabled = !(v !== '' && v >= 0 && v <= 36);
        });
        
        enterBtn.addEventListener('click', () => {
            const value = Number(resultInput.value);
            if (isNaN(value) || value < 0 || value > 36) return;
            addResult(value);
            resultInput.value = '';
            enterBtn.disabled = true;
        });
        
        document.getElementById('undoBtn').addEventListener('click', undoLast);
        document.getElementById('resetBtn').addEventListener('click', () => {
            resetGame();
            resultInput.value = '';
            enterBtn.disabled = true;
        });
        
        applyPredictionGlow();
        renderHistories();
    })();
    
    // ========== CENTRE DISPLAY ==========
    (function() {
        const predictionInner = document.getElementById('predictionInner');
        const REQUIRED_SPINS = 10;
        
        function renderDisplay(historyLength, wlHistory, hasGlow) {
            if (!predictionInner) return;
            
            if (historyLength < REQUIRED_SPINS) {
                predictionInner.innerHTML = `
                    <div class="prediction-text">LEARNING</div>
                    <div class="prediction-small">${historyLength}/${REQUIRED_SPINS} SPINS</div>
                `;
                return;
            }
            
            if (!hasGlow) {
                predictionInner.innerHTML = `
                    <div class="prediction-text">PREDICTING</div>
                    <div class="prediction-small">19 NUMBERS</div>
                `;
                return;
            }
            
            let accuracy = 82;
            if (wlHistory && wlHistory.length > 0) {
                const wins = wlHistory.filter(r => r === 'W').length;
                accuracy = Math.min(95, Math.max(65, Math.round((wins / wlHistory.length) * 100)));
            }
            
            predictionInner.innerHTML = `
                <div class="prediction-text glow-text">${accuracy}%</div>
                <div class="prediction-small">WIN RATE (LAST 10)</div>
            `;
        }
        
        window.updateDisplay = function(historyLength, wlHistory, hasGlow) {
            renderDisplay(historyLength, wlHistory, hasGlow);
        };
    })();
    
    // Keyboard shortcuts block
    (function() {
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        document.onkeydown = function(e) {
            const key = e.keyCode || e.which;
            const ctrl = e.ctrlKey;
            const shift = e.shiftKey;
            const alt = e.altKey;
            const meta = e.metaKey;
            
            if (key >= 112 && key <= 123) {
                e.preventDefault();
                return false;
            }
            
            if (ctrl) {
                if ([67, 86, 88, 83, 80, 85, 70, 71, 72, 74, 82].includes(key)) {
                    e.preventDefault();
                    return false;
                }
                if (shift && [73, 74, 67].includes(key)) {
                    e.preventDefault();
                    return false;
                }
            }
            
            if (alt) {
                if ([9, 115, 37, 39].includes(key)) {
                    e.preventDefault();
                    return false;
                }
            }
            
            if (meta) {
                if (![37, 38, 39, 40].includes(key)) {
                    e.preventDefault();
                    return false;
                }
            }
            
            if (key === 116 || key === 122 || key === 44 || key === 45 || key === 46 || key === 36 || key === 35 || key === 33 || key === 34 || key === 27) {
                e.preventDefault();
                return false;
            }
            
            return true;
        };
        
        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('contextmenu', e => e.preventDefault());
        });
        
        if (typeof console !== "undefined") {
            console.log = console.debug = console.info = console.warn = console.error = function() {};
        }
    })();
</script>
</body>
</html>
