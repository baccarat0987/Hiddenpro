<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER ROULETTE | PREMIUM ACCESS</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            // 1. If not logged in at all, go to home
            if (!user) { 
                window.location.href = "index.html"; 
                return; 
            }
            
            // 2. Check the database for the user's email
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = new Date().getTime();
            
            if (!userDoc.exists()) {
                alert("ACCESS DENIED: No active subscription found for " + user.email);
                window.location.href = "index.html";
                return;
            }

            const userData = userDoc.data();
            // 3. Check if expired (unless Lifetime)
            if (userData.expiry !== 'LIFETIME' && userData.expiry < now) {
                alert("ACCESS EXPIRED: Your subscription has ended.");
                window.location.href = "index.html";
            }
            
            // If we reach here, they are cleared to play!
            document.body.style.display = "flex";
        });
    </script>
    <style>
        /* Hidden by default until Security Guard clears them */
        body { 
            display: none; 
            background: linear-gradient(135deg, #0b0b0b, #1c1c1c, #2c2c2c); 
            flex-direction: column; 
            align-items: center; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 120px; 
            color: white; 
            min-height: 100vh;
        }
        h1 { font-size: 2rem; font-weight: bold; text-shadow: 0 0 5px #ff4d6d, 0 0 10px #ff1a75; margin-bottom: 30px; letter-spacing: 5px; }
        .track-container { position: relative; width: 600px; height: 400px; margin-bottom: 20px; }
        .num { width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; font-weight: bold; position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); }
        .red { background: #c62828; }
        .black { background: #111; }
        .green { background: #0fa23f; }
        .num.neighbor { background: yellow !important; color: black; transform: scale(1.2); box-shadow: 0 0 15px yellow; z-index: 10; }
        .num.center { background: #ff69b4 !important; color: black; transform: scale(1.3); box-shadow: 0 0 20px #ff69b4; z-index: 11; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        #enterBtn { background: #0fa23f; color: white; }
        #enterBtn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        #undoBtn { background: #c62828; color: white; }
        #resetBtn { background: #333; color: white; }
        .result-input { width: 80px; height: 40px; background: #000; border: 1px solid #444; color: #0fa23f; font-size: 20px; text-align: center; font-weight: bold; border-radius: 6px; }
        .history-container { width: 600px; display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
        .history-num, .history-wl { width: 28px; height: 28px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; font-size: 12px; }
        .history-num.red { background: #c62828; }
        .history-num.black { background: #111; }
        .history-num.green { background: #0fa23f; }
        .history-wl.W { background: #0fa23f; box-shadow: 0 0 5px #0fa23f; }
        .history-wl.L { background: #c62828; }
    </style>
</head>
<body>
    <h1>VIPER ROULETTE</h1>
    <div class="track-container" id="track"></div>
    
    <div class="controls">
        <input type="number" id="resultInput" class="result-input" placeholder="0-36" min="0" max="36" required>
        <button id="enterBtn" disabled>ENTER RESULT</button>
        <button id="undoBtn">UNDO</button>
        <button id="resetBtn">RESET SESSION</button>
    </div>

    <div style="width: 600px;">
        <h3 style="font-size: 14px; color: #777;">NUMBER HISTORY</h3>
        <div class="history-container" id="numberHistory"></div>
        <h3 style="font-size: 14px; color: #777; margin-top: 20px;">WIN/LOSS TRACKER</h3>
        <div class="history-container" id="wlHistory"></div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const trackContainer = document.getElementById('track');
            const resultInput = document.getElementById('resultInput');
            const enterBtn = document.getElementById('enterBtn');
            const wheelNumbers = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
            const numbers = [];
            const centerX = 300; const centerY = 200;
            const radiusX = 250; const radiusY = 150;

            wheelNumbers.forEach((num, i) => {
                const angle = (i / wheelNumbers.length) * 2 * Math.PI + Math.PI;
                const x = centerX + radiusX * Math.cos(angle) - 20;
                const y = centerY + radiusY * Math.sin(angle) - 20;
                const div = document.createElement('div');
                div.classList.add('num');
                div.textContent = num;
                if (num === 0) div.classList.add('green');
                else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(num)) div.classList.add('red');
                else div.classList.add('black');
                div.style.left = `${x}px`; div.style.top = `${y}px`;
                trackContainer.appendChild(div);
                numbers.push(div);
            });

            let numberHistory = []; let wlHistory = []; let currentHighlight = []; let firstEntry = true; let undoStack = [];
            const maxHistory = 20; const neighborCount = 9;

            function generateHighlight() {
                numbers.forEach(n => n.classList.remove('neighbor','center'));
                let centerIndex;
                do { centerIndex = Math.floor(Math.random() * numbers.length); } 
                while (numbers[centerIndex].classList.contains('green'));
                
                numbers[centerIndex].classList.add('center');
                for (let i = -neighborCount; i <= neighborCount; i++) {
                    if (i === 0) continue;
                    const idx = (centerIndex + i + numbers.length) % numbers.length;
                    numbers[idx].classList.add('neighbor');
                }
                currentHighlight = numbers.filter(n => n.classList.contains('neighbor') || n.classList.contains('center')).map(n => Number(n.textContent));
            }

            function renderHistories() {
                const nHist = document.getElementById('numberHistory');
                const wHist = document.getElementById('wlHistory');
                nHist.innerHTML = ''; wHist.innerHTML = '';
                numberHistory.forEach(n => {
                    const d = document.createElement('div');
                    d.className = 'history-num ' + (n===0?'green':[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(n)?'red':'black');
                    d.textContent = n; nHist.appendChild(d);
                });
                wlHistory.forEach(r => {
                    const d = document.createElement('div');
                    d.className = 'history-wl ' + r; d.textContent = r; wHist.appendChild(d);
                });
            }

            resultInput.addEventListener('input', () => {
                const v = resultInput.value;
                enterBtn.disabled = !(v !== '' && v >= 0 && v <= 36);
            });

            enterBtn.addEventListener('click', () => {
                const val = Number(resultInput.value);
                numberHistory.push(val);
                if (numberHistory.length > maxHistory) numberHistory.shift();
                if (!firstEntry) {
                    wlHistory.push(currentHighlight.includes(val) ? 'W' : 'L');
                    if (wlHistory.length > maxHistory) wlHistory.shift();
                } else { firstEntry = false; }
                generateHighlight(); renderHistories();
                resultInput.value = ''; enterBtn.disabled = true;
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                numberHistory = []; wlHistory = []; firstEntry = true;
                numbers.forEach(n => n.classList.remove('neighbor', 'center'));
                renderHistories();
            });
        });
    </script>
</body>
</html>
