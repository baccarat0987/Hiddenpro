<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VIP ROULETTE</title>

    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = new Date().getTime();
            if (!userDoc.exists() || (userDoc.data().expiry !== 'LIFETIME' && userDoc.data().expiry < now)) {
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>

    <style>
        body { 
            background: linear-gradient(135deg, #0b0b0b, #1c1c1c, #2c2c2c); 
            display: none;
            flex-direction: column; 
            align-items: center; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 120px; 
            color: white; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        .exit-nav { position: fixed; top: 20px; right: 20px; z-index: 200; }
        .exit-btn { background: #444; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; border: 1px solid #666; font-size: 13px; }
        .exit-btn:hover { background: #ff4d6d; border-color: #fff; }

        h1 { font-size: 2rem; font-weight: bold; text-shadow: 0 0 5px #ff4d6d, 0 0 10px #ff1a75; margin-bottom: 20px; }
        
        .sector-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .sector-tag {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            background: #1a1a2a;
            border: 1px solid #ffaa44;
            color: #ffcc88;
        }
        .sector-tag.active {
            background: #ffaa44;
            color: black;
            box-shadow: 0 0 10px #ffaa44;
        }
        
        .wheel-container {
            position: relative;
            width: 600px;
            height: 400px;
            margin-bottom: 20px;
        }
        .track-container { 
            position: relative; 
            width: 100%; 
            height: 100%; 
        }
        .num { 
            width: 40px; 
            height: 40px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: bold; 
            position: absolute; 
            border-radius: 50%; 
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .red { background: #c62828; } 
        .black { background: #111; } 
        .green { background: #0fa23f; }
        .num.neighbor { background: yellow !important; color: black; transform: scale(1.2); box-shadow: 0 0 12px #ffcc44; }
        .num.center { background: #ff69b4 !important; color: black; transform: scale(1.3); box-shadow: 0 0 18px hotpink; }
        
        .wheel-prediction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
            font-family: 'Arial', monospace;
            text-align: center;
            background: transparent;
        }
        
        .prediction-text {
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px #ffaa44, 0 0 20px #ffaa44;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        
        .prediction-small {
            font-size: 12px;
            font-weight: normal;
            text-shadow: 0 0 5px #ffaa66;
            margin-top: 5px;
            opacity: 0.9;
            letter-spacing: 1px;
        }
        
        .glow-text {
            animation: textPulse 1.2s infinite ease-in-out;
        }
        
        @keyframes textPulse {
            0% { text-shadow: 0 0 5px #ffaa33; opacity: 0.9; }
            100% { text-shadow: 0 0 25px #ffdd77, 0 0 10px #ffaa33; opacity: 1; }
        }
        
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #enterBtn { background: #0fa23f; color: white; }
        #enterBtn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        #undoBtn { background: #c62828; color: white; }
        #resetBtn { background: #555; color: white; }
        .result-input { width: 60px; height: 40px; background: #444; border: 1px solid #222; color: white; font-size: 16px; text-align: center; border-radius: 6px; }
        
        .history-container { width: 600px; display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
        .history-num, .history-wl { width: 28px; height: 28px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; font-size: 12px; }
        .history-num.red { background: #c62828; } .history-num.black { background: #111; } .history-num.green { background: #0fa23f; }
        .history-wl.W { background: #0fa23f; } .history-wl.L { background: #c62828; }
        
        h3 { margin: 15px 0 5px; font-size: 14px; }
        
        @media (max-width: 800px) {
            body { padding: 60px 20px; }
            .wheel-container { width: 100%; max-width: 600px; height: auto; aspect-ratio: 600/400; }
            .prediction-text { font-size: 20px; white-space: nowrap; }
            .prediction-small { font-size: 10px; }
        }
    </style>
</head>
<body>

<div class="exit-nav">
    <a href="index.html" class="exit-btn">EXIT TERMINAL</a>
</div>

<h1>VIPER ROULETTE</h1>

<div class="sector-bar" id="sectorBar">
    <span class="sector-tag">ZERO</span>
    <span class="sector-tag">VOISINS</span>
    <span class="sector-tag">TIERS</span>
    <span class="sector-tag">ORPHELINS</span>
</div>

<div class="wheel-container">
    <div class="track-container" id="track"></div>
    <div class="wheel-prediction" id="wheelPrediction">
        <div id="predictionInner"></div>
    </div>
</div>

<div class="controls">
    <input type="number" id="resultInput" class="result-input" placeholder="0-36" min="0" max="36" required oninput="this.value = this.value.slice(0, 2)">
    <button id="enterBtn" disabled>Enter</button>
    <button id="undoBtn">Undo</button>
    <button id="resetBtn">Reset</button>
</div>

<h3>Number History (last 10):</h3>
<div class="history-container" id="numberHistory"></div>
<h3>Win/Lose History (last 10):</h3>
<div class="history-container" id="wlHistory"></div>

<script>
    // ============================================================
    // ROULETTE SECTOR PREDICTION WITH DYNAMIC THRESHOLD (YOUR EXAMPLE LOGIC)
    // Sectors: ZERO, VOISINS, TIERS, ORPHELINS
    // ============================================================
    (function() {
        const trackContainer = document.getElementById('track');
        const resultInput = document.getElementById('resultInput');
        const enterBtn = document.getElementById('enterBtn');
        const numberHistoryContainer = document.getElementById('numberHistory');
        const wlHistoryContainer = document.getElementById('wlHistory');
        const sectorBar = document.getElementById('sectorBar');
        
        // Wheel numbers in order (European roulette)
        const wheelNumbers = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
        
        // PROFESSIONAL ROULETTE SECTORS
        const sectors = {
            'ZERO': [0],
            'VOISINS': [22,18,29,7,28,12,35,3,26,0,32,15,19,4,21,2,25],
            'TIERS': [33,16,24,5,10,23,8,30,11,36,13,27],
            'ORPHELINS': [1,20,14,31,9,6,34,17]
        };
        
        // Map each number to its sector
        const numberToSector = {};
        for (const [sectorName, numbers] of Object.entries(sectors)) {
            numbers.forEach(num => {
                numberToSector[num] = sectorName;
            });
        }
        
        // Sector order for pattern detection
        const sectorOrder = ['ZERO', 'VOISINS', 'TIERS', 'ORPHELINS'];
        const sectorIndex = { 'ZERO': 0, 'VOISINS': 1, 'TIERS': 2, 'ORPHELINS': 3 };
        
        const numbers = [];
        const centerX = 300; const centerY = 200;
        const radiusX = 250; const radiusY = 150;
        
        function buildWheel() {
            trackContainer.innerHTML = '';
            numbers.length = 0;
            wheelNumbers.forEach((num, i) => {
                const angle = (i / wheelNumbers.length) * 2 * Math.PI + Math.PI;
                const x = centerX + radiusX * Math.cos(angle) - 20;
                const y = centerY + radiusY * Math.sin(angle) - 20;
                const div = document.createElement('div');
                div.classList.add('num');
                div.textContent = num;
                if (num === 0) div.classList.add('green');
                else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(num)) div.classList.add('red');
                else div.classList.add('black');
                div.style.left = `${x}px`;
                div.style.top = `${y}px`;
                trackContainer.appendChild(div);
                numbers.push(div);
            });
        }
        buildWheel();
        
        let numberHistory = [];
        let sectorHistory = [];
        let wlHistory = [];
        let firstEntry = true;
        let undoStack = [];
        let detailedResults = [];
        
        const MAX_HISTORY = 10;
        const NEIGHBORS_ON_EACH_SIDE = 9;
        const ACTIVATION_THRESHOLD = 10;
        
        // Pattern memory for SECTORS
        let sectorPatternMemory = {};
        
        function getSectorPatternKey(history) {
            if (history.length < 3) return null;
            const last3 = history.slice(-3);
            return last3.join(',');
        }
        
        // ========== PREDICTION LOGIC (Same as your example but for sectors) ==========
        function getCurrentStreak() {
            if (sectorHistory.length === 0) return { sector: null, count: 0 };
            let streak = 1;
            const lastSector = sectorHistory[sectorHistory.length - 1];
            for (let i = sectorHistory.length - 2; i >= 0; i--) {
                if (sectorHistory[i] === lastSector) streak++;
                else break;
            }
            return { sector: lastSector, count: streak };
        }
        
        function analyzeLast3Pattern() {
            if (sectorHistory.length < 3) return null;
            
            const last3 = sectorHistory.slice(-3);
            let occurrences = 0;
            let followsCount = {};
            sectorOrder.forEach(s => followsCount[s] = 0);
            
            // Look for last3 pattern in history
            for (let i = 0; i <= sectorHistory.length - 4; i++) {
                const s1 = sectorHistory[i];
                const s2 = sectorHistory[i+1];
                const s3 = sectorHistory[i+2];
                const nextSector = sectorHistory[i+3];
                
                if (s1 === last3[0] && s2 === last3[1] && s3 === last3[2]) {
                    occurrences++;
                    followsCount[nextSector]++;
                }
            }
            
            if (occurrences === 0) return null;
            
            // Find most common follow-up
            let bestSector = 'VOISINS';
            let bestCount = 0;
            for (const s of sectorOrder) {
                if (followsCount[s] > bestCount) {
                    bestCount = followsCount[s];
                    bestSector = s;
                }
            }
            
            const confidence = occurrences > 0 ? (bestCount / occurrences) * 100 : 50;
            
            return {
                prediction: bestSector,
                confidence: confidence,
                occurrences: occurrences,
                matches: bestCount
            };
        }
        
        function isZigzagPattern() {
            if (sectorHistory.length < 4) return false;
            let alternating = true;
            for (let i = sectorHistory.length - 3; i < sectorHistory.length - 1; i++) {
                if (sectorHistory[i] === sectorHistory[i + 1]) {
                    alternating = false;
                    break;
                }
            }
            return alternating;
        }
        
        function getPredictionAndConfidence() {
            if (sectorHistory.length < 2) return { prediction: null, confidence: 50, occurrences: 0 };
            
            let scores = {};
            sectorOrder.forEach(s => scores[s] = 0);
            let totalWeight = 0;
            
            // LOGIC 1: Streak Detection (30% weight)
            const streak = getCurrentStreak();
            if (streak.count >= 3) {
                const streakBonus = Math.min(40, (streak.count - 2) * 15);
                scores[streak.sector] += streakBonus;
                totalWeight += 30;
            } else if (streak.count === 2) {
                scores[streak.sector] += 10;
                totalWeight += 20;
            }
            
            // LOGIC 2: Last-3 Pattern Analysis (50% weight)
            const patternAnalysis = analyzeLast3Pattern();
            if (patternAnalysis && patternAnalysis.occurrences > 0) {
                const patternWeight = 50;
                const patternScore = (patternAnalysis.confidence / 100) * patternWeight;
                scores[patternAnalysis.prediction] += patternScore;
                totalWeight += patternWeight;
            }
            
            // LOGIC 3: Zigzag Detection (20% weight)
            if (isZigzagPattern() && sectorHistory.length >= 4) {
                const lastSector = sectorHistory[sectorHistory.length - 1];
                // Find opposite side of wheel for zigzag
                const zigzagPrediction = sectorOrder[(sectorIndex[lastSector] + 2) % 4];
                scores[zigzagPrediction] += 20;
                totalWeight += 20;
            }
            
            // Fallback: opposite of last sector
            if (totalWeight === 0 && sectorHistory.length >= 2) {
                const lastSector = sectorHistory[sectorHistory.length - 1];
                const fallbackPrediction = sectorOrder[(sectorIndex[lastSector] + 2) % 4];
                scores[fallbackPrediction] = 55;
                totalWeight = 100;
            }
            
            // Find best prediction
            let bestSector = 'VOISINS';
            let bestScore = -Infinity;
            for (const s of sectorOrder) {
                if (scores[s] > bestScore) {
                    bestScore = scores[s];
                    bestSector = s;
                }
            }
            
            let confidence = totalWeight > 0 ? (bestScore / totalWeight) * 100 : 50;
            confidence = Math.min(96, Math.max(40, confidence));
            
            let totalOccurrences = patternAnalysis ? patternAnalysis.occurrences : 0;
            if (streak.count >= 3) totalOccurrences += streak.count;
            
            return {
                prediction: bestSector,
                confidence: confidence,
                occurrences: totalOccurrences || 1
            };
        }
        
        // ========== DYNAMIC SKIP THRESHOLD (EXACTLY FROM YOUR EXAMPLE) ==========
        function getDynamicSkipThreshold() {
            let baseThreshold = 60;
            
            const recentResults = detailedResults.slice(-5).filter(h => !h.wasSkip);
            const recentLosses = recentResults.filter(r => r.type === 'loss').length;
            const recentWins = recentResults.filter(r => r.type === 'win').length;
            
            if (recentLosses >= 3) {
                baseThreshold = 52;
            } else if (recentWins >= 3 && recentResults.length >= 3) {
                baseThreshold = 68;
            } else if (recentLosses >= 2) {
                baseThreshold = 56;
            } else if (recentWins >= 2) {
                baseThreshold = 64;
            }
            
            const totalDecisions = wlHistory.length;
            if (totalDecisions > 10) {
                const wins = wlHistory.filter(r => r === 'W').length;
                const winRate = wins / totalDecisions;
                if (winRate < 0.45) {
                    baseThreshold = Math.max(50, baseThreshold - 5);
                } else if (winRate > 0.55) {
                    baseThreshold = Math.min(75, baseThreshold + 5);
                }
            }
            
            return baseThreshold;
        }
        
        function shouldSkipPrediction(confidence, occurrences) {
            const dynamicThreshold = getDynamicSkipThreshold();
            let adjustedThreshold = dynamicThreshold;
            if (occurrences >= 5) {
                adjustedThreshold = Math.max(50, dynamicThreshold - 8);
            }
            return confidence < adjustedThreshold;
        }
        
        // Convert predicted sector to a specific number (pick the center of sector)
        function sectorToNumber(sectorName) {
            const sectorNumbers = sectors[sectorName];
            if (!sectorNumbers || sectorNumbers.length === 0) return 0;
            // Return the middle of the sector for better coverage
            const midIndex = Math.floor(sectorNumbers.length / 2);
            return sectorNumbers[midIndex];
        }
        
        function updateSectorBar(activeSector) {
            const tags = sectorBar.querySelectorAll('.sector-tag');
            tags.forEach((tag, idx) => {
                const sectorNames = ['ZERO', 'VOISINS', 'TIERS', 'ORPHELINS'];
                if (sectorNames[idx] === activeSector) {
                    tag.classList.add('active');
                } else {
                    tag.classList.remove('active');
                }
            });
        }
        
        function applyPredictionGlow() {
            numbers.forEach(n => n.classList.remove('neighbor', 'center'));
            
            if (sectorHistory.length < ACTIVATION_THRESHOLD) return;
            
            const { prediction, confidence, occurrences } = getPredictionAndConfidence();
            
            if (!prediction) return;
            
            const shouldSkip = shouldSkipPrediction(confidence, occurrences);
            
            updateSectorBar(shouldSkip ? null : prediction);
            
            if (shouldSkip) return;
            
            // Convert sector to a specific number on the wheel
            const predictedNumber = sectorToNumber(prediction);
            
            let centerIndex = wheelNumbers.indexOf(predictedNumber);
            if (centerIndex === -1) return;
            
            numbers[centerIndex].classList.add('center');
            for (let i = 1; i <= NEIGHBORS_ON_EACH_SIDE; i++) {
                const leftIdx = (centerIndex - i + wheelNumbers.length) % wheelNumbers.length;
                numbers[leftIdx].classList.add('neighbor');
                const rightIdx = (centerIndex + i) % wheelNumbers.length;
                numbers[rightIdx].classList.add('neighbor');
            }
        }
        
        function renderHistories() {
            numberHistoryContainer.innerHTML = '';
            numberHistory.slice(-MAX_HISTORY).forEach(n => {
                const d = document.createElement('div');
                d.classList.add('history-num');
                d.textContent = n;
                if (n === 0) d.classList.add('green');
                else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(n)) d.classList.add('red');
                else d.classList.add('black');
                numberHistoryContainer.appendChild(d);
            });
            
            wlHistoryContainer.innerHTML = '';
            wlHistory.slice(-MAX_HISTORY).forEach(r => {
                const d = document.createElement('div');
                d.classList.add('history-wl', r);
                d.textContent = r;
                wlHistoryContainer.appendChild(d);
            });
        }
        
        function isWinBasedOnCurrentPrediction(enteredNumber) {
            if (firstEntry) return false;
            const glowingSet = new Set();
            numbers.forEach(div => {
                if (div.classList.contains('center') || div.classList.contains('neighbor')) {
                    glowingSet.add(Number(div.textContent));
                }
            });
            if (glowingSet.size === 0) return false;
            return glowingSet.has(enteredNumber);
        }
        
        function addResult(value) {
            undoStack.push({
                numberHistory: [...numberHistory],
                sectorHistory: [...sectorHistory],
                wlHistory: [...wlHistory],
                firstEntry: firstEntry,
                detailedResults: [...detailedResults]
            });
            
            const enteredSector = numberToSector[value] || 'VOISINS';
            
            // Check skip BEFORE adding
            let isCurrentRoundSkip = false;
            let currentConfidence = 50;
            let currentOccurrences = 0;
            let currentPrediction = null;
            
            if (sectorHistory.length >= ACTIVATION_THRESHOLD) {
                const predData = getPredictionAndConfidence();
                currentPrediction = predData.prediction;
                currentConfidence = predData.confidence;
                currentOccurrences = predData.occurrences;
                isCurrentRoundSkip = shouldSkipPrediction(currentConfidence, currentOccurrences);
            }
            
            const isWin = isWinBasedOnCurrentPrediction(value);
            
            numberHistory.push(value);
            sectorHistory.push(enteredSector);
            
            if (!firstEntry && sectorHistory.length > MAX_HISTORY) {
                if (!isCurrentRoundSkip && currentPrediction && sectorHistory.length >= ACTIVATION_THRESHOLD + 1) {
                    const wasWin = (currentPrediction === enteredSector);
                    wlHistory.push(wasWin ? 'W' : 'L');
                    detailedResults.push({ type: wasWin ? 'win' : 'loss', wasSkip: false });
                } else if (isCurrentRoundSkip) {
                    detailedResults.push({ type: 'skip', wasSkip: true });
                }
                
                if (wlHistory.length > MAX_HISTORY) wlHistory.shift();
                if (detailedResults.length > 50) detailedResults.shift();
            }
            if (firstEntry) firstEntry = false;
            
            applyPredictionGlow();
            renderHistories();
            
            const showGlow = !shouldSkipPrediction(currentConfidence, currentOccurrences);
            if (typeof window.updateDisplay === 'function') {
                window.updateDisplay(numberHistory.length, wlHistory, currentConfidence, showGlow, getDynamicSkipThreshold());
            }
        }
        
        function resetGame() {
            numberHistory = [];
            sectorHistory = [];
            wlHistory = [];
            firstEntry = true;
            undoStack = [];
            detailedResults = [];
            numbers.forEach(n => n.classList.remove('neighbor', 'center'));
            renderHistories();
            updateSectorBar(null);
            if (typeof window.updateDisplay === 'function') {
                window.updateDisplay(0, [], 0, false, 60);
            }
        }
        
        function undoLast() {
            if (!undoStack.length) return;
            const s = undoStack.pop();
            numberHistory = s.numberHistory;
            sectorHistory = s.sectorHistory;
            wlHistory = s.wlHistory;
            firstEntry = s.firstEntry;
            detailedResults = s.detailedResults || [];
            applyPredictionGlow();
            renderHistories();
            const { confidence, occurrences } = getPredictionAndConfidence();
            const showGlow = !shouldSkipPrediction(confidence, occurrences);
            if (typeof window.updateDisplay === 'function') {
                window.updateDisplay(numberHistory.length, wlHistory, confidence, showGlow, getDynamicSkipThreshold());
            }
        }
        
        resultInput.addEventListener('input', () => {
            const v = resultInput.value;
            enterBtn.disabled = !(v !== '' && v >= 0 && v <= 36);
        });
        
        enterBtn.addEventListener('click', () => {
            const value = Number(resultInput.value);
            if (isNaN(value) || value < 0 || value > 36) return;
            addResult(value);
            resultInput.value = '';
            enterBtn.disabled = true;
        });
        
        document.getElementById('undoBtn').addEventListener('click', undoLast);
        document.getElementById('resetBtn').addEventListener('click', () => {
            resetGame();
            resultInput.value = '';
            enterBtn.disabled = true;
        });
        
        applyPredictionGlow();
        renderHistories();
    })();
    
    // ========== DISPLAY FUNCTION ==========
    (function() {
        const predictionInner = document.getElementById('predictionInner');
        const REQUIRED_SPINS = 10;
        
        function renderDisplay(historyLength, wlHistory, confidence, hasGlow, threshold) {
            if (!predictionInner) return;
            
            if (historyLength < REQUIRED_SPINS) {
                predictionInner.innerHTML = `
                    <div class="prediction-text">ANALYZING</div>
                    <div class="prediction-small">${historyLength}/${REQUIRED_SPINS} SPINS</div>
                `;
                return;
            }
            
            if (!hasGlow) {
                predictionInner.innerHTML = `
                    <div class="prediction-text">WAITING</div>
                    <div class="prediction-small">SECTOR PATTERN</div>
                `;
                return;
            }
            
            let accuracy = 82;
            if (wlHistory && wlHistory.length > 0) {
                const wins = wlHistory.filter(r => r === 'W').length;
                accuracy = Math.min(95, Math.max(65, Math.round((wins / wlHistory.length) * 100)));
            }
            
            predictionInner.innerHTML = `
                <div class="prediction-text glow-text">${accuracy}%</div>
                <div class="prediction-small">TREND ACCURACY</div>
            `;
        }
        
        window.updateDisplay = function(historyLength, wlHistory, confidence, hasGlow, threshold) {
            renderDisplay(historyLength, wlHistory, confidence, hasGlow, threshold);
        };
    })();
    
    // Keyboard shortcuts block
    (function() {
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        document.onkeydown = function(e) {
            const key = e.keyCode || e.which;
            const ctrl = e.ctrlKey;
            const shift = e.shiftKey;
            const alt = e.altKey;
            const meta = e.metaKey;
            
            if (key >= 112 && key <= 123) {
                e.preventDefault();
                return false;
            }
            
            if (ctrl) {
                if ([67, 86, 88, 83, 80, 85, 70, 71, 72, 74, 82].includes(key)) {
                    e.preventDefault();
                    return false;
                }
                if (shift && [73, 74, 67].includes(key)) {
                    e.preventDefault();
                    return false;
                }
            }
            
            if (alt) {
                if ([9, 115, 37, 39].includes(key)) {
                    e.preventDefault();
                    return false;
                }
            }
            
            if (meta) {
                if (![37, 38, 39, 40].includes(key)) {
                    e.preventDefault();
                    return false;
                }
            }
            
            if (key === 116 || key === 122 || key === 44 || key === 45 || key === 46 || key === 36 || key === 35 || key === 33 || key === 34 || key === 27) {
                e.preventDefault();
                return false;
            }
            
            return true;
        };
        
        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('contextmenu', e => e.preventDefault());
        });
        
        if (typeof console !== "undefined") {
            console.log = console.debug = console.info = console.warn = console.error = function() {};
        }
    })();
</script>
