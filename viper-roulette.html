<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP ROULETTE · Trend Prediction</title>

    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = new Date().getTime();
            if (!userDoc.exists() || (userDoc.data().expiry !== 'LIFETIME' && userDoc.data().expiry < now)) {
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>

    <style>
        body { 
            background: linear-gradient(135deg, #0b0b0b, #1c1c1c, #2c2c2c); 
            display: none; /* Guard hidden */
            flex-direction: column; 
            align-items: center; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 120px; 
            color: white; 
        }

        /* EXIT BUTTON */
        .exit-nav { position: fixed; top: 20px; right: 20px; z-index: 200; }
        .exit-btn { background: #444; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; border: 1px solid #666; font-size: 13px; }
        .exit-btn:hover { background: #ff4d6d; border-color: #fff; }

        h1 { font-size: 2rem; font-weight: bold; text-shadow: 0 0 5px #ff4d6d, 0 0 10px #ff1a75; margin-bottom: 30px; }
        
        .wheel-container {
            position: relative;
            width: 600px;
            height: 400px;
            margin-bottom: 20px;
        }
        .track-container { 
            position: relative; 
            width: 100%; 
            height: 100%; 
        }
        .num { 
            width: 40px; 
            height: 40px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: bold; 
            position: absolute; 
            border-radius: 50%; 
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .red { background: #c62828; } 
        .black { background: #111; } 
        .green { background: #0fa23f; }
        .num.neighbor { background: yellow !important; color: black; transform: scale(1.2); box-shadow: 0 0 10px gold; }
        .num.center { background: #ff69b4 !important; color: black; transform: scale(1.3); box-shadow: 0 0 15px hotpink; }
        
        /* PREDICTION INSIDE WHEEL - CLEAN, NO EXTRA CIRCLE, JUST TEXT */
        .wheel-prediction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: none;
            font-family: 'Arial', monospace;
            text-align: center;
            background: transparent;
        }
        .pred-loading {
            text-align: center;
            color: #ffaa66;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .pred-loading .loading-text {
            font-size: 11px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 40px;
            display: inline-block;
            white-space: nowrap;
        }
        .pred-loading .progress-bar-mini {
            width: 100px;
            height: 3px;
            background: #2a2a2a;
            border-radius: 4px;
            margin: 8px auto 0;
            overflow: hidden;
        }
        .pred-loading .progress-fill-mini {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffaa44, #ffdd88);
            transition: width 0.2s;
            border-radius: 4px;
        }
        .pred-number {
            font-size: 42px;
            font-weight: 900;
            color: #ffdd99;
            text-shadow: 0 0 15px #ff9933, 0 0 5px rgba(0,0,0,0.5);
            line-height: 1;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 50px;
            letter-spacing: 2px;
        }
        .pred-confidence {
            font-size: 12px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 3px 12px;
            border-radius: 30px;
            margin-top: 6px;
            color: #ffdd99;
        }
        .glow-prediction {
            animation: pulseGlow 1.2s infinite;
        }
        @keyframes pulseGlow {
            0% { text-shadow: 0 0 5px #ffaa33; }
            100% { text-shadow: 0 0 20px #ffdd77, 0 0 5px #ffaa33; }
        }
        
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #enterBtn { background: #0fa23f; color: white; }
        #enterBtn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        #undoBtn { background: #c62828; color: white; }
        #resetBtn { background: #555; color: white; }
        .result-input { width: 60px; height: 40px; background: #444; border: 1px solid #222; color: white; font-size: 16px; text-align: center; }
        
        .history-container { width: 600px; display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
        .history-num, .history-wl { width: 28px; height: 28px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; font-size: 12px; }
        .history-num.red { background: #c62828; } .history-num.black { background: #111; } .history-num.green { background: #0fa23f; }
        .history-wl.W { background: #0fa23f; } .history-wl.L { background: #c62828; }
        
        h3 { margin: 15px 0 5px; font-size: 14px; }
    </style>
</head>
<body>

<div class="exit-nav">
    <a href="index.html" class="exit-btn">EXIT TERMINAL</a>
</div>

<h1>VIPER ROULETTE</h1>

<div class="wheel-container">
    <div class="track-container" id="track"></div>
    <!-- PREDICTION INSIDE WHEEL - SIMPLE TEXT, NO EXTRA CIRCLE -->
    <div class="wheel-prediction" id="wheelPrediction">
        <div id="predictionInner">
            <!-- dynamic content -->
        </div>
    </div>
</div>

<div class="controls">
    <input type="number" id="resultInput" class="result-input" placeholder="0-36" min="0" max="36" required oninput="this.value = this.value.slice(0, 2)">
    <button id="enterBtn" disabled>Enter</button>
    <button id="undoBtn">Undo</button>
    <button id="resetBtn">Reset</button>
</div>

<h3>Number History (last 10):</h3>
<div class="history-container" id="numberHistory"></div>
<h3>Win/Lose History (last 10):</h3>
<div class="history-container" id="wlHistory"></div>

<script>
// ==================== ORIGINAL ROULETTE ENGINE (PRESERVED) ====================
window.addEventListener('DOMContentLoaded', () => {
    const trackContainer = document.getElementById('track');
    const resultInput = document.getElementById('resultInput');
    const enterBtn = document.getElementById('enterBtn');

    const wheelNumbers = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
    const numbers = [];
    const centerX = 300; const centerY = 200;
    const radiusX = 250; const radiusY = 150;

    wheelNumbers.forEach((num, i) => {
        const angle = (i / wheelNumbers.length) * 2 * Math.PI + Math.PI;
        const x = centerX + radiusX * Math.cos(angle) - 20;
        const y = centerY + radiusY * Math.sin(angle) - 20;
        const div = document.createElement('div');
        div.classList.add('num');
        div.textContent = num;
        if (num === 0) div.classList.add('green');
        else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(num)) div.classList.add('red');
        else div.classList.add('black');
        div.style.left = `${x}px`; div.style.top = `${y}px`;
        trackContainer.appendChild(div);
        numbers.push(div);
    });

    const numberHistoryContainer = document.getElementById('numberHistory');
    const wlHistoryContainer = document.getElementById('wlHistory');

    let numberHistory = [];
    let wlHistory = [];
    let currentHighlight = [];
    let firstEntry = true;
    let undoStack = [];

    const MAX_HISTORY = 10;
    const neighborCount = 9;

    function generateHighlight() {
        numbers.forEach(n => n.classList.remove('neighbor','center'));
        let centerIndex;
        do { centerIndex = Math.floor(Math.random() * numbers.length); } 
        while (numbers[centerIndex].classList.contains('green'));

        numbers[centerIndex].classList.add('center');
        for (let i = -neighborCount; i <= neighborCount; i++) {
            if (i === 0) continue;
            const idx = (centerIndex + i + numbers.length) % numbers.length;
            numbers[idx].classList.add('neighbor');
        }

        currentHighlight = numbers
            .filter(n => n.classList.contains('neighbor') || n.classList.contains('center'))
            .map(n => Number(n.textContent));
    }

    function renderHistories() {
        numberHistoryContainer.innerHTML = '';
        numberHistory.slice(-MAX_HISTORY).forEach(n => {
            const d = document.createElement('div');
            d.classList.add('history-num');
            d.textContent = n;
            if (n === 0) d.classList.add('green');
            else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(n)) d.classList.add('red');
            else d.classList.add('black');
            numberHistoryContainer.appendChild(d);
        });

        wlHistoryContainer.innerHTML = '';
        wlHistory.slice(-MAX_HISTORY).forEach(r => {
            const d = document.createElement('div');
            d.classList.add('history-wl', r);
            d.textContent = r;
            wlHistoryContainer.appendChild(d);
        });
    }

    resultInput.addEventListener('input', () => {
        const v = resultInput.value;
        enterBtn.disabled = !(v !== '' && v >= 0 && v <= 36);
    });

    function notifyPredictionUpdate() {
        if (typeof window.updateTrendPrediction === 'function') {
            window.updateTrendPrediction(numberHistory);
        }
    }

    enterBtn.addEventListener('click', () => {
        const value = Number(resultInput.value);
        
        undoStack.push({
            numberHistory: [...numberHistory],
            wlHistory: [...wlHistory],
            firstEntry: firstEntry,
            highlights: numbers.map(n => n.className),
            currentHighlight: [...currentHighlight]
        });

        numberHistory.push(value);
        if (numberHistory.length > MAX_HISTORY) numberHistory.shift();

        if (!firstEntry) {
            const isWin = currentHighlight.includes(value);
            wlHistory.push(isWin ? 'W' : 'L');
            if (wlHistory.length > MAX_HISTORY) wlHistory.shift();
        } else {
            firstEntry = false;
        }

        generateHighlight();
        renderHistories();
        resultInput.value = '';
        enterBtn.disabled = true;
        
        notifyPredictionUpdate();
    });

    document.getElementById('undoBtn').addEventListener('click', () => {
        if (!undoStack.length) return;
        const s = undoStack.pop();
        numberHistory = s.numberHistory;
        wlHistory = s.wlHistory;
        firstEntry = s.firstEntry;
        currentHighlight = s.currentHighlight;
        
        numbers.forEach((n, i) => n.className = s.highlights[i]);
        renderHistories();
        
        notifyPredictionUpdate();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        numberHistory = []; wlHistory = []; currentHighlight = []; firstEntry = true; undoStack = [];
        numbers.forEach(n => n.classList.remove('neighbor', 'center'));
        generateHighlight();
        renderHistories();
        resultInput.value = '';
        enterBtn.disabled = true;
        
        notifyPredictionUpdate();
    });
    
    generateHighlight();
});

// ==================== TREND LOGIC: BASE ON LAST 10 RESULTS ONLY ====================
(function() {
    const predictionContainer = document.getElementById('predictionInner');
    const wheelDiv = document.getElementById('wheelPrediction');
    
    let currentHistory = [];
    const REQUIRED_SPINS = 10;
    
    // TREND PREDICTION: analyze last 10 results, find most frequent number + hot streak
    function getTrendPrediction(history) {
        if (!history || history.length < REQUIRED_SPINS) {
            return { number: null, confidence: 0, trendData: null };
        }
        
        // ONLY last 10 results matter
        const last10 = history.slice(-10);
        
        // Frequency analysis
        const freq = {};
        last10.forEach(num => {
            freq[num] = (freq[num] || 0) + 1;
        });
        
        // Find most frequent number(s)
        let maxFreq = 0;
        let mostFrequentNumbers = [];
        for (const [num, count] of Object.entries(freq)) {
            if (count > maxFreq) {
                maxFreq = count;
                mostFrequentNumbers = [parseInt(num)];
            } else if (count === maxFreq) {
                mostFrequentNumbers.push(parseInt(num));
            }
        }
        
        // Trend direction: check if there's a repeating pattern (last 3 numbers)
        const last3 = last10.slice(-3);
        let patternBonus = false;
        let patternNumber = null;
        
        // Check if last 2 numbers are same -> trend continues
        if (last3.length >= 2 && last3[last3.length-1] === last3[last3.length-2]) {
            patternBonus = true;
            patternNumber = last3[last3.length-1];
        }
        
        // Check for alternating pattern (hot)
        let lastColorSequence = last10.slice(-5).map(n => {
            if (n === 0) return 'green';
            const reds = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
            return reds.includes(n) ? 'red' : 'black';
        });
        
        let selectedNumber = null;
        let confidencePercent = 95.3; // base minimum in range 95.3% - 98.4%
        
        if (patternBonus && patternNumber !== null) {
            selectedNumber = patternNumber;
            // Higher confidence when pattern is strong
            confidencePercent = 97.8 + (Math.random() * 0.6);
        } else if (mostFrequentNumbers.length > 0) {
            // Pick most frequent, if tie pick the most recent among them
            const recentNumbers = last10.slice(-3);
            let bestMatch = mostFrequentNumbers[0];
            for (const mn of mostFrequentNumbers) {
                if (recentNumbers.includes(mn)) {
                    bestMatch = mn;
                    break;
                }
            }
            selectedNumber = bestMatch;
            // Confidence based on frequency percentage
            const freqPercent = (maxFreq / 10) * 100;
            confidencePercent = 95.3 + (freqPercent * 0.03);
            confidencePercent = Math.min(98.4, confidencePercent);
        } else {
            // fallback: last number
            selectedNumber = last10[last10.length-1];
            confidencePercent = 95.5;
        }
        
        // Ensure confidence range 95.3% - 98.4%
        confidencePercent = Math.min(98.4, Math.max(95.3, confidencePercent));
        confidencePercent = parseFloat(confidencePercent.toFixed(1));
        
        // add tiny random variation for natural feel (within range)
        const variation = (Math.random() * 0.8) - 0.4;
        let finalConfidence = confidencePercent + variation;
        finalConfidence = Math.min(98.4, Math.max(95.3, finalConfidence));
        finalConfidence = parseFloat(finalConfidence.toFixed(1));
        
        return { 
            number: selectedNumber, 
            confidence: finalConfidence,
            trendInfo: `Top freq: ${maxFreq}/10`
        };
    }
    
    // Render UI inside wheel
    function renderPredictionUI(historyLength) {
        if (!predictionContainer) return;
        
        const isReady = historyLength >= REQUIRED_SPINS;
        
        if (!isReady) {
            // COLLECTING STATISTICAL DATA... with loading animation (no circle container, just simple words)
            const percent = Math.min(100, Math.floor((historyLength / REQUIRED_SPINS) * 100));
            predictionContainer.innerHTML = `
                <div class="pred-loading">
                    <div class="loading-text">📊 COLLECTING STATISTICAL DATA...</div>
                    <div class="progress-bar-mini">
                        <div class="progress-fill-mini" style="width: ${percent}%;"></div>
                    </div>
                    <div style="font-size: 10px; margin-top: 5px; opacity: 0.8;">${historyLength}/10 spins</div>
                </div>
            `;
            wheelDiv.classList.remove('glow-prediction');
            return;
        }
        
        // ACTIVE PREDICTION MODE - Show glowing prediction with confidence 95.3% - 98.4%
        const pred = getTrendPrediction(currentHistory);
        if (!pred || pred.number === null) {
            predictionContainer.innerHTML = `<div class="pred-number">?</div><div class="pred-confidence">calculating...</div>`;
            wheelDiv.classList.remove('glow-prediction');
            return;
        }
        
        // Show glowing prediction
        wheelDiv.classList.add('glow-prediction');
        predictionContainer.innerHTML = `
            <div class="pred-number">${pred.number}</div>
            <div class="pred-confidence">${pred.confidence}% trend accuracy</div>
        `;
    }
    
    // Expose update function for roulette
    window.updateTrendPrediction = function(historyArray) {
        if (!historyArray) return;
        currentHistory = [...historyArray];
        renderPredictionUI(currentHistory.length);
    };
    
    // Initial render
    renderPredictionUI(0);
})();

// ==================== SECURITY BLOCKS (PRESERVED) ====================
(function() {
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
        if (
            e.keyCode === 123 || 
            (e.ctrlKey && e.keyCode === 85) || 
            (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) ||
            (e.ctrlKey && e.keyCode === 83)
        ) {
            return false;
        }
    };
    setInterval(function() {
        (function() { return false; }['constructor']('debugger')['call']());
    }, 50);
    function detectDevTools() {
        const threshold = 160;
        if ((window.outerWidth - window.innerWidth > threshold) || (window.outerHeight - window.innerHeight > threshold)) {
            document.body.innerHTML = ""; 
            window.location.replace("about:blank");
        }
    }
    setInterval(detectDevTools, 500);
    if (typeof console !== "undefined") {
        console.log = console.debug = console.info = console.warn = console.error = function() {};
    }
})();
</script>

</body>
</html>
