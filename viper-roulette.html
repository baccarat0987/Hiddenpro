            projectId: "my-software-portal",

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, async (user) => {

<div class="roulette-arena">

    <!-- WHEEL WITH PREDICTION OVERLAY (MIDDLE OF CIRCLE) -->
    <div class="wheel-wrapper">
        <div class="track-container" id="track"></div>
        <div class="prediction-core" id="predictionCore">

        <input type="number" id="resultInput" class="result-input" placeholder="0-36" min="0" max="36" oninput="this.value = this.value.slice(0,2)">

        <button id="undoBtn">↩ UNDO</button>
        <button id="resetBtn">⟳ RESET</button>
    </div>

    <div class="history-section">
        <h3>📊 NUMBER HISTORY (last 10)</h3>
        <div class="history-container" id="numberHistory"></div>
        <h3>🎯 WIN/LOSE HISTORY (last 10)</h3>
        <div class="history-container" id="wlHistory"></div>
    </div>
    <div class="footer-note">Neighbor bet mode active | Neural prediction inside wheel</div>
</div>

<script>
// ======================= ORIGINAL WHEEL + NEIGHBOR (UNTOUCHED) =======================
(function initRoulette() {
    const track = document.getElementById('track');
    const resultInput = document.getElementById('resultInput');
    const enterBtn = document.getElementById('enterBtn');

    const wheelNumbers = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
    const numbersDivs = [];
    const centerX = 300, centerY = 200;
    const radiusX = 250, radiusY = 150;

    wheelNumbers.forEach((num, i) => {
        const angle = (i / wheelNumbers.length) * 2 * Math.PI + Math.PI;
        const x = centerX + radiusX * Math.cos(angle) - 20;
        const y = centerY + radiusY * Math.sin(angle) - 20;
        const div = document.createElement('div');
        div.classList.add('num');
        div.textContent = num;
        if (num === 0) div.classList.add('green');
        else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(num)) div.classList.add('red');
        else div.classList.add('black');
        div.style.left = `${x}px`;
        div.style.top = `${y}px`;
        track.appendChild(div);
        numbersDivs.push(div);
    });

    let numberHistory = [];      // max 10
    let wlHistory = [];          // max 10
    let currentHighlight = [];
    let firstEntry = true;
    let undoStack = [];
    const neighborCount = 9;
    const MAX_HISTORY = 10;      // 👈 LIMIT 10

    function generateHighlight() {
        numbersDivs.forEach(n => n.classList.remove('neighbor','center'));
        let centerIndex;
        do { centerIndex = Math.floor(Math.random() * numbersDivs.length); } 
        while (numbersDivs[centerIndex].classList.contains('green'));

        numbersDivs[centerIndex].classList.add('center');
        for (let i = -neighborCount; i <= neighborCount; i++) {
            if (i === 0) continue;
            const idx = (centerIndex + i + numbersDivs.length) % numbersDivs.length;
            numbersDivs[idx].classList.add('neighbor');
        }
        currentHighlight = numbersDivs
            .filter(n => n.classList.contains('neighbor') || n.classList.contains('center'))
            .map(n => Number(n.textContent));
    }

    function renderHistories() {
        const numberContainer = document.getElementById('numberHistory');
        numberContainer.innerHTML = '';
        numberHistory.slice(-MAX_HISTORY).forEach(n => {
            const d = document.createElement('div');
            d.classList.add('history-num');
            d.textContent = n;
            if (n === 0) d.classList.add('green');
            else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(n)) d.classList.add('red');
            else d.classList.add('black');
            numberContainer.appendChild(d);
        });

        const wlContainer = document.getElementById('wlHistory');
        wlContainer.innerHTML = '';
        wlHistory.slice(-MAX_HISTORY).forEach(r => {
            const d = document.createElement('div');
            d.classList.add('history-wl', r);
            d.textContent = r;
            wlContainer.appendChild(d);
        });
    }

    resultInput.addEventListener('input', () => {
        const v = resultInput.value;
        enterBtn.disabled = !(v !== '' && v >= 0 && v <= 36);
    });

    // function to update external prediction engine
    function notifyPredictionUpdate() {
        if (typeof window.updatePredictionWithHistory === 'function') {
            window.updatePredictionWithHistory([...numberHistory]);
        }
    }

    enterBtn.addEventListener('click', () => {
        const value = Number(resultInput.value);
        undoStack.push({
            numberHistory: [...numberHistory],
            wlHistory: [...wlHistory],
            firstEntry: firstEntry,
            highlights: numbersDivs.map(n => n.className),
            currentHighlight: [...currentHighlight]
        });

        numberHistory.push(value);
        if (numberHistory.length > MAX_HISTORY) numberHistory.shift();   // enforce 10 limit

        if (!firstEntry) {
            const resultWL = currentHighlight.includes(value) ? 'W' : 'L';
            wlHistory.push(resultWL);
            if (wlHistory.length > MAX_HISTORY) wlHistory.shift();       // enforce 10 limit
        } else {
            firstEntry = false;
        }

        generateHighlight();
        renderHistories();
        resultInput.value = '';
        enterBtn.disabled = true;
        notifyPredictionUpdate();
    });

    document.getElementById('undoBtn').addEventListener('click', () => {
        if (!undoStack.length) return;
        const s = undoStack.pop();
        numberHistory = s.numberHistory;
        wlHistory = s.wlHistory;
        firstEntry = s.firstEntry;
        currentHighlight = s.currentHighlight;
        numbersDivs.forEach((n, i) => n.className = s.highlights[i]);
        renderHistories();
        notifyPredictionUpdate();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        numberHistory = [];
        wlHistory = [];
        firstEntry = true;
        undoStack = [];
        numbersDivs.forEach(n => n.classList.remove('neighbor', 'center'));
        generateHighlight();    // fresh neighbor set
        renderHistories();
        resultInput.value = '';
        enterBtn.disabled = true;
        notifyPredictionUpdate();
    });

    generateHighlight();
    renderHistories();
    window.rouletteNumberHistory = () => [...numberHistory];
})();

// ======================= PREDICTION ENGINE (MIDDLE OF WHEEL, NO EXTRA PANEL) =======================
(function predictionEngine() {
    // DOM inside the circle
    const coreDynamic = document.getElementById('coreDynamic');
    const coreNumberSpan = document.getElementById('coreNumberDisplay');
    const coreConfSpan = document.getElementById('coreConfidence');
    const coreSkipDiv = document.getElementById('coreSkipDisplay');
    const coreLoaderArea = document.getElementById('coreLoaderArea');
    const miniFill = document.getElementById('miniProgressFill');

    let currentNumbers = [];
    const REQUIRED_SPINS = 8;   // after 8 spins prediction becomes active
    let activeFlag = false;

    // helper: number color mapping
    function getColorClass(num) {
        if (num === 0) return 'green';
        const reds = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
        return reds.includes(num) ? 'red' : 'black';
    }

    // roulette wheel adjacency (standard neighbors)
    const wheelAdj = {
        0:[32,26],32:[15,0],15:[19,32],19:[4,15],4:[21,19],21:[2,4],2:[25,21],25:[17,2],17:[34,25],34:[6,17],
        6:[27,34],27:[13,6],13:[36,27],36:[11,13],11:[30,36],30:[8,11],8:[23,30],23:[10,8],10:[5,23],5:[24,10],
        24:[16,5],16:[33,24],33:[1,16],1:[20,33],20:[14,1],14:[31,20],31:[9,14],9:[22,31],22:[18,9],18:[29,22],
        29:[7,18],7:[28,29],28:[12,7],12:[35,28],35:[3,12],3:[26,35],26:[0,3]
    };

    // advanced prediction: frequency + neighbor + alternating pattern
    function computePrediction(history) {
        if (!history || history.length < 4) return { number: null, confidence: 0, reason: "collecting data" };
        const lastNum = history[history.length-1];
        const last3 = history.slice(-3);
        const last5 = history.slice(-5);
        
        // 1. neighbor zone candidates
        let neighbors = wheelAdj[lastNum] || [lastNum+1, lastNum-1].filter(v=> v>=0 && v<=36);
        let neighborSet = new Set(neighbors);
        
        // 2. hot numbers from last 10 spins
        const last10 = history.slice(-10);
        const freq = {};
        last10.forEach(n => freq[n] = (freq[n] || 0) + 1);
        let hotNumbers = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>parseInt(e[0]));
        
        // 3. color zigzag detection
        let lastColor = getColorClass(lastNum);
        let oppositeColor = lastColor === 'red' ? 'black' : 'red';
        let colorSequence = last5.map(n => getColorClass(n));
        let isAlternating = true;
        for(let i=1; i<colorSequence.length; i++) {
            if(colorSequence[i] === colorSequence[i-1]) { isAlternating = false; break; }
        }
        
        let candidates = [...new Set([...neighbors, ...hotNumbers])].filter(c => c !== undefined && c>=0 && c<=36);
        if(candidates.length === 0) candidates = [lastNum+1, lastNum-1].filter(v=> v>=0 && v<=36);
        
        let selected = candidates[0];
        let confidenceBase = 48;
        let patternReason = "mixed pattern";
        
        // alternate pattern boost
        if(isAlternating && history.length >= 6) {
            let oppositeCand = candidates.find(c => getColorClass(c) === oppositeColor);
            if(oppositeCand) selected = oppositeCand;
            confidenceBase = 72;
            patternReason = "color zigzag active";
        } else {
            // if neighbor hit recently
            let neighborRecentCount = 0;
            for(let i=history.length-2; i>=Math.max(0, history.length-5); i--) {
                if(neighborSet.has(history[i])) neighborRecentCount++;
            }
            if(neighborRecentCount >= 2) {
                confidenceBase = 68;
                patternReason = "hot neighbor zone";
            }
            // prefer number not in last 3 spins
            let notRecent = candidates.find(c => !last3.includes(c));
            if(notRecent) selected = notRecent;
        }
        
        // confidence fine-tune
        let finalConfidence = Math.min(94, Math.max(42, confidenceBase + (history.length > 12 ? 8 : 0)));
        if (history.length > 20) finalConfidence = Math.min(96, finalConfidence + 4);
        // if the number is totally cold? minor adjust
        return { number: selected, confidence: Math.floor(finalConfidence), reason: patternReason };
    }
    
    // function to decide SKIP based on confidence and recent instability
    function shouldSkip(confidence, historyLen) {
        if (historyLen < REQUIRED_SPINS) return true;   // not yet active
        // dynamic threshold: lower if many spins but confidence low
        let threshold = 54;
        if (historyLen > 18) threshold = 52;
        if (historyLen > 30) threshold = 50;
        return confidence < threshold;
    }
    
    function updateUIForPrediction() {
        if (!coreDynamic) return;
        const history = currentNumbers;
        const spinsCount = history.length;
        const isActive = spinsCount >= REQUIRED_SPINS;
        
        // update mini progress loader inside circle
        let progressPercent = Math.min(100, Math.floor((spinsCount / REQUIRED_SPINS) * 100));
        if (miniFill) miniFill.style.width = `${progressPercent}%`;
        
        if (!isActive) {
            // SHOW ANALYZING PATTERNS MODE (middle of circle)
            coreNumberSpan.style.display = 'none';
            coreConfSpan.style.display = 'none';
            coreSkipDiv.style.display = 'none';
            coreLoaderArea.style.display = 'block';
            if (coreLoaderArea) {
                coreLoaderArea.innerHTML = `<div class="loader-inside"><div class="loader-text">ANALYZING PATTERNS...</div><div class="mini-progress"><div class="mini-fill" style="width:${progressPercent}%"></div></div><div style="font-size:9px; margin-top:4px;">${spinsCount}/${REQUIRED_SPINS} spins</div></div>`;
                // reattach fill reference after innerHTML
                const newFill = document.querySelector('#coreLoaderArea .mini-fill');
                if(newFill) newFill.style.width = `${progressPercent}%`;
            }
            return;
        }
        
        // active prediction mode
        const pred = computePrediction(history);
        if (!pred || pred.number === null) {
            coreNumberSpan.innerText = '?';
            coreConfSpan.innerText = 'low data';
            coreSkipDiv.style.display = 'none';
            coreLoaderArea.style.display = 'none';
            coreNumberSpan.style.display = 'block';
            coreConfSpan.style.display = 'block';
            return;
        }
        
        const skipActive = shouldSkip(pred.confidence, history.length);
        coreNumberSpan.innerText = pred.number;
        coreConfSpan.innerText = `${pred.confidence}%`;
        coreNumberSpan.style.display = 'block';
        coreConfSpan.style.display = 'block';
        coreLoaderArea.style.display = 'none';
        
        if (skipActive) {
            coreSkipDiv.style.display = 'flex';
            coreNumberSpan.style.opacity = '0.4';
            coreConfSpan.style.opacity = '0.4';
        } else {
            coreSkipDiv.style.display = 'none';
            coreNumberSpan.style.opacity = '1';
            coreConfSpan.style.opacity = '1';
        }
        
        // micro animation
        if(!skipActive) {
            coreNumberSpan.style.transform = 'scale(1.05)';
            setTimeout(() => { if(coreNumberSpan) coreNumberSpan.style.transform = ''; }, 200);
        }
    }
    
    // exposed function called from roulette after each spin
    window.updatePredictionWithHistory = function(historyArray) {
        if (!historyArray) return;
        currentNumbers = [...historyArray];
        updateUIForPrediction();
    };
    
    // initial loader sync 
    setInterval(() => {
        if (typeof window.rouletteNumberHistory === 'function') {
            const hist = window.rouletteNumberHistory();
            if (hist && hist.length !== currentNumbers.length) {
                currentNumbers = [...hist];
                updateUIForPrediction();
            }
        } else {
            // fallback if global not ready
            if (currentNumbers.length === 0) updateUIForPrediction();
        }
    }, 400);
    
    // make sure on load we show analyzing with progress
    setTimeout(() => {
        if (currentNumbers.length === 0) updateUIForPrediction();
    }, 100);
})();

// final hook to sync with roulette module after DOM ready
window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        if (typeof window.rouletteNumberHistory === 'function') {
            const initialHistory = window.rouletteNumberHistory();
            if (initialHistory && typeof window.updatePredictionWithHistory === 'function') {
                window.updatePredictionWithHistory(initialHistory);
            }
        }
    }, 200);
});
</script>

<script>
(function() {
