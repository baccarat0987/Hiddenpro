<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP ROULETTE · Neighbor Bet</title>

    <script>
        if (window.location.pathname.endsWith('.html')) {
            const cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = new Date().getTime();
            if (!userDoc.exists() || (userDoc.data().expiry !== 'LIFETIME' && userDoc.data().expiry < now)) {
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>

    <style>
        body { 
            background: linear-gradient(135deg, #0b0b0b, #1c1c1c, #2c2c2c); 
            display: none; /* Guard hidden */
            flex-direction: column; 
            align-items: center; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 120px; 
            color: white; 
        }

        /* EXIT BUTTON */
        .exit-nav { position: fixed; top: 20px; right: 20px; }
        .exit-btn { background: #444; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; border: 1px solid #666; font-size: 13px; }
        .exit-btn:hover { background: #ff4d6d; border-color: #fff; }

        h1 { font-size: 2rem; font-weight: bold; text-shadow: 0 0 5px #ff4d6d, 0 0 10px #ff1a75; margin-bottom: 30px; }
        
        /* WHEEL CONTAINER - relative for prediction overlay */
        .wheel-container {
            position: relative;
            width: 600px;
            height: 400px;
            margin-bottom: 20px;
        }
        .track-container { 
            position: relative; 
            width: 100%; 
            height: 100%; 
        }
        .num { 
            width: 40px; 
            height: 40px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: bold; 
            position: absolute; 
            border-radius: 50%; 
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .red { background: #c62828; } 
        .black { background: #111; } 
        .green { background: #0fa23f; }
        .num.neighbor { background: yellow !important; color: black; transform: scale(1.2); box-shadow: 0 0 10px gold; }
        .num.center { background: #ff69b4 !important; color: black; transform: scale(1.3); box-shadow: 0 0 15px hotpink; }
        
        /* PREDICTION INSIDE WHEEL - CLEAN, CENTERED */
        .wheel-prediction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 215, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: none;
            font-family: 'Arial', monospace;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            transition: all 0.2s;
        }
        .pred-loading {
            text-align: center;
        }
        .pred-loading .loading-dots {
            font-size: 10px;
            letter-spacing: 2px;
            color: #ffaa66;
            font-weight: bold;
            margin-top: 8px;
        }
        .pred-loading .progress-ring {
            width: 50px;
            height: 50px;
            margin: 0 auto;
        }
        .pred-number {
            font-size: 42px;
            font-weight: 900;
            color: #ffdd99;
            text-shadow: 0 0 12px #ff9933;
            line-height: 1;
        }
        .pred-confidence {
            font-size: 11px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 6px;
            color: #ddd;
        }
        .pred-skip {
            font-size: 24px;
            font-weight: 900;
            color: #ff4d4d;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: rgba(0,0,0,0.8);
            padding: 8px 0;
            border-radius: 40px;
            width: 100%;
            text-align: center;
        }
        .glow-prediction {
            animation: pulseGlow 1.2s infinite;
            border-color: #ffdd77;
            box-shadow: 0 0 20px #ffaa33;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px #ffaa33; border-color: rgba(255, 215, 0, 0.5); }
            100% { box-shadow: 0 0 25px #ffdd77; border-color: #ffcc44; }
        }
        .progress-ring-circle {
            stroke-dasharray: 126;
            stroke-dashoffset: 126;
            transition: stroke-dashoffset 0.3s;
        }
        
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #enterBtn { background: #0fa23f; color: white; }
        #enterBtn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        #undoBtn { background: #c62828; color: white; }
        #resetBtn { background: #555; color: white; }
        .result-input { width: 60px; height: 40px; background: #444; border: 1px solid #222; color: white; font-size: 16px; text-align: center; }
        
        .history-container { width: 600px; display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
        .history-num, .history-wl { width: 28px; height: 28px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; font-size: 12px; }
        .history-num.red { background: #c62828; } .history-num.black { background: #111; } .history-num.green { background: #0fa23f; }
        .history-wl.W { background: #0fa23f; } .history-wl.L { background: #c62828; }
        
        h3 { margin: 15px 0 5px; font-size: 14px; }
    </style>
</head>
<body>

<div class="exit-nav">
    <a href="index.html" class="exit-btn">EXIT TERMINAL</a>
</div>

<h1>VIPER ROULETTE</h1>

<div class="wheel-container">
    <div class="track-container" id="track"></div>
    <!-- PREDICTION OVERLAY - INSIDE WHEEL, CLEAN -->
    <div class="wheel-prediction" id="wheelPrediction">
        <div id="predictionInner">
            <!-- dynamic content -->
        </div>
    </div>
</div>

<div class="controls">
    <input type="number" id="resultInput" class="result-input" placeholder="0-36" min="0" max="36" required oninput="this.value = this.value.slice(0, 2)">
    <button id="enterBtn" disabled>Enter</button>
    <button id="undoBtn">Undo</button>
    <button id="resetBtn">Reset</button>
</div>

<h3>Number History (last 10):</h3>
<div class="history-container" id="numberHistory"></div>
<h3>Win/Lose History (last 10):</h3>
<div class="history-container" id="wlHistory"></div>

<script>
// ==================== ORIGINAL ROULETTE ENGINE (PRESERVED) ====================
window.addEventListener('DOMContentLoaded', () => {
    const trackContainer = document.getElementById('track');
    const resultInput = document.getElementById('resultInput');
    const enterBtn = document.getElementById('enterBtn');

    const wheelNumbers = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
    const numbers = [];
    const centerX = 300; const centerY = 200;
    const radiusX = 250; const radiusY = 150;

    wheelNumbers.forEach((num, i) => {
        const angle = (i / wheelNumbers.length) * 2 * Math.PI + Math.PI;
        const x = centerX + radiusX * Math.cos(angle) - 20;
        const y = centerY + radiusY * Math.sin(angle) - 20;
        const div = document.createElement('div');
        div.classList.add('num');
        div.textContent = num;
        if (num === 0) div.classList.add('green');
        else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(num)) div.classList.add('red');
        else div.classList.add('black');
        div.style.left = `${x}px`; div.style.top = `${y}px`;
        trackContainer.appendChild(div);
        numbers.push(div);
    });

    const numberHistoryContainer = document.getElementById('numberHistory');
    const wlHistoryContainer = document.getElementById('wlHistory');

    let numberHistory = [];
    let wlHistory = [];
    let currentHighlight = [];
    let firstEntry = true;
    let undoStack = [];

    const MAX_HISTORY = 10;      // LIMIT 10
    const neighborCount = 9;

    function generateHighlight() {
        numbers.forEach(n => n.classList.remove('neighbor','center'));
        let centerIndex;
        do { centerIndex = Math.floor(Math.random() * numbers.length); } 
        while (numbers[centerIndex].classList.contains('green'));

        numbers[centerIndex].classList.add('center');
        for (let i = -neighborCount; i <= neighborCount; i++) {
            if (i === 0) continue;
            const idx = (centerIndex + i + numbers.length) % numbers.length;
            numbers[idx].classList.add('neighbor');
        }

        currentHighlight = numbers
            .filter(n => n.classList.contains('neighbor') || n.classList.contains('center'))
            .map(n => Number(n.textContent));
    }

    function renderHistories() {
        numberHistoryContainer.innerHTML = '';
        numberHistory.slice(-MAX_HISTORY).forEach(n => {
            const d = document.createElement('div');
            d.classList.add('history-num');
            d.textContent = n;
            if (n === 0) d.classList.add('green');
            else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(n)) d.classList.add('red');
            else d.classList.add('black');
            numberHistoryContainer.appendChild(d);
        });

        wlHistoryContainer.innerHTML = '';
        wlHistory.slice(-MAX_HISTORY).forEach(r => {
            const d = document.createElement('div');
            d.classList.add('history-wl', r);
            d.textContent = r;
            wlHistoryContainer.appendChild(d);
        });
    }

    resultInput.addEventListener('input', () => {
        const v = resultInput.value;
        enterBtn.disabled = !(v !== '' && v >= 0 && v <= 36);
    });

    // notify prediction engine
    function notifyPredictionUpdate() {
        if (typeof window.updatePrediction === 'function') {
            window.updatePrediction(numberHistory);
        }
    }

    enterBtn.addEventListener('click', () => {
        const value = Number(resultInput.value);
        
        undoStack.push({
            numberHistory: [...numberHistory],
            wlHistory: [...wlHistory],
            firstEntry: firstEntry,
            highlights: numbers.map(n => n.className),
            currentHighlight: [...currentHighlight]
        });

        numberHistory.push(value);
        if (numberHistory.length > MAX_HISTORY) numberHistory.shift();

        // WIN/LOSE LOGIC: SKIP PREDICTION DOES NOT COUNT
        // get current prediction skip status before recording result
        let isSkipActive = false;
        if (typeof window.getCurrentSkipStatus === 'function') {
            isSkipActive = window.getCurrentSkipStatus();
        }
        
        if (!firstEntry) {
            // Only record win/loss if prediction is active (not skip)
            if (!isSkipActive) {
                const isWin = currentHighlight.includes(value);
                wlHistory.push(isWin ? 'W' : 'L');
                if (wlHistory.length > MAX_HISTORY) wlHistory.shift();
            } else {
                // SKIP round: do NOT record anything to win/loss history (skip not counted)
                // maintain history as is
            }
        } else {
            firstEntry = false;
        }

        generateHighlight();
        renderHistories();
        resultInput.value = '';
        enterBtn.disabled = true;
        
        notifyPredictionUpdate();
    });

    document.getElementById('undoBtn').addEventListener('click', () => {
        if (!undoStack.length) return;
        const s = undoStack.pop();
        numberHistory = s.numberHistory;
        wlHistory = s.wlHistory;
        firstEntry = s.firstEntry;
        currentHighlight = s.currentHighlight;
        
        numbers.forEach((n, i) => n.className = s.highlights[i]);
        renderHistories();
        
        notifyPredictionUpdate();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        numberHistory = []; wlHistory = []; currentHighlight = []; firstEntry = true; undoStack = [];
        numbers.forEach(n => n.classList.remove('neighbor', 'center'));
        generateHighlight();
        renderHistories();
        resultInput.value = '';
        enterBtn.disabled = true;
        
        notifyPredictionUpdate();
    });
    
    generateHighlight();
});

// ==================== PREDICTION ENGINE (EMBEDDED IN WHEEL) ====================
(function() {
    const predictionContainer = document.getElementById('predictionInner');
    const wheelDiv = document.getElementById('wheelPrediction');
    
    let currentHistory = [];
    let lastPredictionNumber = null;
    let currentSkipStatus = false;
    
    const REQUIRED_SPINS = 10;   // need 10 spins before showing glowing prediction
    
    // roulette wheel adjacency for intelligent prediction
    const wheelAdj = {
        0:[32,26],32:[15,0],15:[19,32],19:[4,15],4:[21,19],21:[2,4],2:[25,21],25:[17,2],17:[34,25],34:[6,17],
        6:[27,34],27:[13,6],13:[36,27],36:[11,13],11:[30,36],30:[8,11],8:[23,30],23:[10,8],10:[5,23],5:[24,10],
        24:[16,5],16:[33,24],33:[1,16],1:[20,33],20:[14,1],14:[31,20],31:[9,14],9:[22,31],22:[18,9],18:[29,22],
        29:[7,18],7:[28,29],28:[12,7],12:[35,28],35:[3,12],3:[26,35],26:[0,3]
    };
    
    function getNumberColor(num) {
        if (num === 0) return 'green';
        const reds = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
        return reds.includes(num) ? 'red' : 'black';
    }
    
    // intelligent prediction using patterns
    function computeSmartPrediction(history) {
        if (history.length < 4) return { number: null, confidence: 0 };
        
        const lastNum = history[history.length-1];
        const last3 = history.slice(-3);
        const last5 = history.slice(-5);
        
        // neighbors
        let neighbors = wheelAdj[lastNum] || [lastNum+1, lastNum-1].filter(v=> v>=0 && v<=36);
        let neighborSet = new Set(neighbors);
        
        // hot numbers from last 10 spins
        const last10 = history.slice(-10);
        const freq = {};
        last10.forEach(n => freq[n] = (freq[n] || 0) + 1);
        let hotNumbers = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>parseInt(e[0]));
        
        // color zigzag detection
        let lastColor = getNumberColor(lastNum);
        let oppositeColor = lastColor === 'red' ? 'black' : 'red';
        let colorSequence = last5.map(n => getNumberColor(n));
        let isAlternating = true;
        for(let i=1; i<colorSequence.length; i++) {
            if(colorSequence[i] === colorSequence[i-1]) { isAlternating = false; break; }
        }
        
        let candidates = [...new Set([...neighbors, ...hotNumbers])].filter(c => c !== undefined && c>=0 && c<=36);
        if(candidates.length === 0) candidates = [lastNum+1, lastNum-1].filter(v=> v>=0 && v<=36);
        
        let selected = candidates[0];
        let confidenceBase = 48;
        
        if(isAlternating && history.length >= 6) {
            let oppositeCand = candidates.find(c => getNumberColor(c) === oppositeColor);
            if(oppositeCand) selected = oppositeCand;
            confidenceBase = 72;
        } else {
            let neighborRecentCount = 0;
            for(let i=history.length-2; i>=Math.max(0, history.length-5); i--) {
                if(neighborSet.has(history[i])) neighborRecentCount++;
            }
            if(neighborRecentCount >= 2) confidenceBase = 68;
            
            let notRecent = candidates.find(c => !last3.includes(c));
            if(notRecent) selected = notRecent;
        }
        
        let finalConfidence = Math.min(92, Math.max(44, confidenceBase + (history.length > 15 ? 6 : 0)));
        if (history.length > 20) finalConfidence = Math.min(95, finalConfidence + 3);
        
        return { number: selected, confidence: Math.floor(finalConfidence) };
    }
    
    // decide skip based on confidence and history length
    function shouldSkipPrediction(confidence, historyLen) {
        if (historyLen < REQUIRED_SPINS) return true;  // not enough data
        let threshold = 54;
        if (historyLen > 20) threshold = 52;
        if (historyLen > 35) threshold = 50;
        return confidence < threshold;
    }
    
    // render UI inside wheel
    function renderPredictionUI(historyLength) {
        if (!predictionContainer) return;
        
        const isReady = historyLength >= REQUIRED_SPINS;
        
        if (!isReady) {
            // ANALYZING MODE with loading progress
            const percent = Math.min(100, Math.floor((historyLength / REQUIRED_SPINS) * 100));
            wheelDiv.classList.remove('glow-prediction');
            predictionContainer.innerHTML = `
                <div class="pred-loading" style="text-align:center;">
                    <svg width="50" height="50" viewBox="0 0 40 40">
                        <circle cx="20" cy="20" r="18" fill="none" stroke="#333" stroke-width="3"/>
                        <circle class="progress-ring-circle" cx="20" cy="20" r="18" fill="none" stroke="#ffaa44" stroke-width="3" stroke-dasharray="113.04" stroke-dashoffset="${113.04 - (113.04 * percent / 100)}" transform="rotate(-90 20 20)"/>
                    </svg>
                    <div style="font-size:10px; color:#ffaa66; margin-top:6px;">ANALYZING</div>
                    <div class="loading-dots" style="font-size:9px;">${historyLength}/${REQUIRED_SPINS} spins</div>
                </div>
            `;
            currentSkipStatus = true;
            return;
        }
        
        // ACTIVE PREDICTION MODE
        const pred = computeSmartPrediction(currentHistory);
        if (!pred || pred.number === null) {
            predictionContainer.innerHTML = `<div class="pred-number">?</div><div class="pred-confidence">waiting</div>`;
            wheelDiv.classList.remove('glow-prediction');
            currentSkipStatus = true;
            return;
        }
        
        const skip = shouldSkipPrediction(pred.confidence, currentHistory.length);
        currentSkipStatus = skip;
        
        if (skip) {
            // SKIP MODE - no glow, show SKIP
            wheelDiv.classList.remove('glow-prediction');
            predictionContainer.innerHTML = `
                <div class="pred-skip">SKIP</div>
                <div class="pred-confidence">${pred.confidence}%</div>
            `;
        } else {
            // ACTIVE GLOWING PREDICTION
            wheelDiv.classList.add('glow-prediction');
            predictionContainer.innerHTML = `
                <div class="pred-number">${pred.number}</div>
                <div class="pred-confidence">${pred.confidence}% confidence</div>
            `;
            lastPredictionNumber = pred.number;
        }
    }
    
    // expose update function for roulette
    window.updatePrediction = function(historyArray) {
        if (!historyArray) return;
        currentHistory = [...historyArray];
        renderPredictionUI(currentHistory.length);
    };
    
    // expose skip status getter for win/loss logic
    window.getCurrentSkipStatus = function() {
        return currentSkipStatus;
    };
    
    // initial render
    renderPredictionUI(0);
})();

// ==================== SECURITY BLOCKS (PRESERVED) ====================
(function() {
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
        if (
            e.keyCode === 123 || 
            (e.ctrlKey && e.keyCode === 85) || 
            (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) ||
            (e.ctrlKey && e.keyCode === 83)
        ) {
            return false;
        }
    };
    setInterval(function() {
        (function() { return false; }['constructor']('debugger')['call']());
    }, 50);
    function detectDevTools() {
        const threshold = 160;
        if ((window.outerWidth - window.innerWidth > threshold) || (window.outerHeight - window.innerHeight > threshold)) {
            document.body.innerHTML = ""; 
            window.location.replace("about:blank");
        }
    }
    setInterval(detectDevTools, 500);
    if (typeof console !== "undefined") {
        console.log = console.debug = console.info = console.warn = console.error = function() {};
    }
})();
</script>

</body>
</html>
