    <script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = new Date().getTime();
            if (!userDoc.exists() || (userDoc.data().expiry !== 'LIFETIME' && userDoc.data().expiry < now)) {
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });

    <style>

        .pred-pattern {
            font-size: 0.75rem;

        }
        .skip-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            color: #ff4d4d;
            text-transform: uppercase;
            border-radius: 24px;
            z-index: 10;
            letter-spacing: 8px;
        }
        .activation-warning {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 15px;
            color: #ffaa66;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 40px;
        }
        .pred-loader {
            text-align: center;
            padding: 30px 20px;
            color: #ffaa66;

            width: 100%;
            height: 6px;
            background: #222;

        h3 { margin: 15px 0 5px; font-size: 1rem; color: #ddd; }
        hr { border-color: #333; margin: 12px 0; }

</head>
<body>

<div class="exit-nav">
    <a href="index.html" class="exit-btn">EXIT TERMINAL</a>
</div>

<!-- ROULETTE ORIGINAL SECTION (UNTOUCHED) -->
<div class="roulette-section">
    <h1>VIPER ROULETTE</h1>
    <div class="track-container" id="track"></div>
    
    <div class="controls">
        <input type="number" id="resultInput" class="result-input" placeholder="0-36" min="0" max="36" required oninput="this.value = this.value.slice(0, 2)">
        <button id="enterBtn" disabled>Enter</button>
        <button id="undoBtn">Undo</button>
        <button id="resetBtn">Reset</button>
    </div>

    <h3>Number History:</h3>
    <div class="history-container" id="numberHistory"></div>
    <h3>Win/Lose History:</h3>
    <div class="history-container" id="wlHistory"></div>
</div>

<!-- PREDICTION PANEL (ADDED LOGIC ONLY, NO STATS DASHBOARD) -->
<div class="prediction-section" id="predictionPanel">
    <div class="pred-title">⌬ PREDICTION ENGINE ⌬</div>
    <div id="predictionDynamicArea">
        <!-- Loading / Activation state -->
        <div id="predictionLoading" style="display: flex; flex-direction: column;">
            <div class="pred-loader">
                ANALYZING PATTERNS...
                <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
                <div style="margin-top: 8px; font-size: 0.7rem;" id="loaderPercent">0%</div>
            </div>
        </div>
        
        <div id="predictionActiveArea" style="display: none;">
            <div class="pred-card" id="predCard">
                <div id="cardContent">
                    <div class="pred-number" id="predictedNumber">—</div>
                    <div class="pred-confidence">
                        <span id="confidenceText">Confidence</span> <strong id="confidencePercent">0</strong>%
                    </div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" id="confidenceFill"></div>
                    </div>
                    <div class="pred-pattern" id="patternDisplay">Waiting for data</div>
                </div>
                <div id="skipOverlay" class="skip-overlay" style="display: none;">SKIP</div>
            </div>
            <div class="activation-warning" id="activationNote"></div>
        </div>
    </div>
</div>

<script>
// ================== ORIGINAL ROULETTE LOGIC (COMPLETELY UNTOUCHED) ==================
window.addEventListener('DOMContentLoaded', () => {
    const trackContainer = document.getElementById('track');
    const resultInput = document.getElementById('resultInput');
    const enterBtn = document.getElementById('enterBtn');

    const wheelNumbers = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
    const numbers = [];
    const centerX = 300; const centerY = 200;
    const radiusX = 250; const radiusY = 150;

    wheelNumbers.forEach((num, i) => {
        const angle = (i / wheelNumbers.length) * 2 * Math.PI + Math.PI;
        const x = centerX + radiusX * Math.cos(angle) - 20;
        const y = centerY + radiusY * Math.sin(angle) - 20;
        const div = document.createElement('div');
        div.classList.add('num');
        div.textContent = num;
        if (num === 0) div.classList.add('green');
        else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(num)) div.classList.add('red');
        else div.classList.add('black');
        div.style.left = `${x}px`; div.style.top = `${y}px`;
        trackContainer.appendChild(div);
        numbers.push(div);
    });

    const numberHistoryContainer = document.getElementById('numberHistory');
    const wlHistoryContainer = document.getElementById('wlHistory');

    let numberHistory = [];
    let wlHistory = [];
    let currentHighlight = [];
    let firstEntry = true;
    let undoStack = [];

    const maxHistory = 20;
    const neighborCount = 9;

    function generateHighlight() {
        numbers.forEach(n => n.classList.remove('neighbor','center'));
        let centerIndex;
        do { centerIndex = Math.floor(Math.random() * numbers.length); } 
        while (numbers[centerIndex].classList.contains('green'));

        numbers[centerIndex].classList.add('center');
        for (let i = -neighborCount; i <= neighborCount; i++) {
            if (i === 0) continue;
            const idx = (centerIndex + i + numbers.length) % numbers.length;
            numbers[idx].classList.add('neighbor');
        }

        currentHighlight = numbers
            .filter(n => n.classList.contains('neighbor') || n.classList.contains('center'))
            .map(n => Number(n.textContent));
    }

    function renderHistories() {
        numberHistoryContainer.innerHTML = '';
        numberHistory.forEach(n => {
            const d = document.createElement('div');
            d.classList.add('history-num');
            d.textContent = n;
            if (n === 0) d.classList.add('green');
            else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(n)) d.classList.add('red');
            else d.classList.add('black');
            numberHistoryContainer.appendChild(d);
        });

        wlHistoryContainer.innerHTML = '';
        wlHistory.forEach(r => {
            const d = document.createElement('div');
            d.classList.add('history-wl', r);
            d.textContent = r;
            wlHistoryContainer.appendChild(d);
        });
    }

    resultInput.addEventListener('input', () => {
        const v = resultInput.value;
        enterBtn.disabled = !(v !== '' && v >= 0 && v <= 36);
    });

    // HOOK: After each roulette spin, we call prediction updater (but original logic untouched)
    function afterSpinUpdatePrediction() {
        if (typeof window.updatePredictionFromRoulette === 'function') {
            window.updatePredictionFromRoulette(numberHistory);
        }
    }

    enterBtn.addEventListener('click', () => {
        const value = Number(resultInput.value);
        
        undoStack.push({
            numberHistory: [...numberHistory],
            wlHistory: [...wlHistory],
            firstEntry: firstEntry,
            highlights: numbers.map(n => n.className),
            currentHighlight: [...currentHighlight]
        });

        numberHistory.push(value);
        if (numberHistory.length > maxHistory) numberHistory.shift();

        if (!firstEntry) {
            wlHistory.push(currentHighlight.includes(value) ? 'W' : 'L');
            if (wlHistory.length > maxHistory) wlHistory.shift();
        } else {
            firstEntry = false;
        }

        generateHighlight();
        renderHistories();
        resultInput.value = '';
        enterBtn.disabled = true;
        
        // Notify prediction engine
        afterSpinUpdatePrediction();
    });

    document.getElementById('undoBtn').addEventListener('click', () => {
        if (!undoStack.length) return;
        const s = undoStack.pop();
        numberHistory = s.numberHistory;
        wlHistory = s.wlHistory;
        firstEntry = s.firstEntry;
        currentHighlight = s.currentHighlight;
        
        numbers.forEach((n, i) => n.className = s.highlights[i]);
        renderHistories();
        
        afterSpinUpdatePrediction();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        numberHistory = []; wlHistory = []; currentHighlight = []; firstEntry = true; undoStack = [];
        numbers.forEach(n => n.classList.remove('neighbor', 'center'));
        renderHistories();
        resultInput.value = '';
        enterBtn.disabled = true;
        
        afterSpinUpdatePrediction();
    });
    
    // initial generate
    generateHighlight();
});

// ================== PREDICTION LOGIC (ADD-ON, no interference with original) ==================
// Enhanced prediction using sequence patterns, neighbor trends, and statistical frequency
(function() {
    // Helper: get color of number (red/black/green)
    function getNumberColor(num) {
        if (num === 0) return 'green';
        const reds = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
        return reds.includes(num) ? 'red' : 'black';
    }
    
    // Analyze last 5 spins to detect hot sectors & patterns
    function getPredictionFromHistory(history) {
        if (!history || history.length < 5) return { number: null, confidence: 0, patternInfo: "Need more spins" };
        
        const last5 = history.slice(-5);
        const last3 = history.slice(-3);
        
        // PATTERN 1: last 3 numbers repeating trend (simple delta)
        let possiblePrediction = null;
        let confidenceScore = 45;
        let reason = "Pattern analysis";
        
        // Check for alternating colors (Red/Black zigzag)
        let colorSequence = last5.map(n => getNumberColor(n));
        let lastColor = getNumberColor(last5[last5.length-1]);
        let oppositeColor = lastColor === 'red' ? 'black' : 'red';
        let colorAlternateStreak = 0;
        for(let i=1; i<colorSequence.length; i++) {
            if(colorSequence[i] !== colorSequence[i-1]) colorAlternateStreak++;
        }
        
        // Neighbor prediction: Most recent number +/- 2 or wheel neighbor simulation
        const lastNum = last5[last5.length-1];
        // wheel adjacency (based on standard roulette wheel order)
        const wheelNeighbors = {
            0: [32,26], 32: [15,0], 15: [19,32], 19: [4,15], 4: [21,19], 21: [2,4], 2: [25,21], 25: [17,2], 17: [34,25], 34: [6,17],
            6: [27,34], 27: [13,6], 13: [36,27], 36: [11,13], 11: [30,36], 30: [8,11], 8: [23,30], 23: [10,8], 10: [5,23], 5: [24,10],
            24: [16,5], 16: [33,24], 33: [1,16], 1: [20,33], 20: [14,1], 14: [31,20], 31: [9,14], 9: [22,31], 22: [18,9], 18: [29,22],
            29: [7,18], 7: [28,29], 28: [12,7], 12: [35,28], 35: [3,12], 3: [26,35], 26: [0,3]
        };
        let neighbors = wheelNeighbors[lastNum] || [lastNum+1, lastNum-1].filter(v => v>=0 && v<=36);
        let neighborCandidates = [...neighbors];
        
        // Frequency analysis: most common in last 10 spins
        const last10 = history.slice(-10);
        const freq = {};
        last10.forEach(n => { freq[n] = (freq[n] || 0) + 1; });
        let hotNumbers = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>parseInt(e[0]));
        
        // combine: prioritize neighbor & hot numbers
        let candidates = [...new Set([...neighborCandidates, ...hotNumbers])].filter(c => c !== undefined);
        if (candidates.length === 0) candidates = [lastNum+1, lastNum-1].filter(v=>v>=0&&v<=36);
        
        // pick best candidate based on recent misses or zigzag
        let selected = candidates[0];
        if (candidates.length > 1) {
            // prefer number not in last 3
            for(let cand of candidates) {
                if(!last3.includes(cand)) {
                    selected = cand;
                    break;
                }
            }
        }
        
        // confidence adjustment based on pattern strength
        if (colorAlternateStreak >= 3) {
            // strong alternating pattern: pick opposite color number from neighbor list
            let oppositeColorCand = candidates.find(c => getNumberColor(c) === oppositeColor);
            if(oppositeColorCand) selected = oppositeColorCand;
            confidenceScore = 72;
            reason = "Strong color zigzag";
        }
        
        // check for repeated neighbor hits
        let neighborHitCount = 0;
        for(let i=history.length-2; i>=Math.max(0, history.length-6); i--) {
            if(neighbors.includes(history[i])) neighborHitCount++;
        }
        if(neighborHitCount >= 2) {
            confidenceScore = Math.min(88, confidenceScore + 18);
            reason = "Neighbor zone active";
        }
        
        // Ensure selected is valid
        if(selected === undefined || selected > 36 || selected < 0) selected = Math.floor(Math.random() * 37);
        
        // Final confidence cap
        let finalConfidence = Math.min(94, Math.max(38, confidenceScore));
        if(history.length > 15) finalConfidence = Math.min(96, finalConfidence + 5);
        
        let patternDesc = `${reason} | Near ${lastNum}`;
        return { number: selected, confidence: Math.floor(finalConfidence), patternInfo: patternDesc };
    }
    
    // UI Elements
    const loadingDiv = document.getElementById('predictionLoading');
    const activeDiv = document.getElementById('predictionActiveArea');
    const predictedNumberSpan = document.getElementById('predictedNumber');
    const confidencePercentSpan = document.getElementById('confidencePercent');
    const confidenceFillDiv = document.getElementById('confidenceFill');
    const patternDisplaySpan = document.getElementById('patternDisplay');
    const skipOverlayDiv = document.getElementById('skipOverlay');
    const loaderFill = document.getElementById('loaderFill');
    const loaderPercentSpan = document.getElementById('loaderPercent');
    const activationNote = document.getElementById('activationNote');
    
    let currentHistory = [];
    const REQUIRED_SPINS = 8; // prediction activates after 8 spins
    
    function updateLoaderUI() {
        if(!loadingDiv) return;
        const progress = Math.min(100, Math.floor((currentHistory.length / REQUIRED_SPINS) * 100));
        if(loaderFill) loaderFill.style.width = `${progress}%`;
        if(loaderPercentSpan) loaderPercentSpan.innerText = `${progress}%`;
        if(currentHistory.length >= REQUIRED_SPINS) {
            loadingDiv.style.display = 'none';
            activeDiv.style.display = 'block';
            if(activationNote) activationNote.innerText = `✅ Active • ${currentHistory.length} spins analyzed`;
        } else {
            loadingDiv.style.display = 'flex';
            activeDiv.style.display = 'none';
            if(activationNote) activationNote.innerText = `⚡ Need ${REQUIRED_SPINS - currentHistory.length} more spins for prediction`;
        }
    }
    
    function applyPrediction() {
        if(currentHistory.length < REQUIRED_SPINS) {
            // show inactive placeholder
            if(activeDiv && activeDiv.style.display === 'block') {
                activeDiv.style.display = 'none';
                loadingDiv.style.display = 'flex';
                updateLoaderUI();
            }
            return;
        }
        
        const pred = getPredictionFromHistory(currentHistory);
        if(!pred || pred.number === null) {
            predictedNumberSpan.innerText = '?';
            confidencePercentSpan.innerText = '0';
            confidenceFillDiv.style.width = '0%';
            patternDisplaySpan.innerText = 'analyzing...';
            skipOverlayDiv.style.display = 'flex';
            return;
        }
        
        // Show prediction number
        predictedNumberSpan.innerText = pred.number;
        confidencePercentSpan.innerText = pred.confidence;
        confidenceFillDiv.style.width = `${pred.confidence}%`;
        // remove previous classes
        confidenceFillDiv.classList.remove('high', 'medium', 'low');
        if(pred.confidence >= 70) confidenceFillDiv.classList.add('high');
        else if(pred.confidence >= 50) confidenceFillDiv.classList.add('medium');
        else confidenceFillDiv.classList.add('low');
        
        patternDisplaySpan.innerText = pred.patternInfo || `pattern based on ${currentHistory.slice(-4).join(',')}`;
        
        // Skip logic: if confidence < 52% OR recent losses pattern, show SKIP overlay
        let shouldSkip = pred.confidence < 52;
        // extra dynamic: if last 3 predictions would have lost? but we keep clean: if confidence low skip
        if(shouldSkip) {
            skipOverlayDiv.style.display = 'flex';
        } else {
            skipOverlayDiv.style.display = 'none';
        }
        
        // Add subtle glow to predicted number on roulette? No interference with original, just display.
    }
    
    // Expose function to be called from roulette after each spin
    window.updatePredictionFromRoulette = function(numberHistoryArray) {
        if(!numberHistoryArray) return;
        currentHistory = [...numberHistoryArray];
        updateLoaderUI();
        if(currentHistory.length >= REQUIRED_SPINS) {
            applyPrediction();
        } else {
            if(activeDiv) activeDiv.style.display = 'none';
            if(loadingDiv) loadingDiv.style.display = 'flex';
        }
    };
    
    // initial check
    setTimeout(() => {
        if(window.numberHistoryFromRoulette) {
            // fallback, but roulette will call later
        }
        updateLoaderUI();
    }, 100);
})();

// Additional hook: expose current history from roulette after DOM ready
window.addEventListener('DOMContentLoaded', () => {
    // attempt to sync existing numberHistory var from roulette after its initialization
    const originalGetHistory = setInterval(() => {
        const numHistContainer = document.getElementById('numberHistory');
        if(numHistContainer && numHistContainer.children.length > 0) {
            // extract numbers from history DOM (safe)
            const historyNumbers = [];
            const historyItems = document.querySelectorAll('#numberHistory .history-num');
            historyItems.forEach(item => {
                const val = parseInt(item.textContent);
                if(!isNaN(val)) historyNumbers.push(val);
            });
            if(historyNumbers.length > 0 && typeof window.updatePredictionFromRoulette === 'function') {
                window.updatePredictionFromRoulette(historyNumbers);
            }
            clearInterval(originalGetHistory);
        }
    }, 300);
});
</script>

<script>
// ===== ORIGINAL SECURITY BLOCKS (PRESERVED) =====
(function() {
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
        if (
            e.keyCode === 123 || 
            (e.ctrlKey && e.keyCode === 85) || 
            (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) ||
            (e.ctrlKey && e.keyCode === 83)
        ) {
            return false;
        }
    };
    setInterval(function() {
        (function() { return false; }['constructor']('debugger')['call']());
    }, 50);
    function detectDevTools() {
        const threshold = 160;
        if ((window.outerWidth - window.innerWidth > threshold) || (window.outerHeight - window.innerHeight > threshold)) {
            document.body.innerHTML = ""; 
            window.location.replace("about:blank");
        }
    }
    setInterval(detectDevTools, 500);
    if (typeof console !== "undefined") {
        console.log = console.debug = console.info = console.warn = console.error = function() {};
    }
})();
</script>
