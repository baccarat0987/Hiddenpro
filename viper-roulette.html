<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VIP ROULETTE · TREND WHEEL</title>
    <!-- Firebase imports remain untouched -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHkhd7O2rJ2goNTCudeRUxQjrTFe2KoHc",
            authDomain: "my-software-portal.firebaseapp.com",
            projectId: "my-software-portal",
            appId: "1:1072405993700:web:b66ca016c8de667d46f4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.email.toLowerCase()));
            const now = new Date().getTime();
            if (!userDoc.exists() || (userDoc.data().expiry !== 'LIFETIME' && userDoc.data().expiry < now)) {
                window.location.href = "index.html";
                return;
            }
            document.body.style.display = "flex";
        });
    </script>
    <style>
        /* === EXACT ORIGINAL STYLES PRESERVED + minor addition for loading state consistency === */
        body { 
            background: linear-gradient(135deg, #0b0b0b, #1c1c1c, #2c2c2c); 
            display: none;
            flex-direction: column; 
            align-items: center; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 120px; 
            color: white; 
        }

        .exit-nav { position: fixed; top: 20px; right: 20px; z-index: 200; }
        .exit-btn { background: #444; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; border: 1px solid #666; font-size: 13px; }
        .exit-btn:hover { background: #ff4d6d; border-color: #fff; }

        h1 { font-size: 2rem; font-weight: bold; text-shadow: 0 0 5px #ff4d6d, 0 0 10px #ff1a75; margin-bottom: 30px; }
        
        .wheel-container {
            position: relative;
            width: 600px;
            height: 400px;
            margin-bottom: 20px;
        }
        .track-container { 
            position: relative; 
            width: 100%; 
            height: 100%; 
        }
        .num { 
            width: 40px; 
            height: 40px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: bold; 
            position: absolute; 
            border-radius: 50%; 
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .red { background: #c62828; } 
        .black { background: #111; } 
        .green { background: #0fa23f; }
        .num.neighbor { background: yellow !important; color: black; transform: scale(1.2); box-shadow: 0 0 10px gold; }
        .num.center { background: #ff69b4 !important; color: black; transform: scale(1.3); box-shadow: 0 0 15px hotpink; }
        
        /* PREDICTION INSIDE WHEEL - percentage display, no number */
        .wheel-prediction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: none;
            font-family: 'Arial', monospace;
            text-align: center;
            background: transparent;
        }
        .pred-loading {
            text-align: center;
            color: #ffaa66;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .pred-loading .loading-text {
            font-size: 11px;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 40px;
            display: inline-block;
            white-space: nowrap;
        }
        .pred-loading .progress-bar-mini {
            width: 120px;
            height: 3px;
            background: #2a2a2a;
            border-radius: 4px;
            margin: 10px auto 0;
            overflow: hidden;
        }
        .pred-loading .progress-fill-mini {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffaa44, #ffdd88);
            transition: width 0.2s ease;
            border-radius: 4px;
        }
        .pred-percentage {
            font-size: 28px;
            font-weight: 900;
            color: #ffdd99;
            text-shadow: 0 0 15px #ff9933;
            line-height: 1;
            background: rgba(0,0,0,0.5);
            padding: 8px 18px;
            border-radius: 50px;
            letter-spacing: 1px;
        }
        .pred-label {
            font-size: 10px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 4px 14px;
            border-radius: 30px;
            margin-top: 6px;
            color: #ffdd99;
            letter-spacing: 1px;
        }
        .glow-prediction {
            animation: pulseGlow 1.2s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 3px #ffaa33); }
            100% { filter: drop-shadow(0 0 18px #ffdd77); }
        }
        
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #enterBtn { background: #0fa23f; color: white; }
        #enterBtn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        #undoBtn { background: #c62828; color: white; }
        #resetBtn { background: #555; color: white; }
        .result-input { width: 60px; height: 40px; background: #444; border: 1px solid #222; color: white; font-size: 16px; text-align: center; border-radius: 6px; }
        
        .history-container { width: 600px; display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
        .history-num, .history-wl { width: 28px; height: 28px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; font-size: 12px; }
        .history-num.red { background: #c62828; } .history-num.black { background: #111; } .history-num.green { background: #0fa23f; }
        .history-wl.W { background: #0fa23f; } .history-wl.L { background: #c62828; }
        
        h3 { margin: 15px 0 5px; font-size: 14px; }
    </style>
</head>
<body>

<div class="exit-nav">
    <a href="index.html" class="exit-btn">EXIT TERMINAL</a>
</div>

<h1>VIPER ROULETTE</h1>

<div class="wheel-container">
    <div class="track-container" id="track"></div>
    <!-- PREDICTION INSIDE WHEEL - only percentage / loading, no number -->
    <div class="wheel-prediction" id="wheelPrediction">
        <div id="predictionInner"></div>
    </div>
</div>

<div class="controls">
    <input type="number" id="resultInput" class="result-input" placeholder="0-36" min="0" max="36" required oninput="this.value = this.value.slice(0, 2)">
    <button id="enterBtn" disabled>Enter</button>
    <button id="undoBtn">Undo</button>
    <button id="resetBtn">Reset</button>
</div>

<h3>Number History (last 10):</h3>
<div class="history-container" id="numberHistory"></div>
<h3>Win/Lose History (last 10):</h3>
<div class="history-container" id="wlHistory"></div>

<script>
    // ==================== ORIGINAL WHEEL & UI LAYOUT (minimal modifications for glow rule) ====================
    // STEP 1: On page load, NO PREDICTION GLOWING on numbers. Only statistical collection phase (0/10 spins)
    // STEP 2: REMOVED all old prediction logic (random neighbor highlight). 
    //         NEW GLOWING on numbers is based on LAST 10 RESULT TREND (most frequent numbers & trend patterns)
    // STEP 3: Glowing numbers on wheel are base on last 10 result calculation - no random glow.
    // STEP 4: Everything else untouched: wheel design, history, undo/reset, firebase, security.
    
    (function() {
        // DOM elements
        const trackContainer = document.getElementById('track');
        const resultInput = document.getElementById('resultInput');
        const enterBtn = document.getElementById('enterBtn');
        const numberHistoryContainer = document.getElementById('numberHistory');
        const wlHistoryContainer = document.getElementById('wlHistory');
        
        // Roulette wheel layout (preserved)
        const wheelNumbers = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
        const numbers = [];      // store number divs
        const centerX = 300; const centerY = 200;
        const radiusX = 250; const radiusY = 150;
        
        // Build wheel DOM elements (original positioning)
        wheelNumbers.forEach((num, i) => {
            const angle = (i / wheelNumbers.length) * 2 * Math.PI + Math.PI;
            const x = centerX + radiusX * Math.cos(angle) - 20;
            const y = centerY + radiusY * Math.sin(angle) - 20;
            const div = document.createElement('div');
            div.classList.add('num');
            div.textContent = num;
            if (num === 0) div.classList.add('green');
            else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(num)) div.classList.add('red');
            else div.classList.add('black');
            div.style.left = `${x}px`; div.style.top = `${y}px`;
            trackContainer.appendChild(div);
            numbers.push(div);
        });
        
        // Game state
        let numberHistory = [];      // numbers entered
        let wlHistory = [];          // W/L based on previous prediction
        let firstEntry = true;       // first spin doesn't generate W/L
        let undoStack = [];
        const MAX_HISTORY = 10;
        
        // ========== NEW TREND-BASED GLOW LOGIC (NO RANDOM) ==========
        // function to compute "trend numbers" from last 10 results.
        // returns an array of numbers to glow (both center + neighbors pattern)
        // Glowing convention: center = absolute highest frequency (or tie-breaking) and neighbors = 4 numbers on each side? but we match original visual flair: 1 "center" + 9 "neighbors".
        // Actually original logic highlighted a center + 9 neighbor numbers (total 10 glowing numbers). But we must base on last 10 results trend.
        // Strategy: based on last 10 results, pick the most frequent number(s) and then its neighbors on the wheel (adjacent positions) to create glowing set.
        // This respects "glowing numbers on wheel are base on last 10 result calculation".
        
        function getTrendGlowNumbers(history) {
            // history: array of numbers (max 10). If less than 10, we return empty array = no glow.
            if (!history || history.length === 0) return { centerNumber: null, glowIndices: [] };
            const last10 = history.slice(-MAX_HISTORY);
            if (last10.length === 0) return { centerNumber: null, glowIndices: [] };
            
            // Frequency analysis
            const freq = {};
            last10.forEach(num => { freq[num] = (freq[num] || 0) + 1; });
            
            let maxFreq = -1;
            let mostFrequentNumbers = [];
            for (const [numStr, count] of Object.entries(freq)) {
                const num = parseInt(numStr);
                if (count > maxFreq) {
                    maxFreq = count;
                    mostFrequentNumbers = [num];
                } else if (count === maxFreq) {
                    mostFrequentNumbers.push(num);
                }
            }
            
            // Tie-breaking: if multiple numbers have same max frequency, pick the one that appears most recently in history (trend recency)
            let selectedCenter = null;
            if (mostFrequentNumbers.length === 1) {
                selectedCenter = mostFrequentNumbers[0];
            } else {
                // find which of these appears last in the last10 array (from end)
                for (let i = last10.length - 1; i >= 0; i--) {
                    if (mostFrequentNumbers.includes(last10[i])) {
                        selectedCenter = last10[i];
                        break;
                    }
                }
                if (!selectedCenter) selectedCenter = mostFrequentNumbers[0];
            }
            
            // find index of selectedCenter in wheelNumbers array
            let centerIndex = wheelNumbers.findIndex(n => n === selectedCenter);
            if (centerIndex === -1) centerIndex = 0; // fallback (should never happen)
            
            // Build set of indices to glow: center + up to 9 neighbor indices (total 10 glowing numbers like original)
            const neighborCountTotal = 9; // 9 neighbors + center = 10 numbers
            const glowIndicesSet = new Set();
            glowIndicesSet.add(centerIndex);
            for (let offset = 1; offset <= neighborCountTotal; offset++) {
                const leftIdx = (centerIndex - offset + wheelNumbers.length) % wheelNumbers.length;
                const rightIdx = (centerIndex + offset) % wheelNumbers.length;
                if (offset % 2 === 1) glowIndicesSet.add(leftIdx);
                else glowIndicesSet.add(rightIdx);
                if (glowIndicesSet.size >= neighborCountTotal + 1) break;
            }
            // ensure exactly 10 glowing numbers (original style)
            let needed = 10 - glowIndicesSet.size;
            let extraOffset = neighborCountTotal + 1;
            while (needed > 0) {
                const idx = (centerIndex + extraOffset) % wheelNumbers.length;
                if (!glowIndicesSet.has(idx)) {
                    glowIndicesSet.add(idx);
                    needed--;
                }
                extraOffset++;
            }
            
            return { centerNumber: selectedCenter, glowIndices: Array.from(glowIndicesSet) };
        }
        
        // Apply glowing effect (center + neighbor) based purely on trend analysis
        function applyTrendGlow() {
            // remove existing glow classes
            numbers.forEach(n => n.classList.remove('neighbor', 'center'));
            
            // If we have less than 10 historical spins -> NO GLOWING on numbers (step 1: waiting for 10 data)
            if (numberHistory.length < MAX_HISTORY) {
                // absolutely no glowing numbers, clean wheel
                return;
            }
            
            // STEP 3: full glow based on last 10 results
            const { centerNumber, glowIndices } = getTrendGlowNumbers(numberHistory);
            if (!glowIndices.length) return;
            
            // apply center glow to the actual number div
            for (let idx of glowIndices) {
                const numDiv = numbers[idx];
                if (!numDiv) continue;
                if (idx === glowIndices[0]) {
                    numDiv.classList.add('center');
                } else {
                    numDiv.classList.add('neighbor');
                }
            }
        }
        
        // ========== History render (unchanged UI) ==========
        function renderHistories() {
            numberHistoryContainer.innerHTML = '';
            numberHistory.slice(-MAX_HISTORY).forEach(n => {
                const d = document.createElement('div');
                d.classList.add('history-num');
                d.textContent = n;
                if (n === 0) d.classList.add('green');
                else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(n)) d.classList.add('red');
                else d.classList.add('black');
                numberHistoryContainer.appendChild(d);
            });
            
            wlHistoryContainer.innerHTML = '';
            wlHistory.slice(-MAX_HISTORY).forEach(r => {
                const d = document.createElement('div');
                d.classList.add('history-wl', r);
                d.textContent = r;
                wlHistoryContainer.appendChild(d);
            });
        }
        
        // Update W/L calculation based on previous prediction: but prediction = glowing numbers (trend set)
        // For each spin, check if the entered number was inside the glowing set (trend-based) BEFORE new spin added.
        function computeWinBasedOnCurrentGlow(enteredNumber) {
            if (firstEntry) return false; // first spin no win/loss recorded
            // collect currently glowing numbers before we modify history
            const glowingNumbers = [];
            numbers.forEach((div, idx) => {
                if (div.classList.contains('center') || div.classList.contains('neighbor')) {
                    const numVal = parseInt(div.textContent);
                    if (!isNaN(numVal)) glowingNumbers.push(numVal);
                }
            });
            return glowingNumbers.includes(enteredNumber);
        }
        
        // Core function to add new result (with trend glow and W/L based on previous glow)
        function addResult(value) {
            // Push state for undo
            undoStack.push({
                numberHistory: [...numberHistory],
                wlHistory: [...wlHistory],
                firstEntry: firstEntry,
                // we don't need to save classes because glow is recalc from history
            });
            
            // Determine win before altering history & before reapplying glow
            const isWin = computeWinBasedOnCurrentGlow(value);
            
            // Add to number history
            numberHistory.push(value);
            if (numberHistory.length > MAX_HISTORY * 2) numberHistory = numberHistory.slice(-MAX_HISTORY * 2);
            
            if (!firstEntry) {
                wlHistory.push(isWin ? 'W' : 'L');
                if (wlHistory.length > MAX_HISTORY) wlHistory.shift();
            } else {
                firstEntry = false;
            }
            
            // After updating history, re-apply trend-based glow (based on latest last10)
            applyTrendGlow();
            renderHistories();
            
            // Notify trend accuracy (percentage) update
            if (typeof window.updateTrendAccuracyDisplay === 'function') {
                window.updateTrendAccuracyDisplay(numberHistory);
            }
        }
        
        // Reset all game data
        function resetGame() {
            numberHistory = [];
            wlHistory = [];
            firstEntry = true;
            undoStack = [];
            // Remove all glow
            numbers.forEach(n => n.classList.remove('neighbor', 'center'));
            renderHistories();
            if (typeof window.updateTrendAccuracyDisplay === 'function') {
                window.updateTrendAccuracyDisplay(numberHistory);
            }
        }
        
        // Undo last action
        function undoLast() {
            if (!undoStack.length) return;
            const s = undoStack.pop();
            numberHistory = s.numberHistory;
            wlHistory = s.wlHistory;
            firstEntry = s.firstEntry;
            // Re-apply glow based on restored history
            applyTrendGlow();
            renderHistories();
            if (typeof window.updateTrendAccuracyDisplay === 'function') {
                window.updateTrendAccuracyDisplay(numberHistory);
            }
        }
        
        // Event binding & input validation
        resultInput.addEventListener('input', () => {
            const v = resultInput.value;
            enterBtn.disabled = !(v !== '' && v >= 0 && v <= 36);
        });
        
        enterBtn.addEventListener('click', () => {
            const value = Number(resultInput.value);
            if (isNaN(value) || value < 0 || value > 36) return;
            addResult(value);
            resultInput.value = '';
            enterBtn.disabled = true;
        });
        
        document.getElementById('undoBtn').addEventListener('click', undoLast);
        document.getElementById('resetBtn').addEventListener('click', () => {
            resetGame();
            resultInput.value = '';
            enterBtn.disabled = true;
        });
        
        // initial: no glowing, no predictions, just clean wheel
        applyTrendGlow(); // will remove any glow because history length 0
        renderHistories();
    })();
    
    // ========== TREND ACCURACY PERCENTAGE (STEP 1 COLLECTION + STEP 2 base on last10 results) ==========
    // This part controls the center wheel percentage and glow container.
    // Requirement: Initially no glowing prediction on numbers, only statistical collection until 10 spins.
    // The percentage and glow on wheel-prediction container will follow rule: only after 10 spins showing TREND ACCURACY percentage, else collecting data.
    (function() {
        const predictionInner = document.getElementById('predictionInner');
        const wheelPredictionDiv = document.getElementById('wheelPrediction');
        
        let currentNumberHistory = [];
        const REQUIRED_SPINS = 10;
        
        // Function to compute trend accuracy percentage based strictly on LAST 10 result trends (no random influence, deterministic)
        // Returns a value between 95.3% and 98.4%, reflecting combined frequency/trend strength.
        function computeTrendAccuracyFromHistory(history) {
            if (!history || history.length < REQUIRED_SPINS) return null;
            const last10 = history.slice(-REQUIRED_SPINS);
            // Frequency Distribution
            const freq = {};
            last10.forEach(num => { freq[num] = (freq[num] || 0) + 1; });
            let maxFreq = 0;
            for (let k in freq) if (freq[k] > maxFreq) maxFreq = freq[k];
            const freqPercent = (maxFreq / 10) * 100;
            
            // Additional pattern detection: consecutive repeat strength
            let patternStrength = 0;
            let consecutiveCount = 0;
            for (let i = 0; i < last10.length - 1; i++) {
                if (last10[i] === last10[i+1]) consecutiveCount++;
            }
            if (consecutiveCount >= 2) patternStrength += 0.4;
            if (consecutiveCount >= 3) patternStrength += 0.3;
            // check if last two numbers equal
            if (last10.length >= 2 && last10[last10.length-1] === last10[last10.length-2]) patternStrength += 0.35;
            
            // Compute base accuracy between range 95.3 - 98.4
            let accuracy = 95.3 + (freqPercent * 0.028);   // freqPercent max 100 -> +2.8 = 98.1
            accuracy += (patternStrength * 0.4);
            accuracy = Math.min(98.4, Math.max(95.3, accuracy));
            // remove random variation to keep deterministic but fine (slight natural consistent)
            accuracy = parseFloat(accuracy.toFixed(1));
            return accuracy;
        }
        
        function renderPercentageUI(historyLength, accuracyValue) {
            if (!predictionInner) return;
            const isReady = historyLength >= REQUIRED_SPINS;
            if (!isReady) {
                // STEP 1: COLLECTING STATISTICAL DATA – no outer glow on prediction container (no glowing effect)
                wheelPredictionDiv.classList.remove('glow-prediction');
                const percentComplete = Math.min(100, Math.floor((historyLength / REQUIRED_SPINS) * 100));
                predictionInner.innerHTML = `
                    <div class="pred-loading">
                        <div class="loading-text">📊 COLLECTING STATISTICAL DATA...</div>
                        <div class="progress-bar-mini">
                            <div class="progress-fill-mini" style="width: ${percentComplete}%;"></div>
                        </div>
                        <div style="font-size: 10px; margin-top: 6px; opacity: 0.7;">${historyLength}/10 spins</div>
                    </div>
                `;
                return;
            }
            
            // Active prediction mode: show glowing percentage based on last 10 trend
            if (accuracyValue !== null && !isNaN(accuracyValue)) {
                wheelPredictionDiv.classList.add('glow-prediction');
                predictionInner.innerHTML = `
                    <div class="pred-percentage">${accuracyValue}%</div>
                    <div class="pred-label">TREND ACCURACY</div>
                `;
            } else {
                wheelPredictionDiv.classList.remove('glow-prediction');
                predictionInner.innerHTML = `<div class="pred-percentage">---</div><div class="pred-label">TREND ACCURACY</div>`;
            }
        }
        
        // Expose update function for roulette core
        window.updateTrendAccuracyDisplay = function(historyArray) {
            if (!historyArray) return;
            currentNumberHistory = [...historyArray];
            const acc = computeTrendAccuracyFromHistory(currentNumberHistory);
            renderPercentageUI(currentNumberHistory.length, acc);
        };
        
        // initial call: no history yet
        renderPercentageUI(0, null);
    })();
    
    // ========== SECURITY BLOCKS (FULLY PRESERVED) ==========
    (function() {
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (
                e.keyCode === 123 || 
                (e.ctrlKey && e.keyCode === 85) || 
                (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) ||
                (e.ctrlKey && e.keyCode === 83)
            ) {
                return false;
            }
        };
        setInterval(function() {
            (function() { return false; }['constructor']('debugger')['call']());
        }, 50);
        function detectDevTools() {
            const threshold = 160;
            if ((window.outerWidth - window.innerWidth > threshold) || (window.outerHeight - window.innerHeight > threshold)) {
                document.body.innerHTML = ""; 
                window.location.replace("about:blank");
            }
        }
        setInterval(detectDevTools, 500);
        if (typeof console !== "undefined") {
            console.log = console.debug = console.info = console.warn = console.error = function() {};
        }
    })();
</script>
</body>
</html>
